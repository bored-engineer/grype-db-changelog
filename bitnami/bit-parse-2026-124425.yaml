details: Parse Server 8.6.109 before 8.6.116 and 9.10.6 before 9.10.7 contains an information disclosure vulnerability in which create or update responses mark fields as deleted based on stored values the caller cannot read. Attackers with write but not read access to an object can inspect these markers to infer whether protected fields are set.
