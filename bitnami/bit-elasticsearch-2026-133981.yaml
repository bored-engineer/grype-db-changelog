details: An issue was discovered in Elasticsearch where specially crafted compressed payloads can cause an infinite loop. A low-privileged authenticated user can submit a malformed payload to a product API endpoint that causes the node to enter a permanent CPU loop, occupying a request-processing thread indefinitely. This can progressively exhaust the node's processing capacity, degrading or denying access to product features, and requiring a restart of the affected node to recover.
