details: 'MinIO is a high-performance object storage system. Prior to 2026.03.17, MinIO AIStor''s STS (Security Token Service) AssumeRoleWithLDAPIdentity endpoint is vulnerable to LDAP credential brute-forcing due to two combined weaknesses: (1) distinguishable error responses that enable username enumeration, and (2) absence of rate limiting on authentication attempts. An unauthenticated network attacker can enumerate valid LDAP usernames and then perform unlimited password guessing to obtain temporary AWS-style STS credentials, gaining access to the victim''s S3 buckets and objects. This issue has been patched in 2026.03.17.'
