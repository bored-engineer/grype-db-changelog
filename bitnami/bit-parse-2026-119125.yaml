details: 'Parse Server before 8.6.107 and 9.0.0 before 9.10.5 returns the stored value of a field reverted by a beforeSave trigger in object update responses, even to clients without read access to that object or field. An authenticated client able to update an object whose beforeSave trigger reverts a field, via revert() or a constant: true validator, can read protected values, including its own account''s raw MFA authData when protectedFieldsTriggerExempt is enabled.'
