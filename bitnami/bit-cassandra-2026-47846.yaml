details: Bitnami Cassandra container images are affected by a retained default superuser vulnerability. When a custom administrator account is configured via the CASSANDRA_USER environment variable, the container initialization script creates the new superuser account but fails to drop the built-in cassandra account in certain scenarios. This leaves the default cassandra:cassandra superuser active as an unintended access path. Any remote attacker who knows the default Cassandra credentials, can authenticate to the cluster as a full superuser regardless of the operator's configuration, bypassing the intent to replace the built-in account.
