details: "The bzip2 packages contain a freely available, high-quality data compressor. It provides both standalone compression and decompression utilities, as well as a shared library for use with other programs.   \n\nSecurity Fix(es):  \n\n  * bzip2: bzip2: Data integrity error when decompressing (with data integrity tests fail). (CVE-2019-12900)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
