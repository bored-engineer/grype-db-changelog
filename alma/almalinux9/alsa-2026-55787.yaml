details: "The OpenJDK 21 packages provide the OpenJDK 21 Java Runtime Environment and the OpenJDK 21 Java Software Development Kit.  \n\nSecurity Fix(es):  \n\n  * JDK: Improve Resource Resolving (CVE-2026-60589)\n  * JDK: Enhance HTTP Connections (CVE-2026-61308)\n  * JDK: Enhance TLS server (CVE-2026-70907)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
