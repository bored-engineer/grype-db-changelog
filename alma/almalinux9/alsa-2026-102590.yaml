details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: mm/damon/ops-common: handle extreme intervals in damon_hot_score() (CVE-2026-64458)\n  * kernel: net/smc: fix UAF in smc_cdc_rx_handler() by pinning the socket (CVE-2026-64541)\n  * kernel: Bluetooth: hci_core: Fix UAF in hci_unregister_dev() (CVE-2026-74302)\n  * kernel: platform/x86/amd/pmc: Fix LPS0 and debugfs leaks when STB init fails (CVE-2026-81015)\n  * kernel: kernel: Memory corruption via out-of-bounds write in Ceph client (CVE-2026-89653)\n  * kernel: uio: Fix stale info pointer in failed registration path (CVE-2026-93054)\n  * kernel: Bluetooth: L2CAP: fix chan mode for LE_CONN_REQ + EXT_FLOWCTL pchan (CVE-2026-98108)\n  * kernel: mm/hugetlb: preserve mremap address delta when skipping page tables (CVE-2026-98373)\n  * kernel: net: openvswitch: conntrack: fix helper UAF due to extensions realloc (CVE-2026-98490)\n  * kernel: kernel: Memory corruption via integer overflow in GUP-fast (CVE-2026-99661)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * cifs: periodic IO errors after rename, even after RHEL-192999 [rhel-9.9.z] (JIRA:RHEL-307290)\n  * CIFS: backport important fixes to AlmaLinux 9.9.z (JIRA:RHEL-309176)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
