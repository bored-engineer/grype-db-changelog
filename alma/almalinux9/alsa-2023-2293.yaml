database_specific:
    anchore:
        record_type: advisory
details: |-
    The Public Key Infrastructure (PKI) Core contains fundamental packages required by AlmaLinux Certificate System.

    Security Fix(es):

    * pki-core: When using the caServerKeygen_DirUserCert profile, user can get certificates for other UIDs by entering name in Subject field (CVE-2022-2393)

    For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

    Additional Changes:

    For detailed information on changes in this release, see the AlmaLinux Release Notes linked from the References section.
