details: "Vim (Vi IMproved) is an updated and improved version of the vi editor.  \n\nSecurity Fix(es):  \n\n  * vim: Vim: Information disclosure and denial of service via crafted Unicode characters in terminal emulator (CVE-2026-28420)\n  * vim: Vim: Denial of Service via out-of-bounds write in terminal handling (CVE-2026-52859)\n  * vim: Vim: Denial of Service via crafted spell file (CVE-2026-55892)\n  * vim: Vim: Denial of Service via out-of-bounds write in spell sound-folding (CVE-2026-59857)\n  * vim: Vim: Arbitrary command execution via crafted vimball (CVE-2026-73076)\n  * vim: Vim: Heap buffer overflow allows arbitrary code execution (CVE-2026-73072)\n  * vim: Vim: Arbitrary Code Execution via Crafted Netrw Menu Entries (CVE-2026-73078)\n  * vim: Vim: Arbitrary Code Execution via Insecure Shell Command Handling (CVE-2026-73077)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
