details: "nginx is a web and proxy server supporting HTTP and other protocols, with a focus on high concurrency, performance, and low memory usage.   \n\nSecurity Fix(es):  \n\n  * nginx: NGINX: Heap buffer over-read allows memory modification or denial of service (CVE-2026-56434)\n  * nginx: NGINX: Memory disclosure and denial of service in ngx_http_slice_module (CVE-2026-60005)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
