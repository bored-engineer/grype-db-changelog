details: "MariaDB is a multi-user, multi-threaded SQL database server that is binary compatible with MySQL.   \n\nSecurity Fix(es):  \n\n  * mariadb: MariaDB Server: Arbitrary code execution via wsrep_notify_cmd (CVE-2026-49261)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [AlmaLinux9][tracker] Rebase Galera to 26.4.27 MariaDB:10.11 (JIRA:AlmaLinux-140363)\n  * Rebase MariaDB 10.11 to 10.11.18 in AlmaLinux9 (JIRA:AlmaLinux-183087)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
