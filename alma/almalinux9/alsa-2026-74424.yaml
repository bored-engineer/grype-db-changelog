        record_type: advisory
details: "The libvirt library contains a C API for managing and interacting with the virtualization capabilities of Linux and other operating systems. In addition, libvirt provides tools for remote management of virtualized systems.  \n\nSecurity Fix(es):  \n\n  * libvirt: swtpm privilege escalation via symlink following (CVE-2026-63622)\n  * libvirt: Integer overflow in NodeGetFreePages RPC handler leading to heap buffer overflow (CVE-2026-18917)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * Live migration fails when virtio-vga becomes available, video device switches from virtio-gpu-pci to virtio-vga on target [almalinux-9.8.z] (JIRA:AlmaLinux-186018)\n  * libvirt-guests does not work together with virtlockd on shutdown [almalinux-9.8.z] (JIRA:AlmaLinux-224986)\n  * Expose guest-get-devices in libvirt-api [almalinux-9.8.z] (JIRA:AlmaLinux-243306)\n  * allow hyperv pvpanic \"device\" to process Windows crash dump [almalinux-9.8.z] (JIRA:AlmaLinux-242549)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
