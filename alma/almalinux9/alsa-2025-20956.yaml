details: "The libtiff packages contain a library of functions for manipulating Tagged Image File Format (TIFF) files.  \n\nSecurity Fix(es):  \n\n  * libtiff: LibTIFF Use-After-Free Vulnerability (CVE-2025-8176)\n  * libtiff: Libtiff Write-What-Where (CVE-2025-9900)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
