details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: crypto: af_alg - Disallow concurrent writes in af_alg_sendmsg (CVE-2025-39964)\n  * kernel: iommu/vt-d: Clear Present bit before tearing down PASID entry (CVE-2026-45894)\n  * kernel: crypto: ccp - Fix a crash due to incorrect cleanup usage of kfree (CVE-2026-45959)\n  * kernel: dm cache policy smq: fix missing locks in invalidating cache blocks (CVE-2026-53062)\n  * kernel: keys: Pin request_key_auth payload in instantiate paths (CVE-2026-63823)\n  * kernel: net/mlx5: Fix MCIA register buffer overflow on 32 dword reads (CVE-2026-68293)\n  * kernel: Linux kernel: libceph null pointer dereference leads to denial of service (CVE-2026-68157)\n  * kernel: Linux kernel Bluetooth RFCOMM: Denial of Service via use-after-free in set_termios (CVE-2026-68188)\n  * kernel: libceph: refresh auth->authorizer_buf{,_len} after authorizer update (CVE-2026-68156)\n  * kernel: Linux kernel (libceph): Denial of Service due to malformed monitor maps (CVE-2026-68155)\n  * kernel: Bluetooth: mgmt: hold reference for hci_conn in mgmt_pending_cmds (CVE-2026-68391)\n  * kernel: net/mlx5e: macsec: fix use-after-free of metadata_dst on RX SC delete (CVE-2026-72072)\n  * kernel: mm/hugetlb: fix list corruption in allocate_file_region_entries() (CVE-2026-74518)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [Intel 9.8 FEAT] ice: Driver Update [almalinux-9.8.z] (JIRA:AlmaLinux-213003)\n  * AlmaLinux 9.8: Multiuser Kerberized DFS shares fail to mount with UID mount option [almalinux-9.8.z] (JIRA:AlmaLinux-254108)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
