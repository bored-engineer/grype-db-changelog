details: "Bubblewrap (/usr/bin/bwrap) is a core execution engine for unprivileged containers that works as a setuid binary on kernels without user namespaces.  \n\nSecurity Fix(es):  \n\n  * flatpak: Access to files outside sandbox for apps using persistent= (--persist) (CVE-2024-42472)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
