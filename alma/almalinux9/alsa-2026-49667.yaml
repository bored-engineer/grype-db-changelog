details: "The p11-kit packages provide a mechanism to manage PKCS#11 modules. The p11-kit-trust subpackage includes a PKCS#11 trust module that provides certificate anchors and black lists based on configuration files.  \n\nSecurity Fix(es):  \n\n  * p11-kit: Stack exhaustion via unbounded recursion in RPC attribute parsing (CVE-2026-13757)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
