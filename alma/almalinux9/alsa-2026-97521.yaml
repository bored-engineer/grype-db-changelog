details: "The microcode_ctl packages provide microcode updates for Intel and AMD processors.  \n\nSecurity Fix(es):  \n\n  * kernel: hypervisor: Intel Processors: Privilege escalation in Ring 0 via improper value handling (CVE-2025-35973)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [AlmaLinux 9] Update Intel CPU microcode to the latest version (JIRA:RHEL-240771)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.  \n\nAdditional Changes:  \n\nFor detailed information on changes in this release, see the AlmaLinux 9 Release Notes linked from the References section.\n"
