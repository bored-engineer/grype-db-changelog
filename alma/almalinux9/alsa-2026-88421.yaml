details: "Kernel-based Virtual Machine (KVM) is a full virtualization solution for Linux on a variety of architectures. The qemu-kvm packages provide the user-space component for running virtual machines that use KVM.  \n\nSecurity Fix(es):  \n\n  * qemu-kvm: qemu-guest-agent: Local privilege escalation via symlink attack in guest-ssh-add-authorized-keys (CVE-2026-12080)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * qemu-img can't create a qcow2 overlay with 'data_file' feature on top of a file without destroying the original image [almalinux-9.8.z] (JIRA:AlmaLinux-164549)\n  * live migration of a VM with a scsi3pr to a node that previously held a reservation on that disk fails. [almalinux-9.8.z] (JIRA:AlmaLinux-280223)\n  * Fix pending QEMU issues for L1VH GA - QEMU [almalinux-9.8.z] (JIRA:AlmaLinux-283121)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
