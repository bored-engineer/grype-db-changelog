    anchore:
        record_type: advisory
details: "The libblockdev packages provide a C library with GObject introspection support used for low-level operations on block devices. The library serves as a thin wrapper around plug-ins for specific functionality, such as LVM, Btrfs, LUKS, or MD RAID.  \n\nSecurity Fix(es):  \n\n  * libblockdev: LPE from allow_active to root in libblockdev via udisks (CVE-2025-6019)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
