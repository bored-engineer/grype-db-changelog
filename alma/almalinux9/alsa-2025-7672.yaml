details: "The xdg-utils package is a set of simple scripts that provide basic desktop integration functions for any Free Desktop.  \n\nSecurity Fix(es):  \n\n  * xdg-utils: improper parse of mailto URIs allows bypass of Thunderbird security mechanism for attachments (CVE-2022-4055)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
