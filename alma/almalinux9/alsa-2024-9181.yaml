details: "Jose is a C-language implementation of the Javascript Object Signing and Encryption standards. The jose package is a dependency of the clevis and tang packages, together providing Network Bound Disk Encryption (NBDE) in AlmaLinux.  \n\nSecurity Fix(es):  \n\n  * jose: resource exhaustion (CVE-2024-28176)\n  * jose: Denial of service due to uncontrolled CPU consumption (CVE-2023-50967)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.  \n\nAdditional Changes:  \n\nFor detailed information on changes in this release, see the AlmaLinux Release Notes linked from the References section.\n"
