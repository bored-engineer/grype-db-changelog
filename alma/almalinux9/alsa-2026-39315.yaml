details: "The libsolv packages provide a library for resolving package dependencies using a satisfiability algorithm.  \n\nSecurity Fix(es):  \n\n  * libsolv: Heap buffer overflow in libsolv repopagestore via unchecked decompression of malicious .solv page data (CVE-2026-48864)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
