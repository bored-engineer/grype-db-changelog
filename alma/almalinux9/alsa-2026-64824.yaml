details: "Redis is an advanced key-value store. It is often referred to as a data-structure server since keys can contain strings, hashes, lists, sets, and sorted sets. For performance, Redis works with an in-memory data set. You can persist it either by dumping the data set to disk every once in a while, or by appending each command to a log.  \n\nSecurity Fix(es):  \n\n  * redis: Redis: Remote Code Execution via specially crafted RESTORE payload (CVE-2026-66373)\n  * redis: Redis: Arbitrary code execution via TLS pending-data list use-after-free (CVE-2026-81934)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * segfault because of Unsupported system page size (jemalloc) (JIRA:AlmaLinux-180910)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
