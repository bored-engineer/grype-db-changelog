details: "The OpenJDK 25 packages provide the OpenJDK 25 Java Runtime Environment and the OpenJDK 25 Java Software Development Kit.  \n\nSecurity Fix(es):  \n\n  * JDK: Enhance Kerberos tickets (CVE-2026-114939)\n  * JDK: Enhance TLS connections (CVE-2026-114947)\n  * JDK: Enhance StringBuilder checks (CVE-2026-114945)\n  * JDK: Enhance JFR Events (CVE-2026-114943)\n  * JDK: Enhance loop handling (CVE-2026-114946)\n  * JDK: Enhance vector masks (CVE-2026-114942)\n  * JDK: Improve integer compression (CVE-2026-114941)\n  * JDK: Enhance JMX Connections (CVE-2026-114944)\n  * JDK: Base64 optimization improvements (CVE-2026-114938)\n  * JDK: Improve TLS client connections (CVE-2026-114940)\n\n\nBug Fix(es):  \n\n  * Post-Quantum Hybrid Key Exchange for TLS 1.3 was added in the previous OpenJDK update, 25.0.5. This caused hybrid key exchanges to be negotiated with systems running in FIPS mode, which would fail due to the current absence of hybrid key exchange support in the FIPS provider. With this release, hybrid key exchange is disabled when in FIPS mode. (RHEL-309186, RHEL-309187)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
