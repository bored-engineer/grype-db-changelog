details: "PipeWire is a multimedia server for Linux and other Unix like operating systems.  \n\nSecurity Fix(es):  \n\n  * pipewire: RAOP RTSP NULL Deref (CVE-2026-14324)\n  * pipewire: Pulse Server alloca Stack Overflow (CVE-2026-14330)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
