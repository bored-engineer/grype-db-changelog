details: "WebKitGTK is the port of the portable web rendering engine WebKit to the GTK platform.  \n\nSecurity Fix(es):  \n\n  * chromium-browser: angle: Use after free in ANGLE (CVE-2026-95325)\n  * chromium-browser: angle: Out of bounds write in ANGLE (CVE-2026-95331)\n  * chromium-browser: angle: Out of bounds read in ANGLE (CVE-2026-106304)\n  * chromium-browser: angle: Buffer overflow in ANGLE (CVE-2026-106247)\n  * chromium-browser: angle: Type confusion in ANGLE (CVE-2026-106293)\n  * chromium-browser: angle: Uninitialized resource in ANGLE (CVE-2026-106245)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
