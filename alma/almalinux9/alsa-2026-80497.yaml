details: "Flatpak is a system for building, distributing, and running sandboxed desktop applications on Linux.  \n\nSecurity Fix(es):  \n\n  * flatpak: Flatpak: Arbitrary code execution via missing symlink protection (CVE-2026-90616)\n  * flatpak: flatpak: Arbitrary write access as root via extra-data extraction (CVE-2026-96275)\n  * flatpak: flatpak: Buffer overflow in OCI delta stream path names on 32-bit systems (CVE-2026-96280)\n  * flatpak: Flatpak: Local privilege escalation via symlink traversal in revokefs writer (CVE-2026-96808)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
