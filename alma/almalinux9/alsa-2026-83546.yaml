details: "The wireshark packages contain a network protocol analyzer used to capture and browse the traffic running on a computer network.  \n\nSecurity Fix(es):  \n\n  * wireshark: Wireshark: Denial of Service via C12.22 protocol dissector crash (CVE-2026-76886)\n  * wireshark: Wireshark: Denial of Service via RRC protocol dissector out-of-bounds write (CVE-2026-76880)\n  * wireshark: Wireshark: Denial of Service vulnerability in ESS protocol dissector (CVE-2026-76919)\n  * wireshark: Wireshark: Denial of Service vulnerability in H.245 protocol dissector (CVE-2026-76927)\n  * wireshark: wireshark: Denial of Service via heap-based buffer overflow in SPDY dissector (CVE-2026-95387)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
