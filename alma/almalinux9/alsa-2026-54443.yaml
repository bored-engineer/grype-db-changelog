database_specific:
    anchore:
        record_type: advisory
details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: accel/ivpu: Fix signed integer truncation in IPC receive (CVE-2026-53202)\n  * kernel: net/sched: act_api: use RCU with deferred freeing for action lifecycle (CVE-2026-53264)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [AlmaLinux9] tlbflush - Windows Driver Verifier catches FLTMGR/Ntfs crashes during KVM 42-VM soak test on AMD EPYC Turin [almalinux-9.8.z] (JIRA:AlmaLinux-214434)\n  * Kernels 5.14.0-434+ may lose page table dirty bit (and page data) [almalinux-9.8.z] (JIRA:AlmaLinux-220787)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
