details: "The curl packages provide the libcurl library and the curl utility for downloading files from servers using various protocols, including HTTP, FTP, and LDAP.  \n\nSecurity Fix(es):  \n\n  * curl: curl: Authentication bypass due to incorrect connection reuse with Negotiate authentication (CVE-2026-1965)\n  * curl: curl: Unauthorized access due to improper HTTP proxy connection reuse (CVE-2026-3784)\n  * curl: curl: Information disclosure via OAuth2 bearer token leakage during HTTP(S) redirect (CVE-2026-3783)\n  * curl: curl: Proxy credential disclosure via redirects to unauthenticated proxies (CVE-2026-6253)\n  * curl: libcurl: Authentication bypass due to incorrect HTTP Negotiate connection reuse (CVE-2026-5545)\n  * curl: libcurl: Credential leak via reused proxy connection during HTTP redirects (CVE-2026-6429)\n  * curl: libcurl: Information disclosure via incorrect Proxy-Authorization header reuse (CVE-2026-7168)\n  * curl: curl: Man-in-the-middle attack via SSH host key bypass (CVE-2026-9547)\n  * libcurl: libcurl: Security feature bypass due to improper mTLS connection reuse (CVE-2026-8932)\n  * curl: curl: Insecure connection establishment due to TLS configuration mismatch (CVE-2026-8286)\n  * curl: libcurl: Unauthorized connection reuse due to a logical error (CVE-2026-8458)\n  * curl: curl: Cookie injection via malicious HTTP server using super cookies (CVE-2026-8924)\n  * curl: curl: Information disclosure via incorrect Digest authentication header reuse (CVE-2026-11856)\n  * curl: Information disclosure due to uncleared proxy authentication state (CVE-2026-8927)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
