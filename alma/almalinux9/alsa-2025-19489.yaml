details: "Virtual Network Computing (VNC) is a remote display system which allows users to view a computing desktop environment not only on the machine where it is running, but from anywhere on the Internet and from a wide variety of machine architectures. TigerVNC is a suite of VNC servers and clients.  \n\nSecurity Fix(es):  \n\n  * xorg: xmayland: Use-after-free in XPresentNotify structure creation (CVE-2025-62229)\n  * xorg: xwayland: Use-after-free in Xkb client resource removal (CVE-2025-62230)\n  * xorg: xmayland: Value overflow in XkbSetCompatMap() (CVE-2025-62231)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
