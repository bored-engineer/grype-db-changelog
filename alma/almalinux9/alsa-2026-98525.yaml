details: "BIND (Berkeley Internet Name Domain) is an implementation of the DNS (Domain Name System) protocols. BIND includes a DNS server (named), which resolves host names to IP addresses; a resolver library (routines for applications to use when interfacing with DNS); and tools for verifying that the DNS server is operating properly.  \n\nSecurity Fix(es):  \n\n  * bind: BIND: Denial of Service via unbounded processing of crafted DNS messages (CVE-2026-19630)\n  * bind: bind: Arbitrary code execution via GSS-TSIG UDP message replay (CVE-2026-94300)\n  * bind: bind: Denial of Service via assertion failure during redirect processing (CVE-2026-96888)\n  * bind: bind: Denial of service via assertion failure in RPZ query processing (CVE-2026-97313)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
