details: "The libtiff package contains a library of functions for manipulating TIFF (Tagged Image File Format) image format files. TIFF is a widely used file format for bitmapped images. TIFF files usually end in the .tif extension and they are often quite large. The libtiff package should be installed if you need to manipulate TIFF format image files.  \n\nSecurity Fix(es):  \n\n  * libtiff: LibTIFF Use-After-Free Vulnerability (CVE-2025-8176)\n  * libtiff: Libtiff Write-What-Where (CVE-2025-9900)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
