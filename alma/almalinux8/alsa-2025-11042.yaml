details: "The socat utility establishes bi-directional byte streams and transfers data between them. The utility can establish streams between a large set of channels, such as files, pipes, devices, and sockets.  \n\nSecurity Fix(es):  \n\n  * socat: arbitrary file overwrite via predictable /tmp directory (CVE-2024-54661)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
