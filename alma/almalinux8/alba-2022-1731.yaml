details: |-
    This erratum reinstates changes made to java-1.8.0-openjdk in AlmaLinux 8.6 GA.  The original builds for AlmaLinux 8.6 GA will have been superseded by newer binaries released as part of the April 2022 security update for AlmaLinux 8.5.

    For detailed information on changes in this release, see the AlmaLinux Release Notes linked from the References section.
