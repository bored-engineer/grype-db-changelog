details: "The pcre2 package contains a new generation of the Perl Compatible Regular Expression libraries for implementing regular expression pattern matching using the same syntax and semantics as Perl.   \n\nSecurity Fix(es):  \n\n  * pcre2: PCRE2: Out-of-bounds write allows arbitrary code execution via crafted regular expressions (CVE-2026-86145)\n  * pcre2: PCRE2: Out-of-bounds write via large pattern input (CVE-2026-89157)\n  * PCRE2: PCRE2: Out-of-bounds write via integer overflow on 32-bit platforms (CVE-2026-89158)\n  * pcre2: pcre2: Out-of-bounds write via crafted regular expression (CVE-2026-103111)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
