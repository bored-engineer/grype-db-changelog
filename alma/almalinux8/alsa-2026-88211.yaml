details: "OpenSSH is an SSH protocol implementation supported by a number of Linux, UNIX, and similar operating systems. It includes the core files necessary for both the OpenSSH client and server.  \n\nSecurity Fix(es):  \n\n  * openssh: OpenSSH: SFTP security bypass due to command-line argument parsing flaw (CVE-2026-59997)\n  * openssh: OpenSSH: Undocumented GSSAPIStrictAcceptorCheck behavior impacts security in Windows Active Directory (CVE-2026-59998)\n  * openssh: OpenSSH: Brute-force attacks facilitated due to insufficient authentication delay (CVE-2026-60001)\n  * openssh: OpenSSH: Denial of Service via excessive GSSAPI authentication attempts (CVE-2026-60000)\n  * openssh: OpenSSH: Tunnel forwarding restriction bypass (CVE-2026-73283)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
