details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: vsock/vmci: fix UAF when peer resets connection during handshake (CVE-2026-64115)\n  * kernel: packet: use consistent hard_header_len in non-ring send paths ()\n  * kernel: packet: use consistent hard_header_len in non-ring send paths (CVE-2026-74582)\n  * kernel: svcrdma: Reject inline replies that overflow the pull-up buffer (CVE-2026-89530)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
