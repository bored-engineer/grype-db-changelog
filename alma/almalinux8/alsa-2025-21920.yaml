details: "The kernel-rt packages provide the Real Time Linux Kernel, which enables fine-tuning for systems with extremely high determinism requirements.  \n\nSecurity Fix(es):  \n\n  * kernel: NFS: Fix a race when updating an existing write (CVE-2025-39697)\n  * kernel: i40e: fix idx validation in config queues msg (CVE-2025-39971)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
