details: "Python is an interpreted, interactive, object-oriented programming language, which includes modules, classes, exceptions, very high level dynamic data types and dynamic typing. Python supports interfaces to many system calls and libraries, as well as to various windowing systems.  \n\nSecurity Fix(es):  \n\n  * python: python: Arbitrary file write via tarfile extraction filter bypass (CVE-2026-114583)\n  * python: python: Misinterpretation of HTTP responses via invalid chunk parsing (CVE-2026-103995)\n  * python: python: Security bypass via null byte truncation in socket.getaddrinfo() (CVE-2026-116566)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
