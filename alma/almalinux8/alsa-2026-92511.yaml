details: ".NET is a fast, lightweight and modular platform for creating cross platform applications that work on Linux, macOS and Windows. It particularly focuses on creating console applications, web applications and micro-services. .NET contains a runtime conforming to .NET Standards a set of framework libraries, an SDK containing compilers and a 'dotnet' application to drive everything.  \n\nSDK version: 11.0.100~rc.3.26522.148  \nRuntime version: 11.0.0~rc.3.26522.148  \n\nSecurity Fix(es):  \n\n  * .NET: .NET Elevation of Privilege Vulnerability (CVE-2026-62909)\n  * dotnet8.0: dotnet9.0: dotnet11.0: dotnet10.0: ASP.NET Core Elevation of Privilege Vulnerability (CVE-2026-114148)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * Update .NET 11 to RC 1 (JIRA:RHEL-260220)\n  * Update .NET 11 to RC 2 (JIRA:RHEL-276919)\n  * Update .NET 11 to RC 3 (JIRA:RHEL-292372)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
