details: "The unbound packages provide a validating, recursive, and caching DNS or DNSSEC resolver.   \n\nSecurity Fix(es):  \n\n  * unbound: Unbound: Remote Code Execution Vulnerability in CNAME Synthesis (CVE-2026-82717)\n  * unbound: Unbound: Heap buffer overflow via malicious DNSSEC response (CVE-2026-81634)\n  * unbound: Unbound: Heap buffer overflow and possible Remote Code Execution when digesting DNSKEY (CVE-2026-81642)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
