details: "The perl-DBI package provides the standard database interface module for the  \nPerl programming language. It implements a database-independent interface,  \nmeaning it defines a consistent set of methods, variables, and conventions for  \ndatabase operations.  \n\nSecurity Fix(es):  \n\n  * DBI: Heap overflow when preparsing SQL statements with excessive placeholders (CVE-2026-14739)\n  * DBI: Arbitrary code execution via caller-influenced Profile attribute (CVE-2026-14380)\n\n\nFor more details about the security issue(s), including the impact, a CVSS  \nscore, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
