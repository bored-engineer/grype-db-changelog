details: "The java-1.8.0-openjdk packages provide the OpenJDK 8 Java Runtime Environment and the OpenJDK 8 Java Software Development Kit.  \n\nSecurity Fix(es):  \n\n  * JDK: Enhance Kerberos tickets (CVE-2026-114939)\n  * JDK: Enhance JFR Events (CVE-2026-114943)\n  * JDK: Enhance loop handling (CVE-2026-114946)\n  * JDK: Enhance JMX Connections (CVE-2026-114944)\n  * JDK: Improve TLS client connections (CVE-2026-114940)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
