details: |-
    Bug Fix(es):

    * AlmaLinux8.1 Snapshot3 - Passthrough PCI card goes into error state if used in domain (kvm) (BZ#1764829)

    * [HPE 8.1 BUG] Icelake: KVM missing .pconfig (BZ#1775133)

    * Failed to create a VM via virt-manager or web console in AlmaLinux8.1 snapshot-2.1 (BZ#1775134)

    * [Intel 8.2 Bug] Icelake-Server host, mode=host-model: "can't apply global Icelake-Server-x86_64-cpu.pconfig=off: Property '.pconfig' not found" (BZ#1775137)
