details: |-
    AlmaLinux Identity Management (IdM) is a centralized authentication, identity management, and authorization solution for both traditional and cloud-based enterprise environments.

    Bug Fix(es) and Enhancement(s):

    * IPA WebUI inaccessible after upgrading to AlmaLinux 8.3.- idoverride-memberof.js missing (BZ#1895910)

    * IPA should handle situations where krb5 library breaks FAST armoring with referrals (BZ#1914821)

    * ipa-kdb: support subordinate/superior UPN suffixes (BZ#1914823)
