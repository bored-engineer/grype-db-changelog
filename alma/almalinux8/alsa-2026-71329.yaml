details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: drm/amdgpu: Fix fence put before wait in amdgpu_amdkfd_submit_ib (CVE-2026-31566)\n  * kernel: netfilter: nf_queue: hold bridge skb->dev while queued (CVE-2026-52912)\n  * kernel: Linux kernel: PPPoE memory corruption via stale pointer (CVE-2026-68121)\n  * kernel: Linux kernel IPVS: Denial of Service due to stale memory references (CVE-2026-80714)\n  * kernel: nvme-tcp: reject a read that transferred too few bytes (CVE-2026-89480)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
