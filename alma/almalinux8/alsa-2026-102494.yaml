details: "The netpbm packages contain tools and a library to manipulate the Netpbm graphics file formats, and tools for conversion of other graphics formats to and from Netpbm.  \n\nSecurity Fix(es):  \n\n  * netpbm: netpbm: Arbitrary code execution via crafted PICT file in picttoppm (CVE-2026-120433)\n  * netpbm: netpbm: Arbitrary code execution via integer overflow in winicontopam (CVE-2026-120432)\n  * netpbm: netpbm: Arbitrary code execution via integer overflow in jbigtopnm (CVE-2026-120436)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
