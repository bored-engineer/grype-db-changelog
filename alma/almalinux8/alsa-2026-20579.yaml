details: "The freeipmi packages contain an Intelligent Platform Management Interface (IPMI) remote console and system management software based on the IPMI specification.  \n\nSecurity Fix(es):  \n\n  * freeipmi: buffer overflows on response messages via ipmi-oem (CVE-2026-33554)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
