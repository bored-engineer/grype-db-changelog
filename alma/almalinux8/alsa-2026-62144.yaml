details: "The wget packages provide the GNU Wget file retrieval utility for HTTP, HTTPS, and FTP protocols.  \n\nSecurity Fix(es):  \n\n  * wget: GNU Wget: Memory corruption via crafted Metalink URL (CVE-2026-58469)\n  * wget: GNU Wget: Heap buffer overflow via server-supplied filename leads to memory corruption (CVE-2026-58471)\n  * wget: GNU Wget: Arbitrary code execution or denial of service via crafted HTML attribute (CVE-2026-58472)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * wget async unsafe code in signal handler context [almalinux-8.10.z] (JIRA:AlmaLinux-145875)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
