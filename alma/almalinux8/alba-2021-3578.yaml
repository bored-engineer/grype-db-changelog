details: |-
    The Pacemaker cluster resource manager is a collection of technologies
    working together to maintain data integrity and application availability in
    the event of failures.

    Bug Fix(es) and Enhancement(s):

    * pacemaker seems to end up in an unfence loop (BZ#1972273)

    * On a three-node cluster if two nodes are hard-reset, sometimes the
    cluster ends up with unremovable transient attributes (BZ#1989622)

    * Pacemaker fencer should retry failed meta-data commands (BZ#1992014)

    * [RFE] Add ability to use sbd on cluster nodes but not remote nodes
    (BZ#1993891)
