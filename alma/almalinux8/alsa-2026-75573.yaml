details: "The Public Key Infrastructure (PKI) Core contains fundamental packages required by AlmaLinux Certificate System.  \n\nSecurity Fix(es):  \n\n  * pki-core: Dogtag/PKI: certprofile-import allows code execution via unsanitized profile content (ExternalProcessConstraint) (CVE-2026-76561)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
