details: |-
    Satellite 5 client module provides programs and libraries that allow your system to use provisioning, monitoring, and configuration management capabilities provided by AlmaLinux Satellite 5.

    This update fixes the following bugs:

    * A build dependency on Python 2 (gtk-builder-convert) has been dropped. (BZ#1598450)

    * Dnf-plugin-spacewalk now displays the correct message about the connection to AlmaLinux Satellite. (BZ#1673445)
