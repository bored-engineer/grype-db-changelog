details: |-
    The glibc packages provide the standard C libraries (libc), POSIX thread
    libraries (libpthread), standard math libraries (libm), and the name
    service cache daemon (nscd) used by multiple programs on the system.
    Without these libraries, the Linux system cannot function correctly.

    Bug Fix(es) and Enhancement(s):

    * glibc: Transaction ID collisions cause slow DNS lookups in getaddrinfo
    (BZ#1904153)

    * glibc: memcpy calls are slower for AMD processors on AlmaLinux 8 than AlmaLinux 7
    (BZ#1913750)
