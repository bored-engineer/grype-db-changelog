details: |-
    GNOME Shell extensions allow for modifying the default GNOME Shell
    interface and its parts, such as window management and application
    launching.

    Bug Fix(es) and Enhancement(s):

    * Disable unfullscreen gesture or a function to switch between normal mode
    and fullscreen mode (BZ#2009192)

    * Desktop icons extension sometimes gets confused about grab state and
    starts eating most mouse events (BZ#2019405)
