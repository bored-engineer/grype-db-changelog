details: |-
    The plymouth packages provide a graphical boot animation in place of the
    text messages that are normally displayed. Text messages are instead
    redirected to a log file for viewing after boot.

    Bug Fix(es) and Enhancement(s):

    * LUKS passphrase prompt not being presented on boot (BZ#2057275)
