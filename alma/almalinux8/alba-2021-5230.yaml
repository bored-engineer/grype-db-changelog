details: |-
    The accountsservice project provides a set of D-Bus interfaces for querying
    and manipulating user account information. It is based on the useradd,
    usermod, and userdel commands.

    Bug Fix(es) and Enhancement(s):

    * [HP WS AlmaLinux 8.5 bug] Desktop presentation changes between reboots when
    logging in as root (BZ#2013103)
