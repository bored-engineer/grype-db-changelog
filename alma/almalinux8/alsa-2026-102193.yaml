details: "Expat is a C library for parsing XML documents. The mingw-expat packages provide a port of the Expat library for MinGW.   \n\nSecurity Fix(es):  \n\n  * libexpat: denial of service via crafted XML input (CVE-2026-45186)\n  * expat: Expat: Denial of Service via quadratic complexity in attribute processing (CVE-2026-66046)\n  * expat: Expat: Denial of Service via XML external entity parsing (CVE-2026-76641)\n  * expat: Expat: XML Injection via Malformed UTF-16 Input (CVE-2026-93990)\n  * expat: expat: Information disclosure via heap buffer over-read in XML_ParseBuffer (CVE-2026-77214)\n  * expat: expat: Denial of Service via delayed entity amplification detection (CVE-2026-115506)\n  * expat: expat: Denial of Service via NULL pointer dereference in external entity parsing (CVE-2026-117610)\n  * expat: expat: Denial of Service via integer overflow during XML attribute parsing (CVE-2026-118370)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
