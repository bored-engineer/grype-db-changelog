        record_type: advisory
details: |-
    The java-11-openjdk packages provide the OpenJDK 11 Java Runtime
    Environment and the OpenJDK 11 Java Software Development Kit.

    Bug Fix(es):

    * The previous OpenJDK 11 release, 11.0.14, was found to contain a regression introduced by improvements to the HTTP client.  It caused both the :authority' and 'Host' header fields to be sent in HTTP/2 requests, which is rejected by some HTTP servers, such as Google's. With this update, the previous behaviour of only setting the ':authority' header is now used. (RH#2053174)
    * Recent changes to the Lightweight Directory Access Protocol (LDAP) implementation in OpenJDK changed the behaviour when an authentication failure occurred. Instead of aborting immediately, all available LDAP servers would be tried with the same credentials. With this update, the previous behaviour of failure after the first authentication denial is restored. (RH#2055344)
