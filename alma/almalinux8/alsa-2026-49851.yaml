details: "The kernel-rt packages provide the Real Time Linux Kernel, which enables fine-tuning for systems with extremely high determinism requirements.  \n\nSecurity Fix(es):  \n\n  * kernel: ipc: limit next_id allocation to the valid ID range (CVE-2026-52923)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * AlmaLinux8.10 - KVM: s390: Limit adapter indicator access to mapped page (JIRA:AlmaLinux-183880)\n  * CIFS mounts do not work with the latest kernel (JIRA:AlmaLinux-213976)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
