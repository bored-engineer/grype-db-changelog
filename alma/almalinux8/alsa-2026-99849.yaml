details: "CGI.pm is a stable, complete and mature solution for processing and preparing HTTP requests and responses. Major features including processing form submissions, file uploads, reading and writing cookies, query string generation and manipulation, and processing and preparing HTTP headers. Some HTML generation utilities are included as well. CGI.pm performs very well in in a vanilla CGI.pm environment and also comes with built-in support for mod_perl and mod_perl2 as well as FastCGI.  \n\nSecurity Fix(es):  \n\n  * perl-cgi: perl-cgi: Denial of Service via unenforced request and upload limits (CVE-2026-120650)\n  * perl-cgi: perl-cgi: arbitrary file write via unsanitized upload filenames (CVE-2026-120641)\n  * perl-cgi: perl-cgi: Security feature bypass via untainted request parameters (CVE-2026-120642)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
