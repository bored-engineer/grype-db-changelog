details: |-
    AlmaLinux Network Tools provide programs and libraries that allow your system to use provisioning, monitoring, and configuration management capabilities provided by AlmaLinux Network and AlmaLinux Network Satellite. The spacewalk-remote-utils package contains the spacewalk-create-channel utility that can be used to create channels with a package set for a particular release.

    This update fixes the following bug:

    There was a problem that was caused by a missing tar command for the system provisioning script (BZ#1703706).
