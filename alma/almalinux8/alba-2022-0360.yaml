details: |-
    Nmstate is a library with an accompanying command line tool that manages host
    networking settings in a declarative manner.

    Bug Fix(es) and Enhancement(s):

    * nmstate changes names of existing ovs-bridge ports when attaching a veth (BZ#2034139)

    * libnmstate expects VF to be named differently to its actual name if the name starts with enp (BZ#2039285)
