details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: RDMA/siw: Reject MPA FPDU length underflow before signed receive math (CVE-2026-64102)\n  * kernel: vmxnet3: fix BUG_ON in vmxnet3_get_hdr_len() for Geneve packets (CVE-2026-68299)\n  * kernel: net/liquidio: drop cached VF pci_dev LUT (CVE-2026-72329)\n  * kernel: dm-integrity: don't increment hash_offset twice (CVE-2026-72099)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [AlmaLinux 8.10] \"kernel BUG at lib/list_debug.c:28!\": list_add corruption in register_trace_event AlmaLinux 8.10 (JIRA:AlmaLinux-214136)\n  * request_key_auth use-after-free on every request-key upcall since 4.18.0-553.165.1 (regression from CVE-2026-63823 backport) (JIRA:AlmaLinux-270349)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
