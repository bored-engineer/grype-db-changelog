details: "The libpng12 package provides libpng 1.2, which is the previous version of the libpng library for manipulating PNG (Portable Network Graphics) image format files. This version should be used in case that it is not possible to use the current version of libpng.  \n\nSecurity Fix(es):  \n\n  * libpng: libpng: Arbitrary code execution due to use-after-free vulnerability (CVE-2026-33416)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
