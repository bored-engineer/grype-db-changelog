details: "Pluggable Authentication Modules (PAM) provide a system to set up authentication policies without the need to recompile programs to handle authentication.  \n\nSecurity Fix(es):  \n\n  * pam: libpam: Libpam vulnerable to read hashed password (CVE-2024-10041)\n  * pam: Improper Hostname Interpretation in pam_access Leads to Access Control Bypass (CVE-2024-10963)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
