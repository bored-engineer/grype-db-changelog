details: "GD is an open source code library for the dynamic creation of images by programmers. GD creates PNG, JPEG, GIF, WebP, XPM, BMP images, among other formats.   \n\nSecurity Fix(es):  \n\n  * libgd: buffer overflow when processing specially crafted GIF file (CVE-2026-9672)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
