details: "This module converts Perl data structures to JSON and vice versa. Its primary goal is to be correct and its secondary goal is to be fast. To reach the latter goal it was written in C.  \n\nSecurity Fix(es):  \n\n  * JSON-XS: integer buffer overflow causing a segfault when parsing crafted JSON (CVE-2025-40928)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
