details: "SAC is a standard interface for CSS parsers, intended to work with CSS1, CSS2, CSS3 and other CSS derived languages.  \n\nSecurity Fix(es):  \n\n  * libreoffice: heap buffer overflow in PDF import stream handling (CVE-2026-63274)\n  * libreoffice: stack buffer overflow in CFF to Type 1 font conversion (CVE-2026-63276)\n  * libreoffice: stack buffer overflow in CFF font hint handling (CVE-2026-63275)\n  * libreoffice: libreoffice: Arbitrary code execution via remote Java database driver (CVE-2026-63277)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [libbase] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275415)\n  * [flute] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275416)\n  * [libserializer] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275417)\n  * [libloader] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275418)\n  * [libformula] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275419)\n  * [librepository] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275420)\n  * [libfonts] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275421)\n  * [liblayout] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275422)\n  * [pentaho-libxml] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275423)\n  * [pentaho-reporting-flow-engine] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-275424)\n  * [sac] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-277813)\n  * [libreoffice] LibreOffice packages using EOL Java (after November 2026) (JIRA:AlmaLinux-260518)\n  * [AlmaLinux 8.10] Base Report Wizard fails with packaged Pentaho reporting engine (JIRA:AlmaLinux-286491)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
