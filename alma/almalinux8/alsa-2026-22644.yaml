database_specific:
    anchore:
        record_type: advisory
details: "Samba is an open-source implementation of the Server Message Block (SMB) protocol and the related Common Internet File System (CIFS) protocol, which allow PC-compatible machines to share files, printers, and various information.  \n\nSecurity Fix(es):  \n\n  * samba: group policy certificate enrollment uses <http://> without validation (CVE-2026-3012)\n  * samba: Samba: Remote Code Execution in printing subsystem via unescaped job description (CVE-2026-4480)\n  * samba: Remote Code Execution in SAMR (CVE-2026-4408)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
