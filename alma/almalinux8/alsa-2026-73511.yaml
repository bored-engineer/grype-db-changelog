details: "The gawk packages contain the GNU version of awk, a text processing utility. Awk interprets a special-purpose programming language to do quick and easy text pattern matching and reformatting jobs.  \n\nSecurity Fix(es):  \n\n  * gawk: gawk: Memory corruption via integer overflow (CVE-2026-40468)\n  * gawk: gawk: Denial of Service due to Use After Free vulnerability in io.c (CVE-2026-40467)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
