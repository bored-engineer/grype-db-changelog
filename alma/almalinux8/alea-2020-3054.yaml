details: |-
    Eclipse is an integrated development environment (IDE).

    This enhancement update adds the eclipse:rhel8 module to AlmaLinux The eclipse:rhel8 module provides Eclipse version 4.15, which is based on the Eclipse Foundation's 2020-03 release train. (BZ#1786637)

    For detailed information on changes in this release, see the AlmaLinux Release Notes linked from the References section.

    For instructions on how to use the Eclipse module, see Using Eclipse linked from the References section.
