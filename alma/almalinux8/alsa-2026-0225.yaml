details: "MariaDB is a multi-user, multi-threaded SQL database server that is binary compatible with MySQL.   \n\nSecurity Fix(es):  \n\n  * mariadb: MariaDB: mariadb-dump utility vulnerable to remote code execution via improper path validation (CVE-2025-13699)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
