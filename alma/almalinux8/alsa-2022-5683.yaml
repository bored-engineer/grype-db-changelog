details: |-
    The java-11-openjdk packages provide the OpenJDK 11 Java Runtime Environment and the OpenJDK 11 Java Software Development Kit.
    The following packages have been upgraded to a later upstream version: java-11-openjdk (11.0.16.0.8). (BZ#2084649)
    Security Fix(es):
    * OpenJDK: integer truncation issue in Xalan-J (JAXP, 8285407) (CVE-2022-34169)
    * OpenJDK: class compilation issue (Hotspot, 8281859) (CVE-2022-21540)
    * OpenJDK: improper restriction of MethodHandle.invokeBasic() (Hotspot, 8281866) (CVE-2022-21541)
    For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
    Bug Fix(es):
    * rh1991003 patch breaks sun.security.pkcs11.wrapper.PKCS11.getInstance() [almalinux-8, openjdk-11] (BZ#2099917)
    * Revert to disabling system security properties and FIPS mode support together [almalinux-8, openjdk-11] (BZ#2108248)
    * SecretKey generate/import operations don't add the CKA_SIGN attribute in FIPS mode [almalinux-8, openjdk-11] (BZ#2108251)
