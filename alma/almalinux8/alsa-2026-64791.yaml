details: "389 Directory Server is an LDAP version 3 (LDAPv3) compliant server. The base packages include the Lightweight Directory Access Protocol (LDAP) server and command-line utilities for server administration.   \n\nSecurity Fix(es):  \n\n  * 389-ds-base: 389-ds-base: heap buffer overflow via SASL wrapped-record length lower-bound underflow in sasl_io_start_packet() (CVE-2026-18355)\n  * 389-ds-base: 389-ds-base: pre-authentication NULL pointer dereference via paged results and USE_ONE_BACKEND control in op_shared_search (CVE-2026-18453)\n  * 389-ds-base: 389-ds-base: SASL PLAIN authentication allows privilege escalation to Directory Manager via stale identity in Cyrus SASL auxiliary property (CVE-2026-18922)\n  * 389-ds-base: 389-ds: anonymous LDAP client can defeat SELFDN ACI bind-rule checks via empty bind DN (CVE-2026-76560)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * lib389: set nsDS5ReplicaBindDNGroup before ensure_agreement() [almalinux-8.10.z] (JIRA:AlmaLinux-244463)\n  * fix breaks replication total init when nsDS5ReplicaBindDNGroup is set after agreement creation [almalinux-8.10.z] (JIRA:AlmaLinux-248762)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
