details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: HID: wacom: Fix OOB write in wacom_hid_set_device_mode() (CVE-2026-63916)\n  * kernel: ALSA: ua101: reject mismatched capture/playback packet sizes (CVE-2026-98741)\n  * kernel: kernel: privilege escalation via incomplete event filter expressions (CVE-2026-99236)\n  * kernel: kernel: Out-of-bounds write in nfsd via crafted SEQUENCE compound requests (CVE-2026-99362)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * kswapd0 loops in do_shrink_slab holding shrinker_rwsem after list_lru_count_one returns a negative nr_items as unsigned long, system hangs (JIRA:RHEL-300411)\n  * [AlmaLinux 8] vlan-tagged GSO packets are dropped in __dev_queue_xmit with SKB_DROP_REASON_SKB_BAD_GSO (JIRA:RHEL-307055)\n  * AlmaLinux 8 error in device recovery while iscsi is in use (JIRA:RHEL-307720)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
