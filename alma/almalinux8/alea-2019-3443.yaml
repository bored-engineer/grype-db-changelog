details: "GCC Toolset is a compiler toolset that provides recent versions of development tools. GCC Toolset is an Application Stream packaged as a Software Collection.\n\nThis enhancement update adds the gcc-toolset-9-elfutils packages to AlmaLinux Eneterprise Linux 8.\n\nFor instructions on usage, see Using GCC Toolset linked from the References section. Components and specifics of this version are documented in the GCC Toolset 9 chapter. \n\nFor detailed changes in this release, see the AlmaLinux Release Notes."
