details: "The util-linux packages contain a large variety of low-level system utilities that are necessary for a Linux system to function. Among others, these include the fdisk configuration tool and the login program.  \n\nSecurity Fix(es):  \n\n  * util-linux: util-linux: heap use-after-free in libblkid nested partition probing (CVE-2026-13595)\n  * util-linux: TOCTOU in the mount program via ancestor directory swap on target path (CVE-2026-53613)\n  * util-linux: util-linux: Partition metadata compromise via integer overflow in DOS partition parser (CVE-2026-53615)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
