details: "The gfs2-utils packages contain utilities for creating, checking, modifying, and correcting any inconsistencies in GFS2 global file systems.  \n\nSecurity Fix(es):  \n\n  * gfs2-utils: gfs2-utils: stack out-of-bounds write via unchecked height in savemeta (CVE-2026-71221)\n  * gfs2-utils: gfs2-utils: stack out-of-bounds write via unchecked di_height in gfs2_edit (CVE-2026-71220)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
