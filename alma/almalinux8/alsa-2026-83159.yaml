details: "The kernel-rt packages provide the Real Time Linux Kernel, which enables fine-tuning for systems with extremely high determinism requirements.  \n\nSecurity Fix(es):  \n\n  * kernel: Linux kernel: Denial of Service due to use-after-free in act_tunnel_key (CVE-2026-68377)\n  * kernel: ASoC: SOF: ipc3-control: Fix heap overflow in bytes_ext put/get (CVE-2026-72262)\n  * kernel: net/sched: cls_route: fix fastmap use-after-free on filter (CVE-2026-74583)\n  * kernel: ALSA: usx2y: bound the hwdep mmap fault offset (CVE-2026-74641)\n  * kernel: udp: fix potential use-after-free in tunnel segmentation (CVE-2026-74705)\n  * kernel: svcrdma: Validate Read chunk positions before reconstruction (CVE-2026-89526)\n  * kernel: NFSD: Prevent client use-after-free during blocked-lock reaping (CVE-2026-90036)\n  * kernel: svcrdma: Reject Write/Reply chunks with segcount 0 (CVE-2026-93228)\n  * kernel: md/raid5-ppl: fix use-after-free in ppl_do_flush() (CVE-2026-93262)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * powerpc/pseries: pci - logic bug in SR-IOV enable (JIRA:AlmaLinux-240146)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
