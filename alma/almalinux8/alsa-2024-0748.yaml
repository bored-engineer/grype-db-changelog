details: |-
    The container-tools module contains tools for working with containers, notably podman, buildah, skopeo, and runc.

    Security Fix(es):

    * runc: file descriptor leak ("Leaky Vessels") (CVE-2024-21626)

    A AlmaLinux Security Bulletin which addresses further details about the Leaky Vessels flaw is available in the References section.

    * golang: net/http/internal: Denial of Service (DoS) via Resource Consumption via HTTP requests (CVE-2023-39326)
    * golang: crypto/tls: Timing Side Channel attack in RSA based TLS key exchanges. (CVE-2023-45287)

    For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
