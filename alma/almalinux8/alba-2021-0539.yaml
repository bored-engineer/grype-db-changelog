details: |-
    The libblockdev packages provide a C library with GObject introspection
    support used for low-level operations on block devices. The library serves
    as a thin wrapper around plug-ins for specific functionality, such as LVM,
    Btrfs, LUKS, or MD RAID.

    Bug Fix(es) and Enhancement(s):

    * libblockdev doesn't run external utilities with LC_ALL=C and fails to
    parse their localized output (BZ#1895286)
