details: "The kernel-rt packages provide the Real Time Linux Kernel, which enables fine-tuning for systems with extremely high determinism requirements.  \n\nSecurity Fix(es):  \n\n  * kernel: drm/amdgpu: Fix use-after-free race in VM acquire (CVE-2026-43370)\n  * kernel: mac802154: llsec: add skb_cow_data() before in-place crypto (CVE-2026-63831)\n  * kernel: sctp: don't free the ASCONF's own transport in DEL-IP processing (CVE-2026-64564)\n  * kernel: ASoC: SOF: ipc3-control: Validate size in snd_sof_update_control (CVE-2026-72261)\n  * kernel: xfrm: ah6: validate routing header segments_left (CVE-2026-80844)\n  * kernel: net: tun: bound receive headroom (CVE-2026-81000)\n  * kernel: scsi: qla2xxx: Bound rsp_info_len to avoid OOB sense-data read (CVE-2026-89846)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * sctp: prevent peer transport count overflow [almalinux-8.10.z] (JIRA:AlmaLinux-216297)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
