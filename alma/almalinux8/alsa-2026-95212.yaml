details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: sctp: stream: fully roll back denied add-stream state (CVE-2026-52929)\n  * kernel: net/smc: fix UAF in smc_cdc_rx_handler() by pinning the socket (CVE-2026-64541)\n  * kernel: sctp: clear new_transport when removing a peer (CVE-2026-74586)\n  * kernel: RDMA/rxe: Fix responder UAF on IB_QP_MAX_DEST_RD_ATOMIC modify_qp (CVE-2026-80864)\n  * kernel: RDMA/rxe: Fix OOB in free_rd_atomic_resources() (CVE-2026-80863)\n  * kernel: openvswitch: Fix CT limit teardown use-after-free (CVE-2026-89488)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * AlmaLinux8.10 - s390/smp: Remove conditional emergency signal usage (JIRA:RHEL-298849)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
