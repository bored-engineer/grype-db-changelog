details: "The kernel-rt packages provide the Real Time Linux Kernel, which enables fine-tuning for systems with extremely high determinism requirements.  \n\nSecurity Fix(es):  \n\n  * kernel: Revert \"net/smc: Introduce TCP ULP support\" (CVE-2026-46330)\n  * kernel: Linux kernel: PPP over L2TP Use-After-Free vulnerability (CVE-2026-68398)\n  * kernel: openvswitch: fix GSO userspace truncation underflow (CVE-2026-68123)\n  * kernel: Bluetooth: mgmt: fix UAF in pair command cancellation (CVE-2026-74510)\n  * kernel: net: bridge: mcast: fix use-after-free of a master VLAN's multicast context (CVE-2026-80842)\n  * kernel: ALSA: seq: midi: Serialize input teardown with event_input (CVE-2026-90207)\n  * kernel: ALSA: pcm: Serialize PCM mmap with buffer reallocation to fix page UAF (CVE-2026-98116)\n  * kernel: s390/boot: Avoid IPL parameter append past command line (CVE-2026-98403)\n  * kernel: kernel: Denial of Service via unvalidated task in iSCSI management responses (CVE-2026-99152)\n  * kernel: kernel: Denial of service via unvalidated task tag in iSCSI Reject PDU (CVE-2026-99153)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
