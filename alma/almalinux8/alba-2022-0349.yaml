details: |-
    Clevis is a pluggable framework for automated decryption. It can be used to
    provide automated decryption of data or even automated unlocking of LUKS
    volumes. The clevis packages provide the client side of the Network Bound
    Disk Encryption (NBDE) project.

    Bug Fix(es) and Enhancement(s):

    * Server hangs in asking password unless user hits enter in clevis/dracut
    (BZ#2023256)
