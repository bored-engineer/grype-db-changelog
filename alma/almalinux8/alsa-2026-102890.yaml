details: "The OpenSCAP suite enables integration of the Security Content Automation  \nProtocol (SCAP) line of standards. The openscap packages provide the  \nOpenSCAP library and the oscap utility that provides various SCAP  \ncapabilities.  \n\nFor detailed information on changes in this release, see the OpenSCAP  \nrelease notes linked from the References section.\n"
