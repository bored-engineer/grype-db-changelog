details: |-
    The resource-agents packages provide the Pacemaker and RGManager service
    managers with a set of scripts. These scripts interface with several
    services to allow operating in a high-availability (HA) environment.

    Bug Fix(es) and Enhancement(s):

    * gcp-vpc-move-vip, gcp-vpc-move-route, gcp-pd-move: A failed API call
    returns OCF_ERR_CONFIGURED, preventing restarts (BZ#2008955)

    * gcp-vpc-move-route and gcp-vpc-move-vip can fail with permission denied
    errors if token file is not found (BZ#2011839)
