details: "The sos package contains a set of utilities that gather information from system hardware, logs, and configuration files. The information can then be used for diagnostic purposes and debugging.  \n\nSecurity Fix(es):  \n\n  * sos: sos: path traversal in sos clean tar extraction via unvalidated symlink/hardlink targets leads to arbitrary file write (CVE-2026-79655)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * Hydra to GraphQL migration and sos upload [rhel-8.10.z] (JIRA:RHEL-290944)\n  * Hydra to GraphQL migration and sos upload (JIRA:RHEL-290945)\n  * Hydra to GraphQL migration and sos upload [rhel-9.4.z] (JIRA:RHEL-290946)\n  * Hydra to GraphQL migration and sos upload [rhel-9.6.z] (JIRA:RHEL-290947)\n  * Hydra to GraphQL migration and sos upload [rhel-9.8.z] (JIRA:RHEL-290948)\n  * Hydra to GraphQL migration and sos upload [rhel-10.0.z] (JIRA:RHEL-290951)\n  * Hydra to GraphQL migration and sos upload [rhel-10.2.z] (JIRA:RHEL-290952)\n  * Hydra to GraphQL migration and sos upload [rhel-8.4.z] (JIRA:RHEL-304344)\n  * Hydra to GraphQL migration and sos upload [rhel-8.6.z] (JIRA:RHEL-304345)\n  * Hydra to GraphQL migration and sos upload [rhel-8.8.z] (JIRA:RHEL-304346)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
