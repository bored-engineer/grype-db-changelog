details: "Performance Co-Pilot (PCP) is a suite of tools, services, and libraries for acquisition, archiving, and analysis of system-level performance measurements. Its light-weight distributed architecture makes it particularly well-suited to centralized analysis of complex systems.  \n\nSecurity Fix(es):  \n\n  * PCP: PCP: Remote denial of service and information leakage (CVE-2026-16530)\n  * PCP: PCP: Arbitrary file creation via path traversal in pmproxy logger servlet (CVE-2026-16531)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [Downstream] Rebase to the v7.1.3 or newer in 10.3 (JIRA:RHEL-173456)\n  * Cockpit reports \"Metrics history could not be loaded\" when some older pmlogger metrics are corrupted (JIRA:RHEL-139714)\n  * pcp-pmda-hdb and pcp-pmda-postgresql ship active default credentials in configuration files (JIRA:RHEL-152221)\n  * [AlmaLinux 10.2] PCP (pcp-zeroconf) now pulls a new set of additional packages that are not really required by default (JIRA:RHEL-180384)\n  * Remove legacy pcp-pmda-bcc package from AlmaLinux 10 and in favor of pcp-pmda-bpf (JIRA:RHEL-188397)\n  * Update of MSSQL PMDA to work with msodbcsql v18 (JIRA:RHEL-177599)\n  * Migrate to libvalkey from hiredis/hiredis-cluster (JIRA:RHEL-108916)\n  * pcp2openmetrics reports only the first metric when uses pmlogger archives (JIRA:RHEL-114006)\n  * pcp2opentelemetry generates output that is incompatible with OTLP/protobuf (JIRA:RHEL-130463)\n  * \"opentelemetry.control.status_code\" metric does not report failing scripts (JIRA:RHEL-130499)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.  \n\nAdditional Changes:  \n\nFor detailed information on changes in this release, see the AlmaLinux 10 Release Notes linked from the References section.\n"
