details: "The sudo packages contain the sudo utility which allows system administrators to provide certain users with the permission to execute privileged commands, which are used for system management purposes, without having to log in as root.  \n\nSecurity Fix(es):  \n\n  * sudo: Sudo: Policy bypass allows unauthorized program execution via execveat (CVE-2026-82474)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * Use canonicalized path if user path contains \"..\" (JIRA:AlmaLinux-212546)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
