details: "Libreswan is an implementation of IPsec and IKE for Linux. IPsec is the Internet Protocol Security and uses strong cryptography to provide both authentication and encryption services. These services allow you to build secure tunnels through untrusted networks such as virtual private network (VPN).  \n\nSecurity Fix(es):  \n\n  * libreswan: IKEv2 Use-After-Free bug when using IKE-over-TCP (CVE-2026-94453)\n  * libreswan: Denial of Service via sending bogus X.509 certificates (CVE-2026-77205)\n  * libreswan: Null Pointer Dereference in PKCS#7 bundle with no CERTS (CVE-2026-77207)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
