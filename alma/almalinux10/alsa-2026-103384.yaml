details: "Grafana is an open source, feature rich metrics dashboard and graph editor for Graphite, InfluxDB & OpenTSDB.   \n\nSecurity Fix(es):  \n\n  * net/[http](http): golang: golang.org/x/net/http2: net/[http](http): HTTP response smuggling via malformed HTTP/2 framing headers (CVE-2026-78660)\n  * grafana: IMAGE RENDER KEYS COULD BE REPLAYED ACROSS GRAFANA INSTANCES THAT SHARE A RENDERER TOKEN (CVE-2026-102589)\n  * grafana: ELASTICSEARCH DATA SOURCE COULD BE USED TO SEND ARBITRARY REQUESTS TO ELASTICSEARCH (CVE-2026-106475)\n  * grafana: MOVING A FOLDER THROUGH THE RESOURCE API COULD GRANT FOLDER ADMIN PERMISSIONS (CVE-2026-111000)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
