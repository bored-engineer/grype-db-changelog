details: "The xfsprogs packages contain a set of utilities to administer the XFS file system, including the mkfs.xfs utility to construct an XFS file system.  \n\nSecurity Fix(es):  \n\n  * xfsprogs: xfsprogs: Local privilege escalation via command injection in xfs_admin (CVE-2026-108472)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
