details: "Mutter is a compositing window manager that displays and manages desktop through OpenGL. It combines the window-management logic inherited from the Metacity window manager with a display engine that uses the Clutter toolkit.   \n\nSecurity Fix(es):  \n\n  * mutter: mutter: client-triggered use-after-free in Wayland color-management ICC image description path (CVE-2026-108094)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
