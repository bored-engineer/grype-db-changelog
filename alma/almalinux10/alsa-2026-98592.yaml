details: "go-fdo-client is the device-side implementation of FIDO Device Onboard specification in Go. It provides an FDO client that interacts with FDO manufacturer and owner servers to perform device on-boarding.  \n\nSecurity Fix(es):  \n\n  * crypto/tls: golang: Golang crypto/tls: Denial of Service via indefinite KeyUpdate messages (CVE-2026-56862)\n  * net/[http](http): net/http/internal/http2: golang.org/x/net/http2: net/[http](http): Denial of Service via excessive HTTP/2 SETTINGS frames (CVE-2026-78669)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
