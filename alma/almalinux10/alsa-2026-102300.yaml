details: "PHP is an HTML-embedded scripting language commonly used with the Apache HTTP Server.  \n\nSecurity Fix(es):  \n\n  * php: PHP-CGI out-of-bounds read and write during PATH_INFO correction (CVE-2026-129538)\n  * php: Timezone cache use-after-free can lead to remote code execution (CVE-2026-129496)\n  * php: PHP-FPM epoll use-after-free can lead to local privilege escalation (CVE-2026-129291)\n  * php: PHP-FPM request smuggling through an unread HTTP request body) (CVE-2026-129289)\n  * php: PHP-FPM status endpoint XSS via unescaped user and script fields) (CVE-2026-129292)\n  * php: PHAR OpenSSL signature bypass via algorithm downgrade (CVE-2026-128090)\n  * php: SOAP use-after-free when processing DTD entity references (CVE-2026-129506)\n  * php: Partially overwritten session files can lead to remote code execution (CVE-2026-126714)\n  * php: Session serializer mismatch can lead to remote code execution (CVE-2026-115560)\n  * php: Use-after-free after interrupted session shutdown (CVE-2026-129481)\n  * php: Mixed-case HTTPS and FTPS URLs can expose data in plaintext (CVE-2026-128064)\n  * php: Denial of service through folded HTTP response headers (CVE-2026-127960)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * php: Rebase PHP to 8.3.37 in rhel-10.3.z (JIRA:RHEL-310444)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
