details: "The patch program applies diff files to originals. The diff command is used to compare an original to a changed file. Diff lists the changes made to the file. A person who has the original file can then use the patch command with the diff file to add the changes to their original file (patching the file).  \n\nSecurity Fix(es):  \n\n  * patch: Filename validation bypass in reversal fallback allows file creation outside the working directory (CVE-2026-115207)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
