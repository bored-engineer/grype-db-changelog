details: "The libpcap packages provide a portable framework for low-level network monitoring. The libpcap library provides network statistics collection, security monitoring, and network debugging.  \n\nSecurity Fix(es):  \n\n  * libpcap: libpcap: Denial of Service via infinite loop in BPF interpreter (CVE-2026-6554)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
