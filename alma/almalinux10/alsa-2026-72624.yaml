details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: KVM: nSVM: Raise #UD if unhandled VMMCALL isn't intercepted by L1 (CVE-2026-46076)\n  * kernel: ext4: fix e4b bitmap inconsistency reports (CVE-2026-45942)\n  * kernel: KVM: arm64: Reassign nested_mmus array behind mmu_lock (CVE-2026-46317)\n  * kernel: fhandle: fix UAF due to unlocked ->mnt_ns read in may_decode_fh() (CVE-2026-53341)\n  * kernel: perf/core: Detach event groups during remove_on_exec (CVE-2026-64556)\n  * kernel: vmxnet3: fix BUG_ON in vmxnet3_get_hdr_len() for Geneve packets (CVE-2026-68299)\n  * kernel: crypto: tegra - fix rctx->cryptlen calculation in tegra_gcm_do_one_req() (CVE-2026-80522)\n  * kernel: perf: Reject exited events as group leaders (CVE-2026-74753)\n  * kernel: nvme-tcp: reject a read that transferred too few bytes (CVE-2026-89480)\n  * kernel: KVM: arm64: Handle negative S1 walk levels in VNCR TLB size evaluation (CVE-2026-89775)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * KVM: s390: Limit adapter indicator access to mapped page [almalinux-10.2.z] (JIRA:AlmaLinux-188661)\n  * crypto: xxhash64 should not be fips approved [almalinux-10.2.z] (JIRA:AlmaLinux-254943)\n  * kata-tdx TD vCPU stuck at reset vector (EIP=0xFFF0) on Intel Xeon 6 (Granite Rapids / Sierra Forest) ? guest never executes. (10.2.z) (JIRA:AlmaLinux-260402)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
