details: "The Berkeley Internet Name Domain (BIND) is an implementation of the Domain Name System (DNS) protocols. BIND includes a DNS server (named); a resolver library (routines for applications to use when interfacing with DNS); and tools for verifying that the DNS server is operating correctly.  \n\nSecurity Fix(es):  \n\n  * bind: Amplification vulnerabilities via self-pointed glue records (CVE-2026-3592)\n  * bind: Unbounded resend loop in BIND 9 resolver (CVE-2026-5950)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [BUG] Bind DNS forwarder when configured to allow stale answers fails to provide resonse of 3 layer CNAME when TTL abruptly changes to 0 [rhel-10] (JIRA:RHEL-142289)\n  * [rhel-10] Bind 9.18.33 DNSSEC Key Rollover with KASP Causes ZSK Key To Be Removed Prematurely (JIRA:RHEL-144421)\n  * bind: New root trust anchor key for DNSSEC [rhel-10.3] (JIRA:RHEL-255748)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.  \n\nAdditional Changes:  \n\nFor detailed information on changes in this release, see the AlmaLinux 10 Release Notes linked from the References section.\n"
