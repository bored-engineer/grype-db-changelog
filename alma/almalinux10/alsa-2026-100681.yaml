details: "Expat is a C library for parsing XML documents.  \n\nSecurity Fix(es):  \n\n  * expat: expat: Denial of Service via improper memory tracking in XML_ParserReset (CVE-2026-113351)\n  * expat: expat: Denial of Service via delayed entity amplification detection (CVE-2026-115506)\n  * expat: expat: Denial of Service via NULL pointer dereference in external entity parsing (CVE-2026-117610)\n  * expat: expat: Denial of Service via integer overflow during XML attribute parsing (CVE-2026-118370)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
