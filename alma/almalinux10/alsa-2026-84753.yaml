details: "The glibc packages provide the standard C libraries (libc), POSIX thread libraries (libpthread), standard math libraries (libm), and the name service cache daemon (nscd) used by multiple programs on the system. Without these libraries, the Linux system cannot function correctly.  \n\nSecurity Fix(es):  \n\n  * glibc: Non-progress DoS in SHIFT_JISX0213 -&gt (CVE-2026-77117)\n  * glibc: Non-progress DoS in EUC_JISX0213 -> UCS-4 conversion state (CVE-2026-80489)\n  * glibc: glibc: Heap buffer overflow via attacker-controlled fopen mode string (CVE-2026-18374)\n  * glibc: glibc DNS stub resolver: Denial of Service via long search domain in configuration (CVE-2026-8674)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
