details: "The Udisks project provides a daemon, tools, and libraries to access and manipulate disks, storage devices, and technologies.  \n\nSecurity Fix(es):  \n\n  * udisks2: udisks2: Local Privilege Escalation via as-user option spoofing (CVE-2026-7867)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
