details: "EDK (Embedded Development Kit) is a project to enable UEFI support for Virtual Machines. This package contains a sample 64-bit UEFI firmware for QEMU and KVM.   \n\nSecurity Fix(es):  \n\n  * openssl: Use After Free with SSL_free_buffers (CVE-2024-4741)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * [edk2,rhel-10] rebase to edk2-stable202602 (JIRA:RHEL-151719)\n  * edk2/x64: re-enable legacy kernel loader (JIRA:RHEL-182419)\n  * [edk2,rhel-10] Unable to allocate PCI BAR with edk2-20260221-1.el10 (JIRA:RHEL-188305)\n  * [edk2] update dbx database to release 1.6.5 (JIRA:RHEL-193127)\n  * [AlmaLinux 10.3] TDX Secure Boot Setup Mode with OVMF.inteltdx.secboot.fd (JIRA:RHEL-220548)\n  * add shell.efi to aarch64 sub-rpm (JIRA:RHEL-235957)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.  \n\nAdditional Changes:  \n\nFor detailed information on changes in this release, see the AlmaLinux 10 Release Notes linked from the References section.\n"
