details: "libinput is a library that handles input devices for display servers and other applications that need to directly deal with input devices.  \n\nSecurity Fix(es):  \n\n  * libinput: local privilege escalation via crafted uinput devices (CVE-2026-50292)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
