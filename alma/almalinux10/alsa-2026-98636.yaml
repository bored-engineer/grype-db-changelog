details: "Qt is a software toolkit for developing applications. This package contains base tools, like string, xml, and network handling.  \n\nSecurity Fix(es):  \n\n  * qt5-qtbase: qt6-qtbase: qt: Denial of Service via excessively large HTTP Cache-Control header (CVE-2026-76151)\n  * qt: qt: Denial of Service via crafted XML parsing in QXmlStreamReader (CVE-2026-16762)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
