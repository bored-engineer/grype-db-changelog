details: "This module manages common properties of domains for one or more virtual hosts. Specifically it can use the ACME protocol to automate certificate provisioning. Certificates will be configured for managed domains and their virtual hosts automatically, including at renewal.  \n\nSecurity Fix(es):  \n\n  * httpd: mod_md: unrestricted OCSP response leads to resource exhaustion (CVE-2026-29168)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
