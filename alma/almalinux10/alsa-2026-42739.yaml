details: "Access Control Lists (ACLs) are used to define fine-grained discretionary access rights for files and directories. The acl packages contain the getfacl and setfacl utilities needed for manipulating access control lists.  \n\nSecurity Fix(es):  \n\n  * acl: Symlink traversal privilege escalation via libacl functions (CVE-2026-54369)\n  * acl: TOCTOU Symlink Traversal via getfacl/setfacl (CVE-2026-54370)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
