details: "The GNU Debugger (GDB) allows debugging of programs written in C, C++, and  \nother languages by executing them in a controlled fashion and printing their  \ndata.  \n\nSecurity Fix(es):  \n\n  * gdb: Out-of-bounds write in STABS parser read_member_functions() via crafted ELF (CVE-2026-13732)\n\n\nFor more details about the security issue(s), including the impact, a CVSS  \nscore, acknowledgments, and other related information, refer to the CVE  \npage(s) listed in the References section.\n"
