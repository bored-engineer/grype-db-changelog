details: "The attr packages provide extended attributes, which can be used to store system objects like capabilities of executables and access control lists, as well as user objects.  \n\nSecurity Fix(es):  \n\n  * attr: Symlink Traversal Privilege Escalation via getfattr and setfattr (CVE-2026-54371)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
