details: "The sg3_utils packages provide command-line utilities for devices that use the Small Computer System Interface (SCSI) command sets.  \n\nSecurity Fix(es):  \n\n  * sg3_utils: sg3_utils: arbitrary command execution via udev property injection in sg_inq --export (CVE-2026-16313)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * sg_inq output conformance for SCSI name string and ATA fields [almalinux-10.2.z] (JIRA:AlmaLinux-188123)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
