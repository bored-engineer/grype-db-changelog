details: "The ldns packages contain a library with the aim to simplify DNS programming in C. All low-level DNS/DNSSEC operations are supported. We also define a higher level API which allows a programmer to (for instance) create or sign packets.  \n\nSecurity Fix(es):  \n\n  * ldns: ldns: Off-path poisoning attacks due to insufficient query-response matching (CVE-2026-10846)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
