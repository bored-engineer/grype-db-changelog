details: "PHP is an HTML-embedded scripting language. PHP attempts to make it easy for developers to write dynamically generated web pages. PHP also offers built-in database integration for several commercial and non-commercial database management systems, so writing a database-enabled webpage with PHP is fairly simple. The most common use of PHP coding is probably as a replacement for CGI scripts.  \n\nSecurity Fix(es):  \n\n  * php: ext-pgsql: PHP: SQL injection via improper backslash escaping (CVE-2026-17543)\n  * php: PHP: Arbitrary code execution via out-of-bounds write in bccomp() (CVE-2026-17544)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * Rebase PHP to 8.4.24 for CVE-2026-17543 and CVE-2026-7260 and CVE-2026-17544 in 10.2.z (JIRA:AlmaLinux-223949)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
