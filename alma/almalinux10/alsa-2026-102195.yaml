details: "OpenSSH is an SSH protocol implementation supported by a number of Linux, UNIX, and similar operating systems. It includes the core files necessary for both the OpenSSH client and server.  \n\nSecurity Fix(es):  \n\n  * openssh: openssh: Information disclosure via shared compression side-channel (CVE-2026-106582)\n  * openssh: openssh: Arbitrary file write via directory traversal during sftp recursive copy (CVE-2026-106552)\n  * openssh: OpenSSH: Credential disclosure via failed GSSAPI authentication (CVE-2026-106553)\n  * openssh: openssh: Denial of service via oversized decompressed packets (CVE-2026-106585)\n  * openssh: openssh: Command injection via unvalidated command-line username (CVE-2026-106583)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * Cannot use IdentititesOnly=yes + PKCS#11 URI in IdentityFile anymore [rhel-10.3.z] (JIRA:RHEL-288515)\n  * ssh-copy-id fails to AlmaLinux 10 [rhel-10.3.z] (JIRA:RHEL-288521)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
