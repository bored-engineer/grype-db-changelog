details: "The gcc-toolset-16-gcc package contains the GNU Compiler Collection version 16.  \n\nSecurity Fix(es):  \n\n  * gcc: Integer wrap in `std (CVE-2026-114691)\n  * gcc: Confirmed out-of-bounds read/write in libstdc++ parallel `std (CVE-2026-114690)\n  * gcc: Stack overflow in std::bitset on libstdc++ (CVE-2026-115455)\n  * gcc: Out-of-bounds read in std::from_chars (CVE-2026-115456)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
