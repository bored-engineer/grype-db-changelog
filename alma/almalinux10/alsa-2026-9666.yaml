details: "The wireshark packages contain a network protocol analyzer used to capture and browse the traffic running on a computer network.  \n\nSecurity Fix(es):  \n\n  * wireshark: Buffer Over-read in Wireshark (CVE-2026-3203)\n  * wireshark: Improperly Controlled Sequential Memory Allocation in Wireshark (CVE-2026-3201)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
