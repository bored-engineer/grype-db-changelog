details: "An implementation of the RPM PGP interface using Sequoia.  \n\nSecurity Fix(es):  \n\n  * sequoia-openpgp: sequoia-openpgp: Cryptographic integrity compromise via key flag confusion (CVE-2026-42784)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * Uninformative error message on --import failure [almalinux-10.2.z] (JIRA:AlmaLinux-176906)\n  * Return NotTrusted importing non-allowed keys [almalinux-10.2.z] (JIRA:AlmaLinux-176907)\n  * [FTBFS] Update bindgen for LLVM 22 compatibility [almalinux-10.2.z] (JIRA:AlmaLinux-176908)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
