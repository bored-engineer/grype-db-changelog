details: "The Apache Commons BeanUtils library provides utility methods for accessing and modifying properties of arbitrary JavaBeans.  \n\nSecurity Fix(es):  \n\n  * commons-beanutils: Apache Commons BeanUtils: PropertyUtilsBean does not suppresses an enum's declaredClass property by default (CVE-2025-48734)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
