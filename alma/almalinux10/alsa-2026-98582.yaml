details: "Expat is a C library for parsing XML documents.  \n\nSecurity Fix(es):  \n\n  * expat: Expat: Denial of Service via quadratic complexity in attribute processing (CVE-2026-66046)\n  * expat: Expat: XML Injection via Malformed UTF-16 Input (CVE-2026-93990)\n  * expat: expat: Denial of Service via integer overflow in expat_realloc (CVE-2026-102633)\n  * expat: expat: Information disclosure via heap buffer over-read in XML_ParseBuffer (CVE-2026-77214)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
