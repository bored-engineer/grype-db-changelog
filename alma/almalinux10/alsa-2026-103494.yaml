details: "The kernel packages contain the Linux kernel, the core of any Linux operating system.  \n\nSecurity Fix(es):  \n\n  * kernel: net: sit: require CAP_NET_ADMIN in the device netns for changelink (CVE-2026-72061)\n  * kernel: KVM: Move kvm_io_bus_get_dev() locking responsibilities to callers (CVE-2026-72282)\n  * kernel: nvmet-tcp: check return value of nvmet_tcp_set_queue_sock (CVE-2026-74385)\n  * kernel: iommu/tegra241-cmdqv: Reject a vSID wider than the SID_MATCH field (CVE-2026-89450)\n  * kernel: iommu/tegra241-cmdqv: Synchronize the error ISR against VINTF (de)init (CVE-2026-90429)\n  * kernel: vdpa_sim_blk: reject out-of-range sector starts (CVE-2026-97991)\n  * kernel: kernel: Use-after-free via race condition in memory folio truncation (CVE-2026-99462)\n\n\nBug Fix(es) and Enhancement(s):  \n\n  * kvm: aarch64 CVE backport CW46 (JIRA:RHEL-305162)\n\n\nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.\n"
