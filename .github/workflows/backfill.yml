name: Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Earliest date to consider, YY-MM-DD (default: the project start, 23-02-16)'
        required: false
        type: string
        default: '23-02-16'
      end_date:
        description: 'Latest date to consider, YY-MM-DD (default: today)'
        required: false
        type: string
        default: ''
      max_items:
        description: 'Max provider/date pairs to export this run (do not exceed 256, the GitHub Actions per-matrix job limit)'
        required: false
        type: number
        default: 256

permissions:
  contents: write
  packages: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.discover.outputs.candidates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generator

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Find missing provider/date pairs
        id: discover
        run: |
          candidates=$(go run ./cmd/discover \
            -start "${{ inputs.start_date }}" \
            -end "${{ inputs.end_date }}" \
            -max "${{ inputs.max_items }}")
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"

  export:
    needs: discover
    if: needs.discover.outputs.candidates != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.candidates) }}
    uses: ./.github/workflows/export.yml
    with:
      provider: ${{ matrix.provider }}
      date: ${{ matrix.date }}

  changelog:
    needs: [discover, export]
    # always(): still advance the changelog branch as far as whichever
    # exports succeeded even if some matrix legs of `export` failed
    # (fail-fast is off), rather than letting one bad day block everything.
    if: always() && needs.discover.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generator

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Advance the changelog branch
        run: .github/scripts/advance-changelog.sh
