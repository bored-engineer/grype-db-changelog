name: Backfill

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max provider/version pairs to chain this run'
        required: false
        type: number
        default: 1000
      shards:
        description: 'Export jobs to spread them across (~ the concurrent job limit)'
        required: false
        type: number
        default: 20
      parallelism:
        description: 'Exports each shard runs at once'
        required: false
        type: number
        default: 3
  # How the dispatcher overlaid onto the "changelog" branch runs this
  # workflow (see .github/changelog-dispatcher.yml), so the schedule still
  # fires once "changelog" is the default branch. Strings, not numbers:
  # GitHub rejects an expression's string result for a number-typed
  # reusable workflow input (see export.yml), and these are only ever used
  # as text below.
  workflow_call:
    inputs:
      max_items:
        required: false
        type: string
      shards:
        required: false
        type: string
      parallelism:
        required: false
        type: string
  # Each run chains the oldest ~1000 not-yet-chained versions, so a
  # backlog drains over successive runs (or manual dispatches) and the
  # changelog then stays current. Overlap is prevented by the concurrency
  # group.
  #
  # Timed to upstream, which publishes three times a day: every provider
  # around 00:20 UTC, and amazon/fedora/github/nvd/rhel again around
  # 08:15 and 16:15. ~90% of builds are out within an hour of 00/08/16:00;
  # rhel, sles and hummingbird can trail by up to ~4-5h. So: one run an
  # hour after each window, one sweep three hours later for stragglers,
  # and anything later still is caught by the next window's run.
  #
  # Not more often: GitHub throttles frequent schedules hard (a */10 cron
  # fired only ~3 times a day), and a caught-up run is a ~30s discover.
  # Off the top of the hour, when scheduled runs are most often delayed.
  #
  # Only the default branch's schedule fires. Keep this in sync with
  # .github/changelog-dispatcher.yml's (a test checks): that copy is the
  # one that runs once "changelog" is the default branch.
  schedule:
    - cron: '7 1,9,17 * * *'
    - cron: '7 4,12,20 * * *'

# Never two at once: both would chain onto the same changelog tip, and the
# loser's whole batch would fail to push.
concurrency:
  group: backfill
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.diff.outputs.candidates }}
      shards: ${{ steps.diff.outputs.shards }}
      stale: ${{ steps.diff.outputs.stale }}
    steps:
      # No checkout needed: a bare commit-only fetch and git ls-remote work
      # directly against the repository URL, and gh/jq are already on the
      # runner image.
      #
      # The changelog branch is the source of truth for what's done: every
      # commit's subject ends in "<provider>@sha256:...". refs/raw/* is only
      # a staging area (exported but not chained yet), so a version whose
      # export succeeded but whose changelog push didn't is retried rather
      # than lost. --filter=tree:0 fetches commits only - a few MB even
      # with the full history.
      - name: List already-chained and already-staged versions
        run: |
          git init -q --bare state.git
          if git -C state.git fetch -q --no-tags --filter=tree:0 \
              "https://github.com/${{ github.repository }}" refs/heads/changelog; then
            git -C state.git log --format=%s FETCH_HEAD \
              | sed -nE 's#^([^ ]+) .*@(sha256:[0-9a-f]+)$#\1\t\2#p' > chained.tsv
          else
            echo "no changelog branch yet" >&2
            : > chained.tsv
          fi
          echo "$(wc -l < chained.tsv) version(s) already chained"

          git ls-remote "https://github.com/${{ github.repository }}" 'refs/raw/*/*' \
            | awk '{n = split($2, a, "/"); d = a[n]; sub("-", ":", d); print a[3] "\t" d}' > staged.tsv
          echo "$(wc -l < staged.tsv) version(s) staged (exported, not yet chained)"

      - name: List upstream provider versions, oldest first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hardcoded, not auto-discovered: listing ALL of an org's packages
          # (what auto-discovery needs) 400'd in CI with the default
          # GITHUB_TOKEN even though it worked fine locally with a personal
          # token - that endpoint evidently needs broader cross-org scope
          # than a repo-scoped Actions token gets. Reading one *already
          # named* public package's version history (below) is a narrower,
          # proven-working ask - it's exactly what trivy-db-changelog's own
          # cron.yml does successfully with the same default token, against
          # a different org. These are every provider grype-db-changelog
          # has ever seen as of 2026-11-22 (confirmed via the org listing
          # locally, just not usable from CI to re-derive it automatically).
          PROVIDERS: >-
            alma alpine amazon arch bitnami chainguard chainguard-libraries
            debian dhi echo eol epss fedora github govulndb hummingbird kev
            mariner minimos nvd oracle photon rhel secureos sles ubuntu wolfi
        run: |
          # done <<< "$providers" below reads line-by-line, so the
          # space-separated env var needs converting to one-per-line first.
          providers=$(tr -s ' ' '\n' <<< "$PROVIDERS")

          # Taken before listing anything: every version published before
          # this instant is in the listings below (see the settle window
          # in the next step).
          date -u -d '-5 minutes' +%Y-%m-%dT%H:%M:%SZ > settled-before.txt
          echo "$(printf '%s\n' "$providers" | grep -c .) provider(s) configured"

          # Every version of every provider's package, not just the current
          # date tag: ghcr.io/anchore/grype-db/data/<provider> gets rebuilt
          # more than once a day for some providers (amazon, fedora, github,
          # nvd, rhel), and each rebuild overwrites that day's tag - the
          # package version history is the only place every intermediate
          # build is still reachable (confirmed: nothing has been
          # garbage-collected, full history back to day one).
          #
          # Fetched in parallel, one background process per provider: each
          # provider's full paginated history takes ~12-19s on its own
          # (confirmed by timing it directly), and there are 27 of them -
          # done serially that's several minutes just listing versions,
          # every single batch, before any exporting even starts. 12-way
          # parallel brings all 27 providers' full history (~26K versions
          # total) down to ~17s wall-clock (confirmed the same way).
          #
          # Paged newest-first and stopped at the first page containing an
          # already-chained version: each provider's chained versions are
          # always exactly its oldest ones (cmd/changelog only ever extends
          # the chain in order, stopping at the first gap - confirmed to
          # hold for the existing history too), so everything older than
          # that page is chained already. The full listing is ~260
          # requests, and the Actions token gets 1000/hr per repository -
          # back-to-back backfill runs would blow through that with full
          # listings every run. Stopping early, a caught-up run is ~27
          # requests (one page per provider), and backfill runs shrink
          # toward that as the frontier advances.
          mkdir -p upstream.d
          while read -r provider; do
            # All or nothing, for every provider: the changelog is chained
            # in GHCR publish order across ALL providers, so a provider
            # left out of this run (or cut short - the API pages
            # newest-first, and a listing that dies partway, a 502 - seen
            # for real, keeps only the NEWEST versions) would have its
            # versions chained later, after ones published after them, and
            # the changelog's dates would go backwards. Any failure fails
            # the whole run instead; the next run retries. Written to a
            # temp file and only renamed into place on success.
            (
              base="upstream.d/${provider}"
              awk -F'\t' -v p="$provider" '$1 == p { print $2 }' chained.tsv > "$base.chained"
              : > "$base.tmp"
              ok=true
              for ((page = 1; ; page++)); do
                if ! gh api "orgs/anchore/packages/container/grype-db%2Fdata%2F${provider}/versions?per_page=100&page=${page}" \
                    --jq '.[] | "\(.created_at)\t\(.name)"' > "$base.page"; then
                  ok=false
                  break
                fi
                [ -s "$base.page" ] || break # past the last page
                awk -v p="$provider" '{ print $0 "\t" p }' "$base.page" >> "$base.tmp"
                # One awk, no pipe (a `| grep -q` could SIGPIPE under
                # pipefail); FILENAME, not NR==FNR, since $base.chained is
                # empty for a provider with nothing chained yet - which is
                # then listed in full.
                if awk -F'\t' 'FILENAME == ARGV[1] { c[$1]; next } ($2 in c) { f = 1; exit } END { exit !f }' \
                    "$base.chained" "$base.page"; then
                  break # reached the chained frontier
                fi
                [ "$(wc -l < "$base.page")" -lt 100 ] && break # short page: the last one
              done
              if $ok; then
                mv "$base.tmp" "$base.tsv"
                echo "$provider: $((page)) page(s), $(wc -l < "$base.tsv") version(s)"
              else
                echo "::error::listing $provider failed"
                rm -f "$base.tmp"
                touch "$base.failed"
              fi
            ) &
            # `|| true`: GitHub Actions runs with `set -e`, and `wait -n`'s
            # exit status is whatever the reaped background job returned;
            # failures are collected via the .failed markers instead, so
            # every provider's listing gets to finish (and log) first.
            while [ "$(jobs -r -p | wc -l)" -ge 12 ]; do wait -n || true; done
          done <<< "$providers"
          wait || true
          if compgen -G 'upstream.d/*.failed' > /dev/null; then
            echo "listing failed for: $(basename -s .failed upstream.d/*.failed | tr '\n' ' ')- not chaining anything this run" >&2
            exit 1
          fi
          # Publish time, then digest for ties (several providers often
          # publish in the same second): byte order (LC_ALL=C), so the
          # order never depends on the runner's locale.
          LC_ALL=C sort -o upstream.tsv upstream.d/*.tsv
          echo "$(wc -l < upstream.tsv) version(s) listed (newest down to each provider's chained frontier)"

      - name: Compute missing candidates
        id: diff
        env:
          MAX_ITEMS: ${{ inputs.max_items || 1000 }}
          SHARDS: ${{ inputs.shards || 20 }}
        run: |
          # upstream.tsv is already sorted oldest-first; awk preserves that
          # order, so no re-sort is needed after filtering. Keyed on
          # "<provider>\t<digest>" in every file.
          #
          # FILENAME==ARGV[n], not the usual NR==FNR idiom: NR==FNR
          # misidentifies the first line of the next file as still being
          # part of the previous one whenever that one has zero lines.
          # The cap is applied inside awk rather than with `| head`, which
          # would SIGPIPE awk and fail the step under `set -o pipefail`.
          #
          # Settle window: only versions published 5+ minutes before the
          # listing began. A version can take a moment to show up in the
          # API after it's published; without the window, a run could
          # chain one published just after it and miss it, which would
          # then be chained out of order next run. (RFC 3339 UTC strings
          # compare correctly as text.)
          awk -F'\t' -v max="$MAX_ITEMS" -v settled="$(cat settled-before.txt)" '
            FILENAME == ARGV[1] { chained[$1 FS $2]; next }
            FILENAME == ARGV[2] { staged[$1 FS $2]; next }
            n < max && $1 < settled && !(($3 FS $2) in chained) {
              print $3 "\t" $2 "\t" ((($3 FS $2) in staged) ? "true" : "false") "\t" $1; n++
            }
          ' chained.tsv staged.tsv upstream.tsv > todo.tsv

          # Everything this run will chain, in order (drives cmd/changelog),
          # with the publish time that dates each commit.
          candidates=$(jq -R -c -s 'split("\n") | map(select(length > 0) | split("\t") | {provider: .[0], digest: .[1], created: .[3]})' < todo.tsv)
          # The subset that still needs exporting - each with its GHCR
          # publish time, which dates the commit when the build itself
          # carries no capture time - dealt round-robin into
          # at most $SHARDS export jobs (the matrix). Dealt per provider -
          # grouped by provider first, then 0,1,2,... across shards - so
          # every shard gets an even share of each provider: nvd exports
          # take ~7x as long as most others, and dealing the time-ordered
          # list directly would line nvd up in the same few shards whenever
          # the providers' interleaving period divides the shard count.
          exports=$(jq -R -c -s 'split("\n") | map(select(length > 0) | split("\t") | select(.[2] == "false") | {provider: .[0], digest: .[1], created: .[3]})' < todo.tsv)
          shards=$(echo "$exports" | jq -c --argjson n "$SHARDS" '
            group_by(.provider) | flatten | to_entries
            | group_by(.key % $n) | map(map(.value))
            | to_entries | map({shard: (.key + 1), items: .value})')
          # Staged refs whose version is already chained - leftovers from
          # before refs/raw was a staging area, or from a manual run.
          # Deleted alongside the next changelog push; capped to keep that
          # push's refspec list reasonable.
          stale=$(awk -F'\t' '
            FILENAME == ARGV[1] { chained[$1 FS $2]; next }
            n < 1000 && ($1 FS $2) in chained { d = $2; sub(":", "-", d); print "refs/raw/" $1 "/" d; n++ }
          ' chained.tsv staged.tsv | jq -R -c -s 'split("\n") | map(select(length > 0))')

          echo "$(echo "$candidates" | jq 'length') candidate(s) this run (capped at $MAX_ITEMS), $(echo "$exports" | jq 'length') to export in $(echo "$shards" | jq 'length') shard(s), $(echo "$stale" | jq 'length') stale staged ref(s)"
          {
            echo "candidates=$candidates"
            echo "shards=$shards"
            echo "stale=$stale"
          } >> "$GITHUB_OUTPUT"

  export:
    needs: discover
    name: export ${{ matrix.shard }}
    if: needs.discover.result == 'success' && needs.discover.outputs.shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.shards) }}
    uses: ./.github/workflows/export.yml
    with:
      items: ${{ toJson(matrix.items) }}
      parallelism: ${{ inputs.parallelism || 3 }}

  changelog:
    needs: [discover, export]
    # always(): still advance the changelog branch as far as whichever
    # exports succeeded even if some matrix legs of `export` failed
    # (fail-fast is off), rather than letting one bad version block
    # everything else in the batch. needs.discover.result == 'success':
    # NOT just outputs.candidates != '[]' - a failed discover job leaves
    # outputs.candidates as an empty string, which also != '[]', and this
    # job would otherwise run anyway with nothing to chain (confirmed:
    # exactly what happened on the first real run of this workflow).
    # exports may be '[]' (everything already staged), which skips
    # `export` - also fine here. stale-only runs still clean up.
    if: >-
      always() && needs.discover.result == 'success'
      && (needs.discover.outputs.candidates != '[]' || needs.discover.outputs.stale != '[]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned regardless of the repo's default branch (which may be
          # "changelog", a branch of pure grype-db snapshots with no Go code).
          ref: generator

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch the current changelog tip and this batch's raw refs
        run: |
          # Written to a file by expression substitution into the script,
          # NOT passed via env: a full batch (1000 candidates with publish
          # times, ~150KB) exceeds Linux's 128KB limit on a single
          # environment string, and the step can't even start ("Argument
          # list too long"). Safe to inline: every field is a hardcoded
          # provider name, a hex digest or a timestamp, and the quoted
          # heredoc delimiter disables all shell expansion.
          cat > candidates.json <<'CANDIDATES_JSON'
          ${{ needs.discover.outputs.candidates }}
          CANDIDATES_JSON

          # --filter=blob:none: cmd/changelog only ever touches tree/commit
          # objects (ls-tree/mktree/commit-tree), never blob content.
          # --depth=1: only the tip's tree is needed to chain onto it, and
          # pushing a child of a commit the remote already has is fine from
          # a shallow clone.
          if ! git fetch -q --depth=1 --filter=blob:none origin \
              refs/heads/changelog:refs/heads/changelog; then
            echo "no changelog branch yet" >&2
          fi

          # One fetch for the whole batch, of only the refs that exist: a
          # single missing ref would fail the whole fetch, and one can be
          # missing if its export leg failed (fail-fast is off) -
          # cmd/changelog stops at the first one it can't resolve and the
          # rest are retried next run.
          jq -r '.[] | "refs/raw/\(.provider)/\(.digest | sub(":"; "-"))"' candidates.json | sort > wanted.txt
          git ls-remote origin 'refs/raw/*/*' | awk '{print $2}' | sort > available.txt
          comm -12 wanted.txt available.txt | sed 's#.*#&:&#' > refspecs.txt
          echo "$(wc -l < refspecs.txt) of $(wc -l < wanted.txt) candidate ref(s) staged"
          if [ -s refspecs.txt ]; then
            xargs git fetch -q --filter=blob:none origin < refspecs.txt
          fi

      - name: Advance the changelog branch
        env:
          STALE: ${{ needs.discover.outputs.stale }}
        run: |
          # candidates.json: written by the previous step.
          # stdout: the raw refs it chained, one per line (logs go to stderr).
          # The overlay: this README onto the branch's tip whenever it
          # changes on generator (see applyOverlay). The dispatcher is only
          # compared, not pushed: an Actions token can't change workflows. HEAD, not $GITHUB_SHA: run from the changelog
          # branch's dispatcher, that is the changelog commit.
          go run ./cmd/changelog -readme README.md \
            -workflow .github/changelog-dispatcher.yml \
            -generator "$(git rev-parse HEAD)" \
            candidates.json > chained-refs.txt
          echo "$STALE" | jq -r '.[]' >> chained-refs.txt

          refspecs=()
          # Pushing it unchanged (nothing new chained) is a harmless no-op.
          if git rev-parse --verify --quiet refs/heads/changelog >/dev/null; then
            refspecs+=(refs/heads/changelog:refs/heads/changelog)
          fi
          while read -r ref; do
            [ -n "$ref" ] && refspecs+=(":$ref")
          done < chained-refs.txt
          if [ "${#refspecs[@]}" -eq 0 ]; then
            echo "nothing to push"
            exit 0
          fi

          # --atomic: the branch advance and the staging-ref deletions land
          # together or not at all, so a version is never both unchained
          # and unstaged (lost) or chained and still staged (re-chained).
          # Retried for the same transient GitHub 500s the export push sees.
          for attempt in 1 2 3 4 5; do
            if git push --atomic origin "${refspecs[@]}"; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying after a pause" >&2
            sleep $((attempt * 10))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
