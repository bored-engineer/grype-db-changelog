name: Backfill

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max provider/version pairs to export this run (do not exceed 256, the GitHub Actions per-matrix job limit)'
        required: false
        type: number
        default: 256

permissions:
  contents: write
  packages: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.diff.outputs.candidates }}
    steps:
      # No checkout needed: git ls-remote works directly against the
      # repository URL, and gh/jq are already on the runner image.
      - name: List already-exported refs
        run: |
          git ls-remote "https://github.com/${{ github.repository }}" 'refs/raw/*/*' \
            | awk '{print $2}' > existing-refs.txt
          echo "$(wc -l < existing-refs.txt) ref(s) already exported"

      - name: List upstream provider versions, oldest first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The org-level package listing gives us the provider list for
          # free (same 27 names as the old hand-maintained providers.json,
          # confirmed) - no manifest to keep in sync as providers are added.
          providers=$(gh api --paginate 'orgs/anchore/packages?package_type=container&per_page=100' --jq '.[].name' \
            | sed -n 's#^grype-db/data/##p')
          echo "$(printf '%s\n' "$providers" | grep -c .) provider(s) discovered"

          # Every version of every provider's package, not just the current
          # date tag: ghcr.io/anchore/grype-db/data/<provider> gets rebuilt
          # more than once a day for some providers (amazon, fedora, github,
          # nvd, rhel), and each rebuild overwrites that day's tag - the
          # package version history is the only place every intermediate
          # build is still reachable (confirmed: nothing has been
          # garbage-collected, full history back to day one).
          #
          # Fetched in parallel, one background process per provider: each
          # provider's full paginated history takes ~12-19s on its own
          # (confirmed by timing it directly), and there are 27 of them -
          # done serially that's several minutes just listing versions,
          # every single batch, before any exporting even starts. 12-way
          # parallel brings all 27 providers' full history (~26K versions
          # total) down to ~17s wall-clock (confirmed the same way). Well
          # within rate limits either way: ~260 total paginated requests
          # for the whole run, against a 1000/hr (Actions token) or
          # 5000/hr budget.
          mkdir -p upstream.d
          while read -r provider; do
            (
              gh api --paginate "orgs/anchore/packages/container/grype-db%2Fdata%2F${provider}/versions?per_page=100" --jq '.[]' \
                | jq -r --arg provider "$provider" '"\(.created_at)\t\(.name)\t\($provider)"' \
                > "upstream.d/${provider}.tsv"
            ) &
            # `|| true`: GitHub Actions runs with `set -e`, and `wait -n`'s
            # exit status is whatever the reaped background job returned -
            # without this, one provider's transient API failure would
            # abort the whole step instead of just leaving that provider
            # out of this run (it's picked up again next run regardless,
            # same as a failed export matrix leg).
            while [ "$(jobs -r -p | wc -l)" -ge 12 ]; do wait -n || true; done
          done <<< "$providers"
          wait || true
          sort -o upstream.tsv upstream.d/*.tsv
          echo "$(wc -l < upstream.tsv) version(s) upstream total"

      - name: Compute missing candidates
        id: diff
        env:
          MAX_ITEMS: ${{ inputs.max_items || 256 }}
        run: |
          # upstream.tsv is already sorted oldest-first; awk preserves that
          # order, so no re-sort is needed after filtering.
          # FILENAME==ARGV[1], not the usual NR==FNR idiom: NR==FNR
          # misidentifies the *first line of upstream.tsv* as still being
          # part of existing-refs.txt whenever existing-refs.txt has zero
          # lines (true today, since this ref scheme starts from nothing) -
          # confirmed by reproducing it. FILENAME-based matching has no
          # such edge case.
          candidates=$(awk -F'\t' '
            FILENAME == ARGV[1] { existing[$1]; next }
            {
              refdigest = $2; gsub(":", "-", refdigest)
              refname = "refs/raw/" $3 "/" refdigest
              if (!(refname in existing)) print
            }
          ' existing-refs.txt upstream.tsv \
            | head -n "$MAX_ITEMS" \
            | jq -R -c -s 'split("\n") | map(select(length > 0) | split("\t") | {provider: .[2], digest: .[1]})')
          echo "$(echo "$candidates" | jq 'length') candidate(s) this run (capped at $MAX_ITEMS)"
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"

  export:
    needs: discover
    if: needs.discover.outputs.candidates != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.candidates) }}
    uses: ./.github/workflows/export.yml
    with:
      provider: ${{ matrix.provider }}
      digest: ${{ matrix.digest }}

  changelog:
    needs: [discover, export]
    # always(): still advance the changelog branch as far as whichever
    # exports succeeded even if some matrix legs of `export` failed
    # (fail-fast is off), rather than letting one bad version block
    # everything else in the batch.
    if: always() && needs.discover.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned regardless of the repo's default branch (which may be
          # "changelog", a branch of pure grype-db snapshots with no Go code).
          ref: generator

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch the current changelog tip and this batch's raw refs
        env:
          CANDIDATES: ${{ needs.discover.outputs.candidates }}
        run: |
          # --filter=blob:none: cmd/changelog only ever touches tree/commit
          # objects (ls-tree/mktree/commit-tree), never blob content, so
          # there's no need to pull every provider snapshot's actual YAML
          # bytes over the network just to splice trees together.
          git fetch -q --filter=blob:none origin \
            refs/heads/changelog:refs/heads/changelog 2>&1 | grep -v '^$' || true

          echo "$CANDIDATES" | jq -r '.[] | "\(.provider) \(.digest)"' | while read -r provider digest; do
            refdigest=$(echo "$digest" | tr ':' '-')
            ref="refs/raw/$provider/$refdigest"
            # A matrix leg exporting this one may have failed (fail-fast is
            # off): tolerate it here rather than aborting the whole job -
            # cmd/changelog skips any candidate it can't resolve locally,
            # and it'll just get picked up again by a future run.
            git fetch -q --filter=blob:none origin "$ref:$ref" \
              || echo "note: $ref not found (export may have failed)" >&2
          done

      - name: Advance the changelog branch
        env:
          CANDIDATES: ${{ needs.discover.outputs.candidates }}
        run: |
          echo "$CANDIDATES" > candidates.json
          go run ./cmd/changelog candidates.json
          git push origin refs/heads/changelog:refs/heads/changelog
