name: Export

# Exports a batch of provider snapshots on one runner, several at a time,
# and stages each as refs/raw/<provider>/<digest> in a single push. The
# backfill fans out one of these per shard: setup (checkout, Go, build,
# login, the changelog tip fetch) is paid once per shard rather than once
# per snapshot - it was ~40% of all runner time at one job per snapshot.

on:
  workflow_dispatch:
    inputs:
      items:
        description: 'JSON array of {"provider": "alpine", "digest": "sha256:...", "created": "<RFC 3339, optional>"} to export'
        required: true
        type: string
      parallelism:
        description: 'Exports to run at once on the runner'
        required: false
        type: number
        default: 3
  workflow_call:
    inputs:
      items:
        required: true
        type: string
      # A string, not a number: the caller passes an expression
      # (`inputs.parallelism || 3`), which always evaluates to a string,
      # and GitHub rejects a string for a number-typed reusable workflow
      # input ("Unexpected value '3'"). It's only ever used as text.
      parallelism:
        required: false
        type: string
        default: '3'

permissions:
  contents: write
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned regardless of the repo's default branch (which may be
          # "changelog", a branch of pure grype-db snapshots with no Go code).
          ref: generator

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o "$RUNNER_TEMP/export" ./cmd/export

      - name: Log in to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Makes the push below thin. This checkout has none of the snapshot
      # data, so without it every push re-uploads each provider's ENTIRE
      # snapshot (~200K files for nvd) even though only a handful of files
      # change between builds - and GitHub keeps every duplicate pack until
      # it repacks. With the changelog tip's trees present locally (no
      # blobs, depth 1: a few MB), git knows the remote already has every
      # unchanged blob by SHA and sends only the changed ones. Confirmed
      # locally: 4 objects pushed instead of 3003 for a one-file change.
      # Best-effort: if it fails, the push is just fat again.
      - name: Fetch the changelog tip's trees
        run: |
          git fetch -q --depth=1 --filter=blob:none origin \
            refs/heads/changelog:refs/remotes/origin/changelog \
            || echo "note: couldn't fetch the changelog tip; push will include every blob" >&2

      - name: Export
        env:
          ITEMS: ${{ inputs.items }}
          PARALLELISM: ${{ inputs.parallelism || 3 }}
        run: |
          # Concurrent fast-imports into one repository are safe: each
          # writes its own pack and updates only its own ref (confirmed
          # locally with 12 at once, fsck clean). Auto-gc is off so none of
          # them decides to repack underneath the others.
          git config gc.auto 0
          mkdir -p logs
          : > failed.txt

          export_one() {
            local provider=$1 digest=$2 created=${3:-}
            local ref="refs/raw/$provider/${digest/:/-}"
            local log="logs/$provider-${digest/:/-}.log"
            local start=$SECONDS
            # cmd/export ends its stream with fast-import's "done" only on
            # success, so a failed export never leaves a (truncated) ref
            # behind, pipefail or not. The rev-parse double-checks it.
            # $created (GHCR publish time) dates the staged commit and its
            # subject; metadata.json's own timestamp becomes its Captured
            # trailer.
            if "$RUNNER_TEMP/export" "$provider" "ghcr.io/anchore/grype-db/data/$provider@$digest" "$created" 2> "$log" \
                | git fast-import --quiet 2>> "$log" \
                && git rev-parse --verify --quiet "$ref" >/dev/null; then
              # With cmd/export's per-stage timing line, if it wrote one.
              echo "ok      $provider $digest ($((SECONDS - start))s) $(grep -o 'stages: .*' "$log" | tail -1)"
            else
              echo "FAILED  $provider $digest ($((SECONDS - start))s)"
              sed 's/^/        /' "$log"
              echo "$provider $digest" >> failed.txt
            fi
          }
          export -f export_one

          # One failure doesn't stop the rest: everything that did export
          # still gets staged below, and the failed ones are retried by a
          # later run (cmd/changelog chains only up to the first gap).
          echo "$ITEMS" | jq -r '.[] | "\(.provider) \(.digest) \(.created // "")"' \
            | xargs -P "$PARALLELISM" -L 1 bash -c 'export_one "$@"' _

          echo "$(git for-each-ref refs/raw | wc -l) exported, $(wc -l < failed.txt) failed"

      - name: Push refs
        run: |
          mapfile -t refspecs < <(git for-each-ref --format='%(refname):%(refname)' refs/raw)
          if [ "${#refspecs[@]}" -eq 0 ]; then
            echo "nothing exported" >&2
            exit 0
          fi
          # These are staging refs: the backfill's changelog job deletes
          # them once the snapshots are chained.
          #
          # Force-push: cmd/export always resets each ref to a fresh orphan
          # commit, so re-exporting one already staged is never a
          # fast-forward.
          #
          # Retried: with many export jobs pushing to the same repo at
          # once, GitHub occasionally returns a transient "Internal Server
          # Error" on the push itself - seen for real during the first
          # large backfill batch (retrying the exact same push succeeds).
          for attempt in 1 2 3 4 5; do
            if git push --force origin "${refspecs[@]}"; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying after a pause" >&2
            sleep $((attempt * 10))
          done
          echo "push failed after 5 attempts" >&2
          exit 1

      # Last, so failures are visible on the run without holding back the
      # push of everything that succeeded.
      - name: Report failures
        run: |
          if [ -s failed.txt ]; then
            echo "::error::$(wc -l < failed.txt) export(s) failed:"
            cat failed.txt
            exit 1
          fi
