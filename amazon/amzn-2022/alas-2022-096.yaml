# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A use-after-free vulnerability was found in MariaDB. This flaw allows attackers to trigger a convert_const_to_int() use-after-free when the BIGINT data type is used, resulting in a denial of service. (CVE-2021-46669)
