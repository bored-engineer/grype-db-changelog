# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: A flaw was found in php.  The main cause of this vulnerability is improper input validation while parsing an Extensible Markup Language(XML) entity.  A special character could allow an attacker to traverse directories. The highest threat from this vulnerability is confidentiality. (CVE-2021-21707)A flaw was found in PHP. The vulnerability occurs due to the malformed php_filter_float() function and leads to a use-after-free vulnerability. This flaw allows an attacker to inject a malicious file, leading to a crash or a Segmentation fault. (CVE-2021-21708)
