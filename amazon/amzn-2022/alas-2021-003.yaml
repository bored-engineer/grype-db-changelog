Vulnerability:
    Description: A flaw was found in the Java logging library Apache Log4j 2 in versions from 2.0-beta9 and before and including 2.14.1. This could allow a remote attacker to execute code on the server if the system logs an attacker-controlled string value with the attacker's JNDI LDAP server lookup. (CVE-2021-44228)
    FixedIn:
        - Available:
            Date: "2021-12-10"
            Kind: advisory
          Name: log4j
          NamespaceName: amzn:2022
          Version: 2.15.0-1.amzn2022.0.1
          VersionFormat: rpm
        - Available:
            Date: "2021-12-10"
            Kind: advisory
