# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: A flaw was found in the way samba implemented SMB1 authentication. An attacker could use this flaw to retrieve the plaintext password sent over the wire even if Kerberos authentication was required. (CVE-2016-2124)A flaw was found in the way Samba maps domain users to local users. An authenticated attacker could use this flaw to cause possible privilege escalation. (CVE-2020-25717)A flaw was found in the way samba, as an Active Directory Domain Controller, is able to support an RODC (read-only domain controller). This would allow an RODC to print administrator tickets. (CVE-2020-25718)A flaw was found in the way Samba, as an Active Directory Domain Controller, implemented Kerberos name-based authentication.   The Samba AD DC, could become confused about the user a ticket represents if it did not strictly require a Kerberos PAC and always use the SIDs found within. The result could include total domain compromise. (CVE-2020-25719)Kerberos acceptors need easy access to stableAD identifiers (eg objectSid) (CVE-2020-25721)Multiple flaws were found in the way samba AD DC implemented access and conformance checking of stored data. An attacker could use this flaw to cause total domain compromise. (CVE-2020-25722)A flaw was found in the way Samba handled file/directory metadata. This flaw allows an authenticated attacker with permissions to read or modify share metadata, to perform this operation outside of the share. (CVE-2021-20316)A flaw was found in the way samba implemented DCE/RPC. If a client to a Samba server sent a very large DCE/RPC request, and chose to fragment it, an attacker could replace later fragments with             their own data, bypassing the signature requirements. (CVE-2021-23192)Use after free in Samba AD DC RPC server (CVE-2021-3738)Information leak via symlinks of existance of files or directories outside of the exported share (CVE-2021-44141)Out-of-bounds heap read/write vulnerability in VFS module vfs_fruit allows code execution (CVE-2021-44142)Samba AD users with permission to write to an account can impersonate arbitrary services (CVE-2022-0336)
