Vulnerability:
    Description: A vulnerability was found in logrotate in how the state file is created. The state file is used to prevent parallel executions of multiple instances of logrotate by acquiring and releasing a file lock. When the state file does not exist, it is created with world-readable permission, allowing an unprivileged user to lock the state file, stopping any rotation. This flaw affects logrotate versions before 3.20.0. (CVE-2022-1348)
    FixedIn:
        - Available:
            Date: "2022-06-28"
            Kind: advisory
          Name: logrotate
          NamespaceName: amzn:2022
          Version: 3.20.1-2.amzn2022
          VersionFormat: rpm
