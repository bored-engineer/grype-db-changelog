Vulnerability:
    Description: A flaw was found in the Xorg-x11-server. An out-of-bounds access issue can occur in the SProcRenderCompositeGlyphs function due to improper validation of the request length. (CVE-2021-4008)A flaw was found in xorg-x11-server. An out-of-bounds access can occur in the SProcXFixesCreatePointerBarrier function. (CVE-2021-4009)A flaw was found in xorg-x11-server where an out-of-bounds access can occur in the SProcScreenSaverSuspend function. (CVE-2021-4010)A flaw was found in xorg-x11-server where an out-of-bounds access can occur in the SwapCreateRegister function. (CVE-2021-4011)
