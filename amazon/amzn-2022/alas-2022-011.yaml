# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: Apache Log4j2 versions 2.0-beta7 through 2.17.0 (excluding security fix releases 2.3.2 and 2.12.4) are vulnerable to a remote code execution (RCE) attack where an attacker with permission to modify the logging configuration file can construct a malicious configuration using a JDBC Appender with a data source referencing a JNDI URI which can execute remote code. This issue is fixed by limiting JNDI data source names to the java protocol in Log4j2 versions 2.17.1, 2.12.4, and 2.3.2. (CVE-2021-44832)
    FixedIn:
        - Name: log4j
          NamespaceName: amzn:2022
          Version: 2.17.1-1.amzn2022.0.1
          VersionFormat: rpm
        - Name: log4j-jcl
          NamespaceName: amzn:2022
          Version: 2.17.1-1.amzn2022.0.1
          VersionFormat: rpm
        - Name: log4j-slf4j
          NamespaceName: amzn:2022
          Version: 2.17.1-1.amzn2022.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2022/ALAS-2022-011.html
