Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:net: fix fraggap accounting error in IPv4/IPv6 paged-allocation fragmentation pathsA fraggap accounting error in __ip6_append_data() and __ip_append_data() causes a heap buffer overflow (8-15 bytes) into the skb_shared_info structure at the tail of a packet''s own head object. This allows an unprivileged local user, including from within unprivileged user namespaces and containers, to achieve privilege escalation, arbitrary code execution, container escape, denial of service, or information disclosure.'
