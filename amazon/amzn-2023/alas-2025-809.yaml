Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: Fixed overflow check in mi_enum_attr() (CVE-2024-27407)In the Linux kernel, the following vulnerability has been resolved:xfs: add bounds checking to xlog_recover_process_data (CVE-2024-41014)In the Linux kernel, the following vulnerability has been resolved:closures: Change BUG_ON() to WARN_ON() (CVE-2024-42252)In the Linux kernel, the following vulnerability has been resolved:mm: call the security_mmap_file() LSM hook in remap_file_pages() (CVE-2024-47745)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix helper writes to read-only maps (CVE-2024-49861)In the Linux kernel, the following vulnerability has been resolved:rcu-tasks: Fix access non-existent percpu rtpcp variable in rcu_tasks_need_gpcb() (CVE-2024-49926)In the Linux kernel, the following vulnerability has been resolved:fs/inode: Prevent dump_mapping() accessing invalid dentry.d_name.name (CVE-2024-49934)In the Linux kernel, the following vulnerability has been resolved:driver core: bus: Fix double free in driver API bus_register() (CVE-2024-50055)In the Linux kernel, the following vulnerability has been resolved:nfsd: cancel nfsd_shrinker_work using sync mode in nfs4_state_shutdown_net (CVE-2024-50121)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: Don''t call cleanup on profile rollback failure (CVE-2024-50146)In the Linux kernel, the following vulnerability has been resolved:ntfs3: Add bounds checking to mi_enum_attr() (CVE-2024-50248)In the Linux kernel, the following vulnerability has been resolved:net: fix crash when config small gso_max_size/gso_ipv4_max_size (CVE-2024-50258)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix use-after-free of nreq in reqsk_timer_handler(). (CVE-2024-53206)In the Linux kernel, the following vulnerability has been resolved:tipc: Fix use-after-free of kernel socket in cleanup_bearer(). (CVE-2024-56642)In the Linux kernel, the following vulnerability has been resolved:net: defer final ''struct net'' free in netns dismantle (CVE-2024-56658)In the Linux kernel, the following vulnerability has been resolved:ipv6: release nexthop on device removalThe CI is hitting some aperiodic hangup at device removal time in thepmtu.sh self-test:unregister_netdevice: waiting for veth_A-R1 to become free. Usage count = 6ref_tracker: veth_A-R1@ffff888013df15d8 has 1/5 users atdst_init+0x84/0x4a0dst_alloc+0x97/0x150ip6_dst_alloc+0x23/0x90ip6_rt_pcpu_alloc+0x1e6/0x520ip6_pol_route+0x56f/0x840fib6_rule_lookup+0x334/0x630ip6_route_output_flags+0x259/0x480ip6_dst_lookup_tail.constprop.0+0x5c2/0x940ip6_dst_lookup_flow+0x88/0x190udp_tunnel6_dst_lookup+0x2a7/0x4c0vxlan_xmit_one+0xbde/0x4a50 [vxlan]vxlan_xmit+0x9ad/0xf20 [vxlan]dev_hard_start_xmit+0x10e/0x360__dev_queue_xmit+0xf95/0x18c0arp_solicit+0x4a2/0xe00neigh_probe+0xaa/0xf0While the first suspect is the dst_cache, explicitly tracking the dstowing the last device reference via probes proved such dst is held bythe nexthop in the originating fib6_info.Similar to commit f5b51fe804ec ("ipv6: route: purge exception onremoval"), we need to explicitly release the originating fib info whendisconnecting a to-be-removed device from a live ipv6 dst: move thefib6_info cleanup into ip6_dst_ifdown().Tested running:./pmtu.sh cleanup_ipv6_exceptionin a tight loop for more than 400 iterations with no spat, running anunpatched kernel  I observed a splat every ~10 iterations. (CVE-2024-56751)'
