Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:iommu/vt-d: Clear Present bit before tearing down context entry (CVE-2026-45944)In the Linux kernel, the following vulnerability has been resolved:mm/vmalloc: take vmap_purge_lock in shrinker (CVE-2026-46093)In the Linux kernel, the following vulnerability has been resolved:af_unix: Drop all SCM attributes for SOCKMAP. (CVE-2026-53005)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: fix missing run load for vcn0 in attr_data_get_block_locked() (CVE-2026-53027)In the Linux kernel, the following vulnerability has been resolved:vsock/virtio: fix zerocopy completion for multi-skb sends (CVE-2026-53365)In the Linux kernel, the following vulnerability has been resolved:NFSv4/flexfiles: reject zero filehandle version count (CVE-2026-53392)In the Linux kernel, the following vulnerability has been resolved:fbdev: fbcon: fix out-of-bounds read in err_out of fbcon_do_set_font()When fbcon_do_set_font() fails (e.g., due to a memory allocation failureinside vc_resize() under heavy memory pressure), it jumps to the `err_out`label to roll back the console state. However, the current rollback logicforgets to restore the `hi_font` state, leading to a severe state machinecorruption.Earlier in the function, `set_vc_hi_font()` might be called to change`vc->vc_hi_font_mask` and mutate the screen buffer. If `vc_resize()`subsequently fails, the `err_out` path restores `vc_font.charcount`but entirely skips rolling back the `vc_hi_font_mask` and the screenbuffer.This mismatch leaves the terminal in a desynchronized state. Because`vc_hi_font_mask` remains set, the VT subsystem will still acceptcharacter indices greater than 255 from userspace and write them to thescreen buffer. Subsequent rendering calls (e.g., `fbcon_putcs()`) willthen use these inflated indices to access the reverted, 256-characterfont array, leading to a deterministic out-of-bounds read and potentialkernel memory disclosure.Fix this by adding the missing rollback logic for the `hi_font` maskand screen buffer in the error path. (CVE-2026-53402)In the Linux kernel, the following vulnerability has been resolved:vsock/virtio: bind uarg before filling zerocopy skb (CVE-2026-63970)In the Linux kernel, the following vulnerability has been resolved:tcp: fix stale per-CPU tcp_tw_isn leak enabling ISN predictionBlamed commit moved the TIME_WAIT-derived ISN from the skb controlblock to a per-CPU variable, assuming the value would always be consumedby tcp_conn_request() for the same packet that wrote it. That assumptionis violated by multiple drop paths between the producer(__this_cpu_write(tcp_tw_isn, isn) in tcp_v{4,6}_rcv()) and the consumer(tcp_conn_request()):- min_ttl / min_hopcount check- xfrm policy check- tcp_inbound_hash() MD5/AO mismatch- tcp_filter() eBPF/SO_ATTACH_FILTER drop- th->syn && th->fin discard in tcp_rcv_state_process() TCP_LISTEN- psp_sk_rx_policy_check() in tcp_v{4,6}_do_rcv()- tcp_checksum_complete() in tcp_v{4,6}_do_rcv()- tcp_v{4,6}_cookie_check() returning NULLWhen a packet is dropped on any of these paths, tcp_tw_isn is left set.The next SYN processed on the same CPU then consumes the non zero value intcp_conn_request(), receiving a potentially predictable ISN.This patch moves back tcp_tw_isn to skb->cb[], getting rid of the per-cpuvariable.Note that tcp_v{4,6}_fill_cb() do not set it.Very litle impact on overall code size/complexity:$ scripts/bloat-o-meter -t vmlinux.old vmlinux.newadd/remove: 0/0 grow/shrink: 2/1 up/down: 8/-15 (-7)Function                                     old     new   deltatcp_v6_rcv                                  3038    3042      +4tcp_v4_rcv                                  3035    3039      +4tcp_conn_request                            2938    2923     -15Total: Before=24436060, After=24436053, chg -0.00% (CVE-2026-64024)In the Linux kernel, the following vulnerability has been resolved:xfs: fail recovery on a committed log item with no regionsIf the first op of a transaction is a bare transaction header(len == sizeof(struct xfs_trans_header)), xlog_recover_add_to_trans()adds an item but no region, leaving it on r_itemq with ri_cnt == 0 andri_buf == NULL.The header can be split across op records, so later ops may still addregions; the item is only invalid if the transaction commits with none.The runtime commit path never emits such a transaction, so this onlyhappens on a crafted log.  It came from an AI-assisted code audit of therecovery parser.xlog_recover_reorder_trans() calls ITEM_TYPE() on the item, which reads*(unsigned short *)item->ri_buf[0].iov_base and faults on the NULLri_buf.  Reject it there, before the commit handlers that also readri_buf[0].KASAN: null-ptr-deref in range [0x0000000000000000-0x0000000000000007]RIP: 0010:xlog_recover_reorder_trans (fs/xfs/xfs_log_recover.c:1836)xlog_recover_commit_trans (fs/xfs/xfs_log_recover.c:2043)xlog_recover_process_data (fs/xfs/xfs_log_recover.c:2501)xlog_do_recovery_pass (fs/xfs/xfs_log_recover.c:3244)xlog_recover (fs/xfs/xfs_log_recover.c:3493)xfs_log_mount (fs/xfs/xfs_log.c:618)xfs_mountfs (fs/xfs/xfs_mount.c:1034)xfs_fs_fill_super (fs/xfs/xfs_super.c:1938)vfs_get_tree (fs/super.c:1695)path_mount (fs/namespace.c:4161)__x64_sys_mount (fs/namespace.c:4367) (CVE-2026-64187)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: fix race between dump and ip_set_list resize (CVE-2026-64189)In the Linux kernel, the following vulnerability has been resolved:bpf: Reject BPF_MAP_TYPE_INODE_STORAGE creation if BPF LSM is uninitializedWhen CONFIG_BPF_LSM=y is set, BPF inode storage maps(BPF_MAP_TYPE_INODE_STORAGE) are compiled into the kernel. However,if the BPF LSM is not explicitly enabled at boot time (e.g. omittedfrom the "lsm=" boot parameter), lsm_prepare() is never executed forthe BPF LSM.Consequently, the BPF inode security blob offset(bpf_lsm_blob_sizes.lbs_inode) is never initialized and remains atits default compiled size of 8 bytes instead of being updated to avalid offset past the reserved struct rcu_head (typically 16 bytesor more).When a privileged user creates and updates a BPF_MAP_TYPE_INODE_STORAGEmap, bpf_inode() evaluates inode->i_security + 8. This erroneouslyaliases the struct rcu_head.func callback pointer at the beginningof the inode->i_security blob. During subsequent map element cleanupor inode destruction, writing NULL to owner_storage clears the queuedRCU callback pointer. When rcu_do_batch() later executes the queuedcallback, it attempts an instruction fetch at address 0x0, triggeringan immediate kernel panic.Fix this by introducing a global bpf_lsm_initialized boolean flagmarked with __ro_after_init. Set this flag to true inside bpf_lsm_init()when the LSM framework successfully registers the BPF LSM. Gate mapallocation in inode_storage_map_alloc() on this flag, returning-EOPNOTSUPP if the BPF LSM is in turn uninitialized.This fail-fast approach prevents userspace from allocating inodestorage maps when the supporting BPF LSM infrastructure is absent,avoiding zombie map states. (CVE-2026-64192)In the Linux kernel, the following vulnerability has been resolved:ACPI: driver: Check ACPI_COMPANION() against NULL during probe (CVE-2026-64227)In the Linux kernel, the following vulnerability has been resolved:fuse: clear intr_entry in fuse_resend and fuse_remove_pending_req (CVE-2026-64265)In the Linux kernel, the following vulnerability has been resolved:fuse: re-lock request before returning from fuse_ref_folio() (CVE-2026-64266)In the Linux kernel, the following vulnerability has been resolved:i2c: core: fix adapter deregistration race (CVE-2026-64279)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Ensure vendor''s exit handler runs before fastpath userspace exits (CVE-2026-64284)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: Clear __hyp_running_vcpu when flushing the pKVM hyp vCPU (CVE-2026-