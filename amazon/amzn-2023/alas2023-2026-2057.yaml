el, the following vulnerability has been resolved:smb: client: fix double-free in SMB2_flush() replay (CVE-2026-64383)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix change notify replay double-free (CVE-2026-64384)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix double-free in SMB2_ioctl() replay (CVE-2026-64385)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix query_info() replay double-free (CVE-2026-64386)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix query directory replay double-free (CVE-2026-64387)In the Linux kernel, the following vulnerability has been resolved:netfilter: ebtables: terminate table name before find_table_lock() (CVE-2026-64411)In the Linux kernel, the following vulnerability has been resolved:netfilter: ebtables: module names must be null-terminated (CVE-2026-64412)In the Linux kernel, the following vulnerability has been resolved:netfilter: ebtables: zero chainstack array (CVE-2026-64413)In the Linux kernel, the following vulnerability has been resolved:netfilter: handle unreadable frags (CVE-2026-64414)In the Linux kernel, the following vulnerability has been resolved:mm/swap: add cond_resched() in swap_reclaim_full_clusters to prevent softlockup (CVE-2026-64415)In the Linux kernel, the following vulnerability has been resolved:mm: swap_cgroup: fix NULL deref in lookup_swap_cgroup_id on swapless host (CVE-2026-64416)In the Linux kernel, the following vulnerability has been resolved:mm: shrinker: fix shrinker_info teardown race with expansion (CVE-2026-64418)In the Linux kernel, the following vulnerability has been resolved:net: ipv4: bound TCP reordering sysctl writes and MTU probe sizes (CVE-2026-64422)In the Linux kernel, the following vulnerability has been resolved:ipv4: igmp: remove multicast group from hash table on device destruction (CVE-2026-64423)In the Linux kernel, the following vulnerability has been resolved:io_uring/io-wq: re-check IO_WQ_BIT_EXIT for each linked work item (CVE-2026-64425)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: validate Dirty Page Table capacity in log_replay copy_lcns (CVE-2026-64432)In the Linux kernel, the following vulnerability has been resolved:audit: Fix data races of skb_queue_len() readers on audit_queue (CVE-2026-64435)In the Linux kernel, the following vulnerability has been resolved:net: af_key: initialize alg_key_len for IPComp states (CVE-2026-64436)In the Linux kernel, the following vulnerability has been resolved:smb: client: restrict implied bcc[0] exemption to responses without data area (CVE-2026-64448)In the Linux kernel, the following vulnerability has been resolved:tipc: fix out-of-bounds read in broadcast Gap ACK blocks (CVE-2026-64450)In the Linux kernel, the following vulnerability has been resolved:hwrng: virtio: clamp device-reported used.len at copy_data() (CVE-2026-64456)In the Linux kernel, the following vulnerability has been resolved:virtio_pci: fix vq info pointer lookup via wrong index (CVE-2026-64457)In the Linux kernel, the following vulnerability has been resolved:mm/damon/ops-common: handle extreme intervals in damon_hot_score() (CVE-2026-64458)In the Linux kernel, the following vulnerability has been resolved:usb: xhci: Fix sleep in atomic context in xhci_free_streams() (CVE-2026-64465)In the Linux kernel, the following vulnerability has been resolved:vfio/mlx5: Fix racy bitfields and tighten struct layout (CVE-2026-64472)In the Linux kernel, the following vulnerability has been resolved:vfio: prevent infinite loop in vfio_mig_get_next_state() on blocked arc (CVE-2026-64474)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: Release the VGA arbiter client on register_device() failure (CVE-2026-64475)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: Latch disable_idle_d3 per device (CVE-2026-64476)In the Linux kernel, the following vulnerability has been resolved:x86/bugs: Enable IBPB flush on BPF JIT allocation (CVE-2026-64507)In the Linux kernel, the following vulnerability has been resolved:bpf: Support for hardening against JIT spraying (CVE-2026-64508)In the Linux kernel, the following vulnerability has been resolved:ACPI: CPPC: Suppress UBSAN warning caused by field misuse (CVE-2026-64512)In the Linux kernel, the following vulnerability has been resolved:userfaultfd: gate must_wait writability check on pte_present() (CVE-2026-64514)In the Linux kernel, the following vulnerability has been resolved:net/sched: cls_api: Handle TC_ACT_CONSUMED in tcf_qevent_handle (CVE-2026-64530)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: bound NTFS_DE view.data_off in UpdateRecordData{Root,Allocation} (CVE-2026-64532)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: validate lcns_follow in log_replay conversion (CVE-2026-64533)In the Linux kernel, the following vulnerability has been resolved:ipv6: Fix null-ptr-deref in fib6_nh_mtu_change(). (CVE-2026-64538)In the Linux kernel, the following vulnerability has been resolved:ipv6: ndisc: fix NULL deref in accept_untracked_na() (CVE-2026-64542)In the Linux kernel, the following vulnerability has been resolved:tipc: fix use-after-free of the discoverer in tipc_disc_rcv() (CVE-2026-64543)In the Linux kernel, the following vulnerability has been resolved:crypto: asymmetric_keys - fix OOB read in pefile_digest_pe_contents (CVE-2026-64544)In the Linux kernel, the following vulnerability has been resolved:net, bpf: check master for NULL in xdp_master_redirect() (CVE-2026-64545)In the Linux kernel, the following vulnerability has been resolved:drm/edid: fix OOB read in drm_parse_tiled_block() (CVE-2026-64546)In the Linux kernel, the following vulnerability has been resolved:bpf, sockmap: reject overflowing copy + len in bpf_msg_push_data() (CVE-2026-64548)In the Linux kernel, the following vulnerability has been resolved:sctp: validate STALE_COOKIE cause length before reading staleness (CVE-2026-64551)In the Linux kernel, the following vulnerability has been resolved:virtio-net: fix len check in receive_big() (CVE-2026-64552)In the Linux kernel, the following vulnerability has been resolved:net: psample: fix info leak in PSAMPLE_ATTR_DATA (CVE-2026-64553)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: nv: Fix SPSR_EL2 restore in kvm_hyp_handle_mops() (CVE-2026-64555)In the Linux kernel, the following vulnerability has been resolved:perf/core: Detach event groups during remove_on_execperf_event_remove_on_exec() removes events by callingperf_event_exit_event(). For top-level events, this removes the event fromthe context with DETACH_EXIT only.This can leave inconsistent group state when a removed event is a groupleader and the group contains siblings without remove_on_exec. If the groupwas active, the surviving siblings can remain active and attached to theremoved leader''s sibling list, but are no longer represented by a validgroup leader on the PMU context active lists.A later close of the removed leader uses DETACH_GROUP and can promote thestill-active siblings from this stale group state. The next schedule-in canthen add an already-linked active_list entry again, corrupting the PMUcontext active list.With DEBUG_LIST enabled, this is caught as a list_add double-add inmerge_sched_in().Fix this by detaching group relationships when remove_on_exec removes anevent. This preserves the existing task-exit and revoke behavior, whileensuring surviving siblings are ungrouped before the removed event leavesthe context. (CVE-2026-64556)In the Linux kernel, the following vulnerability has been resolved:posix-cpu-timers: Prevent UAF caused by non-leader exec() race (CVE-2026-64560)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Check for invalid/obsolete root *after* making MMU pages availableCheck for a "stale" page fault, i.e. for an invalid and/or obsolete root,after making MMU pages available for the shadow MMU.  If reclaiming shadowpages zaps an in-use root, i.e. marks it invalid, then KVM will attempt tomap memory into an invalid root.  On its own, populating an invalid root is"fine", but because child shadow pages inherit their parent''s role, anychildren created during the map/fetch will be created as invalid pages,thus violating KVM''s invariant that invalid pages are never on the list ofactive MMU pages.Note, the underlying flaw has existed since KVM first started trackinginvalid roots in 2008 (commit 2e53d63acba7, "KVM: MMU: ignore zapped rootpagetables"), but the true badness only came along in 2020 (Linux 5.9)with the invariant that invalid shadow pages can''t be on the list ofactive pages.Note #2, inheriting role.invalid when creating child shadow pages is alsofar from ideal; that flaw will be addressed separately. (CVE-2026-64561)In the Linux kernel, the following vulnerability has been resolved:i2c: core: fix NULL-deref on adapter registration failure (CVE-2026-64589)In the Linux kernel, the following vulnerability has been resolved:btrfs: do not trim a device which is not writeable (CVE-2026-64593)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix double-free in SMB2_close() replay (CVE-2026-64597)In the Linux kernel, the following vulnerability has been resolved:smb/client: Fix error code in smb2_aead_req_alloc() (CVE-2026-64598)In the Linux kernel, the following vulnerability has been resolved:KVM: VMX: Grab vmcs12 on CR8 interception update iff vCPU is in guest mode (CVE-2026-64604)In the Linux kernel, the following vulnerability has been resolved:mm/khugepaged: write all dirty file folios when collapsing (CVE-2026-68086)In the Linux kernel, the following vulnerability has been resolved:debugobjects: Plug race against a concurrent OOM disable (CVE-2026-68090)In the Linux kernel, the following vulnerability has been resolved:time/jiffies: Register jiffies clocksource before usage (CVE-2026-68092)'
