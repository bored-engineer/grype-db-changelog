# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Certifi is a curated collection of Root Certificates for validating the trustworthiness of SSL certificates while verifying the identity of TLS hosts. Certifi 2022.12.07 removes root certificates from "TrustCor" from the root store. These are in the process of being removed from Mozilla's trust store. TrustCor's root certificates are being removed pursuant to an investigation prompted by media reporting that TrustCor's ownership also operated a business that produced spyware. Conclusions of Mozilla's investigation can be found in the linked google group discussion. (CVE-2022-23491)
    FixedIn:
        - Available:
            Date: "2023-03-22"
            Kind: advisory
          Name: python-certifi
          NamespaceName: amzn:2023
          Version: 2022.12.07-1.amzn2023.0.1
          VersionFormat: rpm
        - Available:
