# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: LWP::UserAgent versions before 6.83 for Perl leak Authorization and Proxy-Authorization headers on cross-origin redirects.On a 3xx response, the redirect handler strips only Host and Cookie before issuing the follow-up request. Caller-supplied Authorization and Proxy-Authorization headers are sent unchanged to the redirect target, including across scheme, host, or port changes.A redirect to an attacker controlled host therefore discloses the caller's credentials to that host. (CVE-2026-8368)
