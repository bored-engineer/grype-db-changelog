Vulnerability:
    Description: The webp decoder can panic when processing a VP8 chunk with dimensions that do not match the canvas size. (CVE-2026-46601)The TIFF decoder does not set a limit on the size of tiles in tiled images, permitting a malicious or corrupt image containing a very large tile to cause unbounded memory consumption. (CVE-2026-46602)The TIFF decoder can panic when decoding an invalid image with an out-of-bounds strip offset. (CVE-2026-46604)
