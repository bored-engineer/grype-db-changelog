Vulnerability:
    Description: tqdm is an open source progress bar for Python and CLI. Any optional non-boolean CLI arguments (e.g. `--delim`, `--buf-size`, `--manpath`) are passed through python's `eval`, allowing arbitrary code execution. This issue is only locally exploitable and had been addressed in release version 4.66.3. All users are advised to upgrade. There are no known workarounds for this vulnerability. (CVE-2024-34062)
    FixedIn:
        - Name: python-tqdm
          NamespaceName: amzn:2023
          Version: 4.61.1-1.amzn2023.0.3
          VersionFormat: rpm
