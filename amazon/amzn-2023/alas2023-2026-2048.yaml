Vulnerability:
    Description: Authentication bypass by assumed-immutable data in ASP.NET Core allows an authorized attacker to elevate privileges over a network. (CVE-2026-47303)Improper verification of cryptographic signature in .NET allows an unauthorized attacker to bypass a security feature over a network. (CVE-2026-47304)Improper validation of specified type of input in .NET Framework allows an unauthorized attacker to deny service over a network. (CVE-2026-50524)Improper link resolution before file access ('link following') in .NET allows an authorized attacker to perform tampering locally. (CVE-2026-50526)Stack-based buffer overflow in .NET Framework allows an unauthorized attacker to deny service over a network. (CVE-2026-50527)Allocation of resources without limits or throttling in .NET Framework allows an unauthorized attacker to deny service over a network. (CVE-2026-50648)Deserialization of untrusted data in .NET allows an unauthorized attacker to execute code locally. (CVE-2026-50649)Allocation of resources without limits or throttling in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-50651)Access of resource using incompatible type ('type confusion') in .NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-57108)
