Vulnerability:
    Description: jackson-databind contains the general-purpose data-binding functionality and tree-model for Jackson Data Processor. From 2.13.0 until 2.14.0, a potential Denial-of-Service exists when attacker sends deeply nested JSON if (and only if) the service reads deeply nested (1000s of levels) JSON as JsonNode (ObjectMapper.readTree()) and writes out same (or modifided) node using JsonNode.toString(). This can consume significant amount of resources with concurrent relatively small requests (1000 nested arrays is 2kB). This vulnerability is fixed in 2.14.0. (CVE-2026-50193)
    FixedIn:
        - Available:
            Date: "2026-07-20"
            Kind: advisory
          Name: jackson-databind
          NamespaceName: amzn:2023
          Version: 2.14.2-1.amzn2023.0.1
          VersionFormat: rpm
