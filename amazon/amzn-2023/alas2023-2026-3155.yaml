Vulnerability:
    Description: A flaw was found in pymongo. An integer overflow exists in the bundled native extension for Binary JSON (BSON) document encoding when processing an unusually large amount of data. An unprivileged attacker who can submit oversized data to an application for encoding can trigger an arithmetic overflow, resulting in a write outside the boundaries of an allocated memory buffer. This issue can lead to arbitrary code execution within the application process or a denial of service (DoS) via an application crash. (CVE-2026-96749)
