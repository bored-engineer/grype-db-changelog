Vulnerability:
    Description: A complete sandbox escape vulnerability exists in Flatpak before 1.16.4. The Flatpak portal accepts paths in the sandbox-expose options which can be app-controlled symlinks pointing at arbitrary paths. Flatpak run mounts the resolved host path in the sandbox, giving apps access to all host files and enabling code execution in the host context. (CVE-2026-34078)Arbitrary file deletion on the host filesystem in Flatpak before 1.16.4. The caching for ld.so removes outdated cache files without properly checking that the app-controlled path to the outdated cache is in the cache directory, allowing Flatpak applications to delete arbitrary files on the host. (CVE-2026-34079)
