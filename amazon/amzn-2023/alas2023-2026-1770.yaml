Vulnerability:
    Description: 'Allocation of Resources Without Limits or Throttling vulnerability in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from 9.0.0.M1 through 9.0.117.Older, unsupported versions may also be affected.Users are recommended to upgrade to version [FIXED_VERSION], which fixes the issue. (CVE-2026-41284)Improper Input Validation vulnerability in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from 9.0.0.M1 through 9.0.117, from 10.0.0-M1 through 10.0.27.Older, end of support versions may also be affected.Users are recommended to upgrade to version [FIXED_VERSION], which fixes the issue. (CVE-2026-41293)Exposure of HTTP Authentication Header to unexpected hosts during WebSocket authentication vulnerability in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from 9.0.2 through 9.0.117, from 8.5.24 through 8.5.100, from 7.0.83 through 7.0.109.Users are recommended to upgrade to version 11.0.22, 10.1.55 or 9.0.118, which fix the issue. (CVE-2026-42498)DEPRECATED: Authentication Bypass Issues vulnerability in digest authentication in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from 9.0.0.M1 through 9.0.117, from 8.5.0 through 8.5.100, from before 7.0.0.Older unsupported versions any also be affectUsers are recommended to upgrade to version 11.0.22, 10.1.55 or 9.0.118 which fix the issue. (CVE-2026-43512)Improper Handling of Case Sensitivity vulnerability in LockOutRealm in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from 9.0.0.M1 through 9.0.117, from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109.Older unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.22, 10.1.55 or 9.0.118 which fix the issue. (CVE-2026-43513)Observable Timing Discrepancy vulnerability when comparing AJP secret in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from 9.0.0.M1 through 9.0.117, from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109.Older unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.22, 10.1.55 or 9.0.118 which fix the issue. (CVE-2026-43514)Improper Authorization vulnerability when multiple method constraints define an HTTP method for the same extension in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.21, from 10.1.0-M1 through 10.1.54, from 9.0.0.M1 through 9.0.117, from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109.Users are recommended to upgrade to version 11.0.22, 10.1.55 or 9.0.118 which fix the issue. (CVE-2026-43515)'
