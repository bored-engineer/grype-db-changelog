# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A denial-of-service vulnerability exists in github.com/sirupsen/logrus when using Entry.Writer() to log a single-line payload larger than 64KB without newline characters. Due to limitations in the internal bufio.Scanner, the read fails with "token too long" and the writer pipe is closed, leaving Writer() unusable and causing application unavailability (DoS). This affects versions < 1.8.3, 1.9.0, and 1.9.2. The issue is fixed in 1.8.3, 1.9.1, and 1.9.3+, where the input is chunked and the writer continues to function even if an error is logged. (CVE-2025-65637)
    FixedIn:
        - Available:
            Date: "2026-01-07"
            Kind: advisory
          Name: ecs-init
          NamespaceName: amzn:2023
          Version: 1.82.2-1.amzn2023
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2025-1345.html
