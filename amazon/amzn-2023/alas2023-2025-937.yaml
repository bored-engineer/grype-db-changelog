# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A flaw was found in grub2. A specially crafted JPEG file can cause the JPEG parser of grub2 to incorrectly check the bounds of its internal buffers, resulting in an out-of-bounds write. The possibility of overwriting sensitive information to bypass secure boot protections is not discarded. (CVE-2024-45774)A flaw was found in grub2 where the grub_extcmd_dispatcher() function calls grub_arg_list_alloc() to allocate memory for the grub''s argument list. However, it fails to check in case the memory allocation fails. Once the allocation fails, a NULL point will be processed by the parse_option() function, leading grub to crash or, in some rare scenarios, corrupt the IVT data. (CVE-2024-45775)When reading the language .mo file in grub_mofile_open(), grub2 fails to verify an integer overflow when allocating its internal buffer. A crafted .mo file may lead the buffer size calculation to overflow, leading to out-of-bound reads and writes. This flaw allows an attacker to leak sensitive data or overwrite critical data, possibly circumventing secure boot protections. (CVE-2024-45776)A flaw was found in grub2. The calculation of the translation buffer when reading a language .mo file in grub_gettext_getstr_from_position() may overflow, leading to a Out-of-bound write. This issue can be leveraged by an attacker to overwrite grub2''s sensitive heap data, eventually leading to the circumvention of secure boot protections. (CVE-2024-45777)grub2: fs/bfs: Integer overflow in the BFS parser. (CVE-2024-45778)grub2: fs/bfs: Integer overflow leads to Heap OOB Read in the BFS parser (CVE-2024-45779)grub2: fs/tar: Integer Overflow causes Heap OOB Write (CVE-2024-45780)A flaw was found in grub2. When reading a symbolic link''s name from a UFS filesystem, grub2 fails to validate the string length taken as an input. The lack of validation may lead to a heap out-of-bounds write, causing data integrity issues and eventually allowing an attacker to circumvent secure boot protections. (CVE-2024-45781)grub2: fs/hfs: strcpy() using the volume name (fs/hfs.c:382) (CVE-2024-45782)A flaw was found in grub2. When failing to mount an HFS+ grub, the hfsplus filesystem driver doesn''t properly set an ERRNO value. This issue may lead to a NULL pointer access. (CVE-2024-45783)A flaw was found in command/gpg. In some scenarios, hooks created by loaded modules are not removed when the related module is unloaded. This flaw allows an attacker to force grub2 to call the hooks once the module that registered it was unloaded, leading to a use-after-free vulnerability. If correctly exploited, this vulnerability may result in arbitrary code execution, eventually allowing the attacker to bypass secure boot protections. (CVE-2025-0622)A flaw was found in grub2. During the network boot process, when trying to search for the configuration file, grub copies data from a user controlled environment variable into an internal buffer using the grub_strcpy() function. During this step, it fails to consider the environment variable length when allocating the internal buffer, resulting in an out-of-bounds write. If correctly exploited, this issue may result in remote code execution through the same network segment grub is searching for the boot information, which can be used to by-pass secure boot protections. (CVE-2025-0624)A flaw was found in grub2. When performing a symlink lookup, the grub''s UFS module checks the inode''s data size to allocate the internal buffer to read the file content, however, it fails to check if the symlink data size has overflown. When this occurs, grub_malloc() may be called with a smaller value than needed. When further reading the data from the disk into the buffer, the grub_ufs_lookup_symlink() function will write past the end of the allocated size. An attack can leverage this by crafting a malicious filesystem, and as a result, it will corrupt data stored in the heap, allowing for arbitrary code execution used to by-pass secure boot mechanisms. (CVE-2025-0677)grub2: squash4: Integer overflow may lead to heap based out-of-bounds write when reading data (CVE-2025-0678)grub2: reiserfs: Integer overflow when handling symlinks may lead to heap based out-of-bounds write when reading data (CVE-2025-0684)grub2: jfs: Integer overflow when handling symlinks may lead to heap based out-of-bounds write when reading data (CVE-2025-0685)grub2: romfs: Integer overflow when handling symlinks may lead to heap based out-of-bounds write when reading dat (CVE-2025-0686)grub2: udf: Heap based buffer overflow in grub_udf_read_block() may lead to arbitrary code execution (CVE-2025-0689)The read command is used to read the keyboard input from the user, while reads it keeps the input length in a 32-bit integer value which is further used to reallocate the line buffer to accept the next character. During this process, with a line big enough it''s possible to make this variable to overflow leading to a out-of-bounds write in the heap based buffer. This flaw may be leveraged to corrupt grub''s internal critical data and secure boot bypass is not discarded as consequence. (CVE-2025-0690)A flaw was found in grub2. Grub''s dump command is not blocked when grub is in lockdown mode, which allows the user to read any memory information, and an attacker may leverage this in order to extract signatures, salts, and other sensitive information from the memory. (CVE-2025-1118)grub2: fs/hfs: Integer overflow may lead to heap based out-of-bounds write (CVE-2025-1125)'
