Vulnerability:
    Description: 'ntfs3 in the Linux kernel through 6.8.0 allows a physically proximate attacker to read kernel memory by mounting a filesystem (e.g., if a Linux distribution is configured to allow unprivileged mounts of removable media) and then leveraging local access to trigger an out-of-bounds read. A length value can be larger than the amount of memory allocated. NOTE: the supplier''s perspective is that there is no vulnerability when an attack requires an attacker-modified filesystem image. (CVE-2023-45896)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix use-after-free in smb2_query_info_compound() (CVE-2023-52751)In the Linux kernel, the following vulnerability has been resolved:Bluetooth: hci_sock: Fix not validating setsockopt user input (CVE-2024-35963)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: fix potential memory leak in vfio_intx_enable() (CVE-2024-38632)In the Linux kernel, the following vulnerability has been resolved:selinux,smack: don''t bypass permissions check in inode_setsecctx hook (CVE-2024-46695)In the Linux kernel, the following vulnerability has been resolved:icmp: change the order of rate limits (CVE-2024-47678)In the Linux kernel, the following vulnerability has been resolved:vfs: fix race between evice_inodes() and find_inode()&iput() (CVE-2024-47679)In the Linux kernel, the following vulnerability has been resolved:scsi: sd: Fix off-by-one error in sd_read_block_characteristics() (CVE-2024-47682)In the Linux kernel, the following vulnerability has been resolved:tcp: check skb is non-NULL in tcp_rto_delta_us() (CVE-2024-47684)syzbot reported that nf_reject_ip6_tcphdr_put() was possibly sending garbage on the four reserved tcp bits (th->res1)Use skb_put_zero() to clear the whole TCP header, as done in nf_reject_ip_tcphdr_put() (CVE-2024-47685)In the Linux kernel, the following vulnerability has been resolved:nfsd: return -EINVAL when namelen is 0 (CVE-2024-47692)In the Li