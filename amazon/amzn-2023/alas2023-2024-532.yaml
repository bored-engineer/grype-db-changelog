Vulnerability:
    Description: Buffer Overflow vulnerability in WritePCXImage function in pcx.c in GraphicsMagick 1.4 allows remote attackers to cause a denial of service via converting of crafted image file to pcx format. (CVE-2020-21679)In GraphicsMagick, a heap buffer overflow was found when parsing MIFF. (CVE-2022-1270)
