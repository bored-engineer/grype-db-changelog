    Description: 'In the Linux kernel, the following vulnerability has been resolved:eth: bnxt: fix out-of-range access of vnic_info array (CVE-2025-22112)In the Linux kernel, the following vulnerability has been resolved:wifi: cfg80211: init wiphy_work before allocating rfkill fails (CVE-2025-22119)In the Linux kernel, the following vulnerability has been resolved:block: fix adding folio to bio (CVE-2025-22122)In the Linux kernel, the following vulnerability has been resolved:wifi: ath12k: Clear affinity hint before calling ath12k_pci_free_irq() in error path (CVE-2025-22128)In the Linux kernel, the following vulnerability has been resolved:cpufreq/amd-pstate: Add missing NULL ptr check in amd_pstate_update (CVE-2025-23137)In the Linux kernel, the following vulnerability has been resolved:net_sched: hfsc: Address reentrant enqueue adding class to eltree twice (CVE-2025-38001)In the Linux kernel, the following vulnerability has been resolved:gpio: virtuser: fix potential out-of-bound write (CVE-2025-38082)'
