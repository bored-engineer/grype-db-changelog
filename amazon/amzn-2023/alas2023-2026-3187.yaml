ei/ghes: Use raw_spinlock_t for CXL CPER work locks (CVE-2026-89589)In the Linux kernel, the following vulnerability has been resolved:hugetlb: only adjust reservation during unmapping if mapcount is 0Since df7a6d1f6405, __unmap_hugepage_range can adjust reservations.  Inthe case of folio mapped in both a parent and a child, if the parentunmaps the range first, the reservation adjustment will result in anunderflow of the reserved count.  Once the child unmaps the range, thecount is restored.  Change __unmap_hugepage_range() to check the mapcountbefore adjusting the reservation. (CVE-2026-89593)In the Linux kernel, the following vulnerability has been resolved:fsnotify: Fix stale object mask after concurrent mark updates (CVE-2026-89595)In the Linux kernel, the following vulnerability has been resolved:fanotify: fix use-after-free of file range info (CVE-2026-89600)In the Linux kernel, the following vulnerability has been resolved:erofs: skip sufficiently large global buffers when resizing (CVE-2026-89602)In the Linux kernel, the following vulnerability has been resolved:entry: Fix seccomp bypass after ptrace with TSYNC (CVE-2026-89603)In the Linux kernel, the following vulnerability has been resolved:efivarfs: Rate limit statfs() handler (CVE-2026-89604)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: bound page_lcns[] index by the log record (CVE-2026-89615)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: fix info-leak on partial LZNT decompress in ni_read_frame() (CVE-2026-89616)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: validate dirty page table on log replay (CVE-2026-89617)In the Linux kernel, the following vulnerability has been resolved:eventfs: Initialize ei->children and ei->list in init_ei() (CVE-2026-89618)In the Linux kernel, the following vulnerability has been resolved:smb: client: reject a tree connect response whose byte count is too small (CVE-2026-89631)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix OOB read/write from unvalidated DataOffset in coalesce_t2() (CVE-2026-89633)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix ALIGN() overflow in symlink_data() error context loop (CVE-2026-89634)In the Linux kernel, the following vulnerability has been resolved:smb: client: clear ce->tgthint in free_tgts() (CVE-2026-89636)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix UAF and buffer leak in cifs_check_trans2() for malformed secondary T2 (CVE-2026-89637)In the Linux kernel, the following vulnerability has been resolved:smb: client: clear setuid/setgid bit on write with cifsacl/modefromsid/posix extensions (CVE-2026-89638)In the Linux kernel, the following vulnerability has been resolved:cifs: fix loff_t underflow in cifs_remap_file_range() when len == 0 (CVE-2026-89640)In the Linux kernel, the following vulnerability has been resolved:cifs: clear tcon after cifsFileInfo_put() in cifs_file_set_size() (CVE-2026-89641)In the Linux kernel, the following vulnerability has been resolved:audit: avoid dropping live tree ref on fsnotify rule autoremoveaudit_del_rule() is used for both netlink deletion templates and internalfsnotify autoremove.  The former passes a parsed template which owns atemporary tree reference; the latter passes the installed entry itself.The unconditional audit_put_tree() at the end of audit_del_rule() assumesthe template case.  For mixed AUDIT_DIR plus AUDIT_EXE rules, an fsnotifyautoremove event therefore drops the installed rule''s live tree reference.Repeating this across rules sharing the same tree can free the tree whileanother rule still references it, and a later autoremove dereferences thefreed pathname while comparing rules.Move the temporary-tree put to audit_rule_change(), the caller that ownsdeletion templates.  Keep it in the AUDIT_DEL_RULE cleanup so bothsuccessful deletion and -ENOENT still release the parser-owned tree. (CVE-2026-89643)In the Linux kernel, the following vulnerability has been resolved:btrfs: fix extent map leak in NOCOW direct I/O write (CVE-2026-89644)In the Linux kernel, the following vulnerability has been resolved:btrfs: drop recovered reloc root refs on recovery failure (CVE-2026-89645)In the Linux kernel, the following vulnerability has been resolved:ceph: fix leaked inode reference on writeback abort at umount (CVE-2026-89646)In the Linux kernel, the following vulnerability has been resolved:ceph: do not repeat ceph_trim_dentries() if no progress possible (CVE-2026-89647)In the Linux kernel, the following vulnerability has been resolved:ceph: cap delegated inode count in ceph_parse_deleg_inos() (CVE-2026-89648)In the Linux kernel, the following vulnerability has been resolved:ceph: bound xattr value length in __build_xattrs() (CVE-2026-89649)In the Linux kernel, the following vulnerability has been resolved:ceph: bound num_export_targets array for mds info v2/v3 (CVE-2026-89650)In the Linux kernel, the following vulnerability has been resolved:ceph: bound MDSCapAuth path and fs_name decode in handle_session() (CVE-2026-89651)In the Linux kernel, the following vulnerability has been resolved:ceph: bound copied dentry name length in NFS export get_nameceph_get_name() copies the MDS-supplied name into the caller''sNAME_MAX-sized buffer with memcpy(name, rinfo->dname, rinfo->dname_len)and then writes name[rinfo->dname_len] = 0, without checking dname_lenagainst NAME_MAX. A malicious or buggy MDS that returns a LOOKUPNAME replywith dname_len > NAME_MAX overflows the buffer. __get_snap_name() copiesrde->name / rde->name_len the same unchecked way.Impact: a malicious or compromised Ceph MDS overflows the NAME_MAX namebuffer in a client''s NFS-export get_name path, a slab out-of-bounds writereported by KASAN. Reachable when a CephFS mount is re-exported over NFS.Add ceph_export_copy_name(), which rejects lengths above NAME_MAX with-ENAMETOOLONG before the copy, and use it in both ceph_get_name() and__get_snap_name(). (CVE-2026-89652)In the Linux kernel, the following vulnerability has been resolved:ceph: reject export_targets ranks >= CEPH_MAX_MDS in mdsmap decode (CVE-2026-89653)In the Linux kernel, the following vulnerability has been resolved:ceph: fix UAF in __kick_flushing_caps() on cf entry freed during unlock (CVE-2026-89655)In the Linux kernel, the following vulnerability has been resolved:libceph: reject buckets with mismatched CRUSH ids (CVE-2026-89656)In the Linux kernel, the following vulnerability has been resolved:libceph: validate OSD extent maps before cursor advance (CVE-2026-89657)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent client use-after-free during NFSv4.0 revoked-state cleanup (CVE-2026-89658)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent client use-after-free during delegation revoke (CVE-2026-89659)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent client use-after-free during admin state revocationA stateid holds only a bare pointer to its nfs4_client; a stateidreference does not pin it.  The client survives only because__destroy_client() drains its stateids before free_client() runs.nfsd4_revoke_states() drops nn->client_lock across revoke_one_stid(),which dereferences the client to revoke a stateid and readclp->cl_minorversion.  A teardown racing the dropped lock can freethe client first.Pinning cl_rpc_users under client_lock blocks the DESTROY_CLIENTID andEXCHANGE_ID teardown, which refuses while cl_rpc_users is non-zero.force_expire_client() ignores it: once its wait for cl_rpc_users toreach zero has passed, a later pin goes unnoticed.Under client_lock, skip a client whose cl_time is already zero --force_expire_client() clears it there before waiting -- otherwise pincl_rpc_users before dropping the lock.  The walk then either sees theexpiry and skips, or pins in time for that wait to cover the revoke. (CVE-2026-89660)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent lock owner use-after-free during client teardown (CVE-2026-89662)In the Linux kernel, the following vulnerability has been resolved:nfsd: revoke copy-notify stateids before dropping their reference (CVE-2026-89663)In the Linux kernel, the following vulnerability has been resolved:nfsd: reject out-of-range nseconds in NFSv3 SETATTR and create ops (CVE-2026-89666)In the Linux kernel, the following vulnerability has been resolved:nfsd: close shrinker/GC/fsnotify vs per-net shutdown race in filecache (CVE-2026-89667)In the Linux kernel, the following vulnerability has been resolved:nfsd: move nfsd_debugfs_init() after nfsd4_init_slabs() in init_nfsd() (CVE-2026-89668)In the Linux kernel, the following vulnerability has been resolved:nfsd: initialize copy-notify stateid before publishing it (CVE-2026-89669)In the Linux kernel, the following vulnerability has been resolved:nfsd: gate nfs3 setacl by argp->mask (CVE-2026-89671)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix UAF in async copy cancel and shutdown (CVE-2026-89675)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix stale s2s_cp_stateids IDR entry for async COPY (CVE-2026-89676)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix null dereference in nfsd4_setattr for deleg timestamp attrs (CVE-2026-89679)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix nfsd_file leak on inter-server COPY setup failure (CVE-2026-89680)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix fcache_disposal UAF by inlining dispose state into nfsd_netnfsd_file_dispose_list_delayed() defers fput() to nfsd service threadsvia a per-net freeme queue, preventing the shrinker and GC worker frombearing the cost of closing files (see ffb402596147).  However, thequeue lives in a separately-allocated struct nfsd_fcache_disposal thatis freed by nfsd_free_fcache_disposal_net() during per-net teardown.The global shrinker, laundrette, and fsnotify callbacks can still beinside nfsd_file_dispose_list_delayed() dereferencing that pointer,causing a use-after-free.Inline the spinlock and freeme list directly into struct nfsd_net (asfcache_dispose_lock and fcache_dispose_list), eliminating the separatelyallocated struct nfsd_fcache_disposal entirely.  These fields now havethe same lifetime as the net namespace itself, so there is no danglingpointer to chase.nfsd_file_cache_start_net() now just initializes the inline fields andcannot fail due to allocation.  nfsd_file_cache_shutdown_net() drainsthe inline list directly instead of freeing a separate struct.  Thealloc/free helpers are removed. (CVE-2026-89682)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix dentry ref leak on V4ROOT export filehandle lookup (CVE-2026-89683)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix cpntf publish race in nfs4_init_cp_statenfs4_alloc_init_cpntf_state() published the new cpntf entry into thes2s_cp_stateids IDR (with cs_type set) in one s2s_cp_lock section, thentook the lock again to list_add() it onto p_stid->sc_cp_list. In the gapthe entry is reachable by so_id but cp_list is still {NULL,NULL} fromkzalloc. A racing OFFLOAD_CANCEL (so_id is echoed to the client ascnr_stateid, so any NFSv4.2 client can drive it) reachesmanage_cpntf_state() -> _free_cpntf_state_locked() and does list_del() onthe zeroed list_head, oopsing the server.Fold the cs_type assignment and the list_add() into the same criticalsection as idr_alloc_cyclic(), so a concurrent lookup either misses theentry or sees a fully linked cp_list. INIT_LIST_HEAD() the entry afterallocation and switch _free_cpntf_state_locked() to list_del_init() so astale unlink is a no-op. nfs4_init_copy_state() passes NULL p_stid andskips the list_add, preserving NFS4_COPY_STID semantics. (CVE-2026-89684)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix clock domain mismatch in clients_still_reclaiming() (CVE-2026-89685)In the Linux kernel, the following vulnerability has been resolved:nfsd: drop the stateid, not the stateowner, on seqid_op replay retry (CVE-2026-89688)In the Linux kernel, the following vulnerability has been resolved:nfsd: don''t free session slots that are still in use (CVE-2026-89689)In the Linux kernel, the following vulnerability has been resolved:nfsd: defer vfree of compound ops to fix rpc_status UAF (CVE-2026-89690)In the Linux kernel, the following vulnerability has been resolved:nfsd: clear opcnt on compound arg release to prevent OOB read (CVE-2026-89691)In the Linux kernel, the following vulnerability has been resolved:nfsd: clear CALLBACK_RUNNING on failed delegation recall queue (CVE-2026-89692)In the Linux kernel, the following vulnerability has been resolved:nfsd: check nfsd4_acl_to_attr() return value in nfsd4_create()nfsd4_create() stores the return value of nfsd4_acl_to_attr() instatus, but the switch(create->cr_type) block unconditionallyoverwrites it in every branch. ACL translation errors are silentlydiscarded, and the CREATE proceeds without the requested ACL.Add an early exit check after nfsd4_acl_to_attr(), matching thepattern already used in nfsd4_setattr().[ cel: prefer NFS4ERR_BADTYPE over NFS4ERR_ATTRNOTSUPP ] (CVE-2026-89693)In the Linux kernel, the following vulnerability has been resolved:nfsd: check client ownership when cancelling a copy-notify stateid (CVE-2026-89694)In the Linux kernel, the following vulnerability has been resolved:nfsd: block non-SAVEFH ops after FOREIGN PUTFH to prevent NULL deref (CVE-2026-89696)In the Linux kernel, the following vulnerability has been resolved:nfsd: widen nfsd_genl_rqstp address fields to sockaddr_storage (CVE-2026-89698)In the Linux kernel, the following vulnerability has been resolved:nfsd: validate symlink target lengt