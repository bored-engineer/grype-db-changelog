# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Package bin path can escape the package directory, bypassing the GHSA-gjfg-22fp-rrxx fix. A malicious or compromised Composer package could, when installed as a dependency, cause Composer to change the permissions of a file outside that package's own directory and to register a runnable vendor/bin command that points at that outside file. This is a path traversal and link following issue. It is not remote code execution, the attacker gains no ability to read or receive your data directly. The risk is that a file which was readable only by its owner, but modifiable by Composer, can be made world readable and executable, which is enough to expose its contents on a shared or multi tenant host. The earlier hardening from GHSA-gjfg-22fp-rrxx can be bypassed, since it only rejected literal .. path segments in a package's declared binaries, and was only applied in a single place during dependency resolution. (CVE-2026-59944)
    FixedIn:
        - Available:
            Date: "2026-09-14"
            Kind: advisory
          Name: composer
          NamespaceName: amzn:2023
          Version: 2.10.3-1.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2026-2152.html
    Metadata:
        CVE:
            - Name: CVE-2026-59944
    Name: ALAS2023-2026-2152
    NamespaceName: amzn:2023
    Severity: Medium
