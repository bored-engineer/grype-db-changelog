Vulnerability:
    Description: 'A vulnerability was found in libX11 due to an infinite loop within the PutSubImage() function. This flaw allows a local user to consume all available system resources and cause a denial of service condition. (CVE-2023-43786)libX11: integer overflow in XCreateImage() leading to a heap overflow. (CVE-2023-43787)libXpm: out of bounds read on XPM with corrupted colormap (CVE-2023-43789)'
