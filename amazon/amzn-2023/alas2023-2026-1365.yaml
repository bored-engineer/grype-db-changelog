# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Composer is a dependency manager for PHP. In versions on the 2.x branch prior to 2.2.26 and 2.9.3, attackers controlling remote sources that Composer downloads from might in some way inject ANSI control characters in the terminal output of various Composer commands, causing mangled output and potentially leading to confusion or DoS of the terminal application. There is no proven exploit and this has thus a low severity but we still publish a CVE as it has potential for abuse, and we want to be on the safe side informing users that they should upgrade. Versions 2.2.26 and 2.9.3 contain a patch for the issue. (CVE-2025-67746)
    FixedIn:
        - Available:
            Date: "2026-01-23"
            Kind: advisory
          Name: composer
          NamespaceName: amzn:2023
          Version: 2.9.3-1.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2026-1365.html
    Metadata:
        CVE:
            - Name: CVE-2025-67746
    Name: ALAS2023-2026-1365
