    Description: 'In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix deadlock in port "disable" sysfs attribute (CVE-2024-26933)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Fix unremoved procfs host directory regression (CVE-2024-26935)In the Linux kernel, the following vulnerability has been resolved:drm/i915/bios: Tolerate devdata==NULL in intel_bios_encoder_supports_dp_dual_mode() (CVE-2024-26938)In the Linux kernel, the following vulnerability has been resolved:kprobes/x86: Use copy_from_kernel_nofault() to read from unsafe address (CVE-2024-26946)In the Linux kernel, the following vulnerability has been resolved:wireguard: netlink: access device through ctx instead of peer (CVE-2024-26950)In the Linux kernel, the following vulnerability has been resolved:wireguard: netlink: check for dangling peer via is_dead instead of empty list (CVE-2024-26951)In the Linux kernel, the following vulnerability has been resolved:nfs: fix UAF in direct writes (CVE-2024-26958)In the Linux kernel, the following vulnerability has been resolved:mm: swap: fix race between free_swap_and_cache() and swapoff() (CVE-2024-26960)In the Linux kernel, the following vulnerability has been resolved:usb: xhci: Add error handling in xhci_map_urb_for_dma (CVE-2024-26964)In the Linux kernel, the following vulnerability has been resolved:KVM: Always flush async #PF workqueue when vCPU is being destroyed (CVE-2024-26976)In the Linux kernel, the following vulnerability has been resolved:pci_iounmap(): Fix MMIO mapping leak (CVE-2024-26977)In the Linux kernel, the following vulnerability has been resolved:nbd: null check for nla_nest_start (CVE-2024-27025)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: do not compare internal table flags on updates (CVE-2024-27065)In the Linux kernel, the following vulnerability has been resolved:pstore: inode: Only d_invalidate() is needed (CVE-2024-27389)In the 