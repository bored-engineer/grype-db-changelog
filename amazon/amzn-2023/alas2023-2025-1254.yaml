    Description: 'In the Linux kernel, the following vulnerability has been resolved:io_uring/kbuf: always use READ_ONCE() to read ring provided buffer lengths (CVE-2025-39816)In the Linux kernel, the following vulnerability has been resolved:crypto: af_alg - Set merge to zero early in af_alg_sendmsg (CVE-2025-39931)In the Linux kernel, the following vulnerability has been resolved:dm-stripe: fix a possible integer overflow (CVE-2025-39940)In the Linux kernel, the following vulnerability has been resolved:tls: make sure to abort the stream if headers are bogus (CVE-2025-39946)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: Harden uplink netdev access against device unbind (CVE-2025-39947)In the Linux kernel, the following vulnerability has been resolved:cgroup: split cgroup_destroy_wq into 3 workqueues (CVE-2025-39953)In the Linux kernel, the following vulnerability has been resolved:tcp: Clear tcp_sk(sk)->fastopen_rsk in tcp_disconnect(). (CVE-2025-39955)In the Linux kernel, the following vulnerability has been resolved:igc: don''t fail igc_probe() on LED setup error (CVE-2025-39956)In the Linux kernel, the following vulnerability has been resolved:iommu/amd/pgtbl: Fix possible race while increase page table level (CVE-2025-39961)In the Linux kernel, the following vulnerability has been resolved:io_uring: fix incorrect io_kiocb reference in io_link_skb (CVE-2025-39963)In the Linux kernel, the following vulnerability has been resolved:crypto: af_alg - Disallow concurrent writes in af_alg_sendmsg (CVE-2025-39964)In the Linux kernel, the following vulnerability has been resolved:xfrm: xfrm_alloc_spi shouldn''t use 0 as SPI (CVE-2025-39965)In the Linux kernel, the following vulnerability has been resolved:mm: swap: check for stable address space before operating on the VMA (CVE-2025-39992)In the Linux kernel, the following vulnerability has been resolved:scsi: target: target_core_configfs: Add length check to avoid buffer overflow (CVE-2025-39998)'
