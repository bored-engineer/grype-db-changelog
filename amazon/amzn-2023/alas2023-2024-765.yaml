    Description: 'In the Linux kernel, the following vulnerability has been resolved:smb: client: fix use-after-free in smb2_query_info_compound() (CVE-2023-52751)In the Linux kernel, the following vulnerability has been resolved:Bluetooth: hci_sock: Fix not validating setsockopt user input (CVE-2024-35963)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: fix potential memory leak in vfio_intx_enable() (CVE-2024-38632)In the Linux kernel, the following vulnerability has been resolved:selinux,smack: don''t bypass permissions check in inode_setsecctx hook (CVE-2024-46695)syzbot reported that nf_reject_ip6_tcphdr_put() was possibly sending garbage on the four reserved tcp bits (th->res1)Use skb_put_zero() to clear the whole TCP header, as done in nf_reject_ip_tcphdr_put() (CVE-2024-47685)'
