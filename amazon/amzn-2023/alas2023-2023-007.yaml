# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A flaw was found in the xdg-email component of xdg-utils-1.1.0-rc1 and newer. When handling mailto: URIs, xdg-email allows attachments to be discreetly added via the URI when being passed to Thunderbird. An attacker could potentially send a victim a URI that automatically attaches a sensitive file to a new email. If a victim user does not notice that an attachment was added and sends the email, this could result in sensitive information disclosure. It has been confirmed that the code behind this issue is in xdg-email and not in Thunderbird. (CVE-2020-27748)When xdg-mail is configured to use thunderbird for mailto URLs, improper parsing of the URL can lead to additional headers being passed to thunderbird that should not be included per RFC 2368. An attacker can use this method to create a mailto URL that looks safe to users, but will actually attach files when clicked. (CVE-2022-4055)'
    FixedIn:
        - Available:
            Date: "2023-03-22"
            Kind: advisory
          Name: xdg-utils
          NamespaceName: amzn:2023
          Version: 1.1.3-12.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2023-007.html
    Metadata:
        CVE:
            - Name: CVE-2020-27748
            - Name: CVE-2022-4055
    Name: ALAS2023-2023-007
    NamespaceName: amzn:2023
    Severity: Medium
