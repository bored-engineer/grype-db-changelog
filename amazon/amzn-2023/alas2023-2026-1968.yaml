uge_memory: update file PMD counter before folio_put() (CVE-2026-53189)In the Linux kernel, the following vulnerability has been resolved:drm/virtio: fix dma_fence refcount leak on error in virtio_gpu_dma_fence_wait() (CVE-2026-53190)In the Linux kernel, the following vulnerability has been resolved:io_uring/net: inherit IORING_CQE_F_BUF_MORE across bundle recv retries (CVE-2026-53191)In the Linux kernel, the following vulnerability has been resolved:hv_netvsc: use kmap_local_page in netvsc_copy_to_send_buf (CVE-2026-53199)In the Linux kernel, the following vulnerability has been resolved:mm/memory-failure: fix hugetlb_lock AA deadlock in get_huge_page_for_hwpoison (CVE-2026-53207)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_tunnel: fix use-after-free on object destroy (CVE-2026-53212)In the Linux kernel, the following vulnerability has been resolved:ipv6: Fix a potential NPD in cleanup_prefix_route()addrconf_get_prefix_route() can return the fib6_null_entry sentinelentry which has a NULL fib6_table pointer. Therefore, before setting theroute''s expiration time, check that we are not working with this entry,as otherwise a NPD will be triggered [1].Note that the other callers of addrconf_get_prefix_route() are notsusceptible to this bug:1. addrconf_prefix_rcv(): Requests a route with the ''RTF_ADDRCONF |RTF_PREFIX_RT'' flags which are not set on fib6_null_entry.2. modify_prefix_route(): Fixed by commit a747e02430df ("ipv6: avoidpossible NULL deref in modify_prefix_route()").3. __ipv6_ifa_notify(): Calls ip6_del_rt() which specifically checks forfib6_null_entry and returns an error.[1]Oops: general protection fault, probably for non-canonical address 0xdffffc0000000006: 0000 [#1] SMP KASANKASAN: null-ptr-deref in range [0x0000000000000030-0x0000000000000037][...]Call Trace:<TASK>__kasan_check_byte (mm/kasan/common.c:573)lock_acquire.part.0 (kernel/locking/lockdep.c:5842 (discriminator 1))_raw_spin_lock_bh (kernel/locking/spinlock.c:182 (discriminator 1))cleanup_prefix_route (net/ipv6/addrconf.c:1280)ipv6_del_addr (net/ipv6/addrconf.c:1342)inet6_addr_del.isra.0 (net/ipv6/addrconf.c:3119)inet6_rtm_deladdr (net/ipv6/addrconf.c:4812)rtnetlink_rcv_msg (net/core/rtnetlink.c:6997)netlink_rcv_skb (net/netlink/af_netlink.c:2555)netlink_unicast (net/netlink/af_netlink.c:1344)netlink_sendmsg (net/netlink/af_netlink.c:1899)__sock_sendmsg (net/socket.c:802 (discriminator 4))____sys_sendmsg (net/socket.c:2698)___sys_sendmsg (net/socket.c:2752)__sys_sendmsg (net/socket.c:2784)do_syscall_64 (arch/x86/entry/syscall_64.c:63 arch/x86/entry/syscall_64.c:94)entry_SYSCALL_64_after_hwframe (arch/x86/entry/entry_64.S:121) (CVE-2026-53214)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_exthdr: fix register tracking for F_PRESENT flag (CVE-2026-53218)In the Linux kernel, the following vulnerability has been resolved:netfilter: x_tables: avoid leaking percpu counter pointers (CVE-2026-53219)In the Linux kernel, the following vulnerability has been resolved:netfilter: revalidate bridge ports (CVE-2026-53220)In the Linux kernel, the following vulnerability has been resolved:ip6_vti: fix incorrect tunnel matching in vti6_tnl_lookup() (CVE-2026-53221)In the Linux kernel, the following vulnerability has been resolved:net: guard timestamp cmsgs to real error queue skbs (CVE-2026-53223)In the Linux kernel, the following vulnerability has been resolved:sctp: fix uninit-value in __sctp_rcv_asconf_lookup() (CVE-2026-53225)In the Linux kernel, the following vulnerability has been resolved:net: openvswitch: fix possible kfree_skb of ERR_PTR (CVE-2026-53227)In the Linux kernel, the following vulnerability has been resolved:ipv6: sit: reload inner IPv6 header after GSO offloads (CVE-2026-53228)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: xsk: Fix DMA and xdp_frame leak on XDP_TX xmit failure (CVE-2026-53229)In the Linux kernel, the following vulnerability has been resolved:net/mlx5: Fix slab-out-of-bounds in mlx5_query_nic_vport_mac_list (CVE-2026-53230)In the Linux kernel, the following vulnerability has been resolved:net: phy: clean the sfp upstream if phy probing fails (CVE-2026-53232)In the Linux kernel, the following vulnerability has been resolved:netdev: fix double-free in netdev_nl_bind_rx_doit() (CVE-2026-53233)In the Linux kernel, the following vulnerability has been resolved:net: add pskb_may_pull() to skb_gro_receive_list() (CVE-2026-53235)In the Linux kernel, the following vulnerability has been resolved:tcp: restrict SO_ATTACH_FILTER to priv users (CVE-2026-53236)In the Linux kernel, the following vulnerability has been resolved:netlabel: validate unlabeled address and mask attribute lengths (CVE-2026-53238)In the Linux kernel, the following vulnerability has been resolved:xfrm: policy: fix use-after-free on inexact bin in xfrm_policy_bysel_ctx() (CVE-2026-53239)In the Linux kernel, the following vulnerability has been resolved:net/802/mrp: fix vector attribute parsing in mrp_pdu_parse_vecattr (CVE-2026-53245)In the Linux kernel, the following vulnerability has been resolved:ipv4: restrict IPOPT_SSRR and IPOPT_LSRR options (CVE-2026-53249)In the Linux kernel, the following vulnerability has been resolved:devlink: Release nested relation on devlink free (CVE-2026-53261)In the Linux kernel, the following vulnerability has been resolved:net/sched: act_api: use RCU with deferred freeing for action lifecycle (CVE-2026-53264)In the Linux kernel, the following vulnerability has been resolved:netfilter: bridge: make ebt_snat ARP rewrite writable (CVE-2026-53266)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_ct: bail out on template ct in get eval (CVE-2026-53267)In the Linux kernel, the following vulnerability has been resolved:netfilter: conntrack_irc: fix possible out-of-bounds read (CVE-2026-53268)In the Linux kernel, the following vulnerability has been resolved:netfilter: synproxy: add mutex to guard hook reference counting (CVE-2026-53269)In the Linux kernel, the following vulnerability has been resolved:ipvs: clear the svc scheduler ptr early on edit (CVE-2026-53270)In the Linux kernel, the following vulnerability has been resolved:erofs: fix use-after-free on sbi->sync_decompress (CVE-2026-53272)In the Linux kernel, the following vulnerability has been resolved:ipv6: mcast: Fix use-after-free when processing MLD queries (CVE-2026-53275)In the Linux kernel, the following vulnerability has been resolved:sched_ext: Don''t warn on NULL cgrp_moving_from in scx_cgroup_move_task() (CVE-2026-53328)In the Linux kernel, the following vulnerability has been resolved:net: bonding: fix NULL pointer dereference in bond_do_ioctl()In bond_do_ioctl(), slave_dev is obtained via __dev_get_by_name() whichcan return NULL if the requested interface name does not exist. However,the subsequent slave_dbg() call is placed before the NULL check:slave_dev = __dev_get_by_name(net, ifr->ifr_slave);slave_dbg(bond_dev, slave_dev, "slave_dev=%p:\n", slave_dev); //hereif (!slave_dev)return -ENODEV;The slave_dbg() macro expands to netdev_dbg(bond_dev, "(slave %s): " fmt,(slave_dev)->name, ...) which unconditionally dereferences slave_dev->namebefore the NULL check is performed. This results in a NULL pointerdereference kernel oops when a user calls bonding ioctl (e.g.SIOCBONDENSLAVE, SIOCBONDRELEASE, etc.) with a non-existent slaveinterface name.This is reachable from userspace via the bonding ioctl interface withCAP_NET_ADMIN capability, making it a potential local denial-of-servicevector.Fix by moving the slave_dbg() call after the NULL check. (CVE-2026-53337)In the Linux kernel, the following vulnerability has been resolved:KVM: Don''t WARN if memory is dirtied without a vCPU when the VM is dying (CVE-2026-53345)In the Linux kernel, the following vulnerability has been resolved:drm/virtio: Fix driver removal with disabled KMS (CVE-2026-53347)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_conntrack: destroy stale expectfn expectations on unregisterNAT helpers such as nf_nat_h323 store a raw pointer to module text inexp->expectfn (e.g. ip_nat_q931_expect). nf_ct_helper_expectfn_unregister()only unlinks the callback descriptor and never walks the expectation table,so an expectation pending at module removal survives with a danglingexp->expectfn into freed module text.When the expected connection arrives, init_conntrack() invokesexp->expectfn(), now a stale pointer into the unloaded module. Reproducedon a KASAN build by loading the H.323 helpers, creating a Q.931expectation, unloading nf_nat_h323, then connecting to the expected port:Oops: int3: 0000 [#1] SMP KASAN NOPTIRIP: 0010:0xffffffffa06102d1init_conntrack.isra.0 (net/netfilter/nf_conntrack_core.c:1862)nf_conntrack_in (net/netfilter/nf_conntrack_core.c:2049)ipv4_conntrack_local (net/netfilter/nf_conntrack_proto.c:223)nf_hook_slow (net/netfilter/core.c:619)__ip_local_out (net/ipv4/ip_output.c:120)__tcp_transmit_skb (net/ipv4/tcp_output.c:1715)tcp_connect (net/ipv4/tcp_output.c:4374)tcp_v4_connect (net/ipv4/tcp_ipv4.c:345)__sys_connect (net/socket.c:2167)Modules linked in: nf_conntrack_h323 [last unloaded: nf_nat_h323]Reaching the dangling state requires CAP_SYS_MODULE in the initial usernamespace to remove a NAT helper that still has live expectations, so thisis a robustness fix; leaving an expectation pointing at freed text is wrongregardless.Add nf_ct_helper_expectfn_destroy(), which walks the expectation table anddrops every expectation whose ->expectfn matches the descriptor being torndown. Call it from each NAT helper''s exit path after the existing RCU graceperiod, so no expectation outlives the code it points at and no extrasynchronize_rcu() is introduced. With the fix, the same reproducer runs tocompletion without the Oops. (CVE-2026-53349)In the Linux kernel, the following vulnerability has been resolved:signal: clear JOBCTL_PENDING_MASK for caller in zap_other_threads()When a multi-threaded process receives a stop signal (e.g., SIGSTOP),do_signal_stop() sets JOBCTL_STOP_PENDING and JOBCTL_STOP_CONSUME on allthreads and sets signal->group_stop_count to the number of threads. Ifone of the threads concurrently calls execve(), de_thread() invokeszap_other_threads() to kill all other threads. zap_other_threads()aborts the pending group stop by resetting signal->group_stop_count to 0and clears the JOBCTL_PENDING_MASK for all other threads. However, itfails to clear the job control flags for the calling thread.When execve() completes, the calling thread returns to user mode andchecks for pending signals. Seeing the stale JOBCTL_STOP_PENDING flag,it calls do_signal_stop(), which invokes task_participate_group_stop().Since JOBCTL_STOP_CONSUME is still set, it attempts to decrement thealready-zero signal->group_stop_count, triggering a warning:sig->group_stop_count == 0WARNING: CPU: 1 PID: 6475 at kernel/signal.c:373task_participate_group_stop+0x215/0x2d0Call Trace:<TASK>do_signal_stop+0x3be/0x5c0 kernel/signal.c:2619get_signal+0xa8c/0x1330 kernel/signal.c:2884arch_do_signal_or_restart+0xbc/0x840 arch/x86/kernel/signal.c:337exit_to_user_mode_loop+0x8c/0x4d0 kernel/entry/common.c:98do_syscall_64+0x33e/0xf80 arch/x86/entry/syscall_64.c:100entry_SYSCALL_64_after_hwframe+0x77/0x7f</TASK>Fix this race condition by clearing the JOBCTL_PENDING_MASK for thecalling thread in zap_other_threads(), ensuring it does not retain anystale job control state after the thread group is destroyed. This alignswith other functions that tear down a thread group and abort groupstops, such as zap_process() and complete_signal(), which correctlyclear these flags for all threads including the current one. (CVE-2026-53352)In the Linux kernel, the following vulnerability has been resolved:arm64: errata: Mitigate TLBI errata on various Arm CPUsA number of CPUs developed by Arm suffer from errata whereby a broadcastTLBI;DSB sequence may complete before the global observation of writeswhich are translated by an affected TLB entry.These errata ONLY affect the completion of memory accesses which havebeen translated by an invalidated TLB entry, and these errata DO NOTaffect the actual invalidation of TLB entries. TLB entries are removedcorrectly.This issue has been assigned CVE ID CVE-2025-10263.To mitigate this issue, Arm recommends that software follows anyaffected TLBI;DSB sequence with an additional TLBI;DSB, which willensure that all memory write effects affected by the first TLBI havebeen globally observed. The additional TLBI can use any operation thatis broadcast to affected CPUs, and the additional DSB can use any optionthat is sufficient to complete the additional TLBI.The ARM64_WORKAROUND_REPEAT_TLBI workaround is sufficient to mitigatethe issue. Enable this workaround for affected CPUs, and update thesilicon errata documentation accordingly.Note that due to the manner in which Arm develops IP and tracks errata,some CPUs share a common erratum number. (CVE-2026-53354)In the Linux kernel, the following vulnerability has been resolved:drm/i915/gem: Fix phys BO pread/pwrite with offset (CVE-2026-53356)'
