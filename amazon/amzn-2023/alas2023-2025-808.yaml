# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Starting in Python 3.12.0, the asyncio._SelectorSocketTransport.writelines()method would not "pause" writing and signal to the Protocol to drainthe buffer to the wire once the write buffer reached the "high-watermark". Because of this, Protocols would not periodically drain the writebuffer potentially leading to memory exhaustion.Thisvulnerability likely impacts a small number of users, you must be usingPython 3.12.0 or later, on macOS or Linux, using the asyncio modulewith protocols, and using .writelines() method which had newzero-copy-on-write behavior in Python 3.12.0 and later. If not all ofthese factors are true then your usage of Python is unaffected. (CVE-2024-12254)A vulnerability has been found in the CPython `venv` module and CLI where path names provided when creating a virtual environment were not quoted properly, allowing the creator to inject commands into virtual environment "activation" scripts (ie "source venv/bin/activate"). This means that attacker-controlled virtual environments are able to run commands when the virtual environment is activated. Virtual environments which are not created by an attacker or which aren't activated before being used (ie "./venv/bin/python") are not affected. (CVE-2024-9287)
