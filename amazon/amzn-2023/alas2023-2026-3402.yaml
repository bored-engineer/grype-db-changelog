e threadsvia a per-net freeme queue, preventing the shrinker and GC worker frombearing the cost of closing files (see ffb402596147).  However, thequeue lives in a separately-allocated struct nfsd_fcache_disposal thatis freed by nfsd_free_fcache_disposal_net() during per-net teardown.The global shrinker, laundrette, and fsnotify callbacks can still beinside nfsd_file_dispose_list_delayed() dereferencing that pointer,causing a use-after-free.Inline the spinlock and freeme list directly into struct nfsd_net (asfcache_dispose_lock and fcache_dispose_list), eliminating the separatelyallocated struct nfsd_fcache_disposal entirely.  These fields now havethe same lifetime as the net namespace itself, so there is no danglingpointer to chase.nfsd_file_cache_start_net() now just initializes the inline fields andcannot fail due to allocation.  nfsd_file_cache_shutdown_net() drainsthe inline list directly instead of freeing a separate struct.  Thealloc/free helpers are removed. (CVE-2026-89682)In the Linux kernel, the following vulnerability has been resolved:nfsd: restore rq_status_counter to even on all nfsd_dispatch() exit paths (CVE-2026-89705)In the Linux kernel, the following vulnerability has been resolved:lockd, nfsd: RCU-protect nlmsvc_ops dispatch (CVE-2026-89709)In the Linux kernel, the following vulnerability has been resolved:mm/mglru: fix and remove redundant unevictable folio handling (CVE-2026-89757)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: vgic-v3: take an LPI reference in vgic_v3_save_pending_tables (CVE-2026-89913)In the Linux kernel, the following vulnerability has been resolved:mm/huge_memory: transfer the pmd dirty bit to the folio on zap (CVE-2026-89987)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: skip double clone set expressions on element insert (CVE-2026-90061)In the Linux kernel, the following vulnerability has been resolved:xsk: honor XDP_TX_METADATA in zero-copy path (C