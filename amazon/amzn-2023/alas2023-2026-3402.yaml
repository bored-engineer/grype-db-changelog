efore css_rstat_cpu() accesscss_rstat_updated() is exposed as a BPF kfunc and accepts acaller-provided cpu argument. The function uses cpu for per-cpu rstatlookups without checking whether it refers to a valid possible CPU.A BPF iter/cgroup program with CAP_BPF and CAP_PERFMON can pass aninvalid cpu value. On an unfixed UBSCAN_BOUNDS test kernel, cpu ==0x7fffffff triggers:UBSAN: array-index-out-of-bounds in kernel/cgroup/rstat.c:31:9index 2147483647 is out of range for type ''long unsigned int [64]''Call Trace:css_rstat_updatedbpf_iter_run_progcgroup_iter_seq_showbpf_seq_readAdd cpu validation to the BPF-facing css_rstat_updated() kfunc andmove the common implementation to __css_rstat_updated() for in-kernelcallers. (CVE-2026-64036)In the Linux kernel, the following vulnerability has been resolved:netfs: Fix leak of request in netfs_write_begin() error handlingFix netfs_write_begin() to not leak our ref on the request in the event that we get an error from netfs_wait_for_read(). (CVE-2026-64060)In the Linux kernel, the following vulnerability has been resolved:netfilter: bridge: eb_tables: close module init race (CVE-2026-64076)In the Linux kernel, the following vulnerability has been resolved:erofs: fix metabuf leak in inode xattr initialization (CVE-2026-64146)In the Linux kernel, the following vulnerability has been resolved:netfs: Fix zeropoint update where i_size > remote_i_size (CVE-2026-64159)In the Linux kernel, the following vulnerability has been resolved:net: team: fix NULL pointer dereference in team_xmit during mode change (CVE-2026-64190)In the Linux kernel, the following vulnerability has been resolved:smb/client: fix chown/chgrp with SMB3 POSIX Extensions (CVE-2026-64388)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Unconditionally recompute CR8 intercept on PPR update (CVE-2026-64513)In the Linux kernel, the following vulnerability has been resolved:KVM: nVMX: Put vmcs12 pages if nested VM-Enter fails due to invalid gu