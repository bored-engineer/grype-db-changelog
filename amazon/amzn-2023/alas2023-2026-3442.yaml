Vulnerability:
    Description: "A flaw was found in QEMU's websocket I/O channel (QIOChannelWebsock in io/channel-websock.c). The websocket server reads encoded data from a connected client into an input buffer and decodes it into a separate buffer, but the size limit is enforced only on the encoded-input buffer and not on the decoded-input buffer. A client that connects to a QEMU websocket endpoint â\x80\x94 such as a VNC server or a character-device socket backend configured with websocket=on â\x80\x94 and sends data that is not consumed can cause the decoded-input buffer to grow without bound, exhausting host memory and leading to a denial of service. (CVE-2026-101291)hw/usb/hcd-xhci: More reentrancy guard fixes for the XHCI code (CVE-2026-111819)A use-after-free flaw was found in the OHCI USB host controller emulation (hw/usb/hcd-ohci.c) in QEMU. When an isochronous transfer descriptor is directed at a non-isochronous endpoint, ohci_service_iso_td() can free a heap-allocated USBPacket while a pending asynchronous transfer still holds a reference to it; that reference is later dereferenced when the transfer completes. A malicious guest able to program the emulated OHCI controller can use this to crash the QEMU process on the host (denial of service) and potentially execute arbitrary code in the context of the QEMU process. The issue is fixed in QEMU 11.1.3 and 10.0.15. (CVE-2026-7180)"
