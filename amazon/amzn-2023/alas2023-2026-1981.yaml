# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A use-after-free / double-free in c-ares' query-completion handling. Thesame flaw -- a query's callback being invoked while the query is stilllinked in the channel's internal lookup structures -- is present atmultiple points in the resend/finish path (timeout handling, responsehandling, and query dispatch). If the query, or for `ares_getaddrinfo()`the owning `host_query`, is freed as a side effect of that callback, itis then accessed and/or freed a second time. (CVE-2026-33630)
