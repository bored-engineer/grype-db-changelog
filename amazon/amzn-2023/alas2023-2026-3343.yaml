Vulnerability:
    Description: 'Due to security concerns regarding a small set of intermediate certificates issued by a specific Certificate Authority (CA), the Go''s crypto/x509 package is updated to not trust certificates issued by the affected intermediate certificates. This would prevent possible future misuse of certificate issued by the affected intermediate certificates.Amazon Linux golang-based packages are being rebuilt with the fixed crypto/x509 package described in CVE-2026-111943 as a defense-in-depth measure against the eMudhra intermediate CA certificates with weak private keys.By default, Go programs on Amazon Linux use the system-wide certificate authority (CA) store. Therefore, the primary fix for this issue is the ca-certificates update that removes the root CA certificates that signed the affected intermediates. Customers should ensure that update is installed: https://explore.alas.aws.amazon.com/CVE-2026-113470.html (CVE-2026-111943)'
    FixedIn:
        - Available:
            Date: "2026-10-30"
            Kind: advisory
          Name: runfinch-finch
          NamespaceName: amzn:2023
          Version: 1.19.0-1.amzn2023.0.3
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2026-3343.html
    Metadata:
        CVE:
            - Name: CVE-2026-111943
    Name: ALAS2023-2026-3343
    NamespaceName: amzn:2023
    Severity: Medium
