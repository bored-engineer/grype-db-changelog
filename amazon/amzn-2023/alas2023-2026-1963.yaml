Vulnerability:
    Description: When using the "configparser" module to write configuration filescontaining multi-line text values with carriage return characters (\r) theresulting file could be injected with unexpected keys and values if theattacker controls the written value. (CVE-2026-0864)tarfile.extractall() with the 'data' or 'tar'filter could be bypassed by a crafted archive where a hardlinkreferences a symlink stored at a deeper name than the hardlink itself.The extraction fallback validated the symlink at it's archived locationbut recreated it at the hardlink's shallowerpath, letting a relativetarget the filter judged contained escape the destination directory.This allowed a malicious tar archive to create a symlink pointingoutside the destination, enabling out-of-destination file reads orwrites. This was an incomplete fix of CVE-2025-4330. (CVE-2026-11940)When using the "tarfile" module with a file opened in "streaming mode" (mode="r|") the tarfile module did not properly handle EOF, making archive parsing take exponentially longer. (CVE-2026-11972)unicodedata.normalize() can take excessive CPU time when processing specially crafted Unicode input containing long runs of combining characters with alternating Canonical Combining Class values. This affects all normalization forms. (CVE-2026-3276)bz2.BZ2Decompressor objects could be reused after a decompression error. If an application caught the resulting OSError and retried with the same decompressor, crafted input could cause the decompressor to resume from an invalid internal state and perform out-of-bounds writes to a stack buffer. This could crash the process when processing untrusted data. (CVE-2026-9669)
