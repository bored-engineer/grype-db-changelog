Vulnerability:
    Description: 'When use-git-am: true is enabled for a patch source, flatpak-builder invokes git am without disabling git hooks. A malicious source can include a post-applypatch hook, which will be executed automatically when a patch with use-git-am: true is applied. Since git itself runs unsandboxed in host context at this stage, the hook is executed with host privileges, allowing arbitrary code execution on the host. (CVE-2026-86320)'
    FixedIn:
