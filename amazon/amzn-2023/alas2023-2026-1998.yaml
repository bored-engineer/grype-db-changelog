Vulnerability:
    Description: CR/LF bytes were not rejected by HTTP client proxy tunnel headers or host. (CVE-2026-1502)The incremental HTML parser (html.parser.HTMLParser) allows for CPUdenial-of-service through repeated unterminated markup declarations whenprocessing uncontrolled data. (CVE-2026-15308)In the Tarfile.extract() function, the filter parameter is not passed properly when extracting hardlinks. An affected system that extracts content from untrusted tar files could end up writing files with an unexpected uid/gid despite the user passing filter='data' to the extract() function. (CVE-2026-4360)
