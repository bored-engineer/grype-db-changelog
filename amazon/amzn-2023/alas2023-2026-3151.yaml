Vulnerability:
    Description: 'Improper Access Control, Incorrect Authorization vulnerability in Apache Tomcat leads to security constraint bypass if a constraint for a longer path is specified before a more restrictive constraint for a shorter sub-path.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1 through 9.0.120, from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109.Users are recommended to upgrade to version 11.0.25, 10.1.58, 9.0.121, which fixes the issue. (CVE-2026-65182)Time-of-check Time-of-use (TOCTOU) Race Condition vulnerability in Apache Tomcat when creating unix domain sockets allows an unauthorised local user to access the unix domain socket.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.42 through 9.0.120.Users are recommended to upgrade to version 11.0.25, 10.1.58, 9.0.121, which fixes the issue. (CVE-2026-65183)Improper Input Validation vulnerability in Apache Tomcat due to incomplete fix for CVE-2026-32990.This issue affects Apache Tomcat: from 11.0.20 through 11.0.24, from 10.1.53 through 10.1.57, from 9.0.115 through 9.0.120.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which fix the issue. (CVE-2026-65637)Authentication Bypass by Capture-replay vulnerability in Apache Tomcat''s DIGEST authenticator. If, before windowSize requests have been made, a client makes a DIGESTauthenticated request with a nonceCount on the upper boundary of thereplay window then that request is replayable once only while theassociated nonceCount remains within the replay window.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1 through 9.0.120.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.0 through 8.5.100, from 7.0.30 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which fix the issue. (CVE-2026-65905)Off-by-one Error vulnerability in Apache Tomcat impacting the [N] flag on the rewrite valves causes rewrite processing to restart at the second rule rather than the first rule.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1 through 9.0.120.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.0 through 8.5.100. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121 which fix the issue. (CVE-2026-65927)Improper Authorization vulnerability in Apache Tomcat cause by security-role-ref definitions being incorrectly used as role aliases within the Realm in additional to the correct usage with Request.isUserInRole().This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.25 through 9.0.120.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.46 through 8.5.100, from 7.0.97 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which fix the issue. (CVE-2026-66422)Incorrect Authorization vulnerability in Apache Tomcat''s FORM authentication process allows the bypassing of a security constraint that limits user has access to a resource POST but not GET.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1 through 9.0.120.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which fixes the issue. (CVE-2026-68525)Improper Authentication vulnerability in Apache Tomcat meant that in some circumstances (e.g. CLIENT-CERT, SPNEGO) that a user would be authenticated even if the user did not exist in the DataSourceRealm.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1 through 9.0.120.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which fix the issue. (CVE-2026-68569)Uncontrolled Resource Consumption vulnerability in Apache Tomcat via an allocation leak in the HTTP/2 backlog tracking when a stream is resetThis issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.39 through 9.0.120.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.59 through 8.5.100. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which fix the issue. (CVE-2026-68763)Insufficient Session Expiration vulnerability in Apache Tomcat meant that if the session ID for an authenticated HTTP session was changed after a WebSocket connection had been established under that authenticated HTTP session, the WebSokcet session would not be closed as required by the Jakarta WebSocket specification when the HTTP session ended.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.24, from 10.1.0-M1 through 10.1.57, from 9.0.0.M1 through 9.0.120.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.0 through 8.5.100, from 7.0.43 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.25, 10.1.58 or 9.0.121, which fix the issue. (CVE-2026-73180)Improper Check for Certificate Revocation vulnerability in Apache Tomcat. Both the OpenSSL and OpenSSL-FFM TLS implementations ignore CRLs when certificate uses a keystore.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.58, from 9.0.0-M1 through 9.0.121.The following versions were EOL at the time the CVE was created but are known to be affected: from 8.5.0 through 8.5.100. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.59, 9.0.122, which fixes the issue. (CVE-2026-73581)Improper Authentication vulnerability in Apache Tomcat. When Jakarta Authentication was configured with SimpleAuthConfigProvider as the default provider and multiple web application used that provider, the realm for the first web application to authenticate a request would be used for all web applications.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.0.M4 through 9.0.121.The following versions were EOL at the time the CVE was created but are known to be affected: from 8.5.0 through 8.5.100. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60, 9.0.122, which fixes the issue. (CVE-2026-75973)Authentication Bypass by Alternate Name vulnerability in Apache Tomcat allowed the security constraints for any WebSocket endpoint to be bypassed.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.0.M1 through 9.0.121.The following versions were EOS at the time the CVE was created but areknown to be affected: from 8.5.0 through 8.5.100, from 7.0.43 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-76183)Inconsistent Interpretation of HTTP Requests (''HTTP Request/Response Smuggling'') vulnerability in Apache Tomcat caused by processing the transfer-encoding header for an HTTP/1.0 request may allow an attacker to cause one request from another user to fail when Tomcat is located behind a reverse proxy.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.47 through 9.0.121.The following versions were EOL at the time the CVE was created but are known to be affected: from 8.5.67 through 8.5.100. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-77756)Concurrent Execution using Shared Resource with Improper Synchronization (''Race Condition'') vulnerability in Apache Tomcat allows an attacker to inject trailer fields into another HTTP/2 request.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.39 through 9.0.121.The following versions were EOL at the time the CVE was created but areknown to be affected: from 8.5.59 through 8.5.100. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60, 9.0.122, which fix the issue. (CVE-2026-77762)Uncontrolled Resource Consumption vulnerability in Apache Tomcat during sending of WebSocket close message enabled a DoS attack.This issue affects Apache Tomcat: from 11.0.0-M5 through 11.0.25, from 10.1.8 through 10.1.59, from 9.0.74 through 9.0.121.The following versions were EOL at the time the CVE was created but are known to be affected: from 8.5.88 through 8.5.100. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-77791)Allocation of resources without limits or throttling vulnerability in Apache Tomcat allows an unauthenticated AJP request to pin an AJP processing thread leading to denial of service.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.0.M1 through 9.0.121.The following versions were EOL at the time the CVE was created but are known to be affected: from 8.5.0 through 8.5.100, from 7.0.0 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-78383)Incomplete cleanup vulnerability in Apache Tomcat allows a malformed request to potentially (depends on timing) cause one request from another user to fail.This issue affects Apache Tomcat: from 11.0.19 through 11.0.25, from 10.1.53 through 10.1.59, from 9.0.116 through 9.0.121.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-78437)Missing release of resource after effective lifetime, Comparison using wrong factors vulnerability in Apache Tomcat allows a denial of service as a result of lost time outs for asynchronous WebSocket writes.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.0.M1 through 9.0.121.The following versions were EOL at the time the CVE was created but are known to be affected: from 8.5.0 through 8.5.100, from 7.0.43 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-79677)CLIENT_CERT authentication does not fail as expected for some scenarios when soft fail is disabled vulnerability in Apache Tomcat.This issue affects Apache Tomcat: from 11.0.0-M14 through 11.0.25, from 10.1.22 through 10.1.59, from 9.0.92 through 9.0.121.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-86248)Inconsistent interpretation of HTTP/2 requests (''HTTP Request/Response smuggling'') vulnerability in Apache Tomcat caused by a regression in fix for CVE-2026-41293 can trigger request header mix-up.This issue affects Apache Tomcat: from 11.0.22 through 11.0.25, from 10.1.55 through 10.1.59, from 9.0.118 through 9.0.121.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.0.122, which fix the issue. (CVE-2026-86350)Improper handling of length parameter inconsistency vulnerability in Apache Tomcat allows WebSocket message smuggling when per-message-deflate is used.This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.25, from 10.1.0-M1 through 10.1.59, from 9.0.0.M1 through 9.0.121.The following versions were EOS at the time the CVE was created but are known to be affected: from 8.5.0 through 8.5.100, from 7.0.56 through 7.0.109. Other unsupported versions may also be affected.Users are recommended to upgrade to version 11.0.26, 10.1.60 or 9.1.22, which fix the issue. (CVE-2026-87022)'
