Vulnerability:
    Description: url.c in GNU Wget through 1.24.5 mishandles semicolons in the userinfo subcomponent of a URI, and thus there may be insecure behavior in which data that was supposed to be in the userinfo subcomponent is misinterpreted to be part of the host subcomponent. (CVE-2024-38428)
    FixedIn:
        - Name: wget
          NamespaceName: amzn:2023
          Version: 1.21.3-1.amzn2023.0.4
          VersionFormat: rpm
        - Name: wget-debuginfo
          NamespaceName: amzn:2023
          Version: 1.21.3-1.amzn2023.0.4
          VersionFormat: rpm
        - Name: wget-debugsource
          NamespaceName: amzn:2023
          Version: 1.21.3-1.amzn2023.0.4
          VersionFormat: rpm
