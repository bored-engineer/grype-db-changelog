Vulnerability:
    Description: RAOP module accepts unbounded Content-Length values and does not check the pw_array_add() return. (CVE-2026-14324)Multiple unbounded alloca() calls in the PulseAudio protocol server. (CVE-2026-14330)A flaw was found in PipeWire, a multimedia server. This vulnerability allows an attacker to escape sandboxed applications, such as Flatpak, by exploiting PipeWire's PulseAudio compatibility layer. An attacker with minimal permissions within a sandboxed environment can load a malicious library, leading to arbitrary code execution outside the sandbox and potential compromise of the user's system. (CVE-2026-5674)
