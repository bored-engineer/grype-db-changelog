Vulnerability:
    Description: Header parser of `http` stream wrapper does not handle folded headers. (CVE-2025-1217)When requesting a HTTP resource using the DOM or SimpleXML extensions, the wrong content-type header is used to determine the charset when the requested resource performs a redirect. (CVE-2025-1219)Streams HTTP wrapper does not fail for headers with invalid name and no colon. (CVE-2025-1734)Stream HTTP wrapper header check might omit basic auth header. (CVE-2025-1736)Stream HTTP wrapper truncate redirect location to 1024 bytes (CVE-2025-1861)
