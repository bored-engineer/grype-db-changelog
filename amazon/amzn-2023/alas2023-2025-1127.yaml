# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: jackson-core contains core low-level incremental ("streaming") parser and generator abstractions used by Jackson Data Processor. In versions prior to 2.15.0, if a user parses an input file and it has deeply nested data, Jackson could end up throwing a StackoverflowError if the depth is particularly large. jackson-core 2.15.0 contains a configurable limit for how deep Jackson will traverse in an input document, defaulting to an allowable depth of 1000. jackson-core will throw a StreamConstraintsException if the limit is reached. jackson-databind also benefits from this change because it uses jackson-core to parse JSON inputs. As a workaround, users should avoid parsing input files from untrusted sources. (CVE-2025-52999)
    FixedIn:
        - Available:
            Date: "2025-08-08"
            Kind: advisory
          Name: jackson-core
          NamespaceName: amzn:2023
          Version: 2.16.1-4.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2025-1127.html
