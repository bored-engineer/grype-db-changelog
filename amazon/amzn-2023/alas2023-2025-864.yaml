    Description: 'In the Linux kernel, the following vulnerability has been resolved:xfs: fix log recovery buffer allocation for the legacy h_size fixup (CVE-2024-39472)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: prefer nft_chain_validate (CVE-2024-41042)In the Linux kernel, the following vulnerability has been resolved:scsi: mpi3mr: Sanitise num_phys (CVE-2024-42159)In the Linux kernel, the following vulnerability has been resolved:mm: huge_memory: use !CONFIG_64BIT to relax huge page alignment on 32 bit machines (CVE-2024-42258)In the Linux kernel, the following vulnerability has been resolved:drm/i915/gem: Fix Virtual Memory mapping boundaries calculation (CVE-2024-42259)In the Linux kernel, the following vulnerability has been resolved:net/mlx5: Fix missing lock on sync reset reload (CVE-2024-42268)In the Linux kernel, the following vulnerability has been resolved:RDMA/iwcm: Fix a use-after-free related to destroying CM IDs (CVE-2024-42285)In the Linux kernel, the following vulnerability has been resolved:PCI/DPC: Fix use-after-free on concurrent DPC and hot-removal (CVE-2024-42302)In the Linux kernel, the following vulnerability has been resolved:PCI: keystone: Fix NULL pointer dereference in case of DT error in ks_pcie_setup_rc_app_regs() (CVE-2024-43823)In the Linux kernel, the following vulnerability has been resolved:perf: Fix event leak upon exec and file release (CVE-2024-43869)In the Linux kernel, the following vulnerability has been resolved:perf: Fix event leak upon exit (CVE-2024-43870)In the Linux kernel, the following vulnerability has been resolved:devres: Fix memory leakage caused by driver API devm_free_percpu() (CVE-2024-43871)In the Linux kernel, the following vulnerability has been resolved:vhost/vsock: always initialize seqpacket_allow (CVE-2024-43873)In the Linux kernel, the following vulnerability has been resolved:exec: Fix ToCToU between perm check and set-uid/gid usage (CVE-2024-43882)In the Linux kernel, the following vulnerability has been resolved:net: bridge: mcast: wait for previous gc cycles when removing port (CVE-2024-44934)In the Linux kernel, the following vulnerability has been resolved:netfilter: ctnetlink: use helper function to calculate expect ID (CVE-2024-44944)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_set_pipapo: fix initial map fill (CVE-2024-57947)'
