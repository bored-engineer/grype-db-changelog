Vulnerability:
    Description: 'Improper neutralization of input during web page generation (''cross-site scripting'') vulnerability in Apache Commons BCEL.This only happens when you''re using Class2HTML to generate webpages for possibly-attacker-controlled class files, where Class2HTML emitters write attacker class-file strings into HTML unescaped (stored XSS in reports).This issue affects Apache Commons BCEL: before 6.13.0.Users are recommended to upgrade to version 6.13.0, which fixes the issue. (CVE-2026-105111)Symbolic name not mapping to correct object vulnerability in Apache Commons.BCEL caches attacker-controlled classes under their self-declared names without validating the requested name, allowing subsequent lookups and name-keyed verification results to refer to a different class.This issue affects Apache Commons: before 6.13.0.Users are recommended to upgrade to version 6.13.0, which fixes the issue. (CVE-2026-94114)'
