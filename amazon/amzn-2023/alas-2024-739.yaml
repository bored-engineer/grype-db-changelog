# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: 'eventlet before 0.35.2, as used in dnspython before 2.6.0, allows remote attackers to interfere with DNS name resolution by quickly sending an invalid packet from the expected IP address and source port, aka a "TuDoor" attack. In other words, dnspython does not have the preferred behavior in which the DNS name resolution algorithm would proceed, within the full time window, in order to wait for a valid packet. NOTE: dnspython 2.6.0 is unusable for a different reason that was addressed in 2.6.1. (CVE-2023-29483)'
    FixedIn:
        - Name: python-dns
          NamespaceName: amzn:2023
          Version: 2.1.0-3.amzn2023.0.4
          VersionFormat: rpm
        - Name: python3-dns
          NamespaceName: amzn:2023
          Version: 2.1.0-3.amzn2023.0.4
          VersionFormat: rpm
        - Name: python3-dns+dnssec
          NamespaceName: amzn:2023
          Version: 2.1.0-3.amzn2023.0.4
          VersionFormat: rpm
        - Name: python3-dns+idna
          NamespaceName: amzn:2023
          Version: 2.1.0-3.amzn2023.0.4
          VersionFormat: rpm
