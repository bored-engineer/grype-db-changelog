ility has been resolved:PM: runtime: Fix a race condition related to device removal (CVE-2026-23452)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_conntrack_h323: check for zero length in DecodeQ931() (CVE-2026-23455)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_conntrack_h323: fix OOB read in decode_int() CONS case (CVE-2026-23456)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_conntrack_sip: fix Content-Length u32 truncation in sip_help_tcp() (CVE-2026-23457)In the Linux kernel, the following vulnerability has been resolved:netfilter: ctnetlink: fix use-after-free in ctnetlink_dump_exp_ct() (CVE-2026-23458)In the Linux kernel, the following vulnerability has been resolved:btrfs: log new dentries when logging parent dir of a conflicting inode (CVE-2026-23465)In the Linux kernel, the following vulnerability has been resolved:spi: fix statistics allocation (CVE-2026-23475)In the Linux kernel, the following vulnerability has been resolved:spi: fix use-after-free on controller registration failure (CVE-2026-31389)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix krb5 mount with username option (CVE-2026-31392)In the Linux kernel, the following vulnerability has been resolved:nvdimm/bus: Fix potential use after free in asynchronous initialization (CVE-2026-31399)In the Linux kernel, the following vulnerability has been resolved:sunrpc: fix cache_request leak in cache_release (CVE-2026-31400)In the Linux kernel, the following vulnerability has been resolved:HID: bpf: prevent buffer overflow in hid_hw_request (CVE-2026-31401)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix heap overflow in NFSv4.0 LOCK replay cache (CVE-2026-31402)In the Linux kernel, the following vulnerability has been resolved:NFSD: Hold net reference for the lifetime of /proc/fs/nfs/exports fd (CVE-2026-31403)In the Linux kernel, the follow