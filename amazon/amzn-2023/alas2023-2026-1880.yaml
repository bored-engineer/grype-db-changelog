Vulnerability:
    Description: 'Use After Free vulnerability in Apache HTTP Server with mod_ldap in per-directory configurationThis issue affects Apache HTTP Server: from 2.4.0 through 2.4.67.Users are recommended to upgrade to version 2.4.68, which fixes the issue. (CVE-2026-29167)A cross-site scripting vulnerability exists in mod_proxy_ftp''s HTML directory list generation in Apache HTTP Server 2.4.67 and earlier when listing FTP directory contents either via forward or reverse proxy configuration.Users are recommended to upgrade to version 2.4.68, which fixes this issue. (CVE-2026-29170)A buffer overflow in mod_proxy_html in Apache HTTP Server 2.4.67 and earlier allows an attack by an untrusted backend.Users are recommended to upgrade to version 2.4.68, which fixes this issue. (CVE-2026-34355)Heap-based Buffer Overflow vulnerability in Apache HTTP Server with malicious backend servers and ProxyPassReverseCookie*This issue affects Apache HTTP Server: from 2.4.0 through 2.4.67.Users are recommended to upgrade to version 2.4.68, which fixes the issue. (CVE-2026-34356)A path handling issue in mod_dav_fs in Apache 2.4.67 and earlier allows a WebDAV content author to directly manipulate trusted DAV property databases, potentially causing child process crashes.Users are recommended to upgrade to version 2.4.68, which fixes this issue. (CVE-2026-42535)Heap-based Buffer Overflow vulnerability in Apache HTTP Server with mod_xml2enc, xml2StartParse, and untrusted contentThis issue affects Apache HTTP Server: from 2.4.0 through 2.4.67.Users are recommended to upgrade to version 2.4.68, which fixes the issue. (CVE-2026-42536)Out-of-bounds Read vulnerability in Apache HTTP Server with mod_headers and mod_mime and multiple response languages.This issue affects Apache HTTP Server: from 2.4.0 through 2.4.67. (CVE-2026-43951)Improper Privilege Management vulnerability in Apache HTTP Server 2.4.67 and earlier allows local .htaccess authors to read files with the privileges of the httpd user.This issue affects Apache HTTP Server: from through 2.4.67.Users are recommended to upgrade to version 2.4.68, which fixes the issue. (CVE-2026-44119)Buffer Over-read vulnerability in Apache HTTP Server via outbound OCSP requests to an attacker controlled OCSP serverThis issue affects Apache HTTP Server: from 2.4.0 through 2.4.67.Users are recommended to upgrade to version 2.4.68, which fixes the issue. (CVE-2026-44185)Loop with Unreachable Exit Condition (''Infinite Loop'') vulnerability in the mod_proxy_ftp module in Apache HTTP Server with an attacker controlled backend FTP server.This issue affects undefined: from 2.4.0 through 2.4.67.Users are recommended to upgrade to version 2.4.68, which fixes the issue. (CVE-2026-44186)Buffer Underwrite vulnerability in Apache HTTP Server on crafted regular expressions in the configuration.This issue affects Apache HTTP Server: from 2.4.0 through 2.4.67.Users are recommended to upgrade to version 2.4.68, which fixes the issue. (CVE-2026-44631)'
