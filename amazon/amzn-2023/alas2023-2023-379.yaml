    Description: '2024-06-06: CVE-2021-20309 was added to this advisory.A flaw was found in ImageMagick, where a division by zero in WaveImage() of MagickCore/visual-effects.c may trigger undefined behavior via a crafted image file submitted to an application using ImageMagick. The highest threat from this vulnerability is to system availability. (CVE-2021-20309)A vulnerability was found in ImageMagick where heap use-after-free was found in coders/bmp.c. (CVE-2023-5341)'
