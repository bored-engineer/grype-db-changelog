Vulnerability:
    Description: Amazon Corretto has been updated to , which includes fixes for security issues in the JDK. See the Corretto release notes for details.A memory-corruption vulnerability exists in the OpenJDK Base64 decoder affecting OpenJDK 17.0.6 and later on x86-64 systems with specific CPU capabilities. ARM64 systems are not affected. Depending on the deployment context, exploitation could result in a JVM crash for unauthenticated users or, in certain application environments, code execution by an authenticated low-privileged user. Oracle has issued a patch covering versions 17, 21, 25, and 27. (CVE-2026-114938)
