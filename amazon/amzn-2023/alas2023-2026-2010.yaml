# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Incorrect implementation of authentication algorithm in ASP.NET Core allows an authorized attacker to elevate privileges over a network. (CVE-2026-47300)Allocation of resources without limits or throttling in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-47302)Authentication bypass by assumed-immutable data in ASP.NET Core allows an authorized attacker to elevate privileges over a network. (CVE-2026-47303)Improper verification of cryptographic signature in .NET allows an unauthorized attacker to bypass a security feature over a network. (CVE-2026-47304)Improper validation of specified type of input in .NET Framework allows an unauthorized attacker to deny service over a network. (CVE-2026-50524)Allocation of resources without limits or throttling in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-50525)Improper link resolution before file access ('link following') in .NET allows an authorized attacker to perform tampering locally. (CVE-2026-50526)Stack-based buffer overflow in .NET Framework allows an unauthorized attacker to deny service over a network. (CVE-2026-50527)Incorrect authorization in .NET allows an unauthorized attacker to bypass a security feature over a network. (CVE-2026-50528)Protection mechanism failure in .NET Framework allows an unauthorized attacker to execute code locally. (CVE-2026-50646)Allocation of resources without limits or throttling in .NET Framework allows an unauthorized attacker to deny service over a network. (CVE-2026-50648)Deserialization of untrusted data in .NET allows an unauthorized attacker to execute code locally. (CVE-2026-50649)Improper control of generation of code ('code injection') in .NET Framework allows an unauthorized attacker to elevate privileges locally. (CVE-2026-50650)Allocation of resources without limits or throttling in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-50651)Allocation of resources without limits or throttling in ASP.NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-56170)Access of resource using incompatible type ('type confusion') in .NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-57108)
