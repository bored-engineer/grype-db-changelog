Vulnerability:
    Description: Improper control of generation of code ('code injection') in ASP.NET Core allows an unauthorized attacker to execute code over a network. (CVE-2026-102870)Allocation of resources without limits or throttling in ASP.NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-109468)A vulnerability in the Node.js Brotli decoder can result in an out-of-bounds memory write when processing crafted Brotli input. Successful exploitation may lead to memory corruption and remote code execution. (CVE-2026-111497)Incorrect default permissions in ASP.NET Core allows an authorized attacker to elevate privileges locally. (CVE-2026-114148)Uncontrolled recursion in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-58280)Inefficient algorithmic complexity in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-69651)Out-of-bounds write in .NET Framework allows an unauthorized attacker to execute code over a network. (CVE-2026-70007)Allocation of resources without limits or throttling in ASP.NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-70159)Improper authentication in ASP.NET Core allows an unauthorized attacker to elevate privileges over a network. (CVE-2026-70175)Authentication bypass by spoofing in ASP.NET Core allows an authorized attacker to elevate privileges over a network. (CVE-2026-70179)Allocation of resources without limits or throttling in ASP.NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-70181)Concurrent execution using shared resource with improper synchronization ('race condition') in ASP.NET Core allows an authorized attacker to elevate privileges over a network. (CVE-2026-70183)Deadlock in ASP.NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-70186)Out-of-bounds write in .NET allows an unauthorized attacker to execute code over a network. (CVE-2026-70197)Deserialization of untrusted data in .NET allows an unauthorized attacker to execute code over a network. (CVE-2026-83520)Inefficient algorithmic complexity in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-84008)Improper certificate validation in Active Directory Federation Services (AD FS) allows an unauthorized attacker to perform spoofing over a network. (CVE-2026-96222)Improper link resolution before file access ('link following') in .NET allows an authorized attacker to elevate privileges locally. (CVE-2026-96225)Improper link resolution before file access ('link following') in .NET allows an authorized attacker to elevate privileges locally. (CVE-2026-96231)Out-of-bounds write in ASP.NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-96233)Allocation of resources without limits or throttling in ASP.NET Core allows an unauthorized attacker to deny service over a network. (CVE-2026-96236)Inclusion of functionality from untrusted control sphere in .NET allows an unauthorized attacker to execute code over a network. (CVE-2026-96237)Inefficient algorithmic complexity in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-96958)Allocation of resources without limits or throttling in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-96959)Asymmetric resource consumption (amplification) in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-96960)
