# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A flaw was found in the Linux kernel Traffic Control (TC) subsystem. Using a specific networking configuration (redirecting egress packets to ingress using TC action "mirred") a local unprivileged user could trigger a CPU soft lockup (ABBA deadlock) when the transport protocol in use (TCP or SCTP) does a retransmission, resulting in a denial of service condition. (CVE-2022-4269)A NULL pointer dereference has been discovered in the Linux Kernel, in io_file_bitmap_get in io_uring/filetable.c. (CVE-2023-1583)A use-after-free flaw was found in btrfs_search_slot in fs/btrfs/ctree.c in btrfs in the Linux Kernel.This flaw allows an attacker to crash the system and possibly cause a kernel information lea (CVE-2023-1611)An out-of-bounds write vulnerability was found in the Linux kernel''s SLIMpro I2C device driver. The userspace "data->block[0]" variable was not capped to a number between 0-255 and was used as the size of a memcpy, possibly writing beyond the end of dma_buffer. This flaw could allow a local privileged user to crash the system or potentially achieve code execution. (CVE-2023-2194)In the Linux kernel, the following vulnerability has been resolved:dm crypt: add cond_resched() to dmcrypt_write() (CVE-2023-53051)In the Linux kernel, the following vulnerability has been resolved:erspan: do not use skb_mac_header() in ndo_start_xmit() (CVE-2023-53053)In the Linux kernel, the following vulnerability has been resolved:fscrypt: destroy keyring after security_sb_delete() (CVE-2023-53055)In the Linux kernel, the following vulnerability has been resolved:perf/x86/amd/core: Always clear status for idx (CVE-2023-53073)In the Linux kernel, the following vulnerability has been resolved:xsk: Add missing overflow check in xdp_umem_reg (CVE-2023-53080)In the Linux kernel, the following vulnerability has been resolved:nfsd: don''t replace page in rq_pages if it''s a continuation of last page (CVE-2023-53083)In the Linux kernel, the following vulnerability has been resolved:tracing: Do not let histogram values have some modifiers (CVE-2023-53093)'
