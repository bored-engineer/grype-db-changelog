# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:ceph: drop messages from MDS when unmounting (CVE-2022-48628)A use-after-free vulnerability in the Linux kernel''s netfilter: nf_tables component can be exploited to achieve local privilege escalation.Due to a race condition between nf_tables netlink control plane transaction and nft_set element garbage collection, it is possible to underflow the reference counter causing a use-after-free vulnerability.We recommend upgrading past commit 3e91b0ebd994635df2346353322ac51ce84ce6d8. (CVE-2023-4244)A NULL pointer dereference flaw was found in the Linux kernel ipv4 stack. The socket buffer (skb) was assumed to be associated with a device before calling __ip_options_compile, which is not always the case if the skb is re-routed by ipvs. This issue may allow a local user with CAP_NET_ADMIN privileges to crash the system. (CVE-2023-42754)A flaw was found in the Netfilter subsystem of the Linux kernel. A race condition between IPSET_CMD_ADD and IPSET_CMD_SWAP can lead to a kernel panic due to the invocation of `__ip_set_put` on a wrong `set`. This issue may allow a local user to crash the system. (CVE-2023-42756)A use-after-free vulnerability in the Linux kernel''s netfilter: nf_tables component can be exploited to achieve local privilege escalation.Addition and removal of rules from chain bindings within the same transaction causes leads to use-after-free.We recommend upgrading past commit f15f29fd4779be8a418b66e9d52979bb6d6c2325. (CVE-2023-5197)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_set_rbtree: skip sync GC for new elements in this transactionNew elements in this transaction might expired before such transactionends. Skip sync GC for such elements otherwise commit path might walkover an already released object. Once transaction is finished, async GCwill collect such expired element. (CVE-2023-52433)In the Linux kernel, the following vulnerability has been resolved:x86/srso: Add SRSO mitigation for Hygon processors (CVE-2023-52482)In the Linux kernel, the following vulnerability has been resolved:ring-buffer: Do not attempt to read past "commit" (CVE-2023-52501)In the Linux kernel, the following vulnerability has been resolved:mm/slab_common: fix slab_caches list corruption after kmem_cache_destroy() (CVE-2023-52562)In the Linux kernel, the following vulnerability has been resolved:serial: 8250_port: Check IRQ data before use (CVE-2023-52567)In the Linux kernel, the following vulnerability has been resolved:btrfs: remove BUG() after failure to insert delayed dir index item (CVE-2023-52569)In the Linux kernel, the following vulnerability has been resolved:cifs: Fix UAF in cifs_demultiplex_thread() (CVE-2023-52572)In the Linux kernel, the following vulnerability has been resolved:net: rds: Fix possible NULL-pointer dereference (CVE-2023-52573)In the Linux kernel, the following vulnerability has been resolved:team: fix null-ptr-deref when team device type is changed (CVE-2023-52574)In the Linux kernel, the following vulnerability has been resolved:x86/mm, kexec, ima: Use memblock_free_late() from ima_free_kexec_buffer() (CVE-2023-52576)In the Linux kernel, the following vulnerability has been resolved:net: bridge: use DEV_STATS_INC() (CVE-2023-52578)In the Linux kernel, the following vulnerability has been resolved:net/core: Fix ETH_P_1588 flow dissector (CVE-2023-52580)In the Linux kernel, the following vulnerability has been resolved:netfs: Only call folio_start_fscache() one time for each folio (CVE-2023-52582)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: adapt set backend to use GC transaction API (CVE-2023-52923)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: don''t skip expired elements during walk (CVE-2023-52924)A use-after-free vulnerability in the Linux kernel''s fs/smb/client component can be exploited to achieve local privilege escalation.In case of an error in smb3_fs_context_parse_param, ctx->password was freed but the field was not set to NULL which could lead to double free.We recommend upgrading past commit e6e43b8aa7cd3c3af686caf0c2e11819a886d705. (CVE-2023-5345)'
