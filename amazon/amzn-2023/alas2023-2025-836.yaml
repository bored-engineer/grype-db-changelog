Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:net: sched: sch_multiq: fix possible OOB write in multiq_tune() (CVE-2024-36978)In the Linux kernel, the following vulnerability has been resolved:usb-storage: alauda: Check whether the media is initialized (CVE-2024-38619)In the Linux kernel, the following vulnerability has been resolved:mm/memory-failure: fix handling of dissolved but not taken off from buddy pages (CVE-2024-39298)In the Linux kernel, the following vulnerability has been resolved:io_uring: check for non-NULL file pointer in io_file_can_poll() (CVE-2024-39371)In the Linux kernel, the following vulnerability has been resolved:mm/vmalloc: fix vmalloc which may return null if called with __GFP_NOFAIL (CVE-2024-39474)In the Linux kernel, the following vulnerability has been resolved:btrfs: zoned: fix use-after-free due to race with dev replace (CVE-2024-39496)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: Fix race between namespace cleanup and gc in the list:set type (CVE-2024-39503)In the Linux kernel, the following vulnerability has been resolved:HID: core: remove unnecessary WARN_ON() in implement() (CVE-2024-39509)In the Linux kernel, the following vulnerability has been resolved:cachefiles: remove requests from xarray during flushing requests (CVE-2024-40900)In the Linux kernel, the following vulnerability has been resolved:scsi: mpt3sas: Avoid test/set_bit() operating in non-allocated memory (CVE-2024-40901)In the Linux kernel, the following vulnerability has been resolved:net: bridge: mst: pass vlan group directly to br_mst_vlan_set_state (CVE-2024-40921)In the Linux kernel, the following vulnerability has been resolved:drm/i915/dpt: Make DPT object unshrinkable (CVE-2024-40924)In the Linux kernel, the following vulnerability has been resolved:xhci: Handle TD clearing for multiple streams case (CVE-2024-40927)In the Linux kernel, the following vulnerability has been resolved:cachefiles: flush all requests after setting CACHEFILES_DEAD (CVE-2024-40935)In the Linux kernel, the following vulnerability has been resolved:KVM: Fix a data race on last_boosted_vcpu in kvm_vcpu_on_spin() (CVE-2024-40953)In the Linux kernel, the following vulnerability has been resolved:net: do not leave a dangling sk pointer, when socket creation fails (CVE-2024-40954)In the Linux kernel, the following vulnerability has been resolved:seg6: fix parameter passing when calling NF_HOOK() in End.DX4 and End.DX6 behaviors (CVE-2024-40957)In the Linux kernel, the following vulnerability has been resolved:netns: Make get_net_ns() handle zero refcount net (CVE-2024-40958)In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent possible NULL dereference in rt6_probe() (CVE-2024-40960)In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent possible NULL deref in fib6_nh_init() (CVE-2024-40961)In the Linux kernel, the following vulnerability has been resolved:tty: add the option to have a tty reject a new ldisc (CVE-2024-40966)In the Linux kernel, the following vulnerability has been resolved:ACPICA: Revert "ACPICA: avoid Info: mapping multiple BARs. Your kernel is fine." (CVE-2024-40984)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: Disassociate vcpus from redistributor region on teardown (CVE-2024-40989)In the Linux kernel, the following vulnerability has been resolved:net/sched: act_api: fix possible infinite loop in tcf_idr_check_alloc() (CVE-2024-40995)In the Linux kernel, the following vulnerability has been resolved:bpf: Avoid splat in pskb_pull_reason (CVE-2024-40996)In the Linux kernel, the following vulnerability has been resolved:block/ioctl: prefer different overflow check (CVE-2024-41000)In the Linux kernel, the following vulnerability has been resolved:io_uring/sqpoll: work around a potential audit memory leak (CVE-2024-41001)'
