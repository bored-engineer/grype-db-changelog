Vulnerability:
    Description: If the certificate auto-enrollment GPO is enabled on domain members(both in Samba's smb.conf and using Windows GPME tool), a CAcertificate may be fetched using a plain HTTP connection and installedin the member computer's trust store. This may give an attacker achance to intercept the response, installing their chosen certificateinstead.The URL from which the certificate is fetched follows a pattern usedby Microsoft's Network Device Enrollment Service (NDES) to providecertificates to computers on the network that are not full domainmembers. Domain members should already have access to thesecertificates via better protected LDAP connections, so do not need theNDES link (Samba uses no other part of NDES).Pure Samba domains will not have auto-enrolment available, eitherthrough LDAP or HTTP, as Samba does not currently implement ActiveDirectory Certificate Services. However, members of these domains arestill vulnerable if the GPO is enabled.The patch removes the attempt to download the certificate and relieson the LDAP values. (CVE-2026-3012)
