# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Various out-of-bounds reads and writes in the DVB subtitle decoder that can cause crashes for certain input files. (CVE-2026-2923)GStreamer JPEG Parser Heap-based Buffer Overflow Remote Code Execution Vulnerability. This vulnerability allows remote attackers to execute arbitrary code on affected installations of GStreamer. Interaction with this library is required to exploit this vulnerability but attack vectors may vary depending on the implementation.  The specific flaw exists within the processing of Huffman tables. The issue results from the lack of proper validation of the length of user-supplied data prior to copying it to a fixed-length heap-based buffer. An attacker can leverage this vulnerability to execute code in the context of the current process. (CVE-2026-3082)
