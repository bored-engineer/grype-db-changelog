Vulnerability:
    Description: 'archive/tar: unbounded allocation when parsing GNU sparse maptar.Reader did not set a maximum size on the number of sparse region data blocks in GNU tar pax 1.0 sparse files. A maliciously-crafted archive containing a large number of sparse regions could cause a Reader to read an unbounded amount of data from the archive into memory. When reading from a compressed source, a small compressed input could result in large allocations. (CVE-2025-58183)encoding/asn1: pre-allocating memory when parsing DER payload can cause memory exhaustionWhen parsing DER payloads, memories were being allocated prior to fully validating the payloads.This permits an attacker to craft a big empty DER payload to cause memory exhaustion in functions such as asn1.Unmarshal, x509.ParseCertificateRequest, and ocsp.ParseResponse. (CVE-2025-58185)net/http: lack of limit when parsing cookies can cause memory exhaustionDespite HTTP headers having a default limit of 1 MB, the number of cookies that can be parsed did not have a limit.By sending a lot of very small cookies such as "a=;", an attacker can make an HTTP server allocate a large amount of structs, causing large memory consumption.net/http now limits the number of cookies accepted to 3000, which can be adjusted using the httpcookiemaxnum GODEBUG option. (CVE-2025-58186)crypto/x509: panic when validating certificates with DSA public keysValidating certificate chains which contain DSA public keys can cause programsto panic, due to a interface cast that assumes they implement the Equal method.This affects programs which validate arbitrary certificate chains. (CVE-2025-58188)encoding/pem: quadratic complexity when parsing some invalid inputsDue to the design of the PEM parsing function, the processing time for someinputs scales non-linearly with respect to the size of the input.This affects programs which parse untrusted PEM inputs. (CVE-2025-61723)net/mail: excessive CPU consumption in ParseAddressThe ParseAddress function constructed domain-literal address components through repeated string concatenation. When parsing large domain-literal components, this could cause excessive CPU consumption. (CVE-2025-61725)'
