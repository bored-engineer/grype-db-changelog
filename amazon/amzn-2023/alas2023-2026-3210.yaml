Vulnerability:
    Description: 'parse_date() -- and str2time(), which delegates to it -- used regexes withambiguous adjacent greedy runs (year/clock/timezone digits andtimezone/ASCII-timezone letters) before a trailing anchor. A valid-lookingdate prefix followed by a long interior run of digits, letters, or whitespaceand a trailing junk character forced O(N^2) backtracking, so a ~100 KB stringburned tens of seconds of CPU: a denial of service. (CVE-2026-14741)'
