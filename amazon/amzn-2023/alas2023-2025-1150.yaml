# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'Uncontrolled Recursion vulnerability in Apache Commons Lang.This issue affects Apache Commons Lang: Starting with commons-lang:commons-lang 2.0 to 2.6, and, from org.apache.commons:commons-lang3 3.0 before 3.18.0.The methods ClassUtils.getClass(...) can throw StackOverflowError on very long inputs. Because an Error is usually not handled by applications and libraries, aStackOverflowError could cause an application to stop.Users are recommended to upgrade to version 3.18.0, which fixes the issue. (CVE-2025-48924)'
    FixedIn:
        - Available:
            Date: "2025-08-18"
            Kind: advisory
          Name: apache-commons-lang3
          NamespaceName: amzn:2023
          Version: 3.18.0-1.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2025-1150.html
