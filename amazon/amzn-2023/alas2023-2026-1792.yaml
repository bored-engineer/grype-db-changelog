# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A denial of service vulnerability (GHSA-XMRV-PMRH-HHX2) was found in the bundled AWS SDK for Go v2 EventStream decoder used by credentials-fetcher. An attacker who can inject a malformed EventStream response frame with a crafted header value type byte outside the valid range can cause a panic, terminating the host process.
