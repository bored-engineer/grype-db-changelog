    Description: 'In the Linux kernel, the following vulnerability has been resolved:Input: cyapa - add missing input core locking to suspend/resume functions (CVE-2023-52884)In the Linux kernel, the following vulnerability has been resolved:genirq/cpuhotplug, x86/vector: Prevent vector leak during CPU offline (CVE-2024-31076)In the Linux kernel, the following vulnerability has been resolved:efi: libstub: only free priv.runtime_map when allocated (CVE-2024-33619)In the Linux kernel, the following vulnerability has been resolved:ipvlan: Dont Use skb->sk in ipvlan_process_v{4,6}_outbound (CVE-2024-33621)In the Linux kernel, the following vulnerability has been resolved:netfilter: tproxy: bail out if IP has been disabled on the device (CVE-2024-36270)In the Linux kernel, the following vulnerability has been resolved:netfilter: nfnetlink_queue: acquire rcu_read_lock() in instance_destroy_rcu() (CVE-2024-36286)In the Linux kernel, the following vulnerability has been resolved:net: relax socket state check at accept time. (CVE-2024-36484)In the Linux kernel, the following vulnerability has been resolved:tls: fix missing memory barrier in tls_init (CVE-2024-36489)In the Linux kernel, the following vulnerability has been resolved:virtio: delete vq in vp_find_vqs_msix() when request_irq() fails (CVE-2024-37353)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix shift-out-of-bounds in dctcp_update_alpha(). (CVE-2024-37356)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: Use variable length array instead of fixed size (CVE-2024-38623)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: Use 64 bit variable to avoid 32 bit overflow (CVE-2024-38624)In the Linux kernel, the following vulnerability has been resolved:bpf: Allow delete from sockmap/sockhash only if update is allowed (CVE-2024-38662)'
