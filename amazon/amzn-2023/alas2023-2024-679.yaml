Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:bonding: Fix out-of-bounds read in bond_option_arp_ip_targets_set() (CVE-2024-39487)In the Linux kernel, the following vulnerability has been resolved:ima: Avoid blocking in RCU read-side critical section (CVE-2024-40947)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: Validate ff offset (CVE-2024-41019)In the Linux kernel, the following vulnerability has been resolved:filelock: Fix fcntl/close race recovery compat path (CVE-2024-41020)In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix duplicate endpoint bug by clearing reserved bits in the descriptor (CVE-2024-41035)In the Linux kernel, the following vulnerability has been resolved:udp: Set SOCK_RCU_FREE earlier in udp_lib_get_port(). (CVE-2024-41041)In the Linux kernel, the following vulnerability has been resolved:filelock: fix potential use-after-free in posix_lock_inode (CVE-2024-41049)In the Linux kernel, the following vulnerability has been resolved:cachefiles: cyclic allocation of msg_id to avoid reuse (CVE-2024-41050)In the Linux kernel, the following vulnerability has been resolved:mm: prevent derefencing NULL ptr in pfn_section_valid() (CVE-2024-41055)In the Linux kernel, the following vulnerability has been resolved:cachefiles: fix slab-use-after-free in cachefiles_withdraw_cookie() (CVE-2024-41057)In the Linux kernel, the following vulnerability has been resolved:cachefiles: fix slab-use-after-free in fscache_withdraw_volume() (CVE-2024-41058)In the Linux kernel, the following vulnerability has been resolved:nvme: avoid double free special payload (CVE-2024-41073)In the Linux kernel, the following vulnerability has been resolved:null_blk: fix validation of block size (CVE-2024-41077)kernel: virtio-net: tap: mlx5_core short frame denial of service (CVE-2024-41090)kernel: virtio-net: tun: mlx5_core short frame denial of service (CVE-2024-41091)In the Linux kernel, the following vulnerability has been resolved:cdrom: rearrange last_media_change check to avoid unintentional overflow (CVE-2024-42136)In the Linux kernel, the following vulnerability has been resolved:tcp_metrics: validate source addr length (CVE-2024-42154)In the Linux kernel, the following vulnerability has been resolved:crypto: aead,cipher - zeroize key buffer after use (CVE-2024-42229)'
