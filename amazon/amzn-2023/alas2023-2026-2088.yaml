Vulnerability:
    Description: 'Issue summary: When an OpenSSL QUIC server (Listener SSL object) processesvalid QUIC Initial packets for unknown destination connection IDs, itcan allocate and queue new incoming channels without enforcing any limit.Impact summary: A remote peer that can make many Initial packets reach theserver listener faster than the application accepts connections, can cause thememory allocated to store the per-channel state to grow without any limits,potentially making the QUIC listener unavailable and causing Denial of Service.CWE: CWE-770: Allocation of Resources Without Limits or ThrottlingDescription: The function that handles inbound QUIC packets usesConnection-Id from the packet header to find an existing connection(QUIC channel). If no existing connection is found and the packettype is INITIAL, the function treats the packet as a new connection. Itallocates a new channel object and inserts it into a queue where itwaits to be accepted by the local application with SSL_accept(3ossl).The memory occupied by these initial channel objects may growwithout bounds if the application is not able to call SSL_accept()frequently enough to serve these inbound connection requests.The issue is present since OpenSSL 3.5 when the QUIC server implementationwas added.The fix introduces a limit for pending connections. The default limit is setto 256 pending connections (waiting to be accepted by the local application).Applications may change the default by calling SSL_set_value_uint(3ossl).FIPS impact: noThe FIPS module is not affected as the QUIC implementation is outside ofthe OpenSSL FIPS module boundary. (CVE-2026-14456)'
