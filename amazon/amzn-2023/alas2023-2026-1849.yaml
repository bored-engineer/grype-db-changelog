# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A flaw was found in ansible-core. The ansible-galaxy role install command processes dependency specifications from a role's meta/requirements.yml file. Due to improper neutralization of argument delimiters, a malicious role author can inject arbitrary git configuration flags through the src field. This allows arbitrary code execution on the machine of a user who installs the role via ansible-galaxy role install. (CVE-2026-11332)
    FixedIn:
        - Available:
            Date: "2026-06-22"
            Kind: advisory
          Name: ansible-core
          NamespaceName: amzn:2023
          Version: 2.15.3-1.amzn2023.0.12
          VersionFormat: rpm
        - Available:
            Date: "2026-06-22"
            Kind: advisory
          Name: ansible-test
          NamespaceName: amzn:2023
          Version: 2.15.3-1.amzn2023.0.12
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2026-1849.html
