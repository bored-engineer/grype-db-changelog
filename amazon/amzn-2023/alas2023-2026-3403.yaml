Vulnerability:
    Description: URI::_idna::nameprep only lowercased the label and skipped the Unicodenormalization that RFC 3490/3491 require. As a result, a host that wasnot already in NFC encoded to a non-standard A-label that disagrees withwhat browsers, curl, Go, Java, and Python compute for the same input --and that A-label does not round-trip. Code that reads $uri->host for asecurity decision (allow/deny lists, SSRF filters, routing, dedup) couldtherefore disagree with the host that is actually fetched. (CVE-2026-19953)
