Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:inet: inet_defrag: prevent sk release while still in use (CVE-2024-26921)In the Linux kernel, the following vulnerability has been resolved:af_unix: Fix garbage collector racing against connect() (CVE-2024-26923)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: release mutex after nft_gc_seq_end from abort pathThe commit mutex should not be released during the critical sectionbetween nft_gc_seq_begin() and nft_gc_seq_end(), otherwise, async GCworker could collect expired objects and get the released commit lockwithin the same GC sequence.nf_tables_module_autoload() temporarily releases the mutex to loadmodule dependencies, then it goes back to replay the transaction again.Move it at the end of the abort phase after nft_gc_seq_end() is called. (CVE-2024-26925)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix potential UAF in cifs_debug_files_proc_show() (CVE-2024-26928)In the Linux kernel, the following vulnerability has been resolved:xen-netfront: Add missing skb_mark_for_recycle (CVE-2024-27393)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix potential UAF in cifs_signal_cifsd_for_reconnect() (CVE-2024-35861)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix potential UAF in smb2_is_network_name_deleted() (CVE-2024-35862)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix potential UAF in smb2_is_valid_lease_break() (CVE-2024-35864)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix potential UAF in smb2_is_valid_oplock_break() (CVE-2024-35865)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix potential UAF in cifs_stats_proc_write() (CVE-2024-35868)In the Linux kernel, the following vulnerability has been resolved:mm/secretmem: fix GUP-fast succeeding on secretmem folios (CVE-2024-35872)In the Linux kernel, the following vulnerability has been resolved:udp: do not accept non-tunnel GSO skbs landing in a tunnel (CVE-2024-35884)In the Linux kernel, the following vulnerability has been resolved:erspan: make sure erspan_base_hdr is present in skb->head (CVE-2024-35888)In the Linux kernel, the following vulnerability has been resolved:gro: fix ownership transfer (CVE-2024-35890)In the Linux kernel, the following vulnerability has been resolved:bpf, sockmap: Prevent lock inversion deadlock in map delete elem (CVE-2024-35895)In the Linux kernel, the following vulnerability has been resolved:netfilter: validate user input for expected length (CVE-2024-35896)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: discard table flag update with pending basechain deletion (CVE-2024-35897)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: flush pending destroy work before exit_net release (CVE-2024-35899)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: reject new basechain after table flag update (CVE-2024-35900)In the Linux kernel, the following vulnerability has been resolved:net/rds: fix possible cp null dereference (CVE-2024-35902)In the Linux kernel, the following vulnerability has been resolved:tls: get psock ref after taking rxlock to avoid leak (CVE-2024-35908)In the Linux kernel, the following vulnerability has been resolved:tcp: properly terminate timers for kernel sockets (CVE-2024-35910)In the Linux kernel, the following vulnerability has been resolved:block: prevent division by zero in blk_rq_stat_sum() (CVE-2024-35925)In the Linux kernel, the following vulnerability has been resolved:btrfs: send: handle path ref underflow in header iterate_inode_ref() (CVE-2024-35935)In the Linux kernel, the following vulnerability has been resolved:btrfs: handle chunk tree lookup error in btrfs_relocate_sys_chunks() (CVE-2024-35936)In the Linux kernel, the following vulnerability has been resolved:VMCI: Fix memcpy() run-time warning in dg_dispatch_as_host() (CVE-2024-35944)In the Linux kernel, the following vulnerability has been resolved:drm/client: Fully protect modes[] with dev->mode_config.mutex (CVE-2024-35950)In the Linux kernel, the following vulnerability has been resolved:kprobes: Fix possible use-after-free issue on kprobe registration (CVE-2024-35955)In the Linux kernel, the following vulnerability has been resolved:ipv6: fix race condition between ipv6_get_ifaddr and ipv6_del_addr (CVE-2024-35969)In the Linux kernel, the following vulnerability has been resolved:af_unix: Clear stale u->oob_skb. (CVE-2024-35970)In the Linux kernel, the following vulnerability has been resolved:geneve: fix header validation in geneve[6]_xmit_skb (CVE-2024-35973)In the Linux kernel, the following vulnerability has been resolved:xsk: validate user input for XDP_{UMEM|COMPLETION}_FILL_RING (CVE-2024-35976)'
