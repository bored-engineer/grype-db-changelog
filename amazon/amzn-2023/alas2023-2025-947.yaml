    Description: 'In the Linux kernel, the following vulnerability has been resolved:btrfs: handle errors from btrfs_dec_ref() properly (CVE-2024-46753)In the Linux kernel, the following vulnerability has been resolved:ipv6: mcast: extend RCU protection in igmp6_send() (CVE-2025-21759)In the Linux kernel, the following vulnerability has been resolved:netfilter: socket: Lookup orig tuple for IPv6 SNAT (CVE-2025-22021)In the Linux kernel, the following vulnerability has been resolved:nfsd: put dl_stid if fail to queue dl_recall (CVE-2025-22025)In the Linux kernel, the following vulnerability has been resolved:media: streamzap: fix race between device disconnection and urb callback (CVE-2025-22027)In the Linux kernel, the following vulnerability has been resolved:arm64: Don''t call NULL in do_compat_alignment_fixup() (CVE-2025-22033)In the Linux kernel, the following vulnerability has been resolved:tracing: Fix use-after-free in print_graph_function_flags during tracer switching (CVE-2025-22035)In the Linux kernel, the following vulnerability has been resolved:acpi: nfit: fix narrowing conversion in acpi_nfit_ctl (CVE-2025-22044)In the Linux kernel, the following vulnerability has been resolved:x86/mm: Fix flush_tlb_range() when used for zapping normal PMDs (CVE-2025-22045)In the Linux kernel, the following vulnerability has been resolved:net: fix geneve_opt length integer overflow (CVE-2025-22055)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_tunnel: fix geneve_opt type confusion addition (CVE-2025-22056)In the Linux kernel, the following vulnerability has been resolved:udp: Fix memory accounting leak. (CVE-2025-22058)In the Linux kernel, the following vulnerability has been resolved:netlabel: Fix NULL pointer exception caused by CALIPSO on IPv4 sockets (CVE-2025-22063)In the Linux kernel, the following vulnerability has been resolved:rtnetlink: Allocate vfinfo size for VF GUIDs when supported (CVE-2025-22075)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: Fix a couple integer overflows on 32bit systems (CVE-2025-22081)In the Linux kernel, the following vulnerability has been resolved:RDMA/mlx5: Fix mlx5_poll_one() cur_qp update flow (CVE-2025-22086)In the Linux kernel, the following vulnerability has been resolved:RDMA/core: Don''t expose hw_counters outside of init net namespace (CVE-2025-22089)In the Linux kernel, the following vulnerability has been resolved:thermal: int340x: Add NULL check for adev (CVE-2025-23136)In the Linux kernel, the following vulnerability has been resolved:ext4: fix OOB read when checking dotdot dir (CVE-2025-37785)In the Linux kernel, the following vulnerability has been resolved:net_sched: skbprio: Remove overly strict queue assertions (CVE-2025-38637)'
