Vulnerability:
    Description: 'A vulnerability was found in SQLite SQLite3 up to 3.43.0 and classified as critical. This issue affects the function sessionReadRecord of the file ext/session/sqlite3session.c of the component make alltest Handler. The manipulation leads to heap-based buffer overflow. It is recommended to apply a patch to fix this issue. The associated identifier of this vulnerability is VDB-248999.NOTE: https://sqlite.org/forum/forumpost/5bcbf4571cNOTE: Fixed by: https://sqlite.org/src/info/0e4e7a05c4204b47 (CVE-2023-7104)'
