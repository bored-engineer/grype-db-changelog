Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:mptcp: pm: ADD_ADDR rtx: always decrease sk refcount (CVE-2026-46158)In the Linux kernel, the following vulnerability has been resolved:mptcp: pm: ADD_ADDR rtx: free sk if last (CVE-2026-46170)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix ld_{abs,ind} failure path analysis in subprogs (CVE-2026-53090)In the Linux kernel, the following vulnerability has been resolved:bpf: Reject BPF_MAP_TYPE_INODE_STORAGE creation if BPF LSM is uninitializedWhen CONFIG_BPF_LSM=y is set, BPF inode storage maps(BPF_MAP_TYPE_INODE_STORAGE) are compiled into the kernel. However,if the BPF LSM is not explicitly enabled at boot time (e.g. omittedfrom the "lsm=" boot parameter), lsm_prepare() is never executed forthe BPF LSM.Consequently, the BPF inode security blob offset(bpf_lsm_blob_sizes.lbs_inode) is never initialized and remains atits default compiled size of 8 bytes instead of being updated to avalid offset past the reserved struct rcu_head (typically 16 bytesor more).When a privileged user creates and updates a BPF_MAP_TYPE_INODE_STORAGEmap, bpf_inode() evaluates inode->i_security + 8. This erroneouslyaliases the struct rcu_head.func callback pointer at the beginningof the inode->i_security blob. During subsequent map element cleanupor inode destruction, writing NULL to owner_storage clears the queuedRCU callback pointer. When rcu_do_batch() later executes the queuedcallback, it attempts an instruction fetch at address 0x0, triggeringan immediate kernel panic.Fix this by introducing a global bpf_lsm_initialized boolean flagmarked with __ro_after_init. Set this flag to true inside bpf_lsm_init()when the LSM framework successfully registers the BPF LSM. Gate mapallocation in inode_storage_map_alloc() on this flag, returning-EOPNOTSUPP if the BPF LSM is in turn uninitialized.This fail-fast approach prevents userspace from allocating inodestorage maps when the supporting BPF LSM infrastructure is absent,avoiding zombie map states. (CVE-2026-64192)In the Linux kernel, the following vulnerability has been resolved:mm: do file ownership checks with the proper mount idmap (CVE-2026-64294)In the Linux kernel, the following vulnerability has been resolved:x86/bugs: Enable IBPB flush on BPF JIT allocation (CVE-2026-64507)In the Linux kernel, the following vulnerability has been resolved:bpf: Support for hardening against JIT spraying (CVE-2026-64508)In the Linux kernel, the following vulnerability has been resolved:ipv6: ndisc: fix NULL deref in accept_untracked_na() (CVE-2026-64542)In the Linux kernel, the following vulnerability has been resolved:tipc: fix use-after-free of the discoverer in tipc_disc_rcv() (CVE-2026-64543)In the Linux kernel, the following vulnerability has been resolved:perf/core: Detach event groups during remove_on_execperf_event_remove_on_exec() removes events by callingperf_event_exit_event(). For top-level events, this removes the event fromthe context with DETACH_EXIT only.This can leave inconsistent group state when a removed event is a groupleader and the group contains siblings without remove_on_exec. If the groupwas active, the surviving siblings can remain active and attached to theremoved leader''s sibling list, but are no longer represented by a validgroup leader on the PMU context active lists.A later close of the removed leader uses DETACH_GROUP and can promote thestill-active siblings from this stale group state. The next schedule-in canthen add an already-linked active_list entry again, corrupting the PMUcontext active list.With DEBUG_LIST enabled, this is caught as a list_add double-add inmerge_sched_in().Fix this by detaching group relationships when remove_on_exec removes anevent. This preserves the existing task-exit and revoke behavior, whileensuring surviving siblings are ungrouped before the removed event leavesthe context. (CVE-2026-64556)In the Linux kernel, the following vulnerability has been 