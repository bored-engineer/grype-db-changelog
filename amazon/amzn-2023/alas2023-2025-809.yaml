VE-2024-56745)In the Linux kernel, the following vulnerability has been resolved:ipv6: release nexthop on device removalThe CI is hitting some aperiodic hangup at device removal time in thepmtu.sh self-test:unregister_netdevice: waiting for veth_A-R1 to become free. Usage count = 6ref_tracker: veth_A-R1@ffff888013df15d8 has 1/5 users atdst_init+0x84/0x4a0dst_alloc+0x97/0x150ip6_dst_alloc+0x23/0x90ip6_rt_pcpu_alloc+0x1e6/0x520ip6_pol_route+0x56f/0x840fib6_rule_lookup+0x334/0x630ip6_route_output_flags+0x259/0x480ip6_dst_lookup_tail.constprop.0+0x5c2/0x940ip6_dst_lookup_flow+0x88/0x190udp_tunnel6_dst_lookup+0x2a7/0x4c0vxlan_xmit_one+0xbde/0x4a50 [vxlan]vxlan_xmit+0x9ad/0xf20 [vxlan]dev_hard_start_xmit+0x10e/0x360__dev_queue_xmit+0xf95/0x18c0arp_solicit+0x4a2/0xe00neigh_probe+0xaa/0xf0While the first suspect is the dst_cache, explicitly tracking the dstowing the last device reference via probes proved such dst is held bythe nexthop in the originating fib6_info.Similar to commit f5b51fe804ec ("ipv6: route: purge exception onremoval"), we need to explicitly release the originating fib info whendisconnecting a to-be-removed device from a live ipv6 dst: move thefib6_info cleanup into ip6_dst_ifdown().Tested running:./pmtu.sh cleanup_ipv6_exceptionin a tight loop for more than 400 iterations with no spat, running anunpatched kernel  I observed a splat every ~10 iterations. (CVE-2024-56751)In the Linux kernel, the following vulnerability has been resolved:netfs/fscache: Add a memory barrier for FSCACHE_VOLUME_CREATING (CVE-2024-56755)In the Linux kernel, the following vulnerability has been resolved:nvme-pci: fix freeing of the HMB descriptor table (CVE-2024-56756)In the Linux kernel, the following vulnerability has been resolved:btrfs: fix use-after-free when COWing tree bock and tracing is enabled (CVE-2024-56759)In the Linux kernel, the following vulnerability has been resolved:tracing: Prevent bad count for tracing_cpumask_write (CVE-2024-56763)In the Linux kernel, the following vulnerability has been resolved:net/sched: netem: account for backlog updates from child qdisc (CVE-2024-56770)In the Linux kernel, the following vulnerability has been resolved:btrfs: add a sanity check for btrfs root in btrfs_search_slot() (CVE-2024-56774)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix nfs4_openowner leak when concurrent nfsd4_open occur (CVE-2024-56779)In the Linux kernel, the following vulnerability has been resolved:quota: flush quota_release_work upon quota writeback (CVE-2024-56780)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_socket: remove WARN_ON_ONCE on maximum cgroup level (CVE-2024-56783)In the Linux kernel, the following vulnerability has been resolved:drm/dp_mst: Ensure mst_primary pointer is valid in drm_dp_mst_handle_up_req() (CVE-2024-57798)In the Linux kernel, the following vulnerability has been resolved:net: fix memory leak in tcp_conn_request() (CVE-2024-57841)In the Linux kernel, the following vulnerability has been resolved:arm64: ptrace: fix partial SETREGSET for NT_ARM_TAGGED_ADDR_CTRL (CVE-2024-57874)In the Linux kernel, the following vulnerability has been resolved:drm/dp_mst: Fix resetting msg rx state after topology removal (CVE-2024-57876)In the Linux kernel, the following vulnerability has been resolved:mptcp: fix TCP options overflow. (CVE-2024-57882)In the Linux kernel, the following vulnerability has been resolved:mm: vmscan: account for free pages to prevent infinite Loop in throttle_direct_reclaim() (CVE-2024-57884)In the Linux kernel, the following vulnerability has been resolved:RDMA/uverbs: Prevent integer overflow issue (CVE-2024-57890)In the Linux kernel, the following vulnerability has been resolved:btrfs: flush delalloc workers queue before stopping cleaner kthread during unmount (CVE-2024-57896)In the Linux kernel, the following vulnerability has been resolved:ila: serialize calls to nf_register_net_hooks() (CVE-2024-57900)In the Lin