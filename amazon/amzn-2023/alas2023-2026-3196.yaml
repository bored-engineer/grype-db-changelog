 request once the current C2HData PDUhas been consumed. Nothing compares the total bytes received againstthe length the command asked for: struct nvme_tcp_request has noreceive-side counter, queue->data_remaining is per queue, andblk_mq_end_request() completes for blk_rq_bytes(rq) unconditionallywith no residual concept anywhere above.A controller can therefore answer a 4096-byte read with 512 bytes andhave it reported as a complete read; user space then gets 4096 bytes ofwhich 3584 are whatever was already in the page. I reproduced that witha test target.Count the bytes received and refuse to complete a successful read whosecount does not match, at the two NVME_TCP_F_DATA_SUCCESS paths and innvme_tcp_process_nvme_cqe(). The success test shifts req->status rightby one, because the driver keeps the wire value there and shifts it oncompletion, so the check must see what the completion path will see.Only REQ_OP_READ is checked, because there the length comes from thesectors the request covers; a passthrough command is built by itssubmitter, which picks both command and buffer, so the kernel hasnothing to compare against. (CVE-2026-89480)In the Linux kernel, the following vulnerability has been resolved:nvme-tcp: fix host memory disclosure on R2T for a read command (CVE-2026-89481)In the Linux kernel, the following vulnerability has been resolved:nvme-tcp: do not accept C2HData based on blk_rq_payload_bytes() alone (CVE-2026-89482)In the Linux kernel, the following vulnerability has been resolved:nvme: zero the discard fallback page (CVE-2026-89483)In the Linux kernel, the following vulnerability has been resolved:lockd: fix NULL dereference on lockowner allocation failure (CVE-2026-89484)In the Linux kernel, the following vulnerability has been resolved:lockd: pin next file across nlm_inspect_file lock-drop (CVE-2026-89485)In the Linux kernel, the following vulnerability has been resolved:openvswitch: only skb_tx_error() a packet we are about to drop (CVE-2026-89487)In