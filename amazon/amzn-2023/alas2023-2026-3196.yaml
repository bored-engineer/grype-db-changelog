autoremove.  The former passes a parsed template which owns atemporary tree reference; the latter passes the installed entry itself.The unconditional audit_put_tree() at the end of audit_del_rule() assumesthe template case.  For mixed AUDIT_DIR plus AUDIT_EXE rules, an fsnotifyautoremove event therefore drops the installed rule''s live tree reference.Repeating this across rules sharing the same tree can free the tree whileanother rule still references it, and a later autoremove dereferences thefreed pathname while comparing rules.Move the temporary-tree put to audit_rule_change(), the caller that ownsdeletion templates.  Keep it in the AUDIT_DEL_RULE cleanup so bothsuccessful deletion and -ENOENT still release the parser-owned tree. (CVE-2026-89643)In the Linux kernel, the following vulnerability has been resolved:btrfs: drop recovered reloc root refs on recovery failure (CVE-2026-89645)In the Linux kernel, the following vulnerability has been resolved:ceph: do not repeat ceph_trim_dentries() if no progress possible (CVE-2026-89647)In the Linux kernel, the following vulnerability has been resolved:ceph: bound xattr value length in __build_xattrs() (CVE-2026-89649)In the Linux kernel, the following vulnerability has been resolved:ceph: bound num_export_targets array for mds info v2/v3 (CVE-2026-89650)In the Linux kernel, the following vulnerability has been resolved:ceph: bound MDSCapAuth path and fs_name decode in handle_session() (CVE-2026-89651)In the Linux kernel, the following vulnerability has been resolved:ceph: bound copied dentry name length in NFS export get_nameceph_get_name() copies the MDS-supplied name into the caller''sNAME_MAX-sized buffer with memcpy(name, rinfo->dname, rinfo->dname_len)and then writes name[rinfo->dname_len] = 0, without checking dname_lenagainst NAME_MAX. A malicious or buggy MDS that returns a LOOKUPNAME replywith dname_len > NAME_MAX overflows the buffer. __get_snap_name() copiesrde->name / rde->name_len the same unchecked way.Imp