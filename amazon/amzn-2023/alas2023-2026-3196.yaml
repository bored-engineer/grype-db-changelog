s.  Also ensure the table is no longerprocessing packets before its torn down on error unwind.nf_register_net_hooks might have published at least one hook; callsynchronize_rcu() if there was an error.audit log register message gets deferred until all operations havepassed, this avoids need to emit another ureg message in case oferror unwinding.Based on earlier patch by Tristan Madani. (CVE-2026-64079)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: xsk: Fix unlocked writing to ICOSQ (CVE-2026-64210)In the Linux kernel, the following vulnerability has been resolved:netfs: Fix potential UAF in netfs_unlock_abandoned_read_pages() (CVE-2026-64216)In the Linux kernel, the following vulnerability has been resolved:firmware: arm_ffa: Bound PARTITION_INFO_GET_REGS copies (CVE-2026-64520)In the Linux kernel, the following vulnerability has been resolved:libceph: fix two unsafe bare decodes in decode_lockers() (CVE-2026-68082)In the Linux kernel, the following vulnerability has been resolved:tcp: challenge ACK for non-exact RST in SYN-RECEIVED (CVE-2026-68118)In the Linux kernel, the following vulnerability has been resolved:super: fix emergency thaw deadlock on frozen block devices (CVE-2026-68132)In the Linux kernel, the following vulnerability has been resolved:libceph: bound pg_{temp,upmap,upmap_items} length to CEPH_PG_MAX_SIZE (CVE-2026-68159)In the Linux kernel, the following vulnerability has been resolved:net: serialize netif_running() check in enqueue_to_backlog() (CVE-2026-72493)In the Linux kernel, the following vulnerability has been resolved:tcp: clear sock_ops cb flags before force-closing a child socket (CVE-2026-74268)In the Linux kernel, the following vulnerability has been resolved:RDMA/nldev: Fix locking when accessing mr->pd (CVE-2026-74334)In the Linux kernel, the following vulnerability has been resolved:vxlan: use pskb_network_may_pull() for transmit path header pulls (CVE-2026-74474)In the Linux kernel, the following vulne