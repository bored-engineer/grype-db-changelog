s embedded raw_spinlock_t,list_head, and count never initialized. __svc_create() returns thehalf-constructed svc_serv to nfsd, lockd, or the NFS callback serviceanyway.Once that service is live, the hot-path increments insvc_xprt_enqueue(), svc_handle_xprt(), andsvc_pool_wake_idle_thread() reach a counter whose backing pointer isNULL. The pointer is a per-cpu offset, so the access does not fault:it resolves to offset zero of the current CPU''s per-cpu area andsilently corrupts whatever variable lives there. A/proc/fs/nfsd/pool_stats read walks the same NULL per-cpu storage andreturns garbage, and on CONFIG_DEBUG_SPINLOCK or lockdep it splats onthe never-initialized lock.Creating the broken service requires a percpu allocation failure duringRPC server startup, so it is reachable only by a local administratorunder memory pressure or fault injection; a remote peer cannot inducethe bad state on its own.Check each percpu_counter_init() return value in __svc_create() andfail when an allocation fails, unwinding the counters already set upin the current pool and in every pool initialized before it. Adiscrete percpu_counter_destroy() per counter at teardown frees eachper-cpu allocation exactly once. (CVE-2026-89547)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: always drain cache_cleaner before destroying a cache_detail (CVE-2026-89548)In the Linux kernel, the following vulnerability has been resolved:sunrpc: route to a populated pool in svc_pool_for_cpu() (CVE-2026-89549)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: svcauth_gss: enforce krb5 token minimum length (CVE-2026-89550)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: xdr_buf_trim: clamp buf->len to avoid underflow (CVE-2026-89551)In the Linux kernel, the following vulnerability has been resolved:params: fix charp corruption on allocation failure (CVE-2026-89552)In the Linux kernel, the following vulnerability has been resolved:mptcp: fix uninitialized local_id in syncookie MP_JOIN reconstruction (CVE-2026-89554)In the Linux kernel, the following vulnerability has been resolved:mpls: reload header after pskb_may_pull()mpls_select_multipath() calls mpls_multipath_hash() to choose a nexthopwhen an MPLS route has multiple nexthops.  While walking the MPLS labelstack, the hash routine caches hdr for the current label.  After findingthe bottom-of-stack label, it calls pskb_may_pull() before reading theinner IP header.If an skb is constructed with the inner IP header in nonlinear data andinsufficient tailroom in the linear head, pskb_may_pull() callspskb_expand_head() to replace the skb head and free the old one.  Thisleaves hdr pointing to freed memory.  The IPv6 path can invalidate hdragain when it performs a second pull for the larger header.The issue was found through static analysis.  A reproducer sending a legalGeneve packet through a bareudp/MPLS multipath setup triggered the sameKASAN report in 2 of 2 unpatched runs:BUG: KASAN: slab-use-after-free in mpls_select_multipathRead of size 1 at addr ffff88800ecc6e20 by task ksoftirqd/1/23Call Trace:mpls_select_multipathmpls_forward__netif_receive_skb_list_corenetif_receive_skb_list_internalnapi_complete_donegro_cell_poll__napi_pollnet_rx_actionFreed by task 23:kfreepskb_expand_head__pskb_pull_tailmpls_select_multipathReload hdr from the current skb head after each successful pull beforederiving the inner IPv4 or IPv6 header pointer. (CVE-2026-89555)In the Linux kernel, the following vulnerability has been resolved:md: do overflow check for sb->bblog_shift in super_1_load() (CVE-2026-89557)In the Linux kernel, the following vulnerability has been resolved:md/raid10: fix still_degraded being inverted in raid10_sync_request() (CVE-2026-89558)In the Linux kernel, the following vulnerability has been resolved:libnvdimm/labels: Prevent integer overflow in __nd_label_validate() (CVE-2026-89559)In the Linux kernel, the following vulnerability has been resolved:landlock: Require LANDLOCK_ACCESS_FS_MAKE_REG for whiteout creationWhiteout objects are used in the upper layer of an OverlayFS toindicate that the file with this name does not exist in the unifiedview, even if it is present in one of the lower layer file systems.For the userspace implementations of OverlayFS (fuse-overlayfs),whiteout objects can be created from userspace as well:* mknod(2) with S_IFCHR and makedev(0, 0)* renameat2(2) with RENAME_WHITEOUT,creating the whiteout in the old place of the moved file.This commit guards whiteout creation in both of these cases withLANDLOCK_ACCESS_FS_MAKE_REG.  Whiteout objects are *not* consideredcharacter devices and are not bound to a driver.LANDLOCK_ACCESS_FS_MAKE_REG describes the same permission class as awhiteout object: creating one is the only S_IFCHR creation that the VFSexempts from CAP_MKNOD, so it is as unprivileged as creating a regularfile, while LANDLOCK_ACCESS_FS_MAKE_CHAR andLANDLOCK_ACCESS_FS_MAKE_BLOCK keep meaning the creation of devices thatexpose a kernel interface [1].For the mknod(2) case, introduce a Landlock erratum.  The creation ofwhiteout objects through mknod(2) was previously guarded usingLANDLOCK_ACCESS_FS_MAKE_CHAR, and it is now guarded usingLANDLOCK_ACCESS_FS_MAKE_REG.For the renameat2(2) case, fix a bug: Before this commit, renameat2(2)with RENAME_WHITEOUT would create a directory entry even when allLANDLOCK_ACCESS_FS_MAKE_* rights were denied.This does not affect normal renames within layered OverlayFS mounts:When doing a regular rename() on a mounted fuse-overlayfs, it is thefuse-overlayfs daemon that exercises renameat2() with RENAME_WHITEOUT,and only the Landlock domain of that daemon is checked there.Depends-on: 49c9e09d9610 ("landlock: Fix handling of disconnected directories")Depends-on: fe72ce6710cb ("landlock: Add errata documentation section")[mic: Record why LANDLOCK_ACCESS_FS_MAKE_REG is the matching right, andadd link(2) to the user doc] (CVE-2026-89560)In the Linux kern