Vulnerability:
    Description: 'Net::CIDR::Lite versions before 0.24 for Perl does not properly validate IP address and CIDR mask inputs, which may allow IP ACL bypass.Inputs containing a trailing newline or non-ASCII digit characters pass the validators but are then re-encoded by the parser to a different address than the input string spelled. find() and bin_find() can match or miss addresses as a result.Example:my $cidr = Net::CIDR::Lite->new();$cidr->add("::1\n/128");$cidr->find("::1a");  # incorrectly returns trueSee also CVE-2026-45191. (CVE-2026-45190)Net::CIDR::Lite versions before 0.24 for Perl does not properly consider extraneous zero characters in CIDR mask values, which may allow IP ACL bypass.Mask forms like "/00" and "/01" pass validation and parse to the same prefix as their unpadded value.See also CVE-2026-45190. (CVE-2026-45191)'
    FixedIn:
