Vulnerability:
    Description: The tokenizer incorrectly interprets tags with unquoted attribute values that end with a solidus character (/) as self-closing. When directly using Tokenizer, this can result in such tags incorrectly being marked as self-closing, and when using the Parse functions, this can result in content following such tags as being placed in the wrong scope during DOM construction, but only when tags are in foreign content (e.g. <math>, <svg>, etc contexts). (CVE-2025-22872)
    FixedIn:
        - Name: ecs-init
          NamespaceName: amzn:2023
          Version: 1.94.0-1.amzn2023
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2025-1011.html
