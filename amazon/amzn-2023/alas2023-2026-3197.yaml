    Description: 'In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_nat_sip: rewind offset when NAT shrinks the packet (CVE-2026-100070)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: add hook transactions for device deletions (CVE-2026-63858)In the Linux kernel, the following vulnerability has been resolved:bpf, skmsg: fix verdict sk_data_ready racing with ktls rxsk_psock_strp_data_ready() already checks tls_sw_has_ctx_rx() anddefers to psock->saved_data_ready when a TLS RX context is present,avoiding a conflict with the TLS strparser''s ownership of the receivequeue (commit e91de6afa81c, "bpf: Fix running sk_skb program typeswith ktls").sk_psock_verdict_data_ready() has no equivalent guard.  When a socketis inserted into a sockmap (BPF_SK_SKB_VERDICT) before TLS RX isconfigured, tls_sw_strparser_arm() saves sk_psock_verdict_data_readyas rx_ctx->saved_data_ready.  On data arrival:tls_data_ready -> tls_strp_data_ready -> tls_rx_msg_ready-> saved_data_ready() = sk_psock_verdict_data_ready()-> tcp_read_skb() drains sk_receive_queue via __skb_unlink()without calling tcp_eat_skb(), so copied_seq is not advanced.tls_strp_msg_load() then finds tcp_inq() >= full_len (stale), callstcp_recv_skb() on the now-empty queue, hits WARN_ON_ONCE(!first), andreturns with rx_ctx->strp.anchor.frag_list pointing at a psock-owned(potentially freed) skb.  tls_decrypt_sg() subsequently walks thatfrag_list: use-after-free.Apply the same fix as sk_psock_strp_data_ready(): if a TLS RX contextis present, call psock->saved_data_ready (sock_def_readable) to wakerecv() waiters and return immediately, leaving the receive queueuntouched.  TLS retains sole ownership of the queue and decrypts therecord normally through tls_sw_recvmsg(). (CVE-2026-64025)In the Linux kernel, the following vulnerability has been resolved:netfilter: x_tables: add and use xtables_unregister_table_exitPrevious change added xtables_unregister_table_pre_exit to detach thetable from the packetpath and to unlink it from the active table list.In case of rmmod, userspace that is doing set/getsockopt for this tablewill not be able to re-instantiate the table:1. The larval table has been removed already2. existing instantiated table is no longer on the xt pernet table list.This adds the second stage helper:unlink the table from the dying list, free the hook ops (if any) and dothe audit notification.  It replaces xt_unregister_table(). (CVE-2026-64078)In the Linux kernel, the following vulnerability has been resolved:netfilter: x_tables: allocate hook ops while under mutexarp/ip(6)t_register_table() add the table to the per-netns list viaxt_register_table() before allocating the per-netns hook ops copyvia kmemdup_array().  This leaves a window where the table isvisible in the list with ops=NULL.If the pernet exit happens runs concurrently the pre_exit callback findsthe table via xt_find_table() and passes the NULL ops pointer tonf_unregister_net_hooks(), causing a NULL dereference:general protection fault in nf_unregister_net_hooks+0xbc/0x150RIP: nf_unregister_net_hooks (net/netfilter/core.c:613)Call Trace:ipt_unregister_table_pre_exitiptable_mangle_net_pre_exitops_pre_exit_listcleanup_netFix by moving the ops allocation into the xtables core so the table isnever in the list without valid ops.  Also ensure the table is no longerprocessing packets before its torn down on error unwind.nf_register_net_hooks might have published at least one hook; callsynchronize_rcu() if there was an error.audit log register message gets deferred until all operations havepassed, this avoids need to emit another ureg message in case oferror unwinding.Based on earlier patch by Tristan Madani. (CVE-2026-64079)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: xsk: Fix unlocked writing to ICOSQ (CVE-2026-64210)In the Linux kernel, the following vulnerability has been resolved:ipvs: reload ip header after head reallocat