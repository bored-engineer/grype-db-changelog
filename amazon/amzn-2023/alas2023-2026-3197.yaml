ange() when len == 0 (CVE-2026-89640)In the Linux kernel, the following vulnerability has been resolved:audit: avoid dropping live tree ref on fsnotify rule autoremoveaudit_del_rule() is used for both netlink deletion templates and internalfsnotify autoremove.  The former passes a parsed template which owns atemporary tree reference; the latter passes the installed entry itself.The unconditional audit_put_tree() at the end of audit_del_rule() assumesthe template case.  For mixed AUDIT_DIR plus AUDIT_EXE rules, an fsnotifyautoremove event therefore drops the installed rule''s live tree reference.Repeating this across rules sharing the same tree can free the tree whileanother rule still references it, and a later autoremove dereferences thefreed pathname while comparing rules.Move the temporary-tree put to audit_rule_change(), the caller that ownsdeletion templates.  Keep it in the AUDIT_DEL_RULE cleanup so bothsuccessful deletion and -ENOENT still release the parser-owned tree. (CVE-2026-89643)In the Linux kernel, the following vulnerability has been resolved:ceph: bound xattr value length in __build_xattrs() (CVE-2026-89649)In the Linux kernel, the following vulnerability has been resolved:ceph: bound num_export_targets array for mds info v2/v3 (CVE-2026-89650)In the Linux kernel, the following vulnerability has been resolved:ceph: reject export_targets ranks >= CEPH_MAX_MDS in mdsmap decode (CVE-2026-89653)In the Linux kernel, the following vulnerability has been resolved:ceph: fix UAF in __kick_flushing_caps() on cf entry freed during unlock (CVE-2026-89655)In the Linux kernel, the following vulnerability has been resolved:libceph: reject buckets with mismatched CRUSH ids (CVE-2026-89656)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent lock owner use-after-free during client teardown (CVE-2026-89662)In the Linux kernel, the following vulnerability has been resolved:nfsd: revoke copy-notify stateids before dropping their reference (C