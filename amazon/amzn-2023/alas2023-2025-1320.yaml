Vulnerability:
    Description: A client that connects to cupsd but sends slow messages, e.g. only one byte per second, delays cupsd as a whole, such that it becomes unusable by other clients. (CVE-2025-58436)A user in the lpadmin group can use the cups web ui to change the config and insert a malicious line.Then the cupsd process which runs as root will parse the new config and cause an out-of-bound write. (CVE-2025-61915)
