Vulnerability:
    Description: Calling any of the Parse functions on Go source code which contains deeply nested literals can cause a panic due to stack exhaustion. (CVE-2024-34155)Calling Decoder.Decode on a message which contains deeply nested structures can cause a panic due to stack exhaustion. This is a follow-up to CVE-2022-30635. (CVE-2024-34156)Calling Parse on a "// +build" build tag line with deeply nested expressions can cause a panic due to stack exhaustion. (CVE-2024-34158)
