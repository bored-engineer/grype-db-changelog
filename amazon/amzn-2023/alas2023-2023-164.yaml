Vulnerability:
    Description: Redis is an in-memory database that persists on disk. Starting in version 7.0.8 and prior to version 7.0.10, authenticated users can use the MSETNX command to trigger a runtime assertion and termination of the Redis server process. The problem is fixed in Redis version 7.0.10. (CVE-2023-28425)Authenticated users can use the HINCRBYFLOAT command to create an invalid hash field that may later crash Redis on access. (CVE-2023-28856)
