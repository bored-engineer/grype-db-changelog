    Description: "A heap out-of-bounds write was found in the Linux kernelâ\x80\x99s NFS server (nfsd) when it caches replies to NFSv4.1+ SEQUENCE operations. An NFS client that negotiates a minimal cached reply size can cause reply data it controls to be written past the end of a reply-cache slot. This could lead to a denial of service or memory corruption. (CVE-2026-99362)In the Linux kernel, the following vulnerability has been resolved:net: restore refcount ordering for lockless socket access (CVE-2026-99676)"
