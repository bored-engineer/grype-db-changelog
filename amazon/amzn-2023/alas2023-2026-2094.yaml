    Description: Inconsistent interpretation of http requests ('http request/response smuggling') in .NET allows an unauthorized attacker to bypass a security feature over a network. (CVE-2026-62899)Improper removal of sensitive information before storage or transfer in .NET allows an unauthorized attacker to disclose information over a network. (CVE-2026-62900)Unchecked input for loop condition in .NET allows an unauthorized attacker to deny service over a network. (CVE-2026-62901)Uncaught exception in .NET allows an authorized attacker to elevate privileges locally. (CVE-2026-62909)
