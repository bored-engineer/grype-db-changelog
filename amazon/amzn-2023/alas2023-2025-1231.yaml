    Description: Improper link resolution before file access ('link following') in .NET allows an authorized attacker to elevate privileges locally. (CVE-2025-55247)Inadequate encryption strength in .NET, .NET Framework, Visual Studio allows an authorized attacker to disclose information over a network. (CVE-2025-55248)Inconsistent interpretation of http requests ('http request/response smuggling') in ASP.NET Core allows an authorized attacker to bypass a security feature over a network. (CVE-2025-55315)
