Vulnerability:
    Description: In a multiply-corrupted DWARF object libdwarf may try to dealloc(free) an allocation twice.Results are unpredictable and various. This has been a possibility since we added code to prevent leaks when generating 'unattached' Dwarf_Error records (where there is no Dwarf_Debug available at the point of error).The problem was introduced in libdwarf-0.1.0 in 2021. (CVE-2024-2002)
