# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: AWS is aware of CVE-2024-41110, an issue affecting the Moby open source project, packaged in Amazon Linux as "docker". Docker is a component of several open source container management systems.This issue does not affect the default configuration of docker. If an authorization plugin is enabled, a specially-crafted API request to the docker daemon will be forwarded to the authorization plugin in a way that could lead to unintended actions, such as privilege escalation. Enabling an authorization plugin is an atypical configuration. The affected API endpoint is not exposed to the network in either the default, typical, or recommended configurations. The default EKS and ECS configurations do not expose the API endpoint to the network. Enabling a Docker authorization plugin is not supported when using ECS. Finally, docker is not installed on EKS AMIs newer than 1.24. Although Docker is installed in EKS 1.24 and earlier, EKS does not support authorization plugins.Updated docker packages addressing the issue are available for Amazon Linux 2 (docker-20.10.25-1.amzn2.0.5 and docker-25.0.6-1.amzn2.0.1) and for Amazon Linux 2023 (docker-25.0.6-1amzn2023.0.1). AWS recommends that customers using docker upgrade to these or later versions. (CVE-2024-41110)
    FixedIn:
        - Name: docker
          NamespaceName: amzn:2023
          Version: 25.0.6-1.amzn2023.0.1
          VersionFormat: rpm
        - Name: docker-debuginfo
          NamespaceName: amzn:2023
          Version: 25.0.6-1.amzn2023.0.1
          VersionFormat: rpm
        - Name: docker-debugsource
          NamespaceName: amzn:2023
          Version: 25.0.6-1.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS-2024-674.html
    Metadata:
        CVE:
            - Name: CVE-2024-41110
    Name: ALAS-2024-674
    NamespaceName: amzn:2023
    Severity: High
