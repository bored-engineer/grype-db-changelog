Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:btrfs: do proper folio cleanup when cow_file_range() failed (CVE-2024-57976)In the Linux kernel, the following vulnerability has been resolved:kernel: be more careful about dup_mmap() failures and uprobe registering (CVE-2025-21709)In the Linux kernel, the following vulnerability has been resolved:block: fix queue freeze vs limits lock order in sysfs store methods (CVE-2025-21807)In the Linux kernel, the following vulnerability has been resolved:block: mark GFP_NOIO around sysfs ->store() (CVE-2025-21817)In the Linux kernel, the following vulnerability has been resolved:iommu/vt-d: Avoid use of NULL after WARN_ON_ONCE (CVE-2025-21833)In the Linux kernel, the following vulnerability has been resolved:net: better track kernel sockets lifetime (CVE-2025-21884)In the Linux kernel, the following vulnerability has been resolved:bnxt_en: Mask the bd_cnt field in the TX BD properly (CVE-2025-22108)'
