Vulnerability:
    Description: A bounds-checking flaw in the X.Org Server's XvShmPutImage handling can result in an out-of-bounds read or write, potentially leading to server crashes or memory corruption. (CVE-2026-109092)A flaw in the X.Org Server's XTestFakeInput handling can result in a stack out-of-bounds write, potentially leading to server crashes or stack memory corruption. (CVE-2026-109093)An integer overflow flaw in the X.Org Server's glamor Xv image size computation can result in out-of-bounds reads, potentially leading to server crashes or unintended memory access. (CVE-2026-109095)A flaw in the X.Org Server's XvPutImage length validation can allow requests with missing image data to be processed, potentially leading to server crashes or misbehavior. (CVE-2026-109096)A flaw in the X.Org Server's XvQueryImageAttributes reply handling can result in clients receiving an incorrect data size value, potentially leading to improper buffer allocation or usage. (CVE-2026-109903)
