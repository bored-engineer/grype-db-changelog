# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:smb: client: fix UAF and buffer leak in cifs_check_trans2() for malformed secondary T2 (CVE-2026-89637)In the Linux kernel, the following vulnerability has been resolved:ceph: bound copied dentry name length in NFS export get_nameceph_get_name() copies the MDS-supplied name into the caller''sNAME_MAX-sized buffer with memcpy(name, rinfo->dname, rinfo->dname_len)and then writes name[rinfo->dname_len] = 0, without checking dname_lenagainst NAME_MAX. A malicious or buggy MDS that returns a LOOKUPNAME replywith dname_len > NAME_MAX overflows the buffer. __get_snap_name() copiesrde->name / rde->name_len the same unchecked way.Impact: a malicious or compromised Ceph MDS overflows the NAME_MAX namebuffer in a client''s NFS-export get_name path, a slab out-of-bounds writereported by KASAN. Reachable when a CephFS mount is re-exported over NFS.Add ceph_export_copy_name(), which rejects lengths above NAME_MAX with-ENAMETOOLONG before the copy, and use it in both ceph_get_name() and__get_snap_name(). (CVE-2026-89652)In the Linux kernel, the following vulnerability has been resolved:bpf: Reject rdonly/rdwr_buf_size kfunc arguments that exceed u32 max (CVE-2026-93125)In the Linux kernel, the following vulnerability has been resolved:ipv6: sr: restore network header before routing and forwarding (CVE-2026-98096)'
