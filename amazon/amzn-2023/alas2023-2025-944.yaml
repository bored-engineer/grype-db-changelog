Vulnerability:
    Description: golang-jwt is a Go implementation of JSON Web Tokens. Prior to5.2.2 and 4.5.2, the function parse.ParseUnverified splits (via a call to strings.Split) its argument (which is untrusted data) on periods. As a result, in the face of a malicious request whose Authorization header consists of Bearer  followed by many period characters, a call to that function incurs allocations to the tune of O(n) bytes (where n stands for the length of the function's argument), with a constant factor of about 16. This issue is fixed in 5.2.2 and 4.5.2. (CVE-2025-30204)
    FixedIn:
        - Name: runfinch-finch
          NamespaceName: amzn:2023
          Version: 1.7.2-1.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2025-944.html
