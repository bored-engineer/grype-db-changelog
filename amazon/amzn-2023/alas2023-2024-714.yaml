    Description: 'In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: use timestamp to check for set element timeout (CVE-2024-27397)In the Linux kernel, the following vulnerability has been resolved:ima: Fix use-after-free on a dentry''s dname.name (CVE-2024-39494)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix overrunning reservations in ringbuf (CVE-2024-41009)In the Linux kernel, the following vulnerability has been resolved:ata: libata-core: Fix double free on error (CVE-2024-41087)In the Linux kernel, the following vulnerability has been resolved:drm/i915/gt: Fix potential UAF by revoke of fence registers (CVE-2024-41092)In the Linux kernel, the following vulnerability has been resolved:bpf: Mark bpf prog stack with kmsan_unposion_memory in interpreter mode (CVE-2024-42063)In the Linux kernel, the following vulnerability has been resolved:bpf: Take return from set_memory_ro() into account with bpf_prog_lock_ro() (CVE-2024-42068)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: fully validate NFT_DATA_VALUE on store to data registers (CVE-2024-42070)In the Linux kernel, the following vulnerability has been resolved:RDMA/restrack: Fix potential invalid address access (CVE-2024-42080)In the Linux kernel, the following vulnerability has been resolved:ftruncate: pass a signed offset (CVE-2024-42084)In the Linux kernel, the following vulnerability has been resolved:pinctrl: fix deadlock in create_pinctrl() when handling -EPROBE_DEFER (CVE-2024-42090)In the Linux kernel, the following vulnerability has been resolved:x86: stop playing stack games in profile_pc() (CVE-2024-42096)In the Linux kernel, the following vulnerability has been resolved:crypto: ecdh - explicitly zeroize private_key (CVE-2024-42098)'
