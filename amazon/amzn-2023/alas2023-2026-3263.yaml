# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A vulnerability exists in NGINX Plus and NGINX Open Source when a location is configured that uses the alias directive together with rewrite and a set or return directive referencing the $request_filename variable. Alternatively, the same result could be achieved when the $request_filename variable is used in an access log format directive. An unauthenticated attacker along with conditions beyond their control can exploit this vulnerability by sending crafted HTTP requests. This may cause a heap buffer overflow in the NGINX worker process leading to a restart. Additionally, attackers can execute code on systems with Address Space Layout Randomization (ASLR) disabled or when the attacker can bypass ASLR.Impact:This vulnerability may allow remote attackers to cause a denial-of-service (DoS) on the NGINX system or to possibly trigger a code execution. There is no control plane exposure; this is a data plane issue only.Note: Software versions which have reached End of Technical Support (EoTS) are not evaluated. (CVE-2026-15176)A vulnerability exists in NGINX Plus and NGINX Open Source when a map directive uses regex matching and the root directive or access log format references the map''s regex capture variables before referencing the map output variable. Alternatively, the same result could be achieved by using a non-cacheable variable in a string expression under certain conditions. An unauthenticated attacker along with conditions beyond their control can exploit this vulnerability by sending crafted HTTP requests. This may cause a heap buffer overflow in the NGINX worker process leading to a restart. Additionally, attackers can execute code on systems with Address Space Layout Randomization (ASLR) disabled or when the attacker can bypass ASLR.Impact:This vulnerability may allow remote attackers to cause a denial-of-service (DoS) on the NGINX system or to possibly trigger a code execution. There is no control plane exposure; this is a data plane issue only.Note: Software versions which have reached End of Technical Support (EoTS) are not evaluated. (CVE-2026-93479)DescriptionNGINX Plus and NGINX Open Source have a vulnerability in the ngx_http_v3_module module. When using HTTP/3 withproxy_request_buffering on directive, an unauthenticated attacker may be able to inject data in the proxied request.ImpactThis vulnerability may allow remote attackers toinject data in the proxied request.  There is no control plane exposure; this is a data plane issue only.Note: Software versions which have reached End of Technical Support (EoTS) are not evaluated. (CVE-2026-95101)NGINX Plus and NGINX Open Source have a vulnerability in the ngx_http_core_module module. When asynchronous file I/O (AIO) is enabled in certain configurations, processing a Server Side Includes (SSI) page containing "include virtual" commands may trigger a Use-After-Free (UAF) in the NGINX worker process. This may cause memory corruption or a worker process crash. Additionally, attackers can execute code on systems with Address Space Layout Randomization (ASLR) disabled or when the attacker can bypass ASLR.Impact:This vulnerability may allow remote attackers to cause a denial-of-service (DoS) on the NGINX system, corrupt its memory, or possibly trigger code execution. There is no control plane exposure; this is a data plane issue only.Note: Software versions which have reached End of Technical Support (EoTS) are not evaluated. (CVE-2026-97205)DescriptionWhen NGINX Plus or NGINX Open Source is configured with ssl_session_cacheshared:name:sizewithout an explicit ssl_session_ticket_key file directives to automatically rotate SSL session ticket keys, a remote unauthenticated attacker is able to forge client SSL sessionsin a non-deterministic manner that is beyond the attacker''s control. An attacker could leverage this vulnerability to bypass verification of client certificates.ImpactThis vulnerability can lead to the exposure of resources or functionality to unintended actors, possibly providing attackers with access to sensitive information. There is no control plane exposure; this is a data plane issue only.Note: Software versions which have reached End of Technical Support (EoTS) are not evaluated. (CVE-2026-97629)'
