# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: The Libreswan Project was notified of an issue causing libreswan to restart under some IKEv2 retransmit scenarios when a connection is configured to use PreSharedKeys (authby=secret) and the connection cannot find a matching configured secret. When such a connection is automatically added on startup using the auto= keyword, it can cause repeated crashes leading to a Denial of Service. (CVE-2024-2357)
    FixedIn:
        - Name: libreswan
          NamespaceName: amzn:2023
          Version: 4.12-3.amzn2023.0.1
          VersionFormat: rpm
        - Name: libreswan-debuginfo
          NamespaceName: amzn:2023
          Version: 4.12-3.amzn2023.0.1
          VersionFormat: rpm
        - Name: libreswan-debugsource
          NamespaceName: amzn:2023
          Version: 4.12-3.amzn2023.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS-2024-587.html
