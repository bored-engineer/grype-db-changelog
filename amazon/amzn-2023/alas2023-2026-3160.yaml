# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Previously, after a channel has been established, a malicious peer could send crafted messages that would deadlock the entire connection. Now, we handle all RFC 4254 channel messages; global requests are handled explicitly. Then, treat all other messages as a protocol error and tear the connection down instead of buffering and blocking. (CVE-2026-56855)Previously, a channel registered in the mux's chanList is not usable until it is established. A malicious peer was able flood the channel's incomingRequests, deadlocking the entire connection. Now, we add an atomic established state, set when a channel becomes usable. Until such a time, handlePacket drops every packet other than the open confirmation/failure, without blocking and without tearing down the connection. (CVE-2026-78662)
    FixedIn:
        - Available:
            Date: "2026-10-12"
            Kind: advisory
          Name: amazon-ssm-agent
          NamespaceName: amzn:2023
          Version: 3.3.5390.0-1.amzn2023
          VersionFormat: rpm
