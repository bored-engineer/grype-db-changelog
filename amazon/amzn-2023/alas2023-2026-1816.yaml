Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:mm/pagewalk: fix race between concurrent split and refault (CVE-2026-31456)In the Linux kernel, the following vulnerability has been resolved:mm/userfaultfd: fix hugetlb fault mutex hash calculation (CVE-2026-31575)In the Linux kernel, the following vulnerability has been resolved:fuse: reject oversized dirents in page cache (CVE-2026-31694)In the Linux kernel, the following vulnerability has been resolved:net/packet: fix TOCTOU race on mmap''d vnet_hdr in tpacket_snd() (CVE-2026-31700)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix OOB read in smb2_ioctl_query_info QUERY_INFO path (CVE-2026-31708)In the Linux kernel, the following vulnerability has been resolved:smb: client: validate the whole DACL before rewriting it in cifsacl (CVE-2026-31709)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: validate rec->used in journal-replay file record check (CVE-2026-31716)In the Linux kernel, the following vulnerability has been resolved:Buffer overflow in drivers/xen/sys-hypervisor.c (CVE-2026-31786)In the Linux kernel, the following vulnerability has been resolved:xen/privcmd: fix double free via VMA splitting (CVE-2026-31787)In the Linux kernel, the following vulnerability has been resolved:net: af_key: zero aligned sockaddr tail in PF_KEY exports (CVE-2026-43088)In the Linux kernel, the following vulnerability has been resolved:x86: shadow stacks: proper error handling for mmap lock (CVE-2026-43109)In the Linux kernel, the following vulnerability has been resolved:smb: client: require a full NFS mode SID before reading mode bits (CVE-2026-43350)'
