# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A flaw was found in Curl, where it inadvertently kept the SSL session ID for connections in its cache even when the verify status, OCSP stapling test, failed. A subsequent transfer to the same hostname could succeed if the session ID cache were still fresh, which then skips the verify status check. (CVE-2024-0853)
