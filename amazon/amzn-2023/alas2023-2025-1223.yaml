Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:fs: relax assertions on failure to encode file handles (CVE-2024-57924)In the Linux kernel, the following vulnerability has been resolved:net: Fix null-ptr-deref by sock_lock_init_class_and_name() and rmmod. (CVE-2025-23143)In the Linux kernel, the following vulnerability has been resolved:btrfs: adjust subpage bit start based on sectorsize (CVE-2025-37931)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix oob access in cgroup local storage (CVE-2025-38502)In the Linux kernel, the following vulnerability has been resolved:cifs: prevent NULL pointer dereference in UTF16 conversion (CVE-2025-39838)In the Linux kernel, the following vulnerability has been resolved:mm: slub: avoid wake up kswapd in set_track_prepare (CVE-2025-39843)In the Linux kernel, the following vulnerability has been resolved:mm: move page table sync declarations to linux/pgtable.h (CVE-2025-39844)In the Linux kernel, the following vulnerability has been resolved:x86/mm/64: define ARCH_PAGE_TABLE_SYNC_MASK and arch_sync_kernel_mappings() (CVE-2025-39845)In the Linux kernel, the following vulnerability has been resolved:fs: writeback: fix use-after-free in __mark_inode_dirty() (CVE-2025-39866)In the Linux kernel, the following vulnerability has been resolved:mm/damon/sysfs: fix use-after-free in state_show() (CVE-2025-39877)In the Linux kernel, the following vulnerability has been resolved:libceph: fix invalid accesses to ceph_connection_v1_info (CVE-2025-39880)In the Linux kernel, the following vulnerability has been resolved:kernfs: Fix UAF in polling when open file is released (CVE-2025-39881)In the Linux kernel, the following vulnerability has been resolved:mm/memory-failure: fix VM_BUG_ON_PAGE(PagePoisoned(page)) when unpoison memory (CVE-2025-39883)In the Linux kernel, the following vulnerability has been resolved:netfilter: br_netfilter: do not check confirmed bit in br_nf_local_in() after confirm (CVE-2025-39894)In the Linux kernel, the following vulnerability has been resolved:e1000e: fix heap overflow in e1000_set_eeprom (CVE-2025-39898)In the Linux kernel, the following vulnerability has been resolved:mm/slub: avoid accessing metadata when pointer is invalid in object_err() (CVE-2025-39902)In the Linux kernel, the following vulnerability has been resolved:mm/damon/lru_sort: avoid divide-by-zero in damon_lru_sort_apply_parameters() (CVE-2025-39909)In the Linux kernel, the following vulnerability has been resolved:tcp_bpf: Call sk_msg_free() when tcp_bpf_send_verdict() fails to allocate psock->cork. (CVE-2025-39913)In the Linux kernel, the following vulnerability has been resolved:tracing: Silence warning when chunk allocation fails in trace_pid_write (CVE-2025-39914)In the Linux kernel, the following vulnerability has been resolved:mm/damon/reclaim: avoid divide-by-zero in damon_reclaim_apply_parameters() (CVE-2025-39916)In the Linux kernel, the following vulnerability has been resolved:x86/vmscape: Add conditional IBPB mitigationVMSCAPE is a vulnerability that exploits insufficient branch predictor isolation between a guest and a userspace hypervisor (like QEMU). Existing mitigations already protect kernel/KVM from a malicious guest. Userspace can additionally be protected by flushing the branch predictors after a VMexit.Since it is the userspace that consumes the poisoned branch predictors, conditionally issue an IBPB after a VMexit and before returning to userspace. Workloads that frequently switch between hypervisor and userspace will incur the most overhead from the new IBPB.This new IBPB is not integrated with the existing IBPB sites. For instance, a task can use the existing speculation control prctl() to get an IBPB at context switch time. With this implementation, the IBPB is doubled up: one at context switch and another before running userspace. The intent is to integrate and optimize these cases post-embargo.[ dhansen: elaborate on suboptimal IBPB solution ] (CVE-2025-40300)'
