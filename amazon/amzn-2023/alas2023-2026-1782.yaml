Vulnerability:
    Description: CVE-2026-46529 is a command injection vulnerability in Evince, Atril, and Xreader caused by missing quoting of shell-like input in ev_spawn() in ev-application.c. (CVE-2026-46529)An unsoundness issue (RUSTSEC-2026-0097) was also found in the bundled Rust rand crate. ThreadRng methods use unsafe code that can create aliased mutable references when a custom logger accesses rand::rng() or rand::thread_rng() during reseeding, resulting in undefined behavior.
