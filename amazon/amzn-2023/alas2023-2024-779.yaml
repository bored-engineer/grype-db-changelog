Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:ext4: do not create EA inode under buffer lock (CVE-2024-40972)In the Linux kernel, the following vulnerability has been resolved:PCI/MSI: Fix UAF in msi_capability_init (CVE-2024-41096)In the Linux kernel, the following vulnerability has been resolved:ata: libata-core: Fix null pointer dereference on error (CVE-2024-41098)In the Linux kernel, the following vulnerability has been resolved:btrfs: fix extent map use-after-free when adding pages to compressed bio (CVE-2024-42314)In the Linux kernel, the following vulnerability has been resolved:kcm: Serialise kcm_sendmsg() for the same socket. (CVE-2024-44946)In the Linux kernel, the following vulnerability has been resolved:mptcp: pm: avoid possible UaF when selecting endp (CVE-2024-44974)In the Linux kernel, the following vulnerability has been resolved:netfilter: flowtable: validate vlan header (CVE-2024-44983)In the Linux kernel, the following vulnerability has been resolved:ipv6: fix possible UAF in ip6_finish_output2() (CVE-2024-44986)In the Linux kernel, the following vulnerability has been resolved:vfs: Don''t evict inode under the inode lru traversing context (CVE-2024-45003)In the Linux kernel, the following vulnerability has been resolved:ethtool: check device is present when getting link settings (CVE-2024-46679)In the Linux kernel, the following vulnerability has been resolved:soc: qcom: cmd-db: Map shared memory as WC, not WB (CVE-2024-46689)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: Make ICC_*SGI*_EL1 undef in the absence of a vGICv3 (CVE-2024-46707)In the Linux kernel, the following vulnerability has been resolved:mptcp: pm: fix ID 0 endp usage after multiple re-creations (CVE-2024-46711)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: SHAMPO, Fix incorrect page release (CVE-2024-46717)In the Linux kernel, the following vulnerability has been resolved:fou: Fix null-ptr-deref in GRO. (CVE-2024-46763)In the Linux kernel, the following vulnerability has been resolved:fsnotify: clear PARENT_WATCHED flags lazily (CVE-2024-47660)'
