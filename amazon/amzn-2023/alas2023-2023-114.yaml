Vulnerability:
    Description: 'A flaw was found in the Curl package, where the HSTS mechanism would be ignored by subsequent transfers when done on the same command line because the state would not be properly carried. This issue may result in limited confidentiality and integrity. (CVE-2023-23914)A flaw was found in the Curl package, where the HSTS mechanism could fail when multiple transfers are done in parallel, as the HSTS cache file gets overwritten by the most recently completed transfer. This issue may result in limited confidentiality and integrity. (CVE-2023-23915)curl: HTTP multi-header compression denial of service (CVE-2023-23916)'
