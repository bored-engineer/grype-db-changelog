# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Rustls from 0.23.13 before 0.23.45 accepts TLS 1.3 handshake messages at the wrong encryption level when they follow a key-changing message in the same record, because Deframer::aligned does not enforce RFC 8446 record-boundary alignment. A peer or on-path attacker can pack a plaintext EncryptedExtensions with the ServerHello, which rustls accepts unencrypted. (CVE-2026-123613)
    FixedIn:
        - Available:
            Date: "2026-11-27"
            Kind: advisory
          Name: amazon-efs-utils
          NamespaceName: amzn:2023
          Version: 3.3.2-1.amzn2023
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2026-3529.html
