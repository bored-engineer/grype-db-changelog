Vulnerability:
    Description: '""PHP''s session upload progress feature can write attacker-controlled data using one session serialization format and later read it using another. A mismatched decoder can interpret part of a session key as serialized object data. An application with a suitable object gadget chain can then execute code with the privileges of the PHP worker.This is a configuration-dependent deserialization issue, separate from the stale global state vulnerability in CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp). Session upload progress was introduced in PHP 5.4.0, so older unsupported releases may also be affected. (CVE-2026-115560)Partially overwritten session files can lead to remote code execution (CVE-2026-126714)PHAR OpenSSL signature bypass via algorithm downgrade (CVE-2026-128090)PHP can fail to discard unread bytes from an HTTP request body before reusing a persistent PHP-FPM or LSAPI connection. In PHP-FPM, an unauthenticated attacker can make those bytes form a separate FastCGI request, bypass front-end routing and execute attacker-controlled PHP code with the privileges of the worker.PHP-FPM request smuggling through an unread HTTP request body - GHSA-qc49-hpvq-g2w6 (CVE-2026-129289)'
