tup_pipedir_sb() directly and never refreshes that field.The umount path also removes the directory without clearingclnt->pipefs_sb.After a late pipefs mount or any remount, rpc_clnt_remove_pipedir()compares the current superblock against a stale pipefs_sb pointer andskips cleanup, leaving pipefs dentries whose inode private data stillpoints at a freed rpc_clnt, leading to a potential use-after-free duringsubsequent rpc_info_open() or rpc_show_info() calls.Fix this by properly updating clnt->pipefs_sb upon mount events andclearing it during unmount or failure paths. (CVE-2026-89543)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: fix gssx_dec_option_array error path bugs (CVE-2026-89544)In the Linux kernel, the following vulnerability has been resolved:sunrpc: defer rq_argp and rq_resp free until after RCU grace period (CVE-2026-89545)In the Linux kernel, the following vulnerability has been resolved:ipv6: rpl: fix NULL dereference of idev in ipv6_rpl_srh_rcv() (CVE-2026-89561)In the Linux kernel, the following vulnerability has been resolved:ip: orphan prefetched skbs before multicast forwarding (CVE-2026-89564)In the Linux kernel, the following vulnerability has been resolved:acpi/apei/ghes: Use raw_spinlock_t for CXL CPER work locks (CVE-2026-89589)In the Linux kernel, the following vulnerability has been resolved:erofs: skip sufficiently large global buffers when resizing (CVE-2026-89602)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix UAF and buffer leak in cifs_check_trans2() for malformed secondary T2 (CVE-2026-89637)In the Linux kernel, the following vulnerability has been resolved:btrfs: fix extent map leak in NOCOW direct I/O write (CVE-2026-89644)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent client use-after-free during delegation revoke (CVE-2026-89659)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent client use-after-free during admin state revocationA stateid holds only a bare pointer to its nfs4_client; a stateidreference does not pin it.  The client survives only because__destroy_client() drains its stateids before free_client() runs.nfsd4_revoke_states() drops nn->client_lock across revoke_one_stid(),which dereferences the client to revoke a stateid and readclp->cl_minorversion.  A teardown racing the dropped lock can freethe client first.Pinning cl_rpc_users under client_lock blocks the DESTROY_CLIENTID andEXCHANGE_ID teardown, which refuses while cl_rpc_users is non-zero.force_expire_client() ignores it: once its wait for cl_rpc_users toreach zero has passed, a later pin goes unnoticed.Under client_lock, skip a client whose cl_time is already zero --force_expire_client() clears it there before waiting -- otherwise pincl_rpc_users before dropping the lock.  The walk then either sees theexpiry and skips, or pins in time for that wait to cover the revoke. (CVE-2026-89660)In the Linux kernel, the following vulnerability has been resolved:nfsd: close shrinker/GC/fsnotify vs per-net shutdown race in filecache (CVE-2026-89667)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix stale s2s_cp_stateids IDR entry for async COPY (CVE-2026-89676)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix clock domain mismatch in clients_still_reclaiming() (CVE-2026-89685)In the Linux kernel, the following vulnerability has been resolved:nfsd: check nfsd4_acl_to_attr() return value in nfsd4_create()nfsd4_create() stores the return value of nfsd4_acl_to_attr() instatus, but the switch(create->cr_type) block unconditionallyoverwrites it in every branch. ACL translation errors are silentlydiscarded, and the CREATE proceeds without the requested ACL.Add an early exit check after nfsd4_acl_to_attr(), matching thepattern already used in nfsd4_setattr().[ cel: prefer NFS4ERR_BADTYPE over NFS4ERR_ATTRNOTSUPP ] (CVE-2026-89693)In the Linux kernel, the following vuln