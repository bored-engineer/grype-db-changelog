# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: unauthenticated udp packet crashes AD DC nbt server (CVE-2026-3238)Samba file servers and classic (non-AD) domain controllers offer theSamValidatePasswordChange and SamValidatePasswordReset RPC services on theSAMR DCE/RPC service when running over NCACN_IP_TCP. Both services pass ausername and password to the "check password script" that can be configuredin smb.conf.If the "check password script" is configured with the %usubstitution character, the client-controlled username is passed tothe "check password script" without escaping shell meta-characters,leading to a remote command execution vulnerability.This is a non-standard configuration in several ways:It affects Samba file servers and classic (non-AD) domain controllersthat have the "check password script" configured with the %usubstitution character. Active Directory Domain Controllers are notaffected, they do not expand the username via the %u substitutioncharacter.The problem is much less dangerous if %u has single quotes directlyaround it, e.g. '%u', but it's still possible to injectcommand line options.Standard Samba file servers and classic domain controllers are alsoonly affected if the samba-dcerpcd service is started as a systemservice, which can only happen if "rpc start on demand helpers" is setto the non-default setting "no". In the default configuration forDCE/RPC, smbd starts the samba-dcerpcd in a way that makes thevulnerable code inaccessible. (CVE-2026-4408)Samba passes the client-controlled job description string to thecommand configured with the "print command" setting via the "%J"substitution character without escaping shell meta characters. Thisleads to a remote code execution vulnerability.Print servers configured with "printing = cups" or "printing =iprint", and print servers that do not have the %J substitutioncharacter in the "print command" setting are not affected.The problem is much less dangerous if %J has single quotes directlyaround it, e.g. '%J', but it's still possible to injectcommand line options.By default, print servers allow guest users to print. (CVE-2026-4480)
