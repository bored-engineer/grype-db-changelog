    Description: "In the Linux kernel, the following vulnerability has been resolved:xen-netback: Fix UAF when reading statistics data (CVE-2026-100080)In the Linux kernel, the following vulnerability has been resolved:xen-netback: defer xenvif_mcast_addr_list_free() (CVE-2026-100081)In the Linux kernel, the following vulnerability has been resolved:scsi: libiscsi: Validate the task named by a management response (CVE-2026-99152)In the Linux kernel, the following vulnerability has been resolved:keys: Protect the type name while describing a key (CVE-2026-99224)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix fiemap wild read on empty truncated response (CVE-2026-99274)A heap out-of-bounds write was found in the Linux kernelâ\x80\x99s NFS server (nfsd) when it caches replies to NFSv4.1+ SEQUENCE operations. An NFS client that negotiates a minimal cached reply size can cause reply data it controls to be written past the end of a reply-cache slot. This could lead to a denial of service or memory corruption. (CVE-2026-99362)In the Linux kernel, the following vulnerability has been resolved:NFSv4/flexfiles: Use the full 64-bit stripe_unit (CVE-2026-99374)"
