# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Spreadsheet::ParseExcel version 0.65 is a Perl module used for parsing Excel files. Spreadsheet::ParseExcel is vulnerable to an arbitrary code execution (ACE) vulnerability due to passing unvalidated input from a file into a string-type "eval". Specifically, the issue stems from the evaluation of Number format strings (not to be confused with printf-style format strings) within the Excel parsing logic. (CVE-2023-7101)
    FixedIn:
        - Available:
            Date: "2024-01-22"
            Kind: advisory
          Name: perl-Spreadsheet-ParseExcel
          NamespaceName: amzn:2023
          Version: 0.6500-28.amzn2023.0.3
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2024-491.html
    Metadata:
        CVE:
            - Name: CVE-2023-7101
    Name: ALAS2023-2024-491
    NamespaceName: amzn:2023
    Severity: High
