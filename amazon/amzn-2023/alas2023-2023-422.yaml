# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A flaw in the kernel Xen event handler can cause a deadlock with Xen console handling in unprivileged Xen guests. (CVE-2023-34324)An improper input validation flaw was found in the eBPF subsystem in the Linux kernel. The issue occurs due to a lack of proper validation of dynamic pointers within user-supplied eBPF programs prior to executing them. This may allow an attacker with CAP_BPF privileges to escalate privileges and execute arbitrary code in the context of the kernel. (CVE-2023-39191)In the Linux kernel, the following vulnerability has been resolved:perf/x86/lbr: Filter vsyscall addresses (CVE-2023-52476)In the Linux kernel, the following vulnerability has been resolved:usb: hub: Guard against accesses to uninitialized BOS descriptors (CVE-2023-52477)In the Linux kernel, the following vulnerability has been resolved:arm64: errata: Add Cortex-A520 speculative unprivileged load workaround (CVE-2023-52481)In the Linux kernel, the following vulnerability has been resolved:net: fix possible store tearing in neigh_periodic_work() (CVE-2023-52522)In the Linux kernel, the following vulnerability has been resolved:bpf, sockmap: Reject sk_msg egress redirects to non-TCP sockets (CVE-2023-52523)In the Linux kernel, the following vulnerability has been resolved:iommu/vt-d: Avoid memory allocation in iommu_suspend() (CVE-2023-52559)A denial of service vulnerability was found in tipc_crypto_key_revoke in net/tipc/crypto.c in the Linux kernel''s TIPC subsystem. This flaw allows guests with local user privileges to trigger a deadlock and potentially crash the system. (CVE-2024-0641)'
