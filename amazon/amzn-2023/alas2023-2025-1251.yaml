# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'This vulnerability allows remote attackers to execute arbitrary code on affected installations of 7-Zip. Interaction with this product is required to exploit this vulnerability but attack vectors may vary depending on the implementation.The specific flaw exists within the handling of symbolic links in ZIP files. Crafted data in a ZIP file can cause the process to traverse to unintended directories. An attacker can leverage this vulnerability to execute code in the context of a service account.NOTE: Since p7zip/16.02+transitional.1 src:p7zip is only a empty source packageNOTE: depending on 7zip. Mark this version as fixed version.NOTE: https://github.com/ip7z/7zip/releases/tag/25.00NOTE: https://www.zerodayinitiative.com/advisories/ZDI-25-949/ (CVE-2025-11001)This vulnerability allows remote attackers to execute arbitrary code on affected installations of 7-Zip. Interaction with this product is required to exploit this vulnerability but attack vectors may vary depending on the implementation.The specific flaw exists within the handling of symbolic links in ZIP files. Crafted data in a ZIP file can cause the process to traverse to unintended directories. An attacker can leverage this vulnerability to execute code in the context of a service account.NOTE: depending on 7zip. Mark this version as fixed version.NOTE: https://github.com/ip7z/7zip/releases/tag/25.00NOTE: https://www.zerodayinitiative.com/advisories/ZDI-25-950/ (CVE-2025-11002)'
