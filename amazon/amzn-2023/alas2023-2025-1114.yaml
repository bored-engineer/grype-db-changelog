# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: fsockopen() doesn't regard hostname as well, hostname is terminated at the null byte. This can cause Server Side Request Forgery in general case. (CVE-2025-1220)Missing error checking could result in SQL injection and missing error handling could lead to crashes due to null pointer dereferences. (CVE-2025-1735)If a SoapVar instance is created with a fully qualified name larger than 2G, this will cause a NULL pointer dereference resulting in a segmentation fault, leading to a denial of service. (CVE-2025-6491)
