Vulnerability:
    Description: 'net/http: sensitive headers incorrectly sent after cross-domain redirectThe HTTP client drops sensitive headers after following a cross-domain redirect.For example, a request to a.com/ containing an Authorization header which isredirected to b.com/ will not send that header to b.com.In the event that the client received a subsequent same-domain redirect, however,the sensitive headers would be restored. For example, a chain of redirects froma.com/, to b.com/1, and finally to b.com/2 would incorrectly send the Authorizationheader to b.com/2.Thanks to Kyle Seely for reporting this issue. (CVE-2024-45336)crypto/x509: usage of IPv6 zone IDs can bypass URI name constraintsA certificate with a URI which has a IPv6 address with a zone ID mayincorrectly satisfy a URI name constraint that applies to the certificatechain.Certificates containing URIs are not permitted in the web PKI, so thisonly affects users of private PKIs which make use of URIs.Thanks to Juho Forsen of Mattermost for reporting this issue. (CVE-2024-45341)'
