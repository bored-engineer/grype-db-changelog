# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Potential integer and buffer overflow with DollarBlend during serializing a multiple master font for passing to Freetype. Fixed by changing a variable type from short to unsigned short and checking if a length variable exceeds permitted limit.Fixed in ghostpdl-10.05.0 (CVE-2025-27830)Text buffer overflow with long characters; the txt_get_unicode function was copying too few bytes from the fixed glyph name to unicode mapping tables. This was probably causing incorrect Unicode code points in relatively rare cases but not otherwise a problem. However, a badly formed GlyphNames2Unicode array attached to a font could cause the decoding to spill over the assigned buffer.Patched in ghostpdl-10.05.0 (CVE-2025-27831)
