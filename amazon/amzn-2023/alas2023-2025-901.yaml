    Description: 'In the Linux kernel, the following vulnerability has been resolved:netfilter: allow exp not to be removed in nf_ct_find_expectation (CVE-2023-52927)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix use-after-free of signing key (CVE-2024-53179)In the Linux kernel, the following vulnerability has been resolved:memcg: fix soft lockup in the OOM process (CVE-2024-57977)In the Linux kernel, the following vulnerability has been resolved:tpm: Change to kvalloc() in eventlog/acpi.c (CVE-2024-58005)In the Linux kernel, the following vulnerability has been resolved:sched/core: Prevent rescheduling when interrupts are disabled (CVE-2024-58090)In the Linux kernel, the following vulnerability has been resolved:pfifo_tail_enqueue: Drop new packet when sch->limit == 0 (CVE-2025-21702)In the Linux kernel, the following vulnerability has been resolved:smb: client: Add check for next_buffer in receive_encrypted_standard() (CVE-2025-21844)In the Linux kernel, the following vulnerability has been resolved:acct: perform last write from workqueue (CVE-2025-21846)In the Linux kernel, the following vulnerability has been resolved:geneve: Fix use-after-free in geneve_find_dev(). (CVE-2025-21858)In the Linux kernel, the following vulnerability has been resolved:tcp: drop secpath at the same time as we currently drop dst (CVE-2025-21864)In the Linux kernel, the following vulnerability has been resolved:bpf, test_run: Fix use-after-free issue in eth_skb_pkt_type() (CVE-2025-21867)In the Linux kernel, the following vulnerability has been resolved:mptcp: always handle address removal under msk socket lock (CVE-2025-21875)In the Linux kernel, the following vulnerability has been resolved:uprobes: Reject the shared zeropage in uprobe_write_opcode() (CVE-2025-21881)In the Linux kernel, the following vulnerability has been resolved:ovl: fix UAF in ovl_dentry_update_reval by moving dput() in ovl_link_up (CVE-2025-21887)In the Linux kernel, the following vulnerability has been resolved:ipvlan: ensure network headers are in skb linear part (CVE-2025-21891)In the Linux kernel, the following vulnerability has been resolved:tracing: Fix bad hist from corrupting named_triggers list (CVE-2025-21899)'
