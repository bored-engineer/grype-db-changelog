    Description: 'In the Linux kernel, the following vulnerability has been resolved:netfs: Fix netfs_read_folio() to wait on writeback (CVE-2026-64058)In the Linux kernel, the following vulnerability has been resolved:netfs: Fix missing locking around retry adding new subreqs (CVE-2026-64068)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: vgic: Handle race between interrupt affinity change and LPI disabling (CVE-2026-72288)In the Linux kernel, the following vulnerability has been resolved:sctp: add INIT verification after cookie unpacking (CVE-2026-72398)In the Linux kernel, the following vulnerability has been resolved:sctp: fix err_chunk memory leaks in INIT handling (CVE-2026-72413)In the Linux kernel, the following vulnerability has been resolved:netfilter: cttimeout: detach dataplane timeout policy and repurpose refcount (CVE-2026-74347)In the Linux kernel, the following vulnerability has been resolved:OPP: Fix race between OPP addition and lookup (CVE-2026-74405)In the Linux kernel, the following vulnerability has been resolved:xfrm: ah6: validate routing header segments_left (CVE-2026-80844)In the Linux kernel, the following vulnerability has been resolved:net: tun: bound receive headroom (CVE-2026-81000)'
