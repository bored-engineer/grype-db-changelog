Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:iommu/vt-d: Fix race condition during PASID entry replacement (CVE-2026-45945)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: fix missing run load for vcn0 in attr_data_get_block_locked() (CVE-2026-53027)In the Linux kernel, the following vulnerability has been resolved:fbdev: fbcon: fix out-of-bounds read in err_out of fbcon_do_set_font()When fbcon_do_set_font() fails (e.g., due to a memory allocation failureinside vc_resize() under heavy memory pressure), it jumps to the `err_out`label to roll back the console state. However, the current rollback logicforgets to restore the `hi_font` state, leading to a severe state machinecorruption.Earlier in the function, `set_vc_hi_font()` might be called to change`vc->vc_hi_font_mask` and mutate the screen buffer. If `vc_resize()`subsequently fails, the `err_out` path restores `vc_font.charcount`but entirely skips rolling back the `vc_hi_font_mask` and the screenbuffer.This mismatch leaves the terminal in a desynchronized state. Because`vc_hi_font_mask` remains set, the VT subsystem will still acceptcharacter indices greater than 255 from userspace and write them to thescreen buffer. Subsequent rendering calls (e.g., `fbcon_putcs()`) willthen use these inflated indices to access the reverted, 256-characterfont array, leading to a deterministic out-of-bounds read and potentialkernel memory disclosure.Fix this by adding the missing rollback logic for the `hi_font` maskand screen buffer in the error path. (CVE-2026-53402)In the Linux kernel, the following vulnerability has been resolved:xfs: fail recovery on a committed log item with no regionsIf the first op of a transaction is a bare transaction header(len == sizeof(struct xfs_trans_header)), xlog_recover_add_to_trans()adds an item but no region, leaving it on r_itemq with ri_cnt == 0 andri_buf == NULL.The header can be split across op records, so later ops may still addregions; the item is only invalid if the transaction commits with none.The runtime commit path never emits such a transaction, so this onlyhappens on a crafted log.  It came from an AI-assisted code audit of therecovery parser.xlog_recover_reorder_trans() calls ITEM_TYPE() on the item, which reads*(unsigned short *)item->ri_buf[0].iov_base and faults on the NULLri_buf.  Reject it there, before the commit handlers that also readri_buf[0].KASAN: null-ptr-deref in range [0x0000000000000000-0x0000000000000007]RIP: 0010:xlog_recover_reorder_trans (fs/xfs/xfs_log_recover.c:1836)xlog_recover_commit_trans (fs/xfs/xfs_log_recover.c:2043)xlog_recover_process_data (fs/xfs/xfs_log_recover.c:2501)xlog_do_recovery_pass (fs/xfs/xfs_log_recover.c:3244)xlog_recover (fs/xfs/xfs_log_recover.c:3493)xfs_log_mount (fs/xfs/xfs_log.c:618)xfs_mountfs (fs/xfs/xfs_mount.c:1034)xfs_fs_fill_super (fs/xfs/xfs_super.c:1938)vfs_get_tree (fs/super.c:1695)path_mount (fs/namespace.c:4161)__x64_sys_mount (fs/namespace.c:4367) (CVE-2026-64187)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: fix race between dump and ip_set_list resize (CVE-2026-64189)In the Linux kernel, the following vulnerability has been resolved:i2c: i801: fix hardware state machine corruption in error path (CVE-2026-64205)In the Linux kernel, the following vulnerability has been resolved:xfs: don''t wrap around quota ids in dqiterate (CVE-2026-64256)In the Linux kernel, the following vulnerability has been resolved:fuse-uring: remove request-less entries from ent_w_req_queue to fix NULL deref (CVE-2026-64258)In the Linux kernel, the following vulnerability has been resolved:fuse-uring: make a fuse_req on SQE commit only findable after memcpy (CVE-2026-64259)In the Linux kernel, the following vulnerability has been resolved:fuse-uring: Avoid queue->stopped races and set/read that value under lock (CVE-2026-64260)In the Linux kernel, the following vulnerability has been resolved:fuse-uring: 