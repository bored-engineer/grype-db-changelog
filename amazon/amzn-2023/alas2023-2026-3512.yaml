# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: When "Trailer" headers are sent by a client, the HTTP server internally uses the header values to populate the Request.Trailer map passed to the server handler. Because Request.Trailer is a map, each entry incurs memory overhead. For HTTP/2 servers, a malicious client can exploit this by sending a "Trailer" header that declares a large number of fields causing the server to allocate a disproportionate amount of memory while bypassing Server.MaxHeaderValueCount and Server.MaxHeaderBytes limits.This exploit is not applicable for HTTP/1 servers, which do not support  multiplexing a large number of requests over one TCP connection, and whose Server.MaxHeaderBytes are calculated differently.Server.MaxHeaderValueCount and Server.MaxHeaderBytes limits are now applied towards the trailer fields declared in "Trailer" headers. (CVE-2026-78659)
    FixedIn:
        - Available:
            Date: "2026-11-27"
            Kind: advisory
          Name: amazon-ssm-agent
          NamespaceName: amzn:2023
          Version: 3.3.5828.0-1.amzn2023
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2023/ALAS2023-2026-3512.html
