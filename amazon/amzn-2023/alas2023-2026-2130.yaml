Vulnerability:
    Description: An HTTP/2 denial of service vulnerability was found in nginx. Prior to the fix, there was no limit on the number of request headers a client could send. An attacker could seed the HPACK dynamic table with a header, then emit thousands of indexed references that each cost significant server allocation. Combined with HTTP/2 zero-byte flow-control window stalling, all allocations are pinned indefinitely, allowing a single client to exhaust server memory.
