# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: A flaw was found in Exuberant Ctags in the way it handles the "-o" option. This option specifies the tag filename. A crafted tag filename specified in the command line or in the configuration file results in arbitrary command execution because the externalSortTags() in sort.c calls the system(3) function in an unsafe way. (CVE-2022-4515)
    FixedIn:
        - Name: ctags
          NamespaceName: amzn:2
          Version: 5.8-23.amzn2
          VersionFormat: rpm
        - Name: ctags-debuginfo
          NamespaceName: amzn:2
          Version: 5.8-23.amzn2
          VersionFormat: rpm
        - Name: ctags-etags
          NamespaceName: amzn:2
          Version: 5.8-23.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2023-2343.html
