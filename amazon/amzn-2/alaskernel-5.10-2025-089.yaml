Vulnerability:
    Description: 'A flaw was found in the Linux kernel''s Layer 2 Tunneling Protocol (L2TP). A missing lock when clearing sk_user_data can lead to a race condition and NULL pointer dereference. A local user could use this flaw to potentially crash the system causing a denial of service. (CVE-2022-4129)In the Linux kernel, the following vulnerability has been resolved:dmaengine: Fix double increment of client_count in dma_chan_get() (CVE-2022-49753)A memory corruption flaw was found in the Linux kernel''s human interface device (HID) subsystem in how a user inserts a malicious USB device. This flaw allows a local user to crash or potentially escalate their privileges on the system. (CVE-2023-1073)In the Linux kernel, the following vulnerability has been resolved:net: fix UaF in netns ops registration error path (CVE-2023-52999)In the Linux kernel, the following vulnerability has been resolved:net/sched: sch_taprio: fix possible use-after-free (CVE-2023-53021)'
