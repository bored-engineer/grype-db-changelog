# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: Amazon Kinesis Agent versions within Amazon Linux 2 (AL2) prior to aws-kinesis-agent-2.0.4-1 included a version of Apache Log4j affected by CVE-2021-44228 and CVE-2021-45046. The Amazon Kinesis Agent has been updated to aws-kinesis-agent-2.0.4-1 within Amazon Linux 2 that mitigates CVE-2021-44228 and CVE-2021-45046. For additional detail see https://github.com/awslabs/amazon-kinesis-agent.
    FixedIn:
        - Name: aws-kinesis-agent
          NamespaceName: amzn:2
          Version: 2.0.4-1.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2021-1730.html
    Metadata:
        CVE:
            - Name: CVE-2021-44228
            - Name: CVE-2021-45046
    Name: ALAS-2021-1730
    NamespaceName: amzn:2
    Severity: Critical
