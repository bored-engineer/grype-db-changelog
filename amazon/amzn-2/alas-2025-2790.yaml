Vulnerability:
    Description: 'An out-of-bounds write flaw was found in the Linux kernel&rsquo;s framebuffer-based console driver functionality in the way a user triggers ioctl FBIOPUT_VSCREENINFO with malicious data. This flaw allows a local user to crash or potentially escalate their privileges on the system. (CVE-2021-33655)A memory access flaw was found in the Linux kernel''s XEN hypervisor for the virtual machine. This flaw allows a local user to crash the system or potentially escalate their privileges on the system. (CVE-2022-36123)An issue was discovered in the Linux kernel through 5.18.14. xfrm_expand_policies in net/xfrm/xfrm_policy.c can cause a refcount to be dropped twice. (CVE-2022-36879)In the Linux kernel, the following vulnerability has been resolved:mm/mempolicy: fix uninit-value in mpol_rebind_policy() (CVE-2022-49567)In the Linux kernel, the following vulnerability has been resolved:igmp: Fix data-races around sysctl_igmp_llm_reports. (CVE-2022-49590)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_probe_threshold. (CVE-2022-49595)In the Linux kernel, the following vulnerability has been resolved:icmp: Fix data-races around sysctl. (CVE-2022-49638)In the Linux kernel, the following vulnerability has been resolved:cgroup: Use separate src/dst nodes when preloading css_sets for migration (CVE-2022-49647)In the Linux kernel, the following vulnerability has been resolved:usbnet: fix memory leak in error case (CVE-2022-49657)In the Linux kernel, the following vulnerability has been resolved:mm/slub: add missing TID updates on slab deactivation (CVE-2022-49700)'
