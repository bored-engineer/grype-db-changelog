Vulnerability:
    Description: 'A flaw has been found in Xen. An unprivileged guest can cause Denial of Service (DoS) of the host by sending network packets to the backend, causing the backend to crash. (CVE-2023-46838)In the Linux kernel, the following vulnerability has been resolved:EDAC/thunderx: Fix possible out-of-bounds string accessEnabling -Wstringop-overflow globally exposes a warning for a common bugin the usage of strncat():drivers/edac/thunderx_edac.c: In function ''thunderx_ocx_com_threaded_isr'':drivers/edac/thunderx_edac.c:1136:17: error: ''strncat'' specified bound 1024 equals destination size [-Werror=stringop-overflow=]1136 |                 strncat(msg, other, OCX_MESSAGE_SIZE);|                 ^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~...1145 |                                 strncat(msg, other, OCX_MESSAGE_SIZE);...1150 |                                 strncat(msg, other, OCX_MESSAGE_SIZE);...Apparently the author of this driver expected strncat() to behave theway that strlcat() does, which uses the size of the destination bufferas its third argument rather than the length of the source buffer. Theresult is that there is no check on the size of the allocated buffer.Change it to strlcat().[ bp: Trim compiler output, fixup commit message. ] (CVE-2023-52464)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: check the alloc_workqueue return value in radeon_crtc_init()check the alloc_workqueue return value in radeon_crtc_init()to avoid null-ptr-deref. (CVE-2023-52470)In the Linux kernel, the following vulnerability has been resolved:drm: Don''t unref the same fb many times by mistake due to deadlock handling (CVE-2023-52486)In the Linux kernel, the following vulnerability has been resolved:ceph: fix deadlock or deadcode of misusing dget() (CVE-2023-52583)In the Linux kernel, the following vulnerability has been resolved:IB/ipoib: Fix mcast list locking (CVE-2023-52587)In the Linux kernel, the following vulnerability has been resolved:crypto: scomp - fix req->dst buffer overflow (CVE-2023-52612)In the Linux kernel, the following vulnerability has been resolved:hwrng: core - Fix page fault dead lock on mmap-ed hwrng (CVE-2023-52615)In the Linux kernel, the following vulnerability has been resolved:pstore/ram: Fix crash when setting number of cpus to an odd number (CVE-2023-52619)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: Fix a suspicious RCU usage warning (CVE-2023-52623)In the Linux kernel, the following vulnerability has been resolved:powerpc/imc-pmu: Add a null pointer check in update_events_in_group() (CVE-2023-52675)In the Linux kernel, the following vulnerability has been resolved:drm/amd/pm: fix a double-free in si_dpm_init (CVE-2023-52691)In the Linux kernel, the following vulnerability has been resolved:calipso: fix memory leak in netlbl_calipso_add_pass() (CVE-2023-52698)A vulnerability was found in vhost_new_msg in drivers/vhost/vhost.c in the Linux kernel, which does not properly initialize memory in messages passed between virtual guests and the host operating system in the vhost/vhost.c:vhost_new_msg() function. This issue can allow local privileged users to read some kernel memory contents when reading from the /dev/vhost-net device file. (CVE-2024-0340)netfilter: nf_tables: fix pointer math issue in nft_byteorder_eval() (CVE-2024-0607)In the Linux kernel, the following vulnerability has been resolved:llc: call sock_orphan() at release time (CVE-2024-26625)In the Linux kernel, the following vulnerability has been resolved:ip6_tunnel: fix NEXTHDR_FRAGMENT handling in ip6_tnl_parse_tlv_enc_lim() (CVE-2024-26633)In the Linux kernel, the following vulnerability has been resolved:llc: Drop support for ETH_P_TR_802_2. (CVE-2024-26635)In the Linux kernel, the following vulnerability has been resolved:tipc: Check the bearer type before calling tipc_udp_nl_bearer_add() (CVE-2024-26663)In the Linux kernel, the following vulnerability has been resolved:ppp_async: limit MRU to 64K (CVE-2024-26675)In the Linux kernel, the following vulnerability has been resolved:inet: read sk->sk_family once in inet_recv_error() (CVE-2024-26679)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix potential bug in end_buffer_async_write (CVE-2024-26685)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix hang in nilfs_lookup_dirty_data_buffers() (CVE-2024-26696)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix data corruption in dsync block recovery for small block sizes (CVE-2024-26697)In the Linux kernel, the following vulnerability has been resolved:ext4: fix double-free of blocks due to wrong extents moved_len (CVE-2024-26704)In the Linux kernel, the following vulnerability has been resolved:mm/writeback: fix possible divide-by-zero in wb_dirty_limits(), again (CVE-2024-26720)In the Linux kernel, the following vulnerability has been resolved:ipv6: sr: fix possible use-after-free and null-ptr-deref (CVE-2024-26735)In the Linux kernel, the following vulnerability has been resolved:RDMA/srpt: Support specifying the srpt_service_guid parameter (CVE-2024-26744)In the Linux kernel, the following vulnerability has been resolved:l2tp: pass correct message length to ip6_append_data (CVE-2024-26752)In the Linux kernel, the following vulnerability has been resolved:gtp: fix use-after-free and null-ptr-deref in gtp_genl_dump_pdp() (CVE-2024-26754)In the Linux kernel, the following vulnerability has been resolved:dm-crypt: don''t modify the data when using authenticated encryption (CVE-2024-26763)In the Linux kernel, the following vulnerability has been resolved:fs/aio: Restrict kiocb_set_cancel_fn() to I/O submitted via libaio (CVE-2024-26764)In the Linux kernel, the following vulnerability has been resolved:ext4: avoid allocating blocks from corrupted group in ext4_mb_find_by_goal() (CVE-2024-26772)In the Linux kernel, the following vulnerability has been resolved:ext4: avoid allocating blocks from corrupted group in ext4_mb_try_best_found() (CVE-2024-26773)In the Linux kernel, the following vulnerability has been resolved:btrfs: dev-replace: properly validate device names (CVE-2024-26791)In the Linux kernel, the following vulnerability has been resolved:gtp: fix use-after-free and null-ptr-deref in gtp_newlink() (CVE-2024-26793)In the Linux kernel, the following vulnerability has been resolved:netlink: Fix kernel-infoleak-after-free in __skb_datagram_iter (CVE-2024-26805)In the Linux kernel, the following vulnerability has been resolved:x86, relocs: Ignore relocations in .notes section (CVE-2024-26816)In the Linux kernel, the following vulnerability has been resolved:cachefiles: fix memory leak in cachefiles_add_cache() (CVE-2024-26840)In the Linux kernel, the following vulnerability has been resolved:scsi: target: core: Add TMF to tmr_list handling (CVE-2024-26845)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_conntrack_h323: Add protection for bmp length out of range (CVE-2024-26851)In the Linux kernel, the following vulnerability has been resolved:geneve: make sure to pull inner header in geneve_rx() (CVE-2024-26857)In the Linux kernel, the following vulnerability has been resolved:net/bnx2x: Prevent access to a freed page in page_pool (CVE-2024-26859)In the Linux kernel, the following vulnerability has been resolved:hsr: Fix uninit-value access in hsr_get_node() (CVE-2024-26863)In the Linux kernel, the following vulnerability has been resolved:quota: Fix potential NULL pointer dereference (CVE-2024-26878)In the Linux kernel, the following vulnerability has been resolved:dm: call the resume method on internal suspend (CVE-2024-26880)In the Linux kernel, the following vulnerability has been resolved:ACPI: processor_idle: Fix memory leak in acpi_processor_power_exit() (CVE-2024-26894)In the Linux kernel, the following vulnerability has been resolved:aoe: fix the potential use-after-free problem in aoecmd_cfg_pkts (CVE-2024-26898)In the Linux kernel, the following vulnerability has been resolved:do_sys_name_to_handle(): use kzalloc() to fix kernel-infoleak (CVE-2024-26901)In the Linux kernel, the following vulnerability has been resolved:scsi: Revert "scsi: fcoe: Fix potential deadlock on &fip->ctlr_lock" (CVE-2024-26917)In the Linux kernel, the following vulnerability has been resolved:tracing/trigger: Fix to return error if failed to alloc snapshot (CVE-2024-26920)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: fix some memleaks in gssx_dec_option_array (CVE-2024-27388)In the Linux kernel, the following vulnerability has been resolved:efi/capsule-loader: fix incorrect allocation size (CVE-2024-27413)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: fix a double-free in arfs_create_groups (CVE-2024-35835)In the Linux kernel, the following vulnerability has been resolved:x86/mm/ident_map: Use gbpages only where full GB page should be mapped. (CVE-2024-50017)'
