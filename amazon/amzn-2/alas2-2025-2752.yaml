Vulnerability:
    Description: 'A flaw use-after-free in function sco_sock_sendmsg() of the Linux kernel HCI subsystem was found in the way user calls ioct UFFDIO_REGISTER or other way triggers race condition of the call sco_conn_del() together with the call sco_sock_sendmsg() with the expected controllable faulting memory page. A privileged local user could use this flaw to crash the system or escalate their privileges on the system. (CVE-2021-3640)A flaw was found in the Linux SCTP stack. A blind attacker may be able to kill an existing SCTP association through invalid chunks if the attacker knows the IP-addresses and port numbers being used and the attacker can send packets with spoofed IP addresses. (CVE-2021-3772)A memory leak flaw in the Linux kernel''s hugetlbfs memory usage was found in the way the user maps some regions of memory twice using shmget() which are aligned to PUD alignment with the fault of some of the memory pages. A local user could use this flaw to get unauthorized access to some data. (CVE-2021-4002)In the Linux kernel, the following vulnerability has been resolved:i40e: Fix NULL ptr dereference on VSI filter sync (CVE-2021-47184)In the Linux kernel, the following vulnerability has been resolved:tty: tty_buffer: Fix the softlockup issue in flush_to_ldisc (CVE-2021-47185)In the Linux kernel, the following vulnerability has been resolved:btrfs: fix memory ordering between normal and ordered work functions (CVE-2021-47189)In the Linux kernel, the following vulnerability has been resolved:scsi: lpfc: Fix list_add() corruption in lpfc_drain_txq() (CVE-2021-47203)In the Linux kernel, the following vulnerability has been resolved:ocfs2: fix data corruption after conversion from inline format (CVE-2021-47460)In the Linux kernel, the following vulnerability has been resolved:isofs: Fix out of bound access for corrupted isofs image (CVE-2021-47478)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Put LLD module refcnt after SCSI device is released (CVE-2021-47480)In the Linux kernel, the following vulnerability has been resolved:regmap: Fix possible double-free in regcache_rbtree_exit() (CVE-2021-47483)In the Linux kernel, the following vulnerability has been resolved:usbnet: sanity check for maxpacket (CVE-2021-47495)'
