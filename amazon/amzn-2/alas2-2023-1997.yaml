          NamespaceName: amzn:2
          Version: 0.3.6-10.amzn2
          VersionFormat: rpm
        - Name: audiofile-devel
          NamespaceName: amzn:2
          Version: 0.3.6-10.amzn2
          VersionFormat: rpm
