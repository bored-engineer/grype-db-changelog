# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: XStream is a Java library to serialize objects to XML and back again. In XStream before version 1.4.16, there is a vulnerability where the processed stream at unmarshalling time contains type information to recreate the formerly written objects. XStream creates therefore new instances based on these type information. An attacker can manipulate the processed input stream and replace or inject objects, that result in a server-side forgery request. No user is affected, who followed the recommendation to setup XStream's security framework with a whitelist limited to the minimal required types. If you rely on XStream's default blacklist of the Security Framework, you will have to use at least version 1.4.16. (CVE-2021-21342)
    FixedIn:
        - Name: xstream
          NamespaceName: amzn:2
          Version: 1.3.1-16.amzn2.0.2
          VersionFormat: rpm
        - Name: xstream-javadoc
          NamespaceName: amzn:2
          Version: 1.3.1-16.amzn2.0.2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2023-2030.html
    Metadata:
        CVE:
            - Name: CVE-2021-21342
    Name: ALAS-2023-2030
    NamespaceName: amzn:2
    Severity: High
