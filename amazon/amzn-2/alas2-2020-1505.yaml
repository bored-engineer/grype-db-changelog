Vulnerability:
    Description: It was discovered cpio does not properly validate input files when generating TAR archives. When cpio is used to create TAR archives from paths an attacker can write to, the resulting archive may contain files with permissions the attacker did not have or in paths he did not have access to. Extracting those archives from a high-privilege user without carefully reviewing them may lead to the compromise of the system. (CVE-2019-14866)
    FixedIn:
        - Name: cpio
          NamespaceName: amzn:2
          Version: 2.11-28.amzn2
          VersionFormat: rpm
        - Name: cpio-debuginfo
          NamespaceName: amzn:2
          Version: 2.11-28.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2020-1505.html
    Metadata:
        CVE:
            - Name: CVE-2019-14866
    Name: ALAS2-2020-1505
    NamespaceName: amzn:2
    Severity: Medium
