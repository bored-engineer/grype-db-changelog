# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A double-free in libwebp could have led to memory corruption and a potentially exploitable crash. (CVE-2023-1999)In multiple cases browser prompts could have been obscured by popups controlled by content. These could have led to potential user confusion and spoofing attacks. (CVE-2023-32205)The Mozilla Foundation Security Advisory describes this flaw as:An out-of-bound read could have led to a crash in the RLBox Expat driver. (CVE-2023-32206)The Mozilla Foundation Security Advisory describes this flaw as:A missing delay in popup notifications could have made it possible for an attacker to trick a user into granting permissions. (CVE-2023-32207)The Mozilla Foundation Security Advisory describes this flaw as:A type checking bug would have led to invalid code being compiled. (CVE-2023-32211)The Mozilla Foundation Security Advisory describes this flaw as:An attacker could have positioned a `datalist` element to obscure the address bar. (CVE-2023-32212)The Mozilla Foundation Security Advisory describes this flaw as:When reading a file, an uninitialized value could have been used as read limit. (CVE-2023-32213)Mozilla developers and community members reported memory safety bugs present in Firefox 112 and Firefox ESR 102.10. Some of these bugs showed evidence of memory corruption and we presume that with enough effort some of these could have been exploited to run arbitrary code. (CVE-2023-32215)
