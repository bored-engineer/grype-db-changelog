pt(SO_J1939_FILTER) (CVE-2023-52637)In the Linux kernel, the following vulnerability has been resolved:media: rc: bpf attach/detach requires write permission (CVE-2023-52642)In the Linux kernel, the following vulnerability has been resolved:pipe: wakeup wr_wait after setting max_usage (CVE-2023-52672)A flaw was found in the ATA over Ethernet (AoE) driver in the Linux kernel. The aoecmd_cfg_pkts() function improperly updates the refcnt on `struct net_device`, and a use-after-free can be triggered by racing between the free on the struct and the access through the `skbtxq` global queue. This could lead to a denial of service condition or potential code execution. (CVE-2023-6270)A vulnerability was found in vhost_new_msg in drivers/vhost/vhost.c in the Linux kernel, which does not properly initialize memory in messages passed between virtual guests and the host operating system in the vhost/vhost.c:vhost_new_msg() function. This issue can allow local privileged users to read some kernel memory contents when reading from the /dev/vhost-net device file. (CVE-2024-0340)A vulnerability was reported in the Open vSwitch sub-component in the Linux Kernel. The flaw occurs when a recursive operation of code push recursively calls into the code block. The OVS module does not validate the stack depth, pushing too many frames and causing a stack overflow. As a result, this can lead to a crash or other related issues. (CVE-2024-1151)A Speculative Race Condition (SRC) vulnerability that impacts modern CPU architectures supporting speculative execution (related to Spectre V1) has been disclosed. An unauthenticated attacker can exploit this vulnerability to disclose arbitrary data from the CPU using race conditions to access the speculative executable code paths. (CVE-2024-2193)In btrfs_get_root_ref in fs/btrfs/disk-io.c in the Linux kernel through 6.7.1, there can be an assertion failure and crash because a subvolume can be read out too soon after its root item is inserted upon subvolume creation. (CVE-2024-23850)copy_params in drivers/md/dm-ioctl.c in the Linux kernel through 6.7.1 can attempt to allocate more than INT_MAX bytes, and crash, because of a missing param_kernel->data_size check. This is related to ctl_ioctl. (CVE-2024-23851)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_set_rbtree: skip end interval element from gcrbtree lazy gc on insert might collect an end interval element that hasbeen just added in this transactions, skip end interval elements thatare not yet active. (CVE-2024-26581)In the Linux kernel, the following vulnerability has been resolved:sched/membarrier: reduce the ability to hammer on sys_membarrierOn some systems, sys_membarrier can be very expensive, causing overallslowdowns for everything.  So put a lock on the path in order toserialize the accesses to prevent the ability for this to be called attoo high of a frequency and saturate the machine. (CVE-2024-26602)In the Linux kernel, the following vulnerability has been resolved:tcp: make sure init the accept_queue''s spinlocks once (CVE-2024-26614)In the Linux kernel, the following vulnerability has been resolved:llc: call sock_orphan() at release time (CVE-2024-26625)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Move scsi_host_busy() out of host lock for waking up EH handler (CVE-2024-26627)In the Linux kernel, the following vulnerability has been resolved:llc: Drop support for ETH_P_TR_802_2. (CVE-2024-26635)In the Linux kernel, the following vulnerability has been resolved:tcp: add sanity checks to rx zerocopy (CVE-2024-26640)In the Linux kernel, the following vulnerability has been resolved:ip6_tunnel: make sure to pull inner header in __ip6_tnl_rcv() (CVE-2024-26641)In the Linux kernel, the following vulnerability has been resolved:btrfs: don''t abort filesystem when attempting to snapshot deleted subvolume (CVE-2024-26644)In the Linux kernel, the following vulnerability has been resolved:tipc: Check the bearer type before calling tipc_udp_nl_bearer_add() (CVE-2024-26663)In the Linux kernel, the following vulnerability has been resolved:tunnels: fix out of bounds access when building IPv6 PMTU error (CVE-2024-26665)In the Linux kernel, the following vulnerability has been resolved:blk-mq: fix IO hang from sbitmap wakeup race (CVE-2024-26671)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_ct: sanitize layer 3 and 4 protocol number in custom expectations (CVE-2024-26673)In the Linux kernel, the following vulnerability has been resolved:ppp_async: limit MRU to 64K (CVE-2024-26675)In the Linux kernel, the following vulnerability has been resolved:inet: read sk->sk_family once in inet_recv_error() (CVE-2024-26679)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix potential bug in end_buffer_async_write (CVE-2024-26685)In the Linux kernel, the following vulnerability has been resolved:ceph: prevent use-after-free in encode_cap_msg() (CVE-2024-26689)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix hang in nilfs_lookup_dirty_data_buffers() (CVE-2024-26696)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix data corruption in dsync block recovery for small block sizes (CVE-2024-26697)In the Linux kernel, the following vulnerability has been resolved:hv_netvsc: Fix race condition between netvsc_probe and netvsc_remove (CVE-2024-26698)In the Linux kernel, the following vulnerability has been resolved:ext4: fix double-free of blocks due to wrong extents moved_len (CVE-2024-26704)In the Linux kernel, the following vulnerability has been resolved:net: hsr: remove WARN_ONCE() in send_hsr_supervision_frame() (CVE-2024-26707)In the Linux kernel, the following vulnerability has been resolved:mm/writeback: fix possible divide-by-zero in wb_dirty_limits(), again (CVE-2024-26720)In the Linux kernel, the following vulnerability has been resolved:btrfs: do not ASSERT() if the newly created subvolume already got read (CVE-2024-26727)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_chain_filter: handle NETDEV_UNREGISTER for inet/ingress basechain (CVE-2024-26808)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: fix performance regression in swap operation (CVE-2024-26910)In the Linux kernel, the following vulnerability has been resolved:scsi: Revert "scsi: fcoe: Fix potential deadlock on &fip->ctlr_lock" (CVE-2024-26917)In the Linux kernel, the following vulnerability has been resolved:tracing/trigger: Fix to return error if failed to alloc snapshot (CVE-2024-26920)In the Linux kernel, the following vulnerability has been resolved:ubifs: ubifs_symlink: Fix memleak of inode->i_link in error path (CVE-2024-26972)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: fix a double-free in arfs_create_groups (CVE-2024-35835)In the Linux kernel, the following vulnerability has been resolved:x86/mm/ident_map: Use gbpages only where full GB page should be mapped. (CVE-2024-50017)'
