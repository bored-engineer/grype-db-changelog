Vulnerability:
    Description: Git mistakes some paths for relative paths allowing writing outside of the worktree while cloning (CVE-2019-1351)NTFS protections inactive when running Git in the Windows Subsystem for Linux (CVE-2019-1353)remote code execution in recursive clones with nested submodules (CVE-2019-1387)Arbitrary path overwriting via export-marks command option (CVE-2019-1348)Files inside the .git directory may be overwritten during cloning via NTFS Alternate Data Streams (CVE-2019-1352)recursive submodule cloning allows using git directory twice with synonymous directory name written in .git/ (CVE-2019-1349)Incorrect quoting of command-line arguments allowed remote code execution during a recursive clone (CVE-2019-1350)Git does not refuse to write out tracked files with backlashes in filenames (CVE-2019-1354)Recursive clone followed by a submodule update could execute code contained within repository without the user explicitly consent Arbitrary command execution is possible in Git before 2.20.2, 2.21.x before 2.21.1, 2.22.x before 2.22.2, 2.23.x before 2.23.1, and 2.24.x before 2.24.1 because a "git submodule update" operation can run commands found in the .gitmodules file of a malicious repository.(CVE-2019-19604)
