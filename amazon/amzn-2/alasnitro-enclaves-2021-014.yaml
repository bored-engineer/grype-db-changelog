Vulnerability:
    Description: In the OCI Distribution Specification version 1.0.0 and prior and in the OCI Image Specification version 1.0.1 and prior, manifest and index documents are ambiguous without an accompanying Content-Type HTTP header. Versions of Moby (Docker Engine) prior to 20.10.11 and versions of containerd prior to 1.4.12 and 1.5.8 treat the Content-Type header as trusted and deserialize the document according to that header. If the Content-Type header changed between pulls of the same ambiguous document (with the same digest), the document may be interpreted differently, meaning that the digest alone is insufficient to unambiguously identify the content of the image. (CVE-2021-41190)
    FixedIn:
        - Name: containerd
          NamespaceName: amzn:2
          Version: 1.4.6-7.amzn2
          VersionFormat: rpm
        - Name: containerd-debuginfo
          NamespaceName: amzn:2
          Version: 1.4.6-7.amzn2
          VersionFormat: rpm
        - Name: containerd-stress
          NamespaceName: amzn:2
          Version: 1.4.6-7.amzn2
          VersionFormat: rpm
        - Name: docker
          NamespaceName: amzn:2
          Version: 20.10.7-5.amzn2
          VersionFormat: rpm
        - Name: docker-debuginfo
          NamespaceName: amzn:2
          Version: 20.10.7-5.amzn2
          VersionFormat: rpm
