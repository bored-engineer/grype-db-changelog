Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:vt: fix memory overlapping when deleting chars in the buffer (CVE-2022-48627)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: disallow timeout for anonymous sets (CVE-2023-52620)create_empty_lvol in drivers/mtd/ubi/vtbl.c in the Linux kernel through 6.7.4 can attempt to allocate zero bytes, and crash, because of a missing check for ubi->leb_size. (CVE-2024-25739)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: disallow anonymous set with timeout flag (CVE-2024-26642)In the Linux kernel, the following vulnerability has been resolved:scsi: qla2xxx: Fix command flush on cable pull (CVE-2024-26931)In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix deadlock in usb_deauthorize_interface() (CVE-2024-26934)In the Linux kernel, the following vulnerability has been resolved:nilfs2: prevent kernel bug at submit_bh_wbc() (CVE-2024-26955)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix failure to detect DAT corruption in btree and direct mappings (CVE-2024-26956)In the Linux kernel, the following vulnerability has been resolved:fat: fix uninitialized field in nostale filehandles (CVE-2024-26973)In the Linux kernel, the following vulnerability has been resolved:KVM: Always flush async #PF workqueue when vCPU is being destroyed (CVE-2024-26976)In the Linux kernel, the following vulnerability has been resolved:USB: usb-storage: Prevent divide-by-0 error in isd200_ata_command (CVE-2024-27059)In the Linux kernel, the following vulnerability has been resolved:PCI/PM: Drain runtime-idle callbacks before driver removal (CVE-2024-35809)In the Linux kernel, the following vulnerability has been resolved:fs/aio: Check IOCB_AIO_RW before the struct aio_kiocb conversion (CVE-2024-35815)In the Linux kernel, the following vulnerability has been resolved:tcp: properly terminate timers for kernel sockets (CVE-2024-35910)In the Linux kernel, the following vulnerability has been resolved:block: prevent division by zero in blk_rq_stat_sum() (CVE-2024-35925)In the Linux kernel, the following vulnerability has been resolved:scsi: lpfc: Fix possible memory leak in lpfc_rcv_padisc() (CVE-2024-35930)In the Linux kernel, the following vulnerability has been resolved:btrfs: send: handle path ref underflow in header iterate_inode_ref() (CVE-2024-35935)In the Linux kernel, the following vulnerability has been resolved:btrfs: handle chunk tree lookup error in btrfs_relocate_sys_chunks() (CVE-2024-35936)In the Linux kernel, the following vulnerability has been resolved:VMCI: Fix memcpy() run-time warning in dg_dispatch_as_host() (CVE-2024-35944)'
