# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A vulnerability, which was classified as problematic, has been found in Linux Kernel. This issue affects the function nilfs_attach_log_writer of the file fs/nilfs2/segment.c of the component BPF. The manipulation leads to memory leak. The attack may be initiated remotely. It is recommended to apply a patch to fix this issue. The identifier VDB-211961 was assigned to this vulnerability. (CVE-2022-3646)drivers/scsi/stex.c in the Linux kernel through 5.19.9 allows local users to obtain sensitive information from kernel memory because stex_queuecommand_lck lacks a memset for the PASSTHRU_CMD case. (CVE-2022-40768)The Linux kernel NFSD implementation prior to versions 5.19.17 and 6.0.2 are vulnerable to buffer overflow. NFSD tracks the number of pages held by each NFSD thread by combining the receive and send buffers of a remote procedure call (RPC) into a single array of pages. A client can force the send buffer to shrink by sending an RPC message over TCP with garbage data added at the end of the message. The RPC message with garbage data is still correctly formed according to the specification and is passed forward to handlers. Vulnerable code in NFSD is not expecting the oversized request and writes beyond the allocated buffer space. CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H (CVE-2022-43945)In the Linux kernel, the following vulnerability has been resolved:NFSD: Protect against send buffer overflow in NFSv2 READDIR (CVE-2022-50235)In the Linux kernel, the following vulnerability has been resolved:NFSD: fix use-after-free on source server when doing inter-server copy (CVE-2022-50241)In the Linux kernel, the following vulnerability has been resolved:md: Replace snprintf with scnprintf (CVE-2022-50299)In the Linux kernel, the following vulnerability has been resolved:nbd: Fix hung when signal interrupts nbd_start_device_ioctl() (CVE-2022-50314)In the Linux kernel, the following vulnerability has been resolved:jbd2: fix potential use-after-free in jbd2_fc_wait_bufs (CVE-2022-50328)In the Linux kernel, the following vulnerability has been resolved:ext4: fix null-ptr-deref in ext4_write_info (CVE-2022-50344)In the Linux kernel, the following vulnerability has been resolved:NFSD: Protect against send buffer overflow in NFSv3 READ (CVE-2022-50345)'
