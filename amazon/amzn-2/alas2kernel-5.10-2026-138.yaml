    Description: 'In the Linux kernel, the following vulnerability has been resolved:cifs: validate DFS referral string offsets (CVE-2026-72318)In the Linux kernel, the following vulnerability has been resolved:sctp: validate cookie AUTH state before use (CVE-2026-74752)In the Linux kernel, the following vulnerability has been resolved:svcrdma: Reject inline replies that overflow the pull-up buffer (CVE-2026-89530)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix OOB read/write from unvalidated DataOffset in coalesce_t2() (CVE-2026-89633)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent client use-after-free during delegation revoke (CVE-2026-89659)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: vgic-its: Don''t dereference a NULL collection on ITT save (CVE-2026-89912)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent client use-after-free during blocked-lock reaping (CVE-2026-90036)In the Linux kernel, the following vulnerability has been resolved:smb: client: reject out-of-bounds DataOffset in CIFSSMBRead() (CVE-2026-97563)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix server->total_read for compound encrypted PDUs (CVE-2026-98167)In the Linux kernel, the following vulnerability has been resolved:RDMA/rxe: Fix integer overflow in mr_check_range() leading to OOB access (CVE-2026-98365)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix create context out-of-bounds reads (CVE-2026-98454)In the Linux kernel, the following vulnerability has been resolved:KVM: SVM: Preserve TLB control (i.e. pending TLB flush) on failed VMRUN (CVE-2026-98715)In the Linux kernel, the following vulnerability has been resolved:tipc: prevent GCM nonce reuse on peer key changes (CVE-2026-98805)In the Linux kernel, the following vulnerability has been resolved:sctp: check RCV_SHUTDOWN after the sendmsg connect wait (CVE-2026-98846)In the Linux kernel, the following vulnerability has been resolved:tipc: hold a reference to nodes found by link name (CVE-2026-99053)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Use active memslots for the per-vCPU MMIO cache (CVE-2026-99082)'
