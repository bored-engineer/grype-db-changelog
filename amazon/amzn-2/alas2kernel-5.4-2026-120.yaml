    Description: 'In the Linux kernel, the following vulnerability has been resolved:crypto: algif_aead - Revert to operating out-of-placeTo mitigate this issue, we recommend that customers disable loading of the algif_aead module by running the following commands:echo "install algif_aead /bin/false" > /etc/modprobe.d/disable-algif.confrmmod algif_aead 2>/dev/null || trueThis issue requires local authenticated access as a prerequisite; remote unauthenticated activity is not possible. (CVE-2026-31431)'
