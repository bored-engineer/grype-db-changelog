Vulnerability:
    Description: libXfont prior to version 2.0.10 contains an out-of-bounds heap read vulnerability in its PCF font file parsing logic due to insufficient validation of integer values during file position calculations. An attacker who can cause the X server or an application using libXfont to load a malicious PCF font file could potentially leak sensitive information from process memory or cause a crash via a segmentation fault. (CVE-2026-109909)libXfont2 prior to version 2.0.10 contains an uninitialized variable vulnerability (CWE-457) in its FreeType backend that leads to an out-of-bounds read (CWE-125). Due to a missing initialization of a field used as an array subscript for certain font face types, a local client with low privileges could cause the X server to crash by directing it to load a font from a controlled font path, resulting in a denial of service. (CVE-2026-109920)
