Vulnerability:
    Description: Logic issue in variable service module for EDK II/UDK2018/UDK2017/UDK2015 may allow an authenticated user to potentially enable escalation of privilege, information disclosure and/or denial of service via local access. (CVE-2017-5734)A missing check leads to an out-of-bounds read and write flaw in NetworkPkg/DnsDxe as shipped in edk2, when it parses DNS responses. A remote attacker who controls the DNS server used by the vulnerable firmware may use this flaw to make the system crash. (CVE-2018-3613)improper DNS packet size check (CVE-2018-12178)Privilege escalation via heap-based buffer overflow in Decode() function (CVE-2017-5735)Privilege escalation via heap-based buffer overflow in MakeTable() function (CVE-2017-5733)Privilege escalation via processing of malformed files in TianoCompress.c (CVE-2017-5731)Privilege escalation via processing of malformed files in BaseUefiDecompressLib.c (CVE-2017-5732)A stack-based buffer overflow was discovered in edk2 when the HII database contains a Bitmap that claims to be 4-bit or 8-bit per pixel, but the palette contains more than 16(2^4) or 256(2^8) colors. (CVE-2018-12181)Buffer overflow in BlockIo service for EDK II may allow an unauthenticated user to potentially enable escalation of privilege, information disclosure and/or denial of service via network access. (CVE-2018-12180)
