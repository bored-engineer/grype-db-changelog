    Description: 'In the Linux kernel, the following vulnerability has been resolved:KVM: Fix a data race on last_boosted_vcpu in kvm_vcpu_on_spin() (CVE-2024-40953)In the Linux kernel, the following vulnerability has been resolved:blk-rq-qos: fix crash on rq_qos_wait vs. rq_qos_wake_function race (CVE-2024-50082)In the Linux kernel, the following vulnerability has been resolved:tcp: fix mptcp DSS corruption due to large pmtu xmit (CVE-2024-50083)In the Linux kernel, the following vulnerability has been resolved:arm64: probes: Remove broken LDR (literal) uprobe support (CVE-2024-50099)In the Linux kernel, the following vulnerability has been resolved:mptcp: handle consistently DSS corruption (CVE-2024-50185)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v4: Don''t allow a VMOVP on a dying VPE (CVE-2024-50192)In the Linux kernel, the following vulnerability has been resolved:posix-clock: Fix missing timespec64 check in pc_clock_settime() (CVE-2024-50195)In the Linux kernel, the following vulnerability has been resolved:mm/swapfile: skip HugeTLB pages for unuse_vma (CVE-2024-50199)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: Fix encoder->possible_clones (CVE-2024-50201)In the Linux kernel, the following vulnerability has been resolved:nilfs2: propagate directory read errors from nilfs_find_entry() (CVE-2024-50202)'
