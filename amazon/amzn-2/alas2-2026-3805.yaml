# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'CGI::Session::ID::md5 versions before 4.49 for Perl generate predictable session ids from low-entropy sources.The generate_id method builds the session id from a MD5 digest of the process id, the epoch time, and the built-in rand() function. All three are predictable, low-entropy sources: the PID is drawn from a small range, the epoch time can be guessed or read from the HTTP Date header, and Perl''s rand() is unsuitable for security purposes because it is predictable and reversible.An attacker who predicts a session id can impersonate the corresponding session and bypass authentication. (CVE-2026-56016)'
    FixedIn:
        - Available:
            Date: "2026-07-20"
            Kind: advisory
          Name: perl-CGI-Session
          NamespaceName: amzn:2
          Version: 4.35-16.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2026-3805.html
    Metadata:
        CVE:
            - Name: CVE-2026-56016
    Name: ALAS2-2026-3805
