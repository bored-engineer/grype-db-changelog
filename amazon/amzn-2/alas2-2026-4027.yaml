# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'hw/display/qxl: validate primary surface stride against width (CVE-2026-16271)hw/usb/hcd-xhci: Set reentrancy guard in timer functions (CVE-2026-17588)hw/display/vga: fix text-mode OOB write after a graphics surface switch (CVE-2026-77913)io/channel-socket: do not treat a zero length write as an error (CVE-2026-84788)A use-after-free vulnerability was found in QEMU''s 9pfs subsystem. A race condition between the main thread and a worker thread when processing concurrent Tlcreate and Twalk requests allows a malicious guest user to craft a fid path containing stale heap data, bypassing directory traversal restrictions and escaping the shared directory boundary. This can lead to arbitrary host file read/write and code execution (VM escape) as the QEMU process user. (CVE-2026-93834)'
