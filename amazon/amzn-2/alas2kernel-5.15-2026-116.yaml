Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:futex: Prevent lockup in requeue-PI during signal/ timeout wakeup (CVE-2026-52977)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix use-after-free in offloaded map/prog info fill (CVE-2026-53089)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix ld_{abs,ind} failure path analysis in subprogs (CVE-2026-53090)In the Linux kernel, the following vulnerability has been resolved:bpf: Reject BPF_MAP_TYPE_INODE_STORAGE creation if BPF LSM is uninitializedWhen CONFIG_BPF_LSM=y is set, BPF inode storage maps(BPF_MAP_TYPE_INODE_STORAGE) are compiled into the kernel. However,if the BPF LSM is not explicitly enabled at boot time (e.g. omittedfrom the "lsm=" boot parameter), lsm_prepare() is never executed forthe BPF LSM.Consequently, the BPF inode security blob offset(bpf_lsm_blob_sizes.lbs_inode) is never initialized and remains atits default compiled size of 8 bytes instead of being updated to avalid offset past the reserved struct rcu_head (typically 16 bytesor more).When a privileged user creates and updates a BPF_MAP_TYPE_INODE_STORAGEmap, bpf_inode() evaluates inode->i_security + 8. This erroneouslyaliases the struct rcu_head.func callback pointer at the beginningof the inode->i_security blob. During subsequent map element cleanupor inode destruction, writing NULL to owner_storage clears the queuedRCU callback pointer. When rcu_do_batch() later executes the queuedcallback, it attempts an instruction fetch at address 0x0, triggeringan immediate kernel panic.Fix this by introducing a global bpf_lsm_initialized boolean flagmarked with __ro_after_init. Set this flag to true inside bpf_lsm_init()when the LSM framework successfully registers the BPF LSM. Gate mapallocation in inode_storage_map_alloc() on this flag, returning-EOPNOTSUPP if the BPF LSM is in turn uninitialized.This fail-fast approach prevents userspace from allocating inodestorage maps when the supporting BPF LSM infrastructure is absent,avoiding zombie map states. (CVE-2026-64192)In the Linux kernel, the following vulnerability has been resolved:mm: do file ownership checks with the proper mount idmap (CVE-2026-64294)In the Linux kernel, the following vulnerability has been resolved:KVM: nVMX: Hide shadow VMCS right after VMCLEAR (CVE-2026-64562)In the Linux kernel, the following vulnerability has been resolved:rhashtable: clear stale iter->p on table restart (CVE-2026-64563)In the Linux kernel, the following vulnerability has been resolved:sctp: don''t free the ASCONF''s own transport in DEL-IP processing (CVE-2026-64564)In the Linux kernel, the following vulnerability has been resolved:btrfs: reject free space cache with more entries than pages (CVE-2026-64567)In the Linux kernel, the following vulnerability has been resolved:ipv4: fib: free fib_alias with kfree_rcu() on insert error path (CVE-2026-64572)In the Linux kernel, the following vulnerability has been resolved:nexthop: initialize extack in nh_res_bucket_migrate() (CVE-2026-64576)In the Linux kernel, the following vulnerability has been resolved:xfrm: policy: preallocate inexact bins before xfrm_hash_rebuild reinsert (CVE-2026-64579)In the Linux kernel, the following vulnerability has been resolved:xfrm: fix sk_dst_cache double-free in xfrm_user_policy() (CVE-2026-64581)In the Linux kernel, the following vulnerability has been resolved:libceph: fix two unsafe bare decodes in decode_lockers() (CVE-2026-68082)In the Linux kernel, the following vulnerability has been resolved:audit: fix recursive locking deadlock in audit_dupe_exe() (CVE-2026-68096)In the Linux kernel, the following vulnerability has been resolved:openvswitch: fix GSO userspace truncation underflow (CVE-2026-68123)In the Linux kernel, the following vulnerability has been resolved:ila: reload IPv6 header after pskb_may_pull in checksum adjust (CVE-2026-68127)In the Linux kernel, the following vulnerability has been r