          VersionFormat: rpm
        - Name: zziplib-devel
          NamespaceName: amzn:2
          Version: 0.13.62-12.amzn2
          VersionFormat: rpm
        - Name: zziplib-utils
          NamespaceName: amzn:2
          Version: 0.13.62-12.amzn2
          VersionFormat: rpm
