# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: _module_comgen_words_and_files() fed untrusted text (module names readoff disk, LOADEDMODULES, MODULEPATH) straight into `compgen -W`, whichperforms a full unquoted-word expansion on its wordlist -- includingcommand substitution -- as a normal, documented part of its behavior.A module name, loaded-module entry, or MODULEPATH component containinge.g. `$(...)` therefore ran arbitrary shell code the moment a userpressed Tab. (CVE-2026-85013)
