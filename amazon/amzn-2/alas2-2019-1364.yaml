Vulnerability:
    Description: This security update is only applicable to EC2 Bare Metal instance types using Intel processors.Intel has released microcode updates for certain Intel CPUs.  After installing the updated microcode_ctl package, the microcode will be automatically activated on next boot.Improper conditions check in the voltage modulation interface for some Intel Xeon Scalable Processors may allow a privileged user to potentially enable denial of service via local access.(CVE-2019-11139)TSX Asynchronous Abort condition on some CPUs utilizing speculative execution may allow an authenticated user to potentially enable information disclosure via a side channel with local access.(CVE-2019-11135)
