# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: The pip package before 19.2 for Python allows Directory Traversal when a URL is given in an install command, because a Content-Disposition header can have ../ in a filename, as demonstrated by overwriting the /root/.ssh/authorized_keys file. This occurs in _download_http_url in _internal/download.py. (CVE-2019-20916)
    FixedIn:
        - Name: python-pip
          NamespaceName: amzn:2
          Version: 20.2.2-1.amzn2.0.2
          VersionFormat: rpm
        - Name: python-pip-wheel
          NamespaceName: amzn:2
          Version: 20.2.2-1.amzn2.0.2
          VersionFormat: rpm
        - Name: python2-pip
          NamespaceName: amzn:2
          Version: 20.2.2-1.amzn2.0.2
          VersionFormat: rpm
        - Name: python3-pip
          NamespaceName: amzn:2
          Version: 20.2.2-1.amzn2.0.2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2021-1639.html
    Metadata:
        CVE:
            - Name: CVE-2019-20916
    Name: ALAS2-2021-1639
    NamespaceName: amzn:2
    Severity: Medium
