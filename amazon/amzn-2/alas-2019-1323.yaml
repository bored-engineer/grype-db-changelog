# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: keepalived 2.0.8 didn't check for pathnames with symlinks when writing data to a temporary file upon a call to PrintData or PrintStats. This allowed local users to overwrite arbitrary files if fs.protected_symlinks is set to 0, as demonstrated by a symlink from /tmp/keepalived.data or /tmp/keepalived.stats to /etc/passwd.(CVE-2018-19044)
    FixedIn:
        - Name: keepalived
          NamespaceName: amzn:2
          Version: 1.3.5-16.amzn2
          VersionFormat: rpm
        - Name: keepalived-debuginfo
          NamespaceName: amzn:2
          Version: 1.3.5-16.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2019-1323.html
    Metadata:
        CVE:
            - Name: CVE-2018-19044
    Name: ALAS-2019-1323
    NamespaceName: amzn:2
    Severity: Medium
