# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: A flaw was found in rsync that is triggered by a victim rsync user/client connecting to a malicious rsync server. The server can copy and overwrite arbitrary files in the client's rsync target directory and subdirectories. This flaw allows a malicious server, or in some cases, another attacker who performs a man-in-the-middle attack, to potentially overwrite sensitive files on the client machine, resulting in further exploitation. (CVE-2022-29154)
    FixedIn:
        - Name: rsync
          NamespaceName: amzn:2
          Version: 3.1.2-11.amzn2.0.1
          VersionFormat: rpm
        - Name: rsync-debuginfo
          NamespaceName: amzn:2
          Version: 3.1.2-11.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2022-1873.html
    Metadata:
        CVE:
            - Name: CVE-2022-29154
    Name: ALAS2-2022-1873
    NamespaceName: amzn:2
    Severity: High
