# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A flaw was found in chrony when creating the PID file under the /var/run/chrony folder. The file is created during chronyd startup while still running as the root user, and when it's opened for writing, chronyd does not check for an existing symbolic link with the same file name. This flaw allows an attacker with privileged access to create a symlink with the default PID file name pointing to any destination file in the system, resulting in data loss and a denial of service due to the path traversal. (CVE-2020-14367)
    FixedIn:
        - Available:
            Date: "2021-01-07"
            Kind: advisory
          Name: chrony
          NamespaceName: amzn:2
          Version: 3.5.1-1.amzn2.0.1
          VersionFormat: rpm
        - Available:
            Date: "2021-01-07"
            Kind: advisory
          Name: chrony-debuginfo
          NamespaceName: amzn:2
          Version: 3.5.1-1.amzn2.0.1
          VersionFormat: rpm
