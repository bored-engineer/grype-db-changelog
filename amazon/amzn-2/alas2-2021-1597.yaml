Vulnerability:
    Description: A flaw was found in Flatpak. The Flatpak portal D-Bus service passes caller-specified environment variables to non-sandboxed processes on the host system, and in particular to the `flatpak run` command that is used to launch the new sandbox instance. A malicious or compromised Flatpak app could set environment variables that are trusted by the `flatpak run` command, and use them to execute arbitrary code that is outside the sandbox. The highest threat from this vulnerability is to data confidentiality and integrity as well as system availability. (CVE-2021-21261)
    FixedIn:
        - Name: flatpak
          NamespaceName: amzn:2
          Version: 1.0.9-10.amzn2
          VersionFormat: rpm
        - Name: flatpak-builder
          NamespaceName: amzn:2
          Version: 1.0.0-10.amzn2
          VersionFormat: rpm
        - Name: flatpak-debuginfo
