# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'CGI versions before 5.00 for Perl allow CPU exhaustion via a backtracking regex on the XForms multipart/related Content-Type.When a POST Content-Type contains multipart/related, the boundary and start parameters are extracted with an unanchored pattern that puts .+ on either side of the boundary capture, which backtracks in cubic time on a header that does not match. No request body is needed. (CVE-2026-120632)CGI versions before 5.00 for Perl trust the client X-Forwarded-Host header in url, self_url, virtual_host and virtual_port.These take the host name and port from the X-Forwarded-Host request header when present, and otherwise from Host, without validating either. The URLs from url and self_url are the default redirect location and the start_html(-base=>1) base href, and the default start_form action when REQUEST_URI is not set.A client can poison shared caches, and URLs the application stores or sends, with redirects, links and scripts that point at a host it controls. (CVE-2026-120633)CGI::Carp versions before 5.00 for Perl leak warnings across requests in persistent environments via the warningsToBrowser buffer.Warnings are held in a package-level buffer until warningsToBrowser writes them into the page as HTML comments, and the buffer is never cleared between requests. Under mod_perl, FastCGI or PSGI, warnings from one request are written into a later one.Warnings that contain one user''s request data can appear in the HTML sent to another user. (CVE-2026-120634)CGI versions before 5.00 for Perl allow form fields to be smuggled past proxies and WAFs via multipart parsing that differs from the RFCs.The multipart/form-data parser matches the boundary anywhere rather than at the start of a line, uses the boundary without its leading -- for some client-supplied User-Agent values, finds the Content-Disposition name and filename inside the quoted values of other parameters, and corrupts parts when the boundary nears the 4096-byte read size. (CVE-2026-120635)CGI versions before 5.00 for Perl allow open redirects and script injection via URLs built from REQUEST_URI in url and start_form.url(-absolute=>1), url(-relative=>1) and the default start_form action are built from the client-supplied REQUEST_URI without validation. The result can be protocol-relative (//evil.example), absolute-form (http://evil.example/) or contain backslashes, and url(-relative=>1) can return a javascript: URL. Links and form posts built from these URLs can go to another host. (CVE-2026-120636)CGI versions before 5.00 for Perl take request parameters from the process command line arguments for an unrecognised REQUEST_METHOD.For a REQUEST_METHOD such as OPTIONS, CGI falls through to its offline debugging mode, which is on by default, and builds the parameters and path_info from the process''s command line arguments. (CVE-2026-120637)CGI versions before 5.00 for Perl allow open redirects via HTML entity decoding of the URL after application validation in redirect.redirect decodes HTML entities in its URL before writing the Location header, so a URL the application has already validated can change meaning. For example, /&#47;evil.example/ becomes //evil.example/ and sends the user to another host. (CVE-2026-120638)CGI versions before 5.00 for Perl allow HTTP header injection via entity decoding after the newline check in header and unchecked values in multipart_start and do_push.With autoEscape off, header decodes HTML entities in extra header values after its newline check, so an encoded CR or LF reaches the response. multipart_start does not check header values for newlines, and do_push does not check the type it prints in each part.An application that passes request data into these header values can be made to add headers or split the response. (CVE-2026-120639)CGI versions before 5.00 for Perl allow the POSTDATA, PUTDATA, PATCHDATA and XForms:Model parameters to be set from the query string or form fields.CGI stores a non-form request body under POSTDATA, PUTDATA or PATCHDATA, and an XForms body under XForms:Model, but also accepts these names from the query string, a form field or a multipart part, so an application cannot tell a client-sent value from the real body.A cross-site HTML form can post POSTDATA={"admin":true} to an endpoint that reads JSON from param(''POSTDATA''), a request forgery that needs no CORS preflight. (CVE-2026-120640)CGI versions before 5.00 for Perl return upload filenames with any client-supplied path, including ../ and Windows paths.The name returned for an uploaded file is the filename parameter of the part''s Content-Disposition header, unchanged.An application that saves the upload under this name can be made to write outside the intended directory. (CVE-2026-120641)CGI versions before 5.00 for Perl return request-derived values untainted under taint mode.The upload filename, uploadInfo values, some path_info and script_name values, Accept results, and the name lists from url_param and cookie are returned without the taint flag, as is a cookie named expires from 4.67 on.These values come from regex captures or hash keys, which Perl does not taint, so they pass -T checks unvalidated. (CVE-2026-120642)CGI::Cookie versions before 5.00 for Perl allow cookie attribute injection via unvalidated path, domain and expires values.The path, domain and expires values are written into the Set-Cookie header without checking for semicolons or control characters.An application that sets them from request data can be made to add other cookie attributes, such as Domain or SameSite. (CVE-2026-120644)CGI versions before 5.00 for Perl allow denial of service via submitted values used as a regex for optgroup selection in scrolling_list.When rendering option groups, scrolling_list marks the selected options by interpolating each selected value, by default taken from the request parameters, unescaped into a substitution pattern.A client can make the request die with an invalid pattern, or tie up the process with one that backtracks heavily. (CVE-2026-120645)CGI versions before 5.00 for Perl allow Content-Disposition parameter injection via unescaped double quotes in the header attachment filename.header(-attachment => $name) writes $name into the quoted filename parameter of Content-Disposition without escaping double quotes.An application that passes request data as the attachment name can be made to send a second filename parameter, changing the name the response is saved under. (CVE-2026-120647)CGI versions before 5.00 for Perl allow HTML injection via text containing --> in comment.Arguments are placed between <!-- and --> without escaping, so text containing --> closes the comment early.An application that passes request data to comment can be made to inject HTML into the page. (CVE-2026-120648)CGI versions before 5.00 for Perl allow memory, CPU and disk exhaustion via missing or unenforced request size, parameter and upload limits.$CGI::POST_MAX defaults to no limit, and when set is not enforced for chunked multipart bodies or for the boundary line of a multipart body without a boundary= parameter. Bodies saved as PUTDATA, POSTDATA or PATCHDATA uploads are read into memory in one go, and nothing limits the number of parameters or uploads. (CVE-2026-120650)'
