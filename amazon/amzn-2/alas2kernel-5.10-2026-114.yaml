 AAD (assoclen<8) to match ESP/ESN spec (CVE-2026-23060)In the Linux kernel, the following vulnerability has been resolved:regmap: Fix race condition in hwspinlock irqsave routine (CVE-2026-23071)In the Linux kernel, the following vulnerability has been resolved:net/sched: Enforce that teql can only be used as root qdisc (CVE-2026-23074)In the Linux kernel, the following vulnerability has been resolved:fou: Don''t allow 0 for FOU_ATTR_IPPROTO. (CVE-2026-23083)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v3-its: Avoid truncating memory addresses (CVE-2026-23085)In the Linux kernel, the following vulnerability has been resolved:gue: Fix skb memleak with inner IP protocol 0. (CVE-2026-23095)In the Linux kernel, the following vulnerability has been resolved:migrate: correct lock ordering for hugetlb file folios (CVE-2026-23097)In the Linux kernel, the following vulnerability has been resolved:leds: led-class: Only Add LED to leds_list when it is fully ready (CVE-2026-23101)In the Linux kernel, the following vulnerability has been resolved:ipvlan: Make the addrs_lock be per port (CVE-2026-23103)In the Linux kernel, the following vulnerability has been resolved:net/sched: qfq: Use cl_is_active to determine whether class is active in qfq_rm_from_ag (CVE-2026-23105)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Wake up the error handler when final completions race against each other (CVE-2026-23110)In the Linux kernel, the following vulnerability has been resolved:bonding: provide a net pointer to __skb_flow_dissect() (CVE-2026-23119)In the Linux kernel, the following vulnerability has been resolved:sctp: move SCTP_CMD_ASSOC_SHKEY right after SCTP_CMD_PEER_INIT (CVE-2026-23125)In the Linux kernel, the following vulnerability has been resolved:ext4: fix iloc.bh leak in ext4_xattr_inode_update_ref (CVE-2026-23145)In the Linux kernel, the following vulnerability has been resolved:rocker: fix memory leak in rocker_world_port_post_fini() (CVE-2026-23164)In the Linux kernel, the following vulnerability has been resolved:scsi: target: iscsi: Fix use-after-free in iscsit_dec_session_usage_count() (CVE-2026-23193)In the Linux kernel, the following vulnerability has been resolved:KVM: Don''t clobber irqfd routing type when deassigning irqfd (CVE-2026-23198)In the Linux kernel, the following vulnerability has been resolved:macvlan: fix error recovery in macvlan_common_newlink() (CVE-2026-23209)In the Linux kernel, the following vulnerability has been resolved:scsi: target: iscsi: Fix use-after-free in iscsit_dec_conn_usage_count() (CVE-2026-23216)In the Linux kernel, the following vulnerability has been resolved: crypto: virtio - Add spinlock protection with virtqueue notification When VM boots with one virtio-crypto PCI device and builtin backend, run openssl benchmark command with multiple processes, such as openssl speed -evp aes-128-cbc -engine afalg -seconds 10 -multi 32 openssl processes will hangup and there is error reported like this: virtio_crypto virtio0: dataq.0:id 3 is not a head! It seems that the data virtqueue need protection when it is handled for virtio done notification. If the spinlock protection is added in virtcrypto_done_task(), openssl benchmark with multiple processes works well. (CVE-2026-23229)In the Linux kernel, the following vulnerability has been resolved: romfs: check sb_set_blocksize() return value romfs_fill_super() ignores the return value of sb_set_blocksize(), which can fail if the requested block size is incompatible with the block device''s configuration. This can be triggered by setting a loop device''s block size larger than PAGE_SIZE using ioctl(LOOP_SET_BLOCK_SIZE, 32768), then mounting a romfs filesystem on that device. When sb_set_blocksize(sb, ROMBSIZE) is called with ROMBSIZE=4096 but the device has logical_block_size=32768, bdev_validate_blocksize() fails because the requested size is smaller than the device''s logical block size. sb_set_blocksize() returns 0 (failure), but romfs ignores this and continues mounting. The superblock''s block size remains at the device''s logical block size (32768). Later, when sb_bread() attempts I/O with this oversized block size, it triggers a kernel BUG in folio_set_bh(): kernel BUG at fs/buffer.c:1582! BUG_ON(size > PAGE_SIZE); Fix by checking the return value of sb_set_blocksize() and failing the mount with -EINVAL if it returns 0. (CVE-2026-23238)'
