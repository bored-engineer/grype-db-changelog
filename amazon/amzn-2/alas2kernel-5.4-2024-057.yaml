Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: double hook unregistration in netns path (CVE-2022-49558)A race condition leading to a use-after-free issue was found in the QXL driver in the Linux kernel. (CVE-2023-39198)A use-after-free vulnerability in the Linux kernel''s netfilter: nf_tables component can be exploited to achieve local privilege escalation.Due to a race condition between nf_tables netlink control plane transaction and nft_set element garbage collection, it is possible to underflow the reference counter causing a use-after-free vulnerability.We recommend upgrading past commit 3e91b0ebd994635df2346353322ac51ce84ce6d8. (CVE-2023-4244)When a router encounters an IPv6 packet too big to transmit to the next-hop, it returns an ICMP6 "Packet Too Big" (PTB) message to the sender. The sender caches this updated Maximum Transmission Unit (MTU) so it knows not to exceed this value when subsequently routing to the same host.In Linux kernels prior to 6.3, garbage collection is run on the IPv6 Destination Route Cache if the number of entries exceeds a threshold when adding the destination to the cache. This garbage collection examines every entry in the cache while holding a lock. In these affected kernel versions, a flood of the IPv6 ICMP6 PTB messages could cause high lock contention and increased CPU usage, leading to a Denial-of-Service.The fix backports the garbage collection improvements from Linux kernel 6.3 by bringing the IPv6 code closer to the IPv4 code, which does not have this issue.Patch: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit?id=af6d10345ca76670c1b7c37799f0d5576ccef277 (CVE-2023-52340)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_set_rbtree: skip sync GC for new elements in this transactionNew elements in this transaction might expired before such transactionends. Skip sync GC for such elements otherwise commit path might walkover an already released object. Once transaction is finished, async GCwill collect such expired element. (CVE-2023-52433)In the Linux kernel, the following vulnerability has been resolved:io_uring/af_unix: disable sending io_uring over sockets (CVE-2023-52654)In the Linux kernel, the following vulnerability has been resolved:gfs2: ignore negated quota changes (CVE-2023-52759)In the Linux kernel, the following vulnerability has been resolved:bonding: stop the device in bond_setup_by_slave() (CVE-2023-52784)In the Linux kernel, the following vulnerability has been resolved:i2c: core: Run atomic i2c xfer when !preemptible (CVE-2023-52791)In the Linux kernel, the following vulnerability has been resolved:ipvlan: add ipvlan_route_v6_outbound() helper (CVE-2023-52796)In the Linux kernel, the following vulnerability has been resolved:scsi: libfc: Fix potential NULL pointer dereference in fc_lport_ptp_setup() (CVE-2023-52809)In the Linux kernel, the following vulnerability has been resolved:crypto: pcrypt - Fix hungtask for PADATA_RESET (CVE-2023-52813)In the Linux kernel, the following vulnerability has been resolved:drm/amd: Fix UBSAN array-index-out-of-bounds for SMU7 (CVE-2023-52818)In the Linux kernel, the following vulnerability has been resolved:drm/amd: Fix UBSAN array-index-out-of-bounds for Polaris and Tonga (CVE-2023-52819)In the Linux kernel, the following vulnerability has been resolved:perf/core: Bail out early if the request AUX area is out of bound (CVE-2023-52835)In the Linux kernel, the following vulnerability has been resolved:tracing: Have trace_event_file have ref counters (CVE-2023-52879)In the Linux kernel, the following vulnerability has been resolved:tcp: do not accept ACK of bytes we never sent (CVE-2023-52881)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: adapt set backend to use GC transaction API (CVE-2023-52923)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: don''t skip expired elements during walk (CVE-2023-52924)An out-of-bounds read vulnerability was found in the NVMe-oF/TCP subsystem in the Linux kernel. This flaw allows a remote attacker to send a crafted TCP packet, triggering a heap-based buffer overflow that results in kmalloc data to be printed (and potentially leaked) to the kernel ring buffer (dmesg). (CVE-2023-6121)A use-after-free flaw was found in the Linux Kernel due to a race problem in the unix garbage collector''s deletion of SKB races with unix_stream_read_generic() on the socket that the SKB is queued on. (CVE-2023-6531)A heap out-of-bounds write vulnerability in the Linux kernel''s Performance Events system component can be exploited to achieve local privilege escalation.A perf_event''s read_size can overflow, leading to an heap out-of-bounds increment or write in perf_read_group().We recommend upgrading past commit 382c27f4ed28f803b1f1473ac2d8db0afc795a1b. (CVE-2023-6931)A use-after-free vulnerability in the Linux kernel''s ipv4: igmp component can be exploited to achieve local privilege escalation.A race condition can be exploited to cause a timer be mistakenly registered on a RCU read locked object which is freed by another thread.We recommend upgrading past commit e2b706c691905fe78468c361aaabc719d0a496f1. (CVE-2023-6932)A use-after-free issue was found in igmp_start_timer in net/ipv4/igmp.c in the network sub-component in the Linux Kernel. This flaw allows a local user to observe a refcnt use-after-free issue when receiving an igmp query packet, leading to a kernel information leak. (CVE-2024-0584)'
