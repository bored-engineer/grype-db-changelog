Vulnerability:
    Description: 'A use-after-free flaw was found in vcs_read in drivers/tty/vt/vc_screen.c in vc_screen in the Linux Kernel. In this flaw an attacker with local user access may lead to a system crash or a leak of internal kernel information. (CVE-2023-3567)In the Linux kernel, the following vulnerability has been resolved:llc: verify mac len before reading mac header (CVE-2023-52843)In the Linux kernel, the following vulnerability has been resolved:tipc: Change nla_policy for bearer-related names to NLA_NUL_STRING (CVE-2023-52845)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: possible buffer overflow (CVE-2023-52867)In the Linux kernel, the following vulnerability has been resolved:thermal: core: prevent potential string overflow (CVE-2023-52868)In the Linux kernel, the following vulnerability has been resolved:vc_screen: move load of struct vc_data pointer in vcs_read() to avoid UAF (CVE-2023-52973)'
