resolved:mmc: via-sdmmc: stop card-detect handling on probe failure (CVE-2026-89440)In the Linux kernel, the following vulnerability has been resolved:sctp: fix stream->outcnt underflow on duplicate RECONF responsesA cached RECONF chunk may contain more than one request parameter.  Aduplicate response can therefore find and process the same ADD_OUT requestagain while another parameter is still outstanding, rolling back outcnttwice and possibly underflowing it.Track outstanding request types as bits and clear each bit after its firstresponse.  Later responses for the same request are then ignored. (CVE-2026-89476)In the Linux kernel, the following vulnerability has been resolved:sctp: fix NULL deref on untransmitted RECONF completion (CVE-2026-89477)In the Linux kernel, the following vulnerability has been resolved:sctp: drop a chunk if its transport was removed (CVE-2026-89478)In the Linux kernel, the following vulnerability has been resolved:sctp: stop processing a packet once its association is deleted (CVE-2026-89479)In the Linux kernel, the following vulnerability has been resolved:nvme-tcp: do not accept C2HData based on blk_rq_payload_bytes() alone (CVE-2026-89482)In the Linux kernel, the following vulnerability has been resolved:nvme: zero the discard fallback page (CVE-2026-89483)In the Linux kernel, the following vulnerability has been resolved:lockd: pin next file across nlm_inspect_file lock-drop (CVE-2026-89485)In the Linux kernel, the following vulnerability has been resolved:openvswitch: only skb_tx_error() a packet we are about to drop (CVE-2026-89487)In the Linux kernel, the following vulnerability has been resolved:openvswitch: Fix CT limit teardown use-after-free (CVE-2026-89488)In the Linux kernel, the following vulnerability has been resolved:RDMA/ucma: Lock the handler in ucma_set_ib_path() (CVE-2026-89508)In the Linux kernel, the following vulnerability has been resolved:RDMA/cxgb4: Cancel reg_work before freeing device on removec4iw_uld_state_change() queues reg_work to register the RDMA device.c4iw_remove() can free ctx->dev while this work is pending or running,leaving c4iw_register_device() accessing the freed device.Cancel reg_work before removing the device.  The registration work cantear down ctx->dev when registration fails, so do not unregister ordeallocate it again in that case.This issue was found by an in-house static analysis tool. (CVE-2026-89510)In the Linux kernel, the following vulnerability has been resolved:qede: Fix NULL pointer dereference in TPA fragment processingUnder memory pressure, the qede driver encounters NULL pointerdereferences when processing TPA continuation fragments.Commit 8a8633978b84 ("qede: Add build_skb() support.") accidentallydropped the assignment of tpa_info->buffer.data in qede_tpa_start().When memory pressure causes an SKB allocation failure in qede_tpa_start(),the driver sets tpa_start_fail = true and attempts to recycle the physicalpage later in qede_tpa_end() via qede_reuse_page(). However, becausebuffer.data was left uninitialized (NULL), qede_reuse_page() pushes a"ghost" BD (valid DMA mapping but NULL data pointer) back into theactive Rx ring.The next time the hardware uses this ring slot, it passes a NULL pageto qede_fill_frag_skb(), causing a kernel panic.Example crash from production system:BUG: unable to handle kernel NULL pointer dereference at 0x8RIP: qede_fill_frag_skb+0x96/0x430 [qede]Call Trace:qede_rx_int+0xb06/0x1de0qede_poll+0x2f4/0x6c0__napi_poll+0x2d/0x130Fix the root cause by restoring the tpa_info->buffer.data assignmentin qede_tpa_start(), ensuring valid pages are correctly tracked andrecycled. Additionally, update the stale comment forstruct qede_agg_info::buffer to reflect its current usage. (CVE-2026-89511)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Fill in DMA padding bytes in scsi_alloc_sgtables() (CVE-2026-89515)In the Linux kernel, the following vulnerability has been resolved:udf: reject VAT indexes equal to the entry count (CVE-2026-89525)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: Reject krb5 v2 wrap tokens with oversized ec field (CVE-2026-89538)In the Linux kernel, the following vulnerability has been resolved:sunrpc: init gssp_lock before publishing proc entry (CVE-2026-89540)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: harden gss_unwrap_resp_priv length checks (CVE-2026-89541)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: harden gss_krb5_unwrap_v2 against short tokens (CVE-2026-89542)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: always drain cache_cleaner before destroying a cache_detail (CVE-2026-89548)In the Linux kernel, the following vulnerability has been resolved:sunrpc: route to a populated pool in svc_pool_for_cpu() (CVE-2026-89549)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: xdr_buf_trim: clamp buf->len to avoid underflow (CVE-2026-89551)In the Linux kernel, the following vulnerability has been resolved:mptcp: fix uninitialized local_id in syncookie MP_JOIN reconstruction (CVE-2026-89554)In the Linux kernel, the following vulnerability has been resolved:mpls: reload header after pskb_may_pull()mpls_select_multipath() calls mpls_multipath_hash() to choose a nexthopwhen an MPLS route has multiple nexthops.  While walking the MPLS labelstack, the hash routine caches hdr for the current label.  After findingthe bottom-of-stack label, it calls pskb_may_pull() before reading theinner IP header.If an skb is constructed with the inner IP header in nonlinear data andinsufficient tailroom in the linear head, pskb_may_pull() callspskb_expand_head() to replace the skb head and free the old one.  Thisleaves hdr pointing to freed memory.  The IPv6 path can invalidate hdragain when it performs a second pull for the larger header.The issue was found through static analysis.  A reproducer sending a legalGeneve packet through a bareudp/MPLS multipath setup triggered the sameKASAN report in 2 of 2 unpatched runs:BUG: KASAN: slab-use-after-free in mpls_select_multipathRead of size 1 at addr ffff88800ecc6e20 by task ksoftirqd/1/23Call Trace:mpls_select_multipathmpls_forward__netif_receive_skb_list_corenetif_receive_skb_list_internalnapi_complete_donegro_cell_poll__napi_pollnet_rx_actionFreed by task 23:kfreepskb_expand_head__pskb_pull_tailmpls_select_multipathReload hdr from the current skb head after each successful pull beforederiving the inner IPv4 or IPv6 header pointer. (CVE-2026-89555)In the Linux kernel, the following vulnerability has been resolved:md: do overflow check for sb->bblog_shift in super_1_load() (CVE-2026-89557)In the Linux kernel, the following vulnerability has been resolved:libnvdimm/labels: Prevent integer overflow in __nd_label_validate() (CVE-2026-89559)In the Linux kernel, the following vulnerability has been resolved:ip6_gre: fix hardware header length for NBMA tunnels (CVE-2026-89562)In the Linux kernel, the following vulnerability has been resolved:ip6_tunnel: use skb_cow_head() in ip6_tnl_xmit() (CVE-2026-89563)In the Linux kernel, the following vulnerability has been resolved:dm array: reject an array block whose value size is not the caller''s (CVE-2026-89573)In the Linux kernel, the following vulnerability has been resolved:dm raid1: reserve space for NUL-terminator in build_constructor_string() (CVE-2026-89575)In the Linux kernel, the following vulnerability has been resolved:dm-era: fix shadowed superblock leak on take-snap failure (CVE-2026-89576)In the Linux kernel, the following vulnerability has been resolved:bnx2x: fix double free in bnx2x_init_firmware() error path (CVE-2026-89582)In the Linux kernel, the following vulnerability has been resolved:ata: libata-scsi: fix DSM TRIM for sector sizes larger than 2048 bytes (CVE-2026-89586)In the Linux kernel, the following vulnerability has been resolved:fsnotify: Fix stale object mask after co