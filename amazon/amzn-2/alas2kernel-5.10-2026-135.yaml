026-89643)In the Linux kernel, the following vulnerability has been resolved:ceph: bound xattr value length in __build_xattrs() (CVE-2026-89649)In the Linux kernel, the following vulnerability has been resolved:ceph: bound num_export_targets array for mds info v2/v3 (CVE-2026-89650)In the Linux kernel, the following vulnerability has been resolved:ceph: bound copied dentry name length in NFS export get_nameceph_get_name() copies the MDS-supplied name into the caller''sNAME_MAX-sized buffer with memcpy(name, rinfo->dname, rinfo->dname_len)and then writes name[rinfo->dname_len] = 0, without checking dname_lenagainst NAME_MAX. A malicious or buggy MDS that returns a LOOKUPNAME replywith dname_len > NAME_MAX overflows the buffer. __get_snap_name() copiesrde->name / rde->name_len the same unchecked way.Impact: a malicious or compromised Ceph MDS overflows the NAME_MAX namebuffer in a client''s NFS-export get_name path, a slab out-of-bounds writereported by KASAN. Reachable when a CephFS mount is re-exported over NFS.Add ceph_export_copy_name(), which rejects lengths above NAME_MAX with-ENAMETOOLONG before the copy, and use it in both ceph_get_name() and__get_snap_name(). (CVE-2026-89652)In the Linux kernel, the following vulnerability has been resolved:ceph: fix UAF in __kick_flushing_caps() on cf entry freed during unlock (CVE-2026-89655)In the Linux kernel, the following vulnerability has been resolved:libceph: reject buckets with mismatched CRUSH ids (CVE-2026-89656)In the Linux kernel, the following vulnerability has been resolved:NFSD: Prevent lock owner use-after-free during client teardown (CVE-2026-89662)In the Linux kernel, the following vulnerability has been resolved:nfsd: revoke copy-notify stateids before dropping their reference (CVE-2026-89663)In the Linux kernel, the following vulnerability has been resolved:nfsd: initialize copy-notify stateid before publishing it (CVE-2026-89669)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix XDR padding calculation in ff_encode_getdeviceinfo (CVE-2026-89673)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix XDR length calculation in nfsd4_ff_encode_layoutget (CVE-2026-89674)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix cpntf publish race in nfs4_init_cp_statenfs4_alloc_init_cpntf_state() published the new cpntf entry into thes2s_cp_stateids IDR (with cs_type set) in one s2s_cp_lock section, thentook the lock again to list_add() it onto p_stid->sc_cp_list. In the gapthe entry is reachable by so_id but cp_list is still {NULL,NULL} fromkzalloc. A racing OFFLOAD_CANCEL (so_id is echoed to the client ascnr_stateid, so any NFSv4.2 client can drive it) reachesmanage_cpntf_state() -> _free_cpntf_state_locked() and does list_del() onthe zeroed list_head, oopsing the server.Fold the cs_type assignment and the list_add() into the same criticalsection as idr_alloc_cyclic(), so a concurrent lookup either misses theentry or sees a fully linked cp_list. INIT_LIST_HEAD() the entry afterallocation and switch _free_cpntf_state_locked() to list_del_init() so astale unlink is a no-op. nfs4_init_copy_state() passes NULL p_stid andskips the list_add, preserving NFS4_COPY_STID semantics. (CVE-2026-89684)In the Linux kernel, the following vulnerability has been resolved:nfsd: check client ownership when cancelling a copy-notify stateid (CVE-2026-89694)In the Linux kernel, the following vulnerability has been resolved:nfsd: block non-SAVEFH ops after FOREIGN PUTFH to prevent NULL deref (CVE-2026-89696)In the Linux kernel, the following vulnerability has been resolved:nfsd: validate symlink target length in NFSv4 CREATE (CVE-2026-89699)In the Linux kernel, the following vulnerability has been resolved:nfsd: sample writeback error cursor before async COPY loop (CVE-2026-89704)In the Linux kernel, the following vulnerability has been resolved:nfsd: Reset write verifier when async COPY writeback fails (CVE-2026-89706)In the