ved:sctp: prevent possible shift-out-of-bounds in sctp_transport_update_rto (CVE-2025-40281)In the Linux kernel, the following vulnerability has been resolved:fbdev: Add bounds checking in bit_putcs to fix vmalloc-out-of-bounds (CVE-2025-40304)In the Linux kernel, the following vulnerability has been resolved:ntfs3: pretend $Extend records as regular files (CVE-2025-40313)In the Linux kernel, the following vulnerability has been resolved:bpf: Sync pending IRQ work before freeing ring buffer (CVE-2025-40319)In the Linux kernel, the following vulnerability has been resolved:fbdev: bitblit: bound-check glyph index in bit_putcs* (CVE-2025-40322)In the Linux kernel, the following vulnerability has been resolved:NFSD: Fix crash in nfsd4_read_release() (CVE-2025-40324)In the Linux kernel, the following vulnerability has been resolved:sctp: Prevent TOCTOU out-of-bounds write (CVE-2025-40331)'
