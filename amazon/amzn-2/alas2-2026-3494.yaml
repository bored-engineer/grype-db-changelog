# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'Rclone is a command-line program to sync files and directories to and from different cloud storage providers. From 1.46.0 until 1.74.3, rclone rcd --rc-serve accepts unauthenticated GET and HEAD requests to paths of the form: /[remote:path]/object. The remote value is parsed from the URL and passed to normal backend initialization. Inline remote configuration can set backend options that execute local commands during initialization. As a result, a single unauthenticated GET or HEAD request can execute a command as the rclone process user. This vulnerability is fixed in 1.74.3. (CVE-2026-49980)'
    FixedIn:
        - Available:
            Date: "2026-06-29"
            Kind: advisory
          Name: rclone
          NamespaceName: amzn:2
          Version: 1.55.1-1.amzn2.0.9
          VersionFormat: rpm
        - Available:
            Date: "2026-06-29"
            Kind: advisory
          Name: rclone-debuginfo
          NamespaceName: amzn:2
          Version: 1.55.1-1.amzn2.0.9
          VersionFormat: rpm
