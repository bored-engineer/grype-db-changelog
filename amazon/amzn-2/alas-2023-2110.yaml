# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: A flaw was found in the Python-requests package, where it is vulnerable to potentially leaking Proxy-Authorization headers to destination servers, specifically during redirects to an HTTPS origin. This is a product of how rebuild_proxies is used to recompute and reattach the Proxy-Authorization header to requests when redirected. This behavior only affects proxied requests when credentials are supplied in the URL user information component (for example, https://username:password@proxy:8080). (CVE-2023-32681)
    FixedIn:
        - Name: python-requests
          NamespaceName: amzn:2
          Version: 2.6.0-10.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2023-2110.html
    Metadata:
        CVE:
            - Name: CVE-2023-32681
    Name: ALAS-2023-2110
    NamespaceName: amzn:2
    Severity: Medium
