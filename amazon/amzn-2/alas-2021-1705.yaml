Vulnerability:
    Description: A flaw was found in the ptp4l program of the linuxptp package. When ptp4l is operating on a little-endian architecture as a PTP transparent clock, a remote attacker could send a crafted one-step sync message to cause an information leak or crash. The highest threat from this vulnerability is to data confidentiality and system availability. (CVE-2021-3571)
    FixedIn:
        - Name: linuxptp
          NamespaceName: amzn:2
          Version: 2.0-2.amzn2.1.2
          VersionFormat: rpm
        - Name: linuxptp-debuginfo
          NamespaceName: amzn:2
          Version: 2.0-2.amzn2.1.2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2021-1705.html
