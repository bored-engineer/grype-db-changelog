# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A use-after-free flaw was found in the Linux kernel''s sound subsystem in the way a user triggers concurrent calls of PCM hw_params. The hw_free ioctls or similar race condition happens inside ALSA PCM for other ioctls. This flaw allows a local user to crash or potentially escalate their privileges on the system. (CVE-2022-1048)Product: AndroidVersions: Android kernelAndroid ID: A-224546354References: Upstream kernel (CVE-2022-20368)A buffer overflow flaw was found in the Linux kernel''s NFC protocol functionality. This flaw allows a local user to crash or escalate their privileges on the system. (CVE-2022-26490)In the Linux kernel before 5.17.1, a refcount leak bug was found in net/llc/af_llc.c. (CVE-2022-28356)In the Linux kernel, the following vulnerability has been resolved:usb: usbtmc: Fix bug in pipe direction for control transfers (CVE-2022-48834)In the Linux kernel, the following vulnerability has been resolved:net/packet: fix slab-out-of-bounds access in packet_recvmsg() (CVE-2022-48839)In the Linux kernel, the following vulnerability has been resolved:drm/vrr: Set VRR capable prop only if it is attached to connector (CVE-2022-48843)In the Linux kernel, the following vulnerability has been resolved:tpm: use try_get_ops() in tpm-space.c (CVE-2022-49286)In the Linux kernel, the following vulnerability has been resolved:ALSA: pcm: Fix races among concurrent hw_params and hw_free calls (CVE-2022-49291)'
