    Description: 'In the Linux kernel, the following vulnerability has been resolved:net: tap: NULL pointer derefence in dev_parse_header_protocol when skb->dev is null (CVE-2022-50073)In the Linux kernel, the following vulnerability has been resolved:KVM: x86/mmu: Treat NX as a valid SPTE bit for NPT (CVE-2022-50224)In the Linux kernel, the following vulnerability has been resolved:ACPI: PAD: fix crash in exit_round_robin() (CVE-2024-49935)In the Linux kernel, the following vulnerability has been resolved:codel: remove sch->q.qlen check before qdisc_tree_reduce_backlog() (CVE-2025-37798)In the Linux kernel, the following vulnerability has been resolved:sch_htb: make htb_qlen_notify() idempotent (CVE-2025-37932)In the Linux kernel, the following vulnerability has been resolved:serial: mctrl_gpio: split disable_ms into sync and no_sync APIs (CVE-2025-38040)In the Linux kernel, the following vulnerability has been resolved:virtio: break and reset virtio devices on device_shutdown() (CVE-2025-38064)In the Linux kernel, the following vulnerability has been resolved:rseq: Fix segfault on registration when rseq_cs is non-zero (CVE-2025-38067)In the Linux kernel, the following vulnerability has been resolved:net_sched: sch_sfq: reject invalid perturb period (CVE-2025-38193)'
