Vulnerability:
    Description: Malicious patch files cause ed to execute arbitrary commandsGNU Patch version 2.7.6 contains an input validation vulnerability when processing patch files, specifically the EDITOR_PROGRAM invocation (using ed) can result in code execution. This attack appear to be exploitable via a patch file processed via the patch utility. This is similar to FreeBSD's CVE-2015-1418 however although they share a common ancestry the code bases have diverged over time.(CVE-2018-1000156)
    FixedIn:
        - Name: patch
          NamespaceName: amzn:2
          Version: 2.7.1-10.amzn2
          VersionFormat: rpm
        - Name: patch-debuginfo
          NamespaceName: amzn:2
          Version: 2.7.1-10.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2018-1008.html
