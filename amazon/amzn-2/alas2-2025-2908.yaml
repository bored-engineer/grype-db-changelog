# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: File::Find::Rule through 0.34 for Perl is vulnerable to Arbitrary Code Execution when `grep()` encounters a crafted filename.A file handle is opened with the 2 argument form of `open()` allowing an attacker controlled filename to provide the MODE parameter to `open()`, turning the filename into a command to be executed.Example:$ mkdir /tmp/poc; echo > "/tmp/poc/|id"$ perl -MFile::Find::Rule \-E 'File::Find::Rule->grep("foo")->in("/tmp/poc")'uid=1000(user) gid=1000(user) groups=1000(user),100(users) (CVE-2011-10007)
    FixedIn:
        - Name: perl-File-Find-Rule-Perl
          NamespaceName: amzn:2
          Version: 1.13-2.amzn2.0.2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2025-2908.html
    Metadata:
        CVE:
            - Name: CVE-2011-10007
    Name: ALAS2-2025-2908
    NamespaceName: amzn:2
    Severity: High
