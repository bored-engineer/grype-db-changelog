Vulnerability:
    Description: urllib3 before version 1.23 does not remove the Authorization HTTP header when following a cross-origin redirect (i.e., a redirect that differs in host, port, or scheme). This can allow for credentials in the Authorization header to be exposed to unintended hosts or transmitted in cleartext. (CVE-2018-20060)
    FixedIn:
        - Available:
            Date: "2020-06-30"
            Kind: advisory
          Name: python-urllib3
          NamespaceName: amzn:2
          Version: 1.25.7-1.amzn2.0.1
          VersionFormat: rpm
