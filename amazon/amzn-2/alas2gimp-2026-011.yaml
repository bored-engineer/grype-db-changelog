Vulnerability:
    Description: 'GIMP: PSD loader: heap-buffer-overflow in fread_pascal_string() (no null terminator) (CVE-2026-2239)An integer overflow vulnerability has been identified in the PSP (Paint Shop Pro) file parser of GIMP. The issue occurs in the read_creator_block() function, where the Creator metadata block is processed. Specifically, a 32-bit length value read from the file is used directly for memory allocation without proper validation. (CVE-2026-2271)GIMP: ICO import integer overflow bypass leads to heap buffer overflow (CVE-2026-2272)'
