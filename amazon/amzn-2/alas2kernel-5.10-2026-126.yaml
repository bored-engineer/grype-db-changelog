    Description: 'In the Linux kernel, the following vulnerability has been resolved:ext4: replace BUG_ON with proper error handling in ext4_read_inline_folio (CVE-2026-31451)In the Linux kernel, the following vulnerability has been resolved:usb: cdns3: gadget: fix NULL pointer dereference in ep_queue (CVE-2026-31755)In the Linux kernel, the following vulnerability has been resolved:xfrm: defensively unhash xfrm_state lists in __xfrm_state_delete (CVE-2026-46116)In the Linux kernel, the following vulnerability has been resolved:regulator: core: fix locking in regulator_resolve_supply() error path (CVE-2026-46252)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: use list_del_rcu for netlink hooks (CVE-2026-46324)In the Linux kernel, the following vulnerability has been resolved:net/sched: fix pedit partial COW leading to page cache corruption (CVE-2026-46331)In the Linux kernel, the following vulnerability has been resolved:ip6_vti: set netns_immutable on the fallback device. (CVE-2026-52909)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix same-register dst/src OOB read and pointer leak in sock_ops (CVE-2026-53078)In the Linux kernel, the following vulnerability has been resolved:fuse: limit FUSE_NOTIFY_RETRIEVE to uptodate folios (CVE-2026-53167)In the Linux kernel, the following vulnerability has been resolved:bnxt_en: Fix NULL pointer dereference (CVE-2026-53177)In the Linux kernel, the following vulnerability has been resolved:l2tp: pppol2tp: hold reference to session in pppol2tp_ioctl() (CVE-2026-53262)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Fix shadow paging use-after-free due to unexpected role (CVE-2026-53359)'
