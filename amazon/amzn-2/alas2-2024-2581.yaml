    Description: 'An issue was discovered in arch/x86/kvm/vmx/nested.c in the Linux kernel before 6.2.8. nVMX on x86_64 lacks consistency checks for CR0 and CR4. (CVE-2023-30456)In the Linux kernel, the following vulnerability has been resolved:net: bridge: use DEV_STATS_INC() (CVE-2023-52578)In the Linux kernel, the following vulnerability has been resolved:drm/amdgpu: validate the parameters of bo mapping operations more clearly (CVE-2024-26922)In the Linux kernel, the following vulnerability has been resolved:af_unix: Fix garbage collector racing against connect() (CVE-2024-26923)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix OOB in nilfs_set_de_type (CVE-2024-26981)In the Linux kernel, the following vulnerability has been resolved:fs: sysfs: Fix reference leak in sysfs_break_active_protection() (CVE-2024-26993)In the Linux kernel, the following vulnerability has been resolved:serial: mxs-auart: add spinlock around changing cts state (CVE-2024-27000)In the Linux kernel, the following vulnerability has been resolved:tun: limit printing rate when illegal packet received by tun dev (CVE-2024-27013)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: Fix potential data-race in __nft_expr_type_get() (CVE-2024-27020)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v3-its: Prevent double free on error (CVE-2024-35847)In the Linux kernel, the following vulnerability has been resolved:btrfs: fix information leak in btrfs_ioctl_logical_to_ino() (CVE-2024-35849)In the Linux kernel, the following vulnerability has been resolved:dyndbg: fix old BUG_ON in >control parser (CVE-2024-35947)In the Linux kernel, the following vulnerability has been resolved:kprobes: Fix possible use-after-free issue on kprobe registration (CVE-2024-35955)In the Linux kernel, the following vulnerability has been resolved:net/mlx5: Properly link new fs rules into the tree (CVE-2024-35960)In the Linux kernel, the following vulnerability has been resolved:ipv6: fix race condition between ipv6_get_ifaddr and ipv6_del_addr (CVE-2024-35969)In the Linux kernel, the following vulnerability has been resolved:geneve: fix header validation in geneve[6]_xmit_skb (CVE-2024-35973)In the Linux kernel, the following vulnerability has been resolved:HID: i2c-hid: remove I2C_HID_READ_PENDING flag to prevent lock-up (CVE-2024-35997)In the Linux kernel, the following vulnerability has been resolved:i40e: Do not use WQ_MEM_RECLAIM flag for workqueue (CVE-2024-36004)In the Linux kernel, the following vulnerability has been resolved:rtnetlink: Correct nested IFLA_VF_VLAN_LIST attribute validation (CVE-2024-36017)In the Linux kernel, the following vulnerability has been resolved:net: fix out-of-bounds access in ops_init (CVE-2024-36883)In the Linux kernel, the following vulnerability has been resolved:tipc: fix UAF in error path (CVE-2024-36886)In the Linux kernel, the following vulnerability has been resolved:ipv6: fib6_rules: avoid possible NULL dereference in fib6_rule_action() (CVE-2024-36902)In the Linux kernel, the following vulnerability has been resolved:tcp: defer shutdown(SEND_SHUTDOWN) for TCP_SYN_RECV sockets (CVE-2024-36905)In the Linux kernel, the following vulnerability has been resolved:pinctrl: core: delete incorrect free in pinctrl_enable() (CVE-2024-36940)In the Linux kernel, the following vulnerability has been resolved:tipc: fix a possible memleak in tipc_buf_append (CVE-2024-36954)In the Linux kernel, the following vulnerability has been resolved:pinctrl: devicetree: fix refcount leak in pinctrl_dt_to_map() (CVE-2024-36959)'
