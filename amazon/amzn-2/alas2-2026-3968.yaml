# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A flaw was found in jwcrypto. The JWK.import_key() function validates the key_ops JWK member for duplicate values using an algorithm with O(n^2) time complexity, and the length of key_ops is not bounded. A remote, unauthenticated attacker can supply a JWK with a large key_ops array to an application that passes attacker-controlled key material to a public key-import API (reachable via ECDH-ES key agreement, OIDC dynamic client registration, DPoP, or ACME account key registration, among others) to consume excessive CPU time, resulting in a denial of service. (CVE-2026-92091)
    FixedIn:
        - Available:
            Date: "2026-10-12"
            Kind: advisory
          Name: python-jwcrypto
          NamespaceName: amzn:2
          Version: 0.4.2-1.amzn2.0.4
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2026-3968.html
