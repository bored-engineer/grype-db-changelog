# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: ssl.SSLContext.wrap_bio() didn't require the server_hostname argumentto not be None if ssl.SSLContext.check_hostname was set. Due to amissing parameter check in SSLObject, if the server_hostname argumentisn't supplied then hostname verification would be silently skipped.This defect could lead to programs where certificate hostname verification*appeared* to be succeeding with SSLContext.check_hostname = True and noValueError being raised due to misconfiguration.If the program passes a server_hostname value that isn't an empty stringor None to any of these APIs then certificate hostname verificationproceeds as expected and the program is not affected by this vulnerability.Mitigating this vulnerability doesn't require updating Python or applyingthe patch. To mitigate, pass a valid non-None and non-emptyserver_hostname value to SSLContext.wrap_bio(),asyncio.create_connection(), or asyncio.loop.start_tls() andcertificate hostname verification will proceed as expected. Upgrading tothe latest version of Python or applying the patch only changes thebehavior from silently skipping hostname verification to raising aValueError, similar to SSLContext.wrap_socket(), when server_hostnameisn't supplied. (CVE-2026-19553)
