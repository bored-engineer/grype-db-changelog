          VersionFormat: rpm
        - Name: libseccomp-devel
          NamespaceName: amzn:2
          Version: 2.4.1-1.amzn2
          VersionFormat: rpm
        - Name: libseccomp-static
          NamespaceName: amzn:2
          Version: 2.4.1-1.amzn2
          VersionFormat: rpm
