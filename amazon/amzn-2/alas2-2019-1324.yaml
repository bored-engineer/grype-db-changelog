Vulnerability:
    Description: It was discovered that keycloak-httpd-client-install uses a predictable log file name in /tmp. A local attacker could create a symbolic link to a sensitive location, possibly causing data corruption or denial of service.(CVE-2017-15111)In keycloak-http-client-install prior to version 0.8, the admin password could be provided through a command-line argument. This might result in the password being leaked through shell history, or becoming visible to a local attacker at the time the program is running.(CVE-2017-15112)
    FixedIn:
        - Name: keycloak-httpd-client-install
          NamespaceName: amzn:2
          Version: 0.8-1.amzn2
          VersionFormat: rpm
        - Name: python2-keycloak-httpd-client-install
          NamespaceName: amzn:2
          Version: 0.8-1.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2019-1324.html
    Metadata:
        CVE:
            - Name: CVE-2017-15111
            - Name: CVE-2017-15112
    Name: ALAS2-2019-1324
    NamespaceName: amzn:2
    Severity: Low
