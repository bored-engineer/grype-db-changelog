Vulnerability:
    Description: 'A kernel information leak flaw was identified in the scsi_ioctl function in drivers/scsi/scsi_ioctl.c in the Linux kernel. This flaw allows a local attacker with a special user privilege (CAP_SYS_ADMIN or CAP_SYS_RAWIO) to create issues with confidentiality. (CVE-2022-0494)An information leak flaw was found in NFS over RDMA in the net/sunrpc/xprtrdma/rpc_rdma.c function in RPCRDMA_HDRLEN_MIN (7) (in rpcrdma_max_call_header_size, rpcrdma_max_reply_header_size). This flaw allows an attacker with normal user privileges to leak kernel information. (CVE-2022-0812)Due to the small table perturb size, a memory leak flaw was found in the Linux kernel''s TCP source port generation algorithm in the net/ipv4/tcp.c function. This flaw allows an attacker to leak information and may cause a denial of service. (CVE-2022-1012)A use-after-free flaw was found in fs/ext4/namei.c:dx_insert_block() in the Linux kernel''s filesystem sub-component. This flaw allows a local attacker with a user privilege to cause a denial of service. (CVE-2022-1184)A use-after-free vulnerability was found in the Linux kernel''s Netfilter subsystem in net/netfilter/nf_tables_api.c. This flaw allows a local attacker with user access to cause a privilege escalation issue. (CVE-2022-1966)A flaw was found in hw. Incomplete cleanup of multi-core shared buffers for some Intel(r) Processors may allow an authenticated user to enable information disclosure via local access. (CVE-2022-21123)A flaw was found in hw. Incomplete cleanup of microarchitectural fill buffers on some Intel(r) Processors may allow an authenticated user to enable information disclosure via local access. (CVE-2022-21125)A flaw was found in hw. Incomplete cleanup in specific special register write operations for some Intel&reg; Processors may allow an authenticated user to enable information disclosure via local access. (CVE-2022-21166)net/netfilter/nf_tables_api.c in the Linux kernel through 5.18.1 allows a local user (able to create user/net namespaces) to escalate privileges to root because an incorrect NFT_STATEFUL_EXPR check leads to a use-after-free. (CVE-2022-32250)The Linux kernel before 5.17.9 allows TCP servers to identify clients by observing what source ports are used. (CVE-2022-32296)An issue was discovered in the Linux kernel through 5.18.3 on powerpc 32-bit platforms. There is a buffer overflow in ptrace PEEKUSER and POKEUSER (aka PEEKUSR and POKEUSR) when accessing floating point registers. (CVE-2022-32981)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: fix a possible null pointer dereference (CVE-2022-48710)In the Linux kernel, the following vulnerability has been resolved:exec: Force single empty string when argv is empty (CVE-2022-49264)In the Linux kernel, the following vulnerability has been resolved:nbd: fix io hung while disconnecting device (CVE-2022-49297)In the Linux kernel, the following vulnerability has been resolved:nbd: fix race between nbd_alloc_config() and module removal (CVE-2022-49300)In the Linux kernel, the following vulnerability has been resolved:tty: synclink_gt: Fix null-pointer-dereference in slgt_clean() (CVE-2022-49307)In the Linux kernel, the following vulnerability has been resolved:extcon: Modify extcon device to be created after driver data is set (CVE-2022-49308)In the Linux kernel, the following vulnerability has been resolved:xprtrdma: treat all calls not a bcall when bc_serv is NULL (CVE-2022-49321)In the Linux kernel, the following vulnerability has been resolved:tracing: Fix sleeping function called from invalid context on RT kernel (CVE-2022-49322)In the Linux kernel, the following vulnerability has been resolved:tcp: fix tcp_mtup_probe_success vs wrong snd_cwnd (CVE-2022-49330)In the Linux kernel, the following vulnerability has been resolved:net: ipv6: unexport __init-annotated seg6_hmac_init() (CVE-2022-49339)In the Linux kernel, the following vulnerability has been resolved:ext4: avoid cycles in directory h-tree (CVE-2022-49343)In the Linux kernel, the following vulnerability has been resolved:net: xfrm: unexport __init-annotated xfrm4_protocol_init() (CVE-2022-49345)In the Linux kernel, the following vulnerability has been resolved:ext4: fix bug_on in ext4_writepages (CVE-2022-49347)In the Linux kernel, the following vulnerability has been resolved:ext4: fix use-after-free in ext4_rename_dir_prepare (CVE-2022-49349)In the Linux kernel, the following vulnerability has been resolved:net: mdio: unexport __init-annotated mdio_bus_init() (CVE-2022-49350)In the Linux kernel, the following vulnerability has been resolved:firmware: dmi-sysfs: Fix memory leak in dmi_sysfs_register_handle (CVE-2022-49370)In the Linux kernel, the following vulnerability has been resolved:tcp: tcp_rtx_synack() can be called from process context (CVE-2022-49372)In the Linux kernel, the following vulnerability has been resolved:ubi: ubi_create_volume: Fix use-after-free when volume creation failed (CVE-2022-49388)In the Linux kernel, the following vulnerability has been resolved:usb: usbip: fix a refcount leak in stub_probe() (CVE-2022-49389)In the Linux kernel, the following vulnerability has been resolved:dlm: fix plock invalid read (CVE-2022-49407)In the Linux kernel, the following vulnerability has been resolved:video: fbdev: clcdfb: Fix refcount leak in clcdfb_of_vram_setup (CVE-2022-49421)In the Linux kernel, the following vulnerability has been resolved:PCI: Avoid pci_dev_lock() AB/BA deadlock with sriov_numvfs_store() (CVE-2022-49434)In the Linux kernel, the following vulnerability has been resolved:tty: fix deadlock caused by calling printk() under tty_port->lock (CVE-2022-49441)In the Linux kernel, the following vulnerability has been resolved:drivers/base/node.c: fix compaction sysfs file leak (CVE-2022-49442)In the Linux kernel, the following vulnerability has been resolved:rxrpc: Fix listen() setting the bar too high for the prealloc rings (CVE-2022-49450)In the Linux kernel, the following vulnerability has been resolved:net: phy: micrel: Allow probing without .driver_data (CVE-2022-49472)In the Linux kernel, the following vulnerability has been resolved:nvme-pci: fix a NULL pointer dereference in nvme_alloc_admin_tags (CVE-2022-49492)In the Linux kernel, the following vulnerability has been resolved:drm/virtio: fix NULL pointer dereference in virtio_gpu_conn_get_modes (CVE-2022-49532)In the Linux kernel, the following vulnerability has been resolved:zsmalloc: fix races between asynchronous zspage free and page migration (CVE-2022-49554)In the Linux kernel, the following vulnerability has been resolved:netfilter: conntrack: re-fetch conntrack after insertion (CVE-2022-49561)In the Linux kernel, the following vulnerability has been resolved:ext4: add reserved GDT blocks check (CVE-2022-49707)In the Linux kernel, the following vulnerability has been resolved:ext4: fix bug_on ext4_mb_use_inode_pa (CVE-2022-49708)In the Linux kernel, the following vulnerability has been resolved:i40e: Fix call trace in setup_tx_descriptors (CVE-2022-49725)In the Linux kernel, the following vulnerability has been resolved:ipv6: Fix signed integer overflow in l2tp_ip6_sendmsg (CVE-2022-49727)In the Linux kernel, the following vulnerability has been resolved:ata: libata-core: fix NULL pointer deref in ata_host_alloc_pinfo() (CVE-2022-49731)'
