Vulnerability:
    Description: 'A vulnerability, which was classified as problematic, was found in Linux Kernel. This affects the function tcp_getsockopt/tcp_setsockopt of the component TCP Handler. The manipulation leads to race condition. It is recommended to apply a patch to fix this issue. The identifier VDB-211089 was assigned to this vulnerability. (CVE-2022-3566)A vulnerability has been found in Linux Kernel and classified as problematic. This vulnerability affects the function inet6_stream_ops/inet6_dgram_ops of the component IPv6 Handler. The manipulation leads to race condition. It is recommended to apply a patch to fix this issue. VDB-211090 is the identifier assigned to this vulnerability. (CVE-2022-3567)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Fix a use-after-free (CVE-2022-48666)In the Linux kernel, the following vulnerability has been resolved:net: relax socket state check at accept time. (CVE-2024-36484)In the Linux kernel, the following vulnerability has been resolved:bpf, skmsg: Fix NULL pointer dereference in sk_psock_skb_ingress_enqueue (CVE-2024-36938)In the Linux kernel, the following vulnerability has been resolved:usb-storage: alauda: Check whether the media is initialized (CVE-2024-38619)kernel: virtio-net: tap: mlx5_core short frame denial of service (CVE-2024-41090)kernel: virtio-net: tun: mlx5_core short frame denial of service (CVE-2024-41091)'
