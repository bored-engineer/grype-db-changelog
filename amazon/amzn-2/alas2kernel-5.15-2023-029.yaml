Vulnerability:
    Description: 'A flaw in the kernel Xen event handler can cause a deadlock with Xen console handling in unprivileged Xen guests. (CVE-2023-34324)In the Linux kernel, the following vulnerability has been resolved:usb: hub: Guard against accesses to uninitialized BOS descriptors (CVE-2023-52477)In the Linux kernel, the following vulnerability has been resolved:x86/alternatives: Disable KASAN in apply_alternatives() (CVE-2023-52504)In the Linux kernel, the following vulnerability has been resolved:net: fix possible store tearing in neigh_periodic_work() (CVE-2023-52522)In the Linux kernel, the following vulnerability has been resolved:bpf, sockmap: Reject sk_msg egress redirects to non-TCP sockets (CVE-2023-52523)In the Linux kernel, the following vulnerability has been resolved:iommu/vt-d: Avoid memory allocation in iommu_suspend() (CVE-2023-52559)A denial of service vulnerability was found in tipc_crypto_key_revoke in net/tipc/crypto.c in the Linux kernel''s TIPC subsystem. This flaw allows guests with local user privileges to trigger a deadlock and potentially crash the system. (CVE-2024-0641)'
