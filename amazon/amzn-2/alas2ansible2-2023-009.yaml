Vulnerability:
    Description: A flaw was found in the solaris_zone module from the Ansible Community modules. When setting the name for the zone on the Solaris host, the zone name is checked by listing the process with the 'ps' bare command on the remote machine. An attacker could take advantage of this flaw by crafting the name of the zone and executing arbitrary commands in the remote host. Ansible Engine 2.7.15, 2.8.7, and 2.9.2 as well as previous versions are affected. (CVE-2019-14904)A vulnerability was found in Ansible Engine versions 2.9.x before 2.9.3, 2.8.x before 2.8.8, 2.7.x before 2.7.16 and earlier, where in Ansible's nxos_file_copy module can be used to copy files to a flash or bootflash on NXOS devices. Malicious code could craft the filename parameter to perform OS command injections. This could result in a loss of confidentiality of the system among other issues. (CVE-2019-14905)
    FixedIn:
        - Name: ansible
          NamespaceName: amzn:2
          Version: 2.9.5-1.amzn2
          VersionFormat: rpm
        - Name: ansible-doc
          NamespaceName: amzn:2
          Version: 2.9.5-1.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2ANSIBLE2-2023-009.html
