# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: An open redirect flaw was discovered in mod_auth_openidc, where it handles logout redirection. The module does not correctly validate the URL, allowing a URL with leading slashes to bypass the protection checks. A victim user may be tricked into visiting a trusted vulnerable web site, which would redirect them to another possibly malicious URL. (CVE-2019-14857)An open redirect flaw was discovered in mod_auth_openidc where it handles logout redirection. The module does not correctly validate the URL, allowing a URL with slash and backslash at the beginning to bypass the protection checks. A victim user may be tricked into visiting a trusted vulnerable web site, which would redirect him to another, possibly malicious, URL. (CVE-2019-20479)
    FixedIn:
        - Name: mod_auth_openidc
          NamespaceName: amzn:2
          Version: 1.8.8-7.amzn2
          VersionFormat: rpm
        - Name: mod_auth_openidc-debuginfo
          NamespaceName: amzn:2
          Version: 1.8.8-7.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2020-1538.html
    Metadata:
        CVE:
