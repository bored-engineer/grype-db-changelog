Vulnerability:
    Description: 'An out-of-bounds read flaw was found in the Linux kernel''s TeleTYpe subsystem. The issue occurs in how a user triggers a race condition using ioctls TIOCSPTLCK and TIOCGPTPEER and TIOCSTI and TCXONC with leakage of memory in the flush_to_ldisc function. This flaw allows a local user to crash the system or read unauthorized random data from memory. (CVE-2022-1462)A bug in the IMA subsystem was discovered which would incorrectly allow kexec to be used when kernel lockdown was enabled (CVE-2022-21505)Rejected reason: DO NOT USE THIS CANDIDATE NUMBER. ConsultIDs: none. Reason: This candidate is unused by its CNA. Notes: none. (CVE-2022-23816)A flaw was found in hw. Aliases in the branch predictor may cause some AMD processors to predict the wrong branch type, potentially leading to information disclosure. (CVE-2022-23825)Non-transparent sharing of return predictor targets between contexts in some Intel(R) Processors may allow an authorized user to potentially enable information disclosure via local access. (CVE-2022-26373)A flaw was found in hw. The unprotected alternative channel of return branch target prediction in some Intel(R) Processors may allow an authorized user to enable information disclosure via local access. (CVE-2022-28693)A flaw was found in hw. Mis-trained branch predictions for return instructions may allow arbitrary speculative code execution under certain microarchitecture-dependent conditions. (CVE-2022-29900)Intel microprocessor generations 6 to 8 are affected by a new Spectre variant that is able to bypass their retpoline mitigation in the kernel to leak arbitrary data. An attacker with unprivileged user access can hijack return instructions to achieve arbitrary speculative code execution under certain microarchitecture-dependent conditions. (CVE-2022-29901)A memory access flaw was found in the Linux kernel''s XEN hypervisor for the virtual machine. This flaw allows a local user to crash the system or potentially escalate their privileges on the system. (CVE-2022-36123)An issue was discovered in the Linux kernel through 5.18.14. xfrm_expand_policies in net/xfrm/xfrm_policy.c can cause a refcount to be dropped twice. (CVE-2022-36879)A memory corruption flaw was found in the Linux kernel''s Netfilter subsystem in the way a local user uses the libnetfilter_queue when analyzing a corrupted network packet. This flaw allows a local user to crash the system or a remote user to crash the system when the libnetfilter_queue is used by a local user. (CVE-2022-36946)In the Linux kernel, the following vulnerability has been resolved:vt: fix memory overlapping when deleting chars in the buffer (CVE-2022-48627)In the Linux kernel, the following vulnerability has been resolved:ext4: fix race condition between ext4_write and ext4_convert_inline_data (CVE-2022-49414)In the Linux kernel, the following vulnerability has been resolved:mm/mempolicy: fix uninit-value in mpol_rebind_policy() (CVE-2022-49567)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_slow_start_after_idle. (CVE-2022-49572)In the Linux kernel, the following vulnerability has been resolved:udp: Fix a data-race around sysctl_udp_l3mdev_accept. (CVE-2022-49577)In the Linux kernel, the following vulnerability has been resolved:ipv4: Fix a data-race around sysctl_fib_multipath_use_neigh. (CVE-2022-49580)In the Linux kernel, the following vulnerability has been resolved:iavf: Fix handling of dummy receive descriptors (CVE-2022-49583)In the Linux kernel, the following vulnerability has been resolved:igmp: Fix data-races around sysctl_igmp_qrv. (CVE-2022-49589)In the Linux kernel, the following vulnerability has been resolved:igmp: Fix data-races around sysctl_igmp_llm_reports. (CVE-2022-49590)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_mtu_probe_floor. (CVE-2022-49594)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_probe_threshold. (CVE-2022-49595)In the Linux kernel, the following vulnerability has been resolved:ip: Fix a data-race around sysctl_ip_autobind_reuse. (CVE-2022-49600)In the Linux kernel, the following vulnerability has been resolved:ip: Fix data-races around sysctl_ip_fwd_update_priority. (CVE-2022-49603)In the Linux kernel, the following vulnerability has been resolved:x86/speculation: Fill RSB on vmexit for IBRS (CVE-2022-49611)In the Linux kernel, the following vulnerability has been resolved:nexthop: Fix data-races around nexthop_compat_mode. (CVE-2022-49629)In the Linux kernel, the following vulnerability has been resolved:raw: Fix a data-race around sysctl_raw_l3mdev_accept. (CVE-2022-49631)In the Linux kernel, the following vulnerability has been resolved:icmp: Fix data-races around sysctl. (CVE-2022-49638)In the Linux kernel, the following vulnerability has been resolved:sysctl: Fix data races in proc_douintvec_minmax(). (CVE-2022-49640)In the Linux kernel, the following vulnerability has been resolved:cgroup: Use separate src/dst nodes when preloading css_sets for migration (CVE-2022-49647)A NULL pointer dereference issue was found in the SCTP network protocol in net/sctp/stream_sched.c in the Linux kernel. If stream_in allocation fails, stream_out is freed, which would be accessed further. This flaw allows a local user to crash the system or potentially cause a denial of service. (CVE-2023-2177)'
