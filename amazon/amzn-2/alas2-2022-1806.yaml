Vulnerability:
    Description: "Versions of the Apache Log4j hotpatch package before log4j-cve-2021-44228-hotpatch-1.3-5 are affected by a race condition that could lead to a local privilege escalation.The Apache Log4j Hotpatch is not a replacement for updating to a log4j version that mitigates CVE-2021-44228 or CVE-2021-45046, it provides a temporary mitigation to CVE-2021-44228 by hotpatching local Java virtual machines. To do so, the hotpatch script iterates through all running Java processes, performs several checks, and executes the Java virtual machine with the same permissions and capabilities as the running process to load the hotpatch.A local user could cause the hotpatch script to execute a binary with elevated privileges by running a custom â\x80\x9Cjavaâ\x80\x9D process which performs exec() of a set user ID binary after the hotpatch has observed the process path and before it has observed its effective user ID.To leverage this issue a user must already have local access to the target system with permissions to run custom programs."
    FixedIn:
        - Available:
            Date: "2022-06-15"
            Kind: advisory
          Name: log4j-cve-2021-44228-hotpatch
          NamespaceName: amzn:2
          Version: 1.3-5.amzn2
          VersionFormat: rpm
