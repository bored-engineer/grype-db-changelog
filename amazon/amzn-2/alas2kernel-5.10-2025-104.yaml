    Description: 'In the Linux kernel, the following vulnerability has been resolved:btrfs: fix deadlock when cloning inline extents and using qgroups (CVE-2021-46987)In the Linux kernel, the following vulnerability has been resolved:uio_hv_generic: Fix another memory leak in error handling paths (CVE-2021-47070)In the Linux kernel, the following vulnerability has been resolved:RDMA/rxe: Return CQE error if invalid lkey was supplied (CVE-2021-47076)In the Linux kernel, the following vulnerability has been resolved:scsi: lpfc: Fix link down processing to address NULL pointer dereference (CVE-2021-47183)In the Linux kernel, the following vulnerability has been resolved:block: don''t call rq_qos_ops->done_bio if the bio isn''t tracked (CVE-2021-47412)In the Linux kernel, the following vulnerability has been resolved:ptp: Fix possible memory leak in ptp_clock_register() (CVE-2021-47455)In the Linux kernel, the following vulnerability has been resolved:dm rq: don''t queue request to blk-mq during DM suspend (CVE-2021-47498)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix UAF in decryption with multichannel (CVE-2025-37750)In the Linux kernel, the following vulnerability has been resolved:virtio-net: ensure the received length does not exceed allocated size (CVE-2025-38375)In the Linux kernel, the following vulnerability has been resolved:usb: net: sierra: check for no status endpoint (CVE-2025-38474)In the Linux kernel, the following vulnerability has been resolved:net/sched: sch_qfq: Fix race condition on qfq_aggregate (CVE-2025-38477)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix use-after-free in crypt_message when using async crypto (CVE-2025-38488)In the Linux kernel, the following vulnerability has been resolved:HID: core: do not bypass hid_hw_raw_request (CVE-2025-38494)In the Linux kernel, the following vulnerability has been resolved:HID: core: ensure the allocated report buffer can contain 