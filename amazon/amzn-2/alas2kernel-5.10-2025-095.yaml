    Description: 'In the Linux kernel, the following vulnerability has been resolved:net/sched: act_mirred: don''t override retval if we already lost the skb (CVE-2024-26739)In the Linux kernel, the following vulnerability has been resolved:of: module: add buffer overflow check in of_modalias() (CVE-2024-38541)In the Linux kernel, the following vulnerability has been resolved:btrfs: don''t BUG_ON() when 0 reference count at btrfs_lookup_extent_info() (CVE-2024-46751)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix helper writes to read-only maps (CVE-2024-49861)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v2m: Prevent use after free of gicv2m_get_fwnode() (CVE-2025-37819)In the Linux kernel, the following vulnerability has been resolved:net_sched: hfsc: Fix a UAF vulnerability in class with netem as child qdisc (CVE-2025-37890)In the Linux kernel, the following vulnerability has been resolved:net_sched: qfq: Fix double list add in class with netem as child qdisc (CVE-2025-37913)In the Linux kernel, the following vulnerability has been resolved:net_sched: drr: Fix double list add in class with netem as child qdisc (CVE-2025-37915)In the Linux kernel, the following vulnerability has been resolved:tracing: Fix oob write in trace_seq_to_buffer() (CVE-2025-37923)In the Linux kernel, the following vulnerability has been resolved:iommu/amd: Fix potential buffer overflow in parse_ivrs_acpihid (CVE-2025-37927)In the Linux kernel, the following vulnerability has been resolved:xenbus: Use kref to track req lifetime (CVE-2025-37949)In the Linux kernel, the following vulnerability has been resolved:net_sched: Flush gso_skb list too during ->change() (CVE-2025-37992)In the Linux kernel, the following vulnerability has been resolved:module: ensure that kobject_put() is safe for module type kobjects (CVE-2025-37995)In the Linux kernel, the following vulnerability has been resolved:openvswitch: Fix unsafe attribute parsing