Vulnerability:
    Description: '2023-08-03: CVE-2020-24742 was added to this advisory.Files placed by attacker can influence the working directory and lead to malicious code execution (CVE-2020-0569)Uncontrolled search path in the QT Library before 5.14.0, 5.12.7 and 5.9.10 may allow an authenticated user to potentially enable elevation of privilege via local access. (CVE-2020-0570)An issue has been fixed in Qt versions 5.14.0 where QPluginLoader attempts to load plugins relative to the working directory, allowing attackers to execute arbitrary code via crafted files. (CVE-2020-24742)'
