Vulnerability:
    Description: An XSS vulnerability was discovered in python-lxml's clean module versions before 4.6.3. When disabling the safe_attrs_only and forms arguments, the Cleaner class does not remove the formaction attribute allowing for JS to bypass the sanitizer. A remote attacker could exploit this flaw to run arbitrary JS code on users who interact with incorrectly sanitized HTML. This issue is patched in lxml 4.6.3. (CVE-2021-28957)
    FixedIn:
        - Name: python-lxml
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.6
          VersionFormat: rpm
        - Name: python-lxml-debuginfo
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.6
          VersionFormat: rpm
        - Name: python-lxml-docs
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.6
          VersionFormat: rpm
        - Name: python3-lxml
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.6
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2024-2620.html
