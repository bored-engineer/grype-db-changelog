    Description: 'In the Linux kernel, the following vulnerability has been resolved:dmaengine: Fix double increment of client_count in dma_chan_get() (CVE-2022-49753)A memory corruption flaw was found in the Linux kernel''s human interface device (HID) subsystem in how a user inserts a malicious USB device. This flaw allows a local user to crash or potentially escalate their privileges on the system. (CVE-2023-1073)In the Linux kernel, the following vulnerability has been resolved:x86/i8259: Mark legacy PIC interrupts with IRQ_LEVEL (CVE-2023-52993)In the Linux kernel, the following vulnerability has been resolved:tracing: Make sure trace_printk() can output as soon as it can be used (CVE-2023-53007)In the Linux kernel, the following vulnerability has been resolved:HID: betop: check shape of output reports (CVE-2023-53015)In the Linux kernel, the following vulnerability has been resolved:net: mdio: validate parameter addr in mdiobus_get_phy() (CVE-2023-53019)'
