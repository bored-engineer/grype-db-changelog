# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'NGINX Plus and NGINX Open Source have a vulnerability in the ngx_http_v3_module module. When using HTTP/3 with OpenSSL versions <= OpenSSL 3.5.0 under certain configurations, a limited heap buffer overflow could happen while processing a TLS handshake. This can happen in a non-deterministic manner that is beyond the attacker''s control. This may cause a heap buffer overflow in the NGINX worker process leading to a restart and/or limited data corruption.Impact:This vulnerability may allow remote attackers to cause a denial-of-service (DoS) on the NGINX system or limited data corruption. There is no control plane exposure; this is a data plane issue only.Note: Software versions which have reached End of Technical Support (EoTS) are not evaluated. (CVE-2026-90439)'
