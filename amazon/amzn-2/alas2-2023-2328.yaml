Vulnerability:
    Description: 'A flaw in the kernel Xen event handler can cause a deadlock with Xen console handling in unprivileged Xen guests. (CVE-2023-34324)A NULL pointer dereference flaw was found in the Linux kernel ipv4 stack. The socket buffer (skb) was assumed to be associated with a device before calling __ip_options_compile, which is not always the case if the skb is re-routed by ipvs. This issue may allow a local user with CAP_NET_ADMIN privileges to crash the system. (CVE-2023-42754)In the Linux kernel, the following vulnerability has been resolved:ipv4, ipv6: Fix handling of transhdrlen in __ip{,6}_append_data() (CVE-2023-52527)In the Linux kernel, the following vulnerability has been resolved:net: usb: smsc75xx: Fix uninit-value access in __smsc75xx_read_reg (CVE-2023-52528)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix potential use after free in nilfs_gccache_submit_read_data() (CVE-2023-52566)In the Linux kernel, the following vulnerability has been resolved:serial: 8250_port: Check IRQ data before use (CVE-2023-52567)In the Linux kernel, the following vulnerability has been resolved:team: fix null-ptr-deref when team device type is changed (CVE-2023-52574)In the Linux kernel, the following vulnerability has been resolved:dccp: fix dccp_v4_err()/dccp_v6_err() again (CVE-2023-52577)'
