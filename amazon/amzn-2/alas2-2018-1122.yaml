Vulnerability:
    Description: An issue was discovered in rsn_supp/wpa.c in wpa_supplicant 2.0 through 2.6. Under certain conditions, the integrity of EAPOL-Key messages is not checked, leading to a decryption oracle. An attacker within range of the Access Point and client can abuse the vulnerability to recover sensitive information.(CVE-2018-14526)
    FixedIn:
        - Name: wpa_supplicant
          NamespaceName: amzn:2
          Version: 2.6-12.amzn2
          VersionFormat: rpm
        - Name: wpa_supplicant-debuginfo
          NamespaceName: amzn:2
          Version: 2.6-12.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2018-1122.html
