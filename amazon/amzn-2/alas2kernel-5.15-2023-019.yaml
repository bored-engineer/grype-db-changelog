Vulnerability:
    Description: 'A use-after-free vulnerability in the Linux Kernel Performance Events system can be exploited to achieve local privilege escalation.The perf_group_detach function did not check the event''s siblings'' attach_state before calling add_event_to_groups(), but remove_on_exec made it possible to call list_del_event() on before detaching from their group, making it possible to use a dangling pointer causing a use-after-free vulnerability.We recommend upgrading past commit fd0815f632c24878e325821943edccc7fde947a2. (CVE-2023-2235)An issue was discovered in arch/x86/kvm/vmx/nested.c in the Linux kernel before 6.2.8. nVMX on x86_64 lacks consistency checks for CR0 and CR4. (CVE-2023-30456)In the Linux kernel, the following vulnerability has been resolved:ftrace: Fix invalid address access in lookup_rec() when index is 0 (CVE-2023-53075)In the Linux kernel, the following vulnerability has been resolved:ext4: fix task hung in ext4_xattr_delete_inode (CVE-2023-53089)In the Linux kernel, the following vulnerability has been resolved:ext4: update s_journal_inum if it changes after journal replay (CVE-2023-53091)In the Linux kernel, the following vulnerability has been resolved:ext4: fix WARNING in ext4_update_inline_data (CVE-2023-53100)In the Linux kernel, the following vulnerability has been resolved:ext4: zero i_disksize when initializing the bootloader inode (CVE-2023-53101)In the Linux kernel, the following vulnerability has been resolved:net: tunnels: annotate lockless accesses to dev->needed_headroom (CVE-2023-53109)In the Linux kernel, the following vulnerability has been resolved:bpf, sockmap: Fix an infinite loop error when len is 0 in tcp_bpf_recvmsg_parser() (CVE-2023-53133)In the Linux kernel, the following vulnerability has been resolved:af_unix: fix struct pid leaks in OOB support (CVE-2023-53136)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Remove the /proc/scsi/${proc_name} directory earlier (CVE-2023-53140)'
