    Description: Generated code produced by C1 may leak a package-private class to a class from a different package. (CVE-2022-21540)MethodHandle.invokeBasic() method can be accessed on byte code level from an arbitrary class. (CVE-2022-21541)computeNextExponential sometimes returns negative numbers contrary to the documentation. (CVE-2022-21549)The Xalan Java XSLT library has an integer truncation issue when processing malicious stylesheets. This can be used to corrupt Java class files generated by the internal XSLTC compiler and execute arbitrary Java bytecode. (CVE-2022-34169)
