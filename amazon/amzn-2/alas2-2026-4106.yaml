Vulnerability:
    Description: A flaw was found in libgsf. A heap-based buffer overflow vulnerability exists in the OLE2 document parser within the ole_info_read_metabat function. A remote attacker could exploit this flaw by enticing a user to open a specially crafted file. Successful exploitation could lead to arbitrary code execution or cause an application crash, resulting in a Denial of Service (DoS). (CVE-2026-116124)
