nux kernel, the following vulnerability has been resolved:RDMA/cma: Do not change route.addr.src_addr outside state checks (CVE-2022-48925)In the Linux kernel, the following vulnerability has been resolved:KVM: x86/mmu: make apf token non-zero to fix bug (CVE-2022-48943)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: initialize registers in nft_do_chain() (CVE-2022-49293)'
