# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: blktrace (aka Block IO Tracing) 1.2.0, as used with the Linux kernel and Android, has a buffer overflow in the dev_map_read function in btt/devmap.c because the device and devno arrays are too small, as demonstrated by an invalid free when using the btt program with a crafted file.(CVE-2018-10689)
    FixedIn:
        - Name: blktrace
          NamespaceName: amzn:2
          Version: 1.0.5-9.amzn2
          VersionFormat: rpm
        - Name: blktrace-debuginfo
          NamespaceName: amzn:2
          Version: 1.0.5-9.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2019-1320.html
    Metadata:
        CVE:
            - Name: CVE-2018-10689
    Name: ALAS2-2019-1320
    NamespaceName: amzn:2
    Severity: Low
