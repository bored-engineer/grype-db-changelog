Vulnerability:
    Description: 'A vulnerability, which was classified as problematic, was found in Linux Kernel. This affects the function tcp_getsockopt/tcp_setsockopt of the component TCP Handler. The manipulation leads to race condition. It is recommended to apply a patch to fix this issue. The identifier VDB-211089 was assigned to this vulnerability. (CVE-2022-3566)A vulnerability has been found in Linux Kernel and classified as problematic. This vulnerability affects the function inet6_stream_ops/inet6_dgram_ops of the component IPv6 Handler. The manipulation leads to race condition. It is recommended to apply a patch to fix this issue. VDB-211090 is the identifier assigned to this vulnerability. (CVE-2022-3567)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Fix a use-after-free (CVE-2022-48666)In the Linux kernel, the following vulnerability has been resolved:net: relax socket state check at accept time. (CVE-2024-36484)In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent NULL dereference in ip6_output() (CVE-2024-36901)In the Linux kernel, the following vulnerability has been resolved:bpf, skmsg: Fix NULL pointer dereference in sk_psock_skb_ingress_enqueue (CVE-2024-36938)In the Linux kernel, the following vulnerability has been resolved:net: sched: sch_multiq: fix possible OOB write in multiq_tune() (CVE-2024-36978)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix potential kernel bug due to lack of writeback flag waiting (CVE-2024-37078)In the Linux kernel, the following vulnerability has been resolved:r8169: Fix possible ring buffer corruption on fragmented Tx packets. (CVE-2024-38586)In the Linux kernel, the following vulnerability has been resolved:usb-storage: alauda: Check whether the media is initialized (CVE-2024-38619)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix deadlock in smb2_find_smb_tcon() (CVE-2024-39468)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix nilfs_empty_dir() misjudgment and long loop on I/O errors (CVE-2024-39469)In the Linux kernel, the following vulnerability has been resolved:bcache: fix variable length array abuse in btree_iter (CVE-2024-39482)In the Linux kernel, the following vulnerability has been resolved:bonding: Fix out-of-bounds read in bond_option_arp_ip_targets_set() (CVE-2024-39487)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: Fix race between namespace cleanup and gc in the list:set type (CVE-2024-39503)In the Linux kernel, the following vulnerability has been resolved:HID: core: remove unnecessary WARN_ON() in implement() (CVE-2024-39509)In the Linux kernel, the following vulnerability has been resolved:scsi: mpt3sas: Avoid test/set_bit() operating in non-allocated memory (CVE-2024-40901)In the Linux kernel, the following vulnerability has been resolved:ima: Avoid blocking in RCU read-side critical section (CVE-2024-40947)In the Linux kernel, the following vulnerability has been resolved:netns: Make get_net_ns() handle zero refcount net (CVE-2024-40958)In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent possible NULL dereference in rt6_probe() (CVE-2024-40960)In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent possible NULL deref in fib6_nh_init() (CVE-2024-40961)In the Linux kernel, the following vulnerability has been resolved:scsi: qedi: Fix crash while reading debugfs attribute (CVE-2024-40978)In the Linux kernel, the following vulnerability has been resolved:drop_monitor: replace spin_lock by raw_spin_lock (CVE-2024-40980)In the Linux kernel, the following vulnerability has been resolved:tipc: force a dst refcount before doing decryption (CVE-2024-40983)In the Linux kernel, the following vulnerability has been resolved:ACPICA: Revert "ACPICA: avoid Info: mapping multiple BARs. Your kernel is fine." (CVE-2024-40984)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: fix UBSAN warning in kv_dpm.c (CVE-2024-40988)In the Linux kernel, the following vulnerability has been resolved:net/sched: act_api: fix possible infinite loop in tcf_idr_check_alloc() (CVE-2024-40995)In the Linux kernel, the following vulnerability has been resolved:block/ioctl: prefer different overflow check (CVE-2024-41000)In the Linux kernel, the following vulnerability has been resolved:netpoll: Fix race condition in netpoll_owner_active (CVE-2024-41005)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix overrunning reservations in ringbuf (CVE-2024-41009)In the Linux kernel, the following vulnerability has been resolved:filelock: Fix fcntl/close race recovery compat path (CVE-2024-41020)In the Linux kernel, the following vulnerability has been resolved:drm/amdgpu: Fix signedness bug in sdma_v4_0_process_trap_irq() (CVE-2024-41022)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix kernel bug on rename operation of broken directory (CVE-2024-41034)In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix duplicate endpoint bug by clearing reserved bits in the descriptor (CVE-2024-41035)In the Linux kernel, the following vulnerability has been resolved:udp: Set SOCK_RCU_FREE earlier in udp_lib_get_port(). (CVE-2024-41041)In the Linux kernel, the following vulnerability has been resolved:filelock: fix potential use-after-free in posix_lock_inode (CVE-2024-41049)In the Linux kernel, the following vulnerability has been resolved:mm: prevent derefencing NULL ptr in pfn_section_valid() (CVE-2024-41055)In the Linux kernel, the following vulnerability has been resolved:hfsplus: fix uninit-value in copy_name (CVE-2024-41059)In the Linux kernel, the following vulnerability has been resolved:null_blk: fix validation of block size (CVE-2024-41077)In the Linux kernel, the following vulnerability has been resolved:ata: libata-core: Fix double free on error (CVE-2024-41087)kernel: virtio-net: tap: mlx5_core short frame denial of service (CVE-2024-41090)kernel: virtio-net: tun: mlx5_core short frame denial of service (CVE-2024-41091)In the Linux kernel, the following vulnerability has been resolved:drm/i915/gt: Fix potential UAF by revoke of fence registers (CVE-2024-41092)In the Linux kernel, the following vulnerability has been resolved:usb: atm: cxacru: fix endpoint checking in cxacru_bind() (CVE-2024-41097)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: fully validate NFT_DATA_VALUE on store to data registers (CVE-2024-42070)In the Linux kernel, the following vulnerability has been resolved:ftruncate: pass a signed offset (CVE-2024-42084)In the Linux kernel, the following vulnerability has been resolved:pinctrl: fix deadlock in create_pinctrl() when handling -EPROBE_DEFER (CVE-2024-42090)In the Linux kernel, the following vulnerability has been resolved:x86: stop playing stack games in profile_pc() (CVE-2024-42096)In the Linux kernel, the following vulnerability has been resolved:nilfs2: add missing check for inode numbers on directory entries (CVE-2024-42104)In the Linux kernel, the following vulnerability has been resolved:bnx2x: Fix multiple UBSAN array-index-out-of-bounds (CVE-2024-42148)In the Linux kernel, the following vulnerability has been resolved:nvmet: fix a possible leak when destroy a ctrl during qp establishment (CVE-2024-42152)In the Linux kernel, the following vulnerability has been resolved:tcp_metrics: validate source addr length (CVE-2024-42154)In the Linux kernel, the following vulnerability has been resolved:crypto: aead,cipher - zeroize key buffer after use (CVE-2024-42229)'
