# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: runc through 1.0.0-rc8, as used in Docker through 19.03.2-ce and other products, allows AppArmor restriction bypass because libcontainer/rootfs_linux.go incorrectly checks mount targets, and thus a malicious Docker image can mount over a /proc directory. (CVE-2019-16884)A flaw was found in runc. An attacker who controls the container image for two containers that share a volume can race volume mounts during container initialization, by adding a symlink to the rootfs that points to a directory on the volume. The highest threat from this vulnerability is to data confidentiality and integrity as well as system availability. (CVE-2019-19921)
    FixedIn:
        - Name: runc
          NamespaceName: amzn:2
          Version: 1.0.0-0.1.20200204.gitdc9208a.amzn2
          VersionFormat: rpm
        - Name: runc-debuginfo
          NamespaceName: amzn:2
          Version: 1.0.0-0.1.20200204.gitdc9208a.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASDOCKER-2021-009.html
