Vulnerability:
    Description: The Mozilla Foundation Security Advisory describes this flaw as:It was possible for certain browser prompts and dialogs to be activated or dismissed unintentionally by the user due to an insufficient activation-delay. (CVE-2023-5721)The Mozilla Foundation Security Advisory describes this flaw as:Drivers are not always robust to extremely large draw calls and in some cases this scenario could have led to a crash. (CVE-2023-5724)The Mozilla Foundation Security Advisory describes this flaw as:A malicious installed WebExtension could open arbitrary URLs, which under the right circumstance could be leveraged to collect sensitive user data. (CVE-2023-5725)The Mozilla Foundation Security Advisory describes this flaw as:During garbage collection extra operations were performed on a object that should not be. This could have led to a potentially exploitable crash. (CVE-2023-5728)The Mozilla Foundation Security Advisory describes this flaw as:Memory safety bugs present in Firefox 118, Firefox ESR 115.3, and Thunderbird 115.3. Some of these bugs showed evidence of memory corruption and we presume that with enough effort some of these could have been exploited to run arbitrary code. (CVE-2023-5730)The Mozilla Foundation Security Advisory describes this flaw as:An attacker could have created a malicious link using bidirectional characters to spoof the location in the address bar when visited. (CVE-2023-5732)
