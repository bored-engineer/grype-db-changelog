lowing vulnerability has been resolved:sctp: sysctl: cookie_hmac_alg: avoid using current->nsproxy (CVE-2025-21640)In the Linux kernel, the following vulnerability has been resolved:afs: Fix the maximum cell name length (CVE-2025-21646)In the Linux kernel, the following vulnerability has been resolved:netfilter: conntrack: clamp maximum hashtable size to INT_MAX (CVE-2025-21648)In the Linux kernel, the following vulnerability has been resolved:net_sched: cls_flow: validate TCA_FLOW_RSHIFT attribute (CVE-2025-21653)In the Linux kernel, the following vulnerability has been resolved:dm thin: make get_first_thin use rcu-safe list first function (CVE-2025-21664)In the Linux kernel, the following vulnerability has been resolved:vsock: prevent null-ptr-deref in vsock_*[has_data|has_space] (CVE-2025-21666)In the Linux kernel, the following vulnerability has been resolved:vsock/virtio: discard packets if the transport changes (CVE-2025-21669)In the Linux kernel, the following vulnerability has been resolved:gtp: Destroy device along with udp socket''s netns dismantle. (CVE-2025-21678)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix bpf_sk_select_reuseport() memory leak (CVE-2025-21683)In the Linux kernel, the following vulnerability has been resolved:vfio/platform: check the bounds of read/write syscalls (CVE-2025-21687)In the Linux kernel, the following vulnerability has been resolved:USB: serial: quatech2: fix null-ptr-deref in qt2_process_read_urb() (CVE-2025-21689)In the Linux kernel, the following vulnerability has been resolved:fs/proc: fix softlockup in __read_vmcore (part 2) (CVE-2025-21694)In the Linux kernel, the following vulnerability has been resolved:gfs2: Truncate address space when flipping GFS2_DIF_JDATA flag (CVE-2025-21699)'
