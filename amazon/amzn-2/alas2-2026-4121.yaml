# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: rsync through 3.5.1 contains a denial of service vulnerability in the delta-transfer sender's hash_search() in match.c that allows malicious receivers to trigger unbounded strong-checksum work at consecutive offsets. Unauthenticated attackers pulling from a public daemon module can supply weak checksums colliding with consecutive rolling windows plus non-matching strong checksums, exhausting sender CPU across concurrent connections. (CVE-2026-119741)
    FixedIn:
        - Available:
            Date: "2026-11-17"
            Kind: advisory
          Name: rsync
          NamespaceName: amzn:2
          Version: 3.1.2-11.amzn2.0.9
          VersionFormat: rpm
        - Available:
            Date: "2026-11-17"
            Kind: advisory
          Name: rsync-debuginfo
          NamespaceName: amzn:2
          Version: 3.1.2-11.amzn2.0.9
          VersionFormat: rpm
