          NamespaceName: amzn:2
          Version: 1.2.12-1.amzn2.0.1
          VersionFormat: rpm
        - Name: librelp-devel
          NamespaceName: amzn:2
          Version: 1.2.12-1.amzn2.0.1
          VersionFormat: rpm
