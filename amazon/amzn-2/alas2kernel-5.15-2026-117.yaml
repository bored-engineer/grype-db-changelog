_cyclic(), so a concurrent lookup either misses theentry or sees a fully linked cp_list. INIT_LIST_HEAD() the entry afterallocation and switch _free_cpntf_state_locked() to list_del_init() so astale unlink is a no-op. nfs4_init_copy_state() passes NULL p_stid andskips the list_add, preserving NFS4_COPY_STID semantics. (CVE-2026-89684)In the Linux kernel, the following vulnerability has been resolved:nfsd: check client ownership when cancelling a copy-notify stateid (CVE-2026-89694)In the Linux kernel, the following vulnerability has been resolved:nfsd: block non-SAVEFH ops after FOREIGN PUTFH to prevent NULL deref (CVE-2026-89696)In the Linux kernel, the following vulnerability has been resolved:nfsd: validate symlink target length in NFSv4 CREATE (CVE-2026-89699)In the Linux kernel, the following vulnerability has been resolved:nfsd: sample writeback error cursor before async COPY loop (CVE-2026-89704)In the Linux kernel, the following vulnerability has been resolved:nfsd: Reset write verifier when async COPY writeback fails (CVE-2026-89706)In the Linux kernel, the following vulnerability has been resolved:NFSv4.1: fix layout segment leak on the pnfs_layout_process() forget path (CVE-2026-89710)In the Linux kernel, the following vulnerability has been resolved:NFSD: remove flawed WARN_ON_ONCE from nfsd_mode_check (CVE-2026-89711)In the Linux kernel, the following vulnerability has been resolved:NFSD: restart ssc_expire_umount walk after dropping nfsd_ssc_lock (CVE-2026-89712)In the Linux kernel, the following vulnerability has been resolved:lib/ucs2_string.c: fix out-of-bounds read in ucs2_strnlen() (CVE-2026-89726)In the Linux kernel, the following vulnerability has been resolved:mm: memcg: stop reclaim when a limit update is superseded (CVE-2026-89752)In the Linux kernel, the following vulnerability has been resolved:mm/vmscan: report RCU-tasks quiescent states in shrink_lruvec() (CVE-2026-89753)In the Linux kernel, the following vulnerability has been resolved:v