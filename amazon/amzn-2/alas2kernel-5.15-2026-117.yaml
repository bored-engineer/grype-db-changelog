l outstanding, rolling back outcnttwice and possibly underflowing it.Track outstanding request types as bits and clear each bit after its firstresponse.  Later responses for the same request are then ignored. (CVE-2026-89476)In the Linux kernel, the following vulnerability has been resolved:sctp: fix NULL deref on untransmitted RECONF completion (CVE-2026-89477)In the Linux kernel, the following vulnerability has been resolved:sctp: drop a chunk if its transport was removed (CVE-2026-89478)In the Linux kernel, the following vulnerability has been resolved:sctp: stop processing a packet once its association is deleted (CVE-2026-89479)In the Linux kernel, the following vulnerability has been resolved:nvme-tcp: reject a read that transferred too few bytesnvme_tcp_recv_data() completes a request once the current C2HData PDUhas been consumed. Nothing compares the total bytes received againstthe length the command asked for: struct nvme_tcp_request has noreceive-side counter, queue->data_remaining is per queue, andblk_mq_end_request() completes for blk_rq_bytes(rq) unconditionallywith no residual concept anywhere above.A controller can therefore answer a 4096-byte read with 512 bytes andhave it reported as a complete read; user space then gets 4096 bytes ofwhich 3584 are whatever was already in the page. I reproduced that witha test target.Count the bytes received and refuse to complete a successful read whosecount does not match, at the two NVME_TCP_F_DATA_SUCCESS paths and innvme_tcp_process_nvme_cqe(). The success test shifts req->status rightby one, because the driver keeps the wire value there and shifts it oncompletion, so the check must see what the completion path will see.Only REQ_OP_READ is checked, because there the length comes from thesectors the request covers; a passthrough command is built by itssubmitter, which picks both command and buffer, so the kernel hasnothing to compare against. (CVE-2026-89480)In the Linux kernel, the following vulnerability has been resolved:nvme-tcp: do not accept C2HData based on blk_rq_payload_bytes() alone (CVE-2026-89482)In the Linux kernel, the following vulnerability has been resolved:nvme: zero the discard fallback page (CVE-2026-89483)In the Linux kernel, the following vulnerability has been resolved:lockd: pin next file across nlm_inspect_file lock-drop (CVE-2026-89485)In the Linux kernel, the following vulnerability has been resolved:openvswitch: only skb_tx_error() a packet we are about to drop (CVE-2026-89487)In the Linux kernel, the following vulnerability has been resolved:openvswitch: Fix CT limit teardown use-after-free (CVE-2026-89488)In the Linux kernel, the following vulnerability has been resolved:RDMA/ucma: Lock the handler in ucma_set_ib_path() (CVE-2026-89508)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Fill in DMA padding bytes in scsi_alloc_sgtables() (CVE-2026-89515)In the Linux kernel, the following vulnerability has been resolved:udf: reject VAT indexes equal to the entry count (CVE-2026-89525)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: Reject krb5 v2 wrap tokens with oversized ec field (CVE-2026-89538)In the Linux kernel, the following vulnerability has been resolved:sunrpc: init gssp_lock before publishing proc entry (CVE-2026-89540)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: harden gss_unwrap_resp_priv length checks (CVE-2026-89541)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: harden gss_krb5_unwrap_v2 against short tokens (CVE-2026-89542)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: always drain cache_cleaner before destroying a cache_detail (CVE-2026-89548)In the Linux kernel, the following vulnerability has been resolved:sunrpc: route to a populated pool in svc_pool_for_cpu() (CVE-2026-89549)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: xdr_buf_trim: clamp buf->len to avoid underflow (CVE-2026-89551)In the Linux kernel, the following vulnerability has been resolved:mptcp: fix uninitialized local_id in syncookie MP_JOIN reconstruction (CVE-2026-89554)In the Linux kernel, the following vulnerability has been resolved:mpls: reload header after pskb_may_pull()mpls_select_multipath() calls mpls_multipath_hash() to choose a nexthopwhen an MPLS route has multiple nexthops.  While walking the MPLS labelstack, the hash routine caches hdr for the current label.  After findingthe bottom-of-stack label, it calls pskb_may_pull() before reading theinner IP header.If an skb is constructed with the inner IP header in nonlinear data andinsufficient tailroom in the linear head, pskb_may_pull() callspskb_expand_head() to replace the skb head and free the old one.  Thisleaves hdr pointing to freed memory.  The IPv6 path can invalidate hdragain when it performs a second pull for the larger header.The issue was found through static analysis.  A reproducer sending a legalGeneve packet through a bareudp/MPLS multipath setup triggered the sameKASAN report in 2 of 2 unpatched runs:BUG: KASAN: slab-use-after-free in mpls_select_multipathRead of size 1 at addr ffff88800ecc6e20 by task ksoftirqd/1/23Call Trace:mpls_select_multipathmpls_forward__netif_receive_skb_list_corenetif_receive_skb_list_internalnapi_complete_donegro_cell_poll__napi_pollnet_rx_actionFreed by task 23:kfreepskb_expand_head__pskb_pull_tailmpls_select_multipathReload hdr from the current skb head after each successful pull beforederiving the inner IPv4 or IPv6 header pointer. (CVE-2026-89555)In the Linux kernel, the following vulnerability has been resolved:md: do overflow check for sb->bblog_shift in super_1_load() (CVE-2026-89557)In the Linux kernel, the following vulnerability has been resolved:ip6_gre: fix hardware header length for NBMA tunnels (CVE-2026-89562)In the Linux kernel, the following vulnerability has been resolved:ip6_tunnel: use skb_cow_head() in ip6_tnl_xmit() (CVE-2026-89563)In