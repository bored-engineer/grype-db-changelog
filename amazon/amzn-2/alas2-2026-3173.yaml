    Description: 'curl''s code for managing SSH connections when SFTP was done using the wolfSSH powered backend was flawed and missed host verification mechanisms.This prevents curl from detecting MITM attackers and more. (CVE-2025-10966)broken TLS options for threaded LDAPSNOTE: https://curl.se/docs/CVE-2025-14017.htmlNOTE: Introduced with: https://github.com/curl/curl/commit/ccba0d10b6baf5c73cae8cf4fb3f29f0f55c5a34 (curl-7_17_0)NOTE: Fixed by: https://github.com/curl/curl/commit/39d1976b7f709a516e3243338ebc0443bdd8d56d (rc-8_18_0-1, curl-8_18_0)NOTE: Built with OpenLDAP (only affects the legacy LDAP support) (CVE-2025-14017)bearer token leak on cross-protocol redirectNOTE: https://curl.se/docs/CVE-2025-14524.htmlNOTE: Introduced with: https://github.com/curl/curl/commit/06c1bea72faabb6fad4b7ef818aafaa336c9a7aa (curl-7_33_0)NOTE: Fixed by: https://github.com/curl/curl/commit/1a822275d333dc6da6043497160fd04c8fa48640 (rc-8_18_0-2, curl-8_18_0) (CVE-2025-14524)OpenSSL partial chain store policy bypassNOTE: https://curl.se/docs/CVE-2025-14819.htmlNOTE: Introduced with: https://github.com/curl/curl/commit/3c16697ebd796f799227be293e8689aec5f8190d (curl-7_87_0)NOTE: Fixed by: https://github.com/curl/curl/commit/cd046f6c93b39d673a58c18648d8906e954c4f5d (rc-8_18_0-3, curl-8_18_0) (CVE-2025-14819)libssh global knownhost overrideNOTE: https://curl.se/docs/CVE-2025-15079.htmlNOTE: Introduced with: https://github.com/curl/curl/commit/c92d2e14cfb0db662f958effd2ac86f995cf1b5a (curl-7_58_0)NOTE: Fixed by: https://github.com/curl/curl/commit/adca486c125d9a6d9565b9607a19dce803a8b479 (rc-8_18_0-3, curl-8_18_0)NOTE: Debian builds with libssh2 for SSH backend (CVE-2025-15079)libssh key passphrase bypass without agent setNOTE: https://curl.se/docs/CVE-2025-15224.htmlNOTE: Introduced with: https://github.com/curl/curl/commit/c92d2e14cfb0db662f958effd2ac86f995cf1b5a (curl-7_58_0)NOTE: Fixed by: https://github.com/curl/curl/commit/16d5f2a5660c61cc27bd5f1c7f512391d1c927aa (curl-8_18_0)NOTE