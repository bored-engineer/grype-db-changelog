Vulnerability:
    Description: libfontenc prior to version 1.1.10 contains a heap out-of-bounds write vulnerability in its encoding-file parser due to insufficient bounds validation of a size value read from an encoding file. On systems where the X server runs as root, this vulnerability could be exploited by a local user with low privileges, potentially leading to local privilege escalation with high impact to confidentiality, integrity, and availability. (CVE-2026-109908)
