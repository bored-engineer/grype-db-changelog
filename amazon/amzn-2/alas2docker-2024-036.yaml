# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: AWS is aware of CVE-2024-21626, an issue affecting the runc component of several open source container management systems. Under certain conditions, an actor could leverage a specially crafted container or container configuration to access files or directories outside the container's file system namespace.An updated version of runc that addresses the issue is available for Amazon Linux 1 (runc-1.1.11-1.0.amzn1), Amazon Linux 2 (runc-1.1.11-1.amzn2) and for Amazon Linux 2023 (runc-1.1.11-1.amzn2023). AWS recommends that customers using runc or any container-related software apply those updates or a newer version. (CVE-2024-21626)
    FixedIn:
        - Name: runc
          NamespaceName: amzn:2
          Version: 1.1.11-1.amzn2
          VersionFormat: rpm
        - Name: runc-debuginfo
          NamespaceName: amzn:2
          Version: 1.1.11-1.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2DOCKER-2024-036.html
    Metadata:
