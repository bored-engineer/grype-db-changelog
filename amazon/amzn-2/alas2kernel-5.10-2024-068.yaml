# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:block: add check that partition length needs to be aligned with block sizeBefore calling add partition or resize partition, there is no checkon whether the length is aligned with the logical block size.If the logical block size of the disk is larger than 512 bytes,then the partition size maybe not the multiple of the logical block size,and when the last sector is read, bio_truncate() will adjust the bio size,resulting in an IO error if the size of the read command is smaller thanthe logical block size.If integrity data is supported, this will alsoresult in a null pointer dereference when calling bio_integrity_free. (CVE-2023-52458)In the Linux kernel, the following vulnerability has been resolved:x86/srso: Add SRSO mitigation for Hygon processors (CVE-2023-52482)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: disallow timeout for anonymous sets (CVE-2023-52620)create_empty_lvol in drivers/mtd/ubi/vtbl.c in the Linux kernel through 6.7.4 can attempt to allocate zero bytes, and crash, because of a missing check for ubi->leb_size. (CVE-2024-25739)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: disallow anonymous set with timeout flag (CVE-2024-26642)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: mark set as dead when unbinding anonymous set with timeout (CVE-2024-26643)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: Lock external INTx masking ops (CVE-2024-26810)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: Create persistent INTx handler (CVE-2024-26812)In the Linux kernel, the following vulnerability has been resolved:vfio/platform: Create persistent IRQ handlers (CVE-2024-26813)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: release mutex after nft_gc_seq_end from abort pathThe commit mutex should not be released during the critical sectionbetween nft_gc_seq_begin() and nft_gc_seq_end(), otherwise, async GCworker could collect expired objects and get the released commit lockwithin the same GC sequence.nf_tables_module_autoload() temporarily releases the mutex to loadmodule dependencies, then it goes back to replay the transaction again.Move it at the end of the abort phase after nft_gc_seq_end() is called. (CVE-2024-26925)In the Linux kernel, the following vulnerability has been resolved:scsi: qla2xxx: Fix command flush on cable pull (CVE-2024-26931)In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix deadlock in usb_deauthorize_interface() (CVE-2024-26934)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Fix unremoved procfs host directory regression (CVE-2024-26935)In the Linux kernel, the following vulnerability has been resolved:drm/i915/gt: Reset queue_priority_hint on parking (CVE-2024-26937)In the Linux kernel, the following vulnerability has been resolved:wireguard: netlink: access device through ctx instead of peer (CVE-2024-26950)In the Linux kernel, the following vulnerability has been resolved:wireguard: netlink: check for dangling peer via is_dead instead of empty list (CVE-2024-26951)In the Linux kernel, the following vulnerability has been resolved:nilfs2: prevent kernel bug at submit_bh_wbc() (CVE-2024-26955)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix failure to detect DAT corruption in btree and direct mappings (CVE-2024-26956)In the Linux kernel, the following vulnerability has been resolved:nfs: fix UAF in direct writes (CVE-2024-26958)In the Linux kernel, the following vulnerability has been resolved:mm: swap: fix race between free_swap_and_cache() and swapoff() (CVE-2024-26960)In the Linux kernel, the following vulnerability has been resolved:mac802154: fix llsec key resources release in mac802154_llsec_key_del (CVE-2024-26961)In the Linux kernel, the following vulnerability has been resolved:fat: fix uninitialized field in nostale filehandles (CVE-2024-26973)In the Linux kernel, the following vulnerability has been resolved:KVM: Always flush async #PF workqueue when vCPU is being destroyed (CVE-2024-26976)In the Linux kernel, the following vulnerability has been resolved:USB: usb-storage: Prevent divide-by-0 error in isd200_ata_command (CVE-2024-27059)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: Disable auto-enable of exclusive INTx IRQ (CVE-2024-27437)In the Linux kernel, the following vulnerability has been resolved:KVM: SVM: Flush pages under kvm->lock to fix UAF in svm_register_enc_region() (CVE-2024-35791)In the Linux kernel, the following vulnerability has been resolved:dm snapshot: fix lockup in dm_exception_table_exit (CVE-2024-35805)In the Linux kernel, the following vulnerability has been resolved:PCI/PM: Drain runtime-idle callbacks before driver removal (CVE-2024-35809)In the Linux kernel, the following vulnerability has been resolved:mmc: core: Avoid negative index with array access (CVE-2024-35813)In the Linux kernel, the following vulnerability has been resolved:fs/aio: Check IOCB_AIO_RW before the struct aio_kiocb conversion (CVE-2024-35815)In the Linux kernel, the following vulnerability has been resolved:vt: fix unicode buffer corruption when deleting characters (CVE-2024-35823)In the Linux kernel, the following vulnerability has been resolved:udp: do not accept non-tunnel GSO skbs landing in a tunnel (CVE-2024-35884)In the Linux kernel, the following vulnerability has been resolved:erspan: make sure erspan_base_hdr is present in skb->head (CVE-2024-35888)In the Linux kernel, the following vulnerability has been resolved:bpf, sockmap: Prevent lock inversion deadlock in map delete elem (CVE-2024-35895)In the Linux kernel, the following vulnerability has been resolved:netfilter: validate user input for expected length (CVE-2024-35896)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: discard table flag update with pending basechain deletion (CVE-2024-35897)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: flush pending destroy work before exit_net release (CVE-2024-35899)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: reject new basechain after table flag update (CVE-2024-35900)In the Linux kernel, the following vulnerability has been resolved:net/rds: fix possible cp null dereference (CVE-2024-35902)In the Linux kernel, the following vulnerability has been resolved:tcp: properly terminate timers for kernel sockets (CVE-2024-35910)In the Linux kernel, the following vulnerability has been resolved:block: prevent division by zero in blk_rq_stat_sum() (CVE-2024-35925)In the Linux kernel, the following vulnerability has been resolved:scsi: lpfc: Fix possible memory leak in lpfc_rcv_padisc() (CVE-2024-35930)In the Linux kernel, the following vulnerability has been resolved:btrfs: send: handle path ref underflow in header iterate_inode_ref() (CVE-2024-35935)In the Linux kernel, the following vulnerability has been resolved:btrfs: handle chunk tree lookup error in btrfs_relocate_sys_chunks() (CVE-2024-35936)In the Linux kernel, the following vulnerability has been resolved:VMCI: Fix memcpy() run-time warning in dg_dispatch_as_host() (CVE-2024-35944)In the Linux kernel, the following vulnerability has been resolved:i40e: fix vf may be used uninitialized in this function warning (CVE-2024-36020)'
