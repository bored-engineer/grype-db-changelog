Vulnerability:
    Description: 'A vulnerability classified as problematic has been found in Linux Kernel. This affects the function fib_nh_match of the file net/ipv4/fib_semantics.c of the component IPv4 Handler. The manipulation leads to out-of-bounds read. It is possible to initiate the attack remotely. It is recommended to apply a patch to fix this issue. The identifier VDB-210357 was assigned to this vulnerability. (CVE-2022-3435)A vulnerability was found in Linux Kernel. It has been declared as problematic. Affected by this vulnerability is the function follow_page_pte of the file mm/gup.c of the component BPF. The manipulation leads to race condition. The attack can be launched remotely. It is recommended to apply a patch to fix this issue. The identifier VDB-211921 was assigned to this vulnerability. (CVE-2022-3623)Guests can trigger NIC interface reset/abort/crash via netback It is possible for a guest to trigger a NIC interface reset/abort/crash in a Linux based network backend by sending certain kinds of packets. It appears to be an (unwritten?) assumption in the rest of the Linux network stack that packet protocol headers are all contained within the linear section of the SKB and some NICs behave badly if this is not the case. This has been reported to occur with Cisco (enic) and Broadcom NetXtrem II BCM5780 (bnx2x) though it may be an issue with other NICs/drivers as well. In case the frontend is sending requests with split headers, netback will forward those violating above mentioned assumption to the networking core, resulting in said misbehavior. (CVE-2022-3643)Guests can trigger deadlock in Linux netback driver T[his CNA information record relates to multiple CVEs; the text explains which aspects/vulnerabilities correspond to which CVE.] The patch for XSA-392 introduced another issue which might result in a deadlock when trying to free the SKB of a packet dropped due to the XSA-392 handling (CVE-2022-42328). Additionally when dropping packages for other reasons the same deadlock could occur in case of netpoll being active for the interface the xen-netback driver is connected to (CVE-2022-42329). (CVE-2022-42328)Guests can trigger deadlock in Linux netback driver T[his CNA information record relates to multiple CVEs; the text explains which aspects/vulnerabilities correspond to which CVE.] The patch for XSA-392 introduced another issue which might result in a deadlock when trying to free the SKB of a packet dropped due to the XSA-392 handling (CVE-2022-42328). Additionally when dropping packages for other reasons the same deadlock could occur in case of netpoll being active for the interface the xen-netback driver is connected to (CVE-2022-42329). (CVE-2022-42329)A stack overflow flaw was found in the Linux kernel''s SYSCTL subsystem in how a user changes certain kernel parameters and variables. This flaw allows a local user to crash or potentially escalate their privileges on the system. (CVE-2022-4378)In the Linux kernel, the following vulnerability has been resolved:udf: Fix preallocation discarding at indirect extent boundary (CVE-2022-48946)In the Linux kernel, the following vulnerability has been resolved:igb: Initialize mailbox message for VF reset (CVE-2022-48949)In the Linux kernel, the following vulnerability has been resolved:ipv6: avoid use-after-free in ip6_fragment() (CVE-2022-48956)In the Linux kernel, the following vulnerability has been resolved:xen-netfront: Fix NULL sring after live migration (CVE-2022-48969)In the Linux kernel, the following vulnerability has been resolved:af_unix: Get user_ns from in_skb in unix_diag_get_exact(). (CVE-2022-48970)In the Linux kernel, the following vulnerability has been resolved:mac802154: fix missing INIT_LIST_HEAD in ieee802154_if_add() (CVE-2022-48972)In the Linux kernel, the following vulnerability has been resolved:can: af_can: fix NULL pointer dereference in can_rcv_filter (CVE-2022-48977)In the Linux kernel, the following vulnerability has been resolved:HID: core: fix shift-out-of-bounds in hid_report_raw_event (CVE-2022-48978)In the Linux kernel, the following vulnerability has been resolved:drm/shmem-helper: Remove errant put in error path (CVE-2022-48981)In the Linux kernel, the following vulnerability has been resolved:mm/gup: fix gup_pud_range() for dax (CVE-2022-48986)In the Linux kernel, the following vulnerability has been resolved:media: v4l2-dv-timings.c: fix too strict blanking sanity checks (CVE-2022-48987)In the Linux kernel, the following vulnerability has been resolved:memcg: fix possible use-after-free in memcg_write_event_control() (CVE-2022-48988)In the Linux kernel, the following vulnerability has been resolved:mm/khugepaged: invoke MMU notifiers in shmem/file collapse paths (CVE-2022-48991)In the Linux kernel, the following vulnerability has been resolved:char: tpm: Protect tpm_pm_suspend with locks (CVE-2022-48997)In the Linux kernel, the following vulnerability has been resolved:ipv4: Handle attempt to delete multipath route when fib_info contains an nh reference (CVE-2022-48999)In the Linux kernel, the following vulnerability has been resolved:iommu/vt-d: Fix PCI device refcount leak in has_external_pci() (CVE-2022-49000)In the Linux kernel, the following vulnerability has been resolved:iommu/vt-d: Fix PCI device refcount leak in dmar_dev_scope_init() (CVE-2022-49002)In the Linux kernel, the following vulnerability has been resolved:tracing: Free buffers when a used dynamic event is removed (CVE-2022-49006)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix NULL pointer dereference in nilfs_palloc_commit_free_entry() (CVE-2022-49007)In the Linux kernel, the following vulnerability has been resolved:sctp: fix memory leak in sctp_stream_outq_migrate() (CVE-2022-49013)In the Linux kernel, the following vulnerability has been resolved:net: tun: Fix use-after-free in tun_detach() (CVE-2022-49014)In the Linux kernel, the following vulnerability has been resolved:net: hsr: Fix potential use-after-free (CVE-2022-49015)In the Linux kernel, the following vulnerability has been resolved:tipc: re-fetch skb cb after tipc_msg_validate (CVE-2022-49017)In the Linux kernel, the following vulnerability has been resolved:net: phy: fix null-ptr-deref while probe() failed (CVE-2022-49021)In the Linux kernel, the following vulnerability has been resolved:net/mlx5e: Fix use-after-free when reverting termination table (CVE-2022-49025)In the Linux kernel, the following vulnerability has been resolved:iavf: Fix error handling in iavf_init_module() (CVE-2022-49027)In the Linux kernel, the following vulnerability has been resolved:ixgbevf: Fix resource leak in ixgbevf_init_module() (CVE-2022-49028)In the Linux kernel, the following vulnerability has been resolved:libbpf: Handle size overflow for ringbuf mmap (CVE-2022-49030)In the Linux kernel, the following vulnerability has been resolved:btrfs: qgroup: fix sleep from invalid context bug in btrfs_qgroup_inherit() (CVE-2022-49033)A time-of-check to time-of-use issue exists in io_uring subsystem''s IORING_OP_CLOSE operation in the Linux kernel''s versions 5.6 - 5.11 (inclusive), which allows a local user to elevate their privileges to root. Introduced in b5dba59e0cf7e2cc4d3b3b1ac5fe81ddf21959eb, patched in 9eac1904d3364254d622bf2c771c4f85cd435fc2, backported to stable in 788d0824269bef539fe31a785b1517882eafed93. (CVE-2023-1295)A null pointer dereference issue was found in the can protocol in net/can/af_can.c in the Linux Kernel. ml_priv may not be initialized in the receive path of CAN frames. This issue could allow a local user to crash the system or cause a denial of service. (CVE-2023-2166)'
