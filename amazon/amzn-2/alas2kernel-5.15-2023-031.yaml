Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:llc: verify mac len before reading mac header (CVE-2023-52843)In the Linux kernel, the following vulnerability has been resolved:hsr: Prevent use after free in prp_create_tagged_frame() (CVE-2023-52846)In the Linux kernel, the following vulnerability has been resolved:padata: Fix refcnt handling in padata_free_shell() (CVE-2023-52854)In the Linux kernel, the following vulnerability has been resolved:perf: hisi: Fix use-after-free when register pmu fails (CVE-2023-52859)In the Linux kernel, the following vulnerability has been resolved:thermal: core: prevent potential string overflow (CVE-2023-52868)In the Linux kernel, the following vulnerability has been resolved:pstore/platform: Add check for kstrdup (CVE-2023-52869)A use-after-free vulnerability in the Linux kernel''s netfilter: nf_tables component can be exploited to achieve local privilege escalation.The function nft_trans_gc_catchall did not remove the catchall set element from the catchall_list when the argument sync is true, making it possible to free a catchall set element many times.We recommend upgrading past commit 93995bf4af2c5a99e2a87f0cd5ce547d31eb7630. (CVE-2023-6111)'
