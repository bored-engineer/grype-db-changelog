# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: The default OCI Linux spec in oci/defaults{_linux}.go in Docker/Moby, from 1.11 to current, does not block /proc/acpi pathnames. The flaw allows an attacker to modify host's hardware like enabling/disabling Bluetooth or turning up/down keyboard brightness. (CVE-2018-10892)
    FixedIn:
        - Name: docker
          NamespaceName: amzn:2
          Version: 18.06.1ce-2.amzn2
          VersionFormat: rpm
        - Name: docker-debuginfo
          NamespaceName: amzn:2
          Version: 18.06.1ce-2.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASDOCKER-2021-005.html
