Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:net: bonding: fix use-after-free in bond_xmit_broadcast() (CVE-2026-31419)In the Linux kernel, the following vulnerability has been resolved:security/keys: fix missed RCU read section on lookupNicholas Carlini reports that the keyring code calls assoc_array_find()in find_key_to_update() without holding the RCU read lock, while theassoc_array_gc() code really is designed around removing the node fromthe tree and then freeing it after an RCU grace-period.The regular key handling doesn''t see this because holding the keyringsemaphore hides any lifetime issues, but the persistent key handlinguses a different model.Instead of extending the keyring locking, just do the simple RCU lockingthat the assoc_array was designed for. (CVE-2026-64015)In the Linux kernel, the following vulnerability has been resolved:vxlan: Fix potential null-ptr-deref in vxlan_gro_prepare_receive(). (CVE-2026-74406)In the Linux kernel, the following vulnerability has been resolved:mm/vmalloc: acquire init_mm lock on huge vmap to avoid ptdump UAF (CVE-2026-74672)In the Linux kernel, the following vulnerability has been resolved:net/sched: cls_u32: skip hash tables in u32_bind_class() (CVE-2026-74739)In the Linux kernel, the following vulnerability has been resolved:usb: xhci: bail out of setup if the controller is inaccessible (CVE-2026-80861)In the Linux kernel, the following vulnerability has been resolved:nvme-tcp: fix host memory disclosure on R2T for a read command (CVE-2026-89481)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: reject duplicate CREDS_VALUE options (CVE-2026-89539)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: fix gssx_dec_option_array error path bugs (CVE-2026-89544)In the Linux kernel, the following vulnerability has been resolved:params: fix charp corruption on allocation failure (CVE-2026-89552)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix OOB read/write from unvalidated DataOffset in coalesce_t2() (CVE-2026-89633)In the Linux kernel, the following vulnerability has been resolved:cifs: fix loff_t underflow in cifs_remap_file_range() when len == 0 (CVE-2026-89640)In the Linux kernel, the following vulnerability has been resolved:ceph: bound copied dentry name length in NFS export get_nameceph_get_name() copies the MDS-supplied name into the caller''sNAME_MAX-sized buffer with memcpy(name, rinfo->dname, rinfo->dname_len)and then writes name[rinfo->dname_len] = 0, without checking dname_lenagainst NAME_MAX. A malicious or buggy MDS that returns a LOOKUPNAME replywith dname_len > NAME_MAX overflows the buffer. __get_snap_name() copiesrde->name / rde->name_len the same unchecked way.Impact: a malicious or compromised Ceph MDS overflows the NAME_MAX namebuffer in a client''s NFS-export get_name path, a slab out-of-bounds writereported by KASAN. Reachable when a CephFS mount is re-exported over NFS.Add ceph_export_copy_name(), which rejects lengths above NAME_MAX with-ENAMETOOLONG before the copy, and use it in both ceph_get_name() and__get_snap_name(). (CVE-2026-89652)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix nfsd_file leak on inter-server COPY setup failure (CVE-2026-89680)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix clock domain mismatch in clients_still_reclaiming() (CVE-2026-89685)In the Linux kernel, the following vulnerability has been resolved:nfsd: size fh_verify server sockaddr slot by xpt_locallen (CVE-2026-89702)In the Linux kernel, the following vulnerability has been resolved:nfsd: release path refs on follow_down() error (CVE-2026-89707)In the Linux kernel, the following vulnerability has been resolved:device property: fix infinite loop in fwnode_for_each_child_node() (CVE-2026-89744)In the Linux kernel, the following vulnerability has been resolved:KEYS: trusted: Fix TPM teardown ordering (CVE-2026-89763)In the Linux kernel, the following vulnerability has been resolved:mm/huge_memory: transfer the pmd dirty bit to the folio on zap (CVE-2026-89987)In the Linux kernel, the following vulnerability has been resolved:kprobes: Protect kprobe_blacklist with RCU (CVE-2026-89988)In the Linux kernel, the following vulnerability has been resolved:ftrace: Take trace_array reference before accessing its ftrace_ops (CVE-2026-90002)In the Linux kernel, the following vulnerability has been resolved:lockd: fix swapped arguments in nlmsvc_match_ip() (CVE-2026-93231)In the Linux kernel, the following vulnerability has been resolved:arm64: mm: Fix the lockless page-table walk in show_pte() (CVE-2026-93239)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix heap overflow in DACL owner/group rewrite (CVE-2026-97555)In the Linux kernel, the following vulnerability has been resolved:smb: client: avoid leaking refcount when cifs_sb_tlink() fails (CVE-2026-97556)In the Linux kernel, the following vulnerability has been resolved:smb: client: avoid leaking refcount in cifs_queue_oplock_break() (CVE-2026-97557)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix cifsFileInfo reference leak in deferred close (CVE-2026-97558)In the Linux kernel, the following vulnerability has been resolved:smb: client: reject userspace cifs.idmap descriptions (CVE-2026-97564)In the Linux kernel, the following vulnerability has been resolved:net/sched: act_api: release all action references on NEWACTION failure (CVE-2026-97616)In the Linux kernel, the following vulnerability has been resolved:io_uring/rw: end write accounting from ->ki_complete (CVE-2026-97619)In the Linux kernel, the following vulnerability has been resolved:genetlink: pin family module during policy dump (CVE-2026-97901)In the Linux kernel, the following vulnerability has been resolved:tick/broadcast: Plug clockevents replacement race (CVE-2026-97925)In the Linux