# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: A flaw was found in squid. When Squid is parsing ESI, it keeps the ESI elements in ESIContext. ESIContext contains a buffer for holding a stack of ESIElements. When a new ESIElement is parsed, it is added via addStackElement. addStackElement has a check for the number of elements in this buffer, but it's off by 1, leading to a Heap Overflow of 1 element. The overflow is within the same structure so it can't affect adjacent memory blocks, and thus just leads to a crash while processing. (CVE-2019-12521)Due to chunked decoder lenience Squid is vulnerable to Request/Response smuggling attacks when parsing HTTP/1.1 and ICAP messages. (CVE-2023-46846)
    FixedIn:
        - Name: squid
          NamespaceName: amzn:2
          Version: 3.5.20-17.amzn2.7.20
          VersionFormat: rpm
        - Name: squid-debuginfo
          NamespaceName: amzn:2
          Version: 3.5.20-17.amzn2.7.20
          VersionFormat: rpm
        - Name: squid-migration-script
          NamespaceName: amzn:2
          Version: 3.5.20-17.amzn2.7.20
          VersionFormat: rpm
        - Name: squid-sysvinit
          NamespaceName: amzn:2
          Version: 3.5.20-17.amzn2.7.20
          VersionFormat: rpm
