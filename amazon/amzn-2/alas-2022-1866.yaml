Vulnerability:
    Description: 'Title: Wider MultiByte conversionsBuffer overflow is possible due to incorrect byte count (should be charactercount). (CVE-2022-21618)Title: Improve NTLM supportwriteSecurityBuffer() writes a serialized security buffer to be used for NTLMauth. One of the fields that are serialized is a hostname provided by thename resolver. If this hostname is very long, integer truncation occurs,which would allow a malicious hostname to be partially re-interpreted assomething else following a hostname, once the security buffer is deserializedon the other size. (CVE-2022-21619)Title: Improve JNDI lookupsJNDI DNS port numbers can be easily guessed and should be more random. (CVE-2022-21624)Title: Key X509 usagesDecoding of X509 keys may use excessive amount of heap memory. (CVE-2022-21626)Title: Better HttpServer serviceHttpServer eagerly accepts connections which may exceed the limit. (CVE-2022-21628)Title: Improve HTTP/1.1 client usageThe HTTP/2 connection cache caches connection based on the IP address but notthe SNI which can allow spoofing for servers on the same IP. (CVE-2022-39399)'
