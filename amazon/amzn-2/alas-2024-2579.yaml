Vulnerability:
    Description: It is possible for a malicious or malfunctioning client to send lessthan the expected amount of data to the server. If this happens, theserver will hang indefinitely waiting for the remainder (or until theconnection gets closed). Because iperf3 is deliberately designed toservice only one client connection at a time, this will prevent otherconnections to the iperf3 server.Avoid running iperf3 with root privileges to minimize impact.Update iperf3 to a version containing the fix (i.e. iperf-3.15 orlater). (CVE-2023-7250)
