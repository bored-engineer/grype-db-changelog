Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:x86/xen: Drop USERGS_SYSRET64 paravirt call (CVE-2021-4440)In the Linux kernel, the following vulnerability has been resolved:net: sched: flower: protect fl_walk() with rcu (CVE-2021-47402)A flaw was found in the filelock_init in fs/locks.c function in the Linux kernel. This issue can lead to host memory exhaustion due to memcg not limiting the number of Portable Operating System Interface (POSIX) file locks. (CVE-2022-0480)In the Linux kernel, the following vulnerability has been resolved:drm/amdgpu: Fix possible NULL dereference in amdgpu_ras_query_error_status_helper() (CVE-2023-52585)In the Linux kernel, the following vulnerability has been resolved:sched/psi: Fix use-after-free in ep_remove_wait_queue() (CVE-2023-52707)In the Linux kernel, the following vulnerability has been resolved:mptcp: ensure snd_nxt is properly initialized on connect (CVE-2024-36889)'
