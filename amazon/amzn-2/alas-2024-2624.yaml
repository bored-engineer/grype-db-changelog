# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: 'QEMU: sdhci: heap buffer overflow in sdhci_write_dataport() (CVE-2024-3447)A flaw was found in the QEMU disk image utility (qemu-img) ''info'' command. A specially crafted image file containing a `json:{}` value describing block devices in QMP could cause the qemu-img process on the host to consume large amounts of memory or CPU time, leading to denial of service or read/write to an existing external file. (CVE-2024-4467)'
