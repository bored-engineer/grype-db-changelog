8 and Firefox ESR 153.5. (CVE-2026-109756)Sandbox escape due to race condition in the Networking component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109757)Site isolation issue in the Networking component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109759)Mitigation bypass in the Networking: HTTP component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109760)Incorrect boundary conditions in the SVG component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109762)Mitigation bypass in the File Handling component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109763)Mitigation bypass in the Enterprise Policies component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109764)Race condition, use-after-free in the Graphics: Text component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109765)Mitigation bypass in the Enterprise Policies component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109766)Information disclosure in the Networking component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109767)Spoofing issue in the DOM: Web Serial component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109770)Denial-of-service in the WebRTC component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109775)Race condition in the XPCOM component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109776)Information disclosure in the Storage: IndexedDB component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109777)Privilege escalation in the WebExtensions component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109778)Denial-of-service in the Printing: Output component. This vulnerability was fixed in Firefox 158 and Firefox ESR 153.5. (CVE-2026-109781)Mitigation bypass in the File Handling component. This vulnerability was fixed in Firefox ESR 153.5. (CVE-2026-109782)Mitigation bypass in the File Handling component. This vulnerability was fixed in Firefox ESR 153.5. (CVE-2026-109783)A malicious, compromised, or MITM-controlled Exchange server can return a single well-formed SOAP response containing an element with enough attributes to keep Thunderbird''s main thread CPU-bound for seconds to hours. This vulnerability was fixed in Thunderbird 158 and Thunderbird 153.5. (CVE-2026-110249)When setting up an account, Thunderbird''s Exchange AutoDiscover lookup also queried the domain''s AutoDiscover service over plain HTTP. Due to a bug, that unencrypted request included the credentials the user had entered, allowing a network attacker to obtain the user''s password. This vulnerability was fixed in Thunderbird 158.0.1 and Thunderbird 153.5.1. (CVE-2026-113866)Thunderbird did not escape attribute values when serializing outgoing XMPP stanzas. Because values from incoming requests were echoed back in automatic replies, a remote XMPP user could send a crafted request that caused Thunderbird to inject arbitrary stanzas into the user''s connection, which the server would then process as if sent by the user. This could be used to send messages or change contact and subscription settings on behalf of the user, without any interaction. This bug only affects Thunderbird''s chat feature with XMPP accounts. This vulnerability was fixed in Thunderbird 158.0.1 and Thunderbird 153.5.1. (CVE-2026-113867)When authenticating to a POP3 or SMTP server using NTLM, Thunderbird did not check whether the server''s challenge was valid base64. A malicious server could send a challenge that caused Thunderbird to include uninitialized heap memory in its NTLM response, disclosing that memory to the server. A challenge consisting only of base64 padding also caused an out-of-bounds read, crashing Thunderbird. This affected accounts configured to use NTLM or GSSAPI authentication. The uninitialized memory disclosure only affected NTLM. This vulnerability was fixed in Thunderbird 158.0.1 and Thunderbird 153.5.1. (CVE-2026-113868)Expat through 2.8.4 fails to validate low surrogates following high surrogates in UTF-16 input, allowing malformed UTF-16 sequences to be accepted. Attackers can craft UTF-16 encoded XML with lone high surrogates that consume following code units, hiding markup characters from the parser and enabling XML injection attacks. (CVE-2026-93990)'
