Vulnerability:
    Description: 'A denial of service flaw for virtual machine guests in the Linux kernel''s Xen hypervisor subsystem was found in the way users call some interrupts with high frequency from one of the guests.A local user could use this flaw to starve the resources resulting in a denial of service. (CVE-2021-28711)A denial of service flaw for virtual machine guests in the Linux kernel''s Xen hypervisor subsystem was found in the way users call some interrupts with high frequency from one of the guests.A local user could use this flaw to starve the resources resulting in a denial of service. (CVE-2021-28712)A denial of service flaw for virtual machine guests in the Linux kernel''s Xen hypervisor subsystem was found in the way users call some interrupts with high frequency from one of the guests.A local user could use this flaw to starve the resources resulting in a denial of service. (CVE-2021-28713)Incoming data packets for a guest in the Linux kernel''s netback driver are buffered until the guest is ready to process them. There are some measures taken for avoiding to pile up too much data, but those can be bypassed by the guest: The timeout could even never trigger if the guest manages to have only one free slot in its RX queue ring page and the next package would require more than one free slot, which may be the case when using GSO, XDP, or software hashing. (CVE-2021-28714)Incoming data packets for a guest in the Linux kernel''s netback driver are buffered until the guest is ready to process them. There are some measures taken for avoiding to pile up too much data, but those can be bypassed by the guest: There is a timeout how long the client side of an interface can stop consuming new packets before it is assumed to have stalled, but this timeout is rather long (60 seconds by default). Using a UDP connection on a fast interface can easily accumulate gigabytes of data in that time. (CVE-2021-28715)A flaw was found in the Linux kernel''s implementation of RDMA over infiniband. An attacker with a privileged local account can leak kernel stack information when issuing commands to the /dev/infiniband/rdma_cm device node. While this access is unlikely to leak sensitive user information, it can be further used to defeat existing kernel protection mechanisms. (CVE-2021-3923)A read-after-free memory flaw was found in the Linux kernel''s garbage collection for Unix domain socket file handlers in the way users call close() and fget() simultaneously and can potentially trigger a race condition. This flaw allows a local user to crash the system or escalate their privileges on the system. (CVE-2021-4083)A data leak flaw was found in the way XFS_IOC_ALLOCSP IOCTL in the XFS filesystem allowed for size increase of files with unaligned size. A local attacker could use this flaw to leak data on the XFS filesystem otherwise not accessible to them. (CVE-2021-4155)A use-after-free flaw in the Linux kernel TEE (Trusted Execution Environment) subsystem was found in the way user calls ioctl TEE_IOC_OPEN_SESSION or TEE_IOC_INVOKE. A local user could use this flaw to crash the system or escalate their privileges on the system. If the Linux system non configured with the CONFIG_PREEMPT option or CONFIG_CPU_SW_DOMAIN_PAN option enabled, then it is unlikely that a user can trigger this issue. (CVE-2021-44733)In the Linux kernel, the following vulnerability has been resolved:sctp: use call_rcu to free endpoint (CVE-2021-46929)In the Linux kernel, the following vulnerability has been resolved:net: fix use-after-free in tw_timer_handler (CVE-2021-46936)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix use-after-free due to delegation race (CVE-2021-47506)In the Linux kernel, the following vulnerability has been resolved:seg6: fix the iif in the IPv6 socket control block (CVE-2021-47515)In the Linux kernel, the following vulnerability has been resolved:serial: core: fix transmit-buffer reset and memleak (CVE-2021-47527)In the Linux kernel, the following vulnerability has been resolved:net/mlx4_en: Fix an use-after-free bug in mlx4_en_try_alloc_resources() (CVE-2021-47541)In the Linux kernel, the following vulnerability has been resolved:ethernet: hisilicon: hns: hns_dsaf_misc: fix a possible array overflow in hns_dsaf_ge_srst_by_port() (CVE-2021-47548)In the Linux kernel, the following vulnerability has been resolved:scsi: mpt3sas: Fix kernel panic during drive powercycle test (CVE-2021-47565)In the Linux kernel, the following vulnerability has been resolved:proc/vmcore: fix clearing user buffer by properly using clear_user() (CVE-2021-47566)In the Linux kernel, the following vulnerability has been resolved:scsi: scsi_debug: Sanity check block descriptor length in resp_mode_select() (CVE-2021-47576)In the Linux kernel, the following vulnerability has been resolved:sit: do not call ipip6_dev_free() from sit_init_net() (CVE-2021-47588)In the Linux kernel, the following vulnerability has been resolved:igbvf: fix double free in `igbvf_probe` (CVE-2021-47589)In the Linux kernel, the following vulnerability has been resolved:dm btree remove: fix use after free in rebalance_children() (CVE-2021-47600)In the Linux kernel, the following vulnerability has been resolved:audit: improve robustness of the audit queue handling (CVE-2021-47603)In the Linux kernel, the following vulnerability has been resolved:net: netlink: af_netlink: Prevent empty skb by adding a check on len. (CVE-2021-47606)In the Linux kernel, the following vulnerability has been resolved:firmware: arm_scpi: Fix string overflow in SCPI genpd driver (CVE-2021-47609)The cgroup release_agent is called with call_usermodehelper. The function call_usermodehelper starts the release_agent with a full set of capabilities. Therefore require capabilities when setting the release_agent. (CVE-2022-0492)'
