Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:ubi: Fix race condition between ctrl_cdev_ioctl and ubi_cdev_ioctl (CVE-2021-47634)In the Linux kernel, the following vulnerability has been resolved:Revert "Revert "block, bfq: honor already-setup queue merges"" (CVE-2021-47646)In the Linux kernel, the following vulnerability has been resolved:ASoC: soc-compress: prevent the potentially use of null pointer (CVE-2021-47650)A denial of service (DOS) issue was found in the Linux kernel&rsquo;s smb2_ioctl_query_info function in the fs/cifs/smb2ops.c Common Internet File System (CIFS) due to an incorrect return from the memdup_user function. This flaw allows a local, privileged (CAP_SYS_ADMIN) attacker to crash the system. (CVE-2022-0168)When the KVM updates the guest''s page table entry, it will first use get_user_pages_fast() to pin the page, and when it fails (e.g. the vma->flags has VM_IO or VM_PFNMAP), it will get corresponding VMA where the page lies in through find_vma_intersection(), calculate the physical address, and map the page to the kernel virtual address through memremap(), and finally, write the update.The problem is that when we get the vma through find_vma_intersection(), only VM_PFNMAP is checked, not both VM_IO and VM_PFNMAP. In the reproducer below, after the KVM_SET_USER_MEMORY_REGION is completed, we replace the guest''s memory mapping with the kernel-user shared region of io_uring and then perform the KVM_TRANSLATE operation, which finally triggers the page table entry update. Now, memremap() will return page_offset_base (direct mapping of all physical memory) + vaddr (the linear address of KVM_TRANSLATE) + vm_pgoff (the offset when io_uring performs mmap(2)), and use the return value as the base address for CMPXCHG (write 0x21 in this case). Since both vaddr and vm_pgoff are controllable by the user-mode process, writing may exceed the previously mapped guest memory space and trigger exceptions such as UAF. The vulnerability shares similarities with CVE-2021-22543. (CVE-2022-1158)A vulnerability was found in the pfkey_register function in net/key/af_key.c in the Linux kernel. This flaw allows a local, unprivileged user to gain access to kernel memory, leading to a system crash or a leak of internal kernel information. (CVE-2022-1353)A use-after-free flaw was found in the Linux kernel''s io_uring interface subsystem in the way a user triggers a race condition between timeout flush and removal. This flaw allows a local user to crash or escalate their privileges on the system. (CVE-2022-29582)A flaw was found in the Linux kernel implementation of proxied virtualized TPM devices. On a system where virtualized TPM devices are configured (this is not the default) a local attacker can create a use-after-free and create a situation where it may be possible to escalate privileges on the system. (CVE-2022-2977)A flaw was found in the Linux kernel. A NULL pointer dereference may occur while a slip driver is in progress to detach in sl_tx_timeout in drivers/net/slip/slip.c. This issue could allow an attacker to crash the system or leak internal kernel information. (CVE-2022-41858)In the Linux kernel, the following vulnerability has been resolved:swiotlb: fix info leak with DMA_FROM_DEVICE (CVE-2022-48853)In the Linux kernel, the following vulnerability has been resolved:dm integrity: fix memory corruption when tag_size is less than digest size (CVE-2022-49044)In the Linux kernel, the following vulnerability has been resolved:ipv6: fix panic when forwarding a pkt with no in6 dev (CVE-2022-49048)In the Linux kernel, the following vulnerability has been resolved:mm: fix unexpected zeroed page mapping with zram swap (CVE-2022-49052)In the Linux kernel, the following vulnerability has been resolved:scsi: target: tcmu: Fix possible page UAF (CVE-2022-49053)In the Linux kernel, the following vulnerability has been resolved:cifs: potential buffer overflow in handling symlinks (CVE-2022-49058)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: Fix the svc_deferred_event trace class (CVE-2022-49065)In the Linux kernel, the following vulnerability has been resolved:veth: Ensure eth header is in skb''s linear part (CVE-2022-49066)In the Linux kernel, the following vulnerability has been resolved:gpio: Restrict usage of GPIO chip irq members before initialization (CVE-2022-49072)In the Linux kernel, the following vulnerability has been resolved:ata: sata_dwc_460ex: Fix crash due to OOB write (CVE-2022-49073)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v3: Fix GICR_CTLR.RWP polling (CVE-2022-49074)In the Linux kernel, the following vulnerability has been resolved:btrfs: fix qgroup reserve overflow the qgroup limit (CVE-2022-49075)In the Linux kernel, the following vulnerability has been resolved:mmmremap.c: avoid pointless invalidate_range_start/end on mremap(old_size=0) (CVE-2022-49077)In the Linux kernel, the following vulnerability has been resolved:lz4: fix LZ4_decompress_safe_partial read out of bound (CVE-2022-49078)In the Linux kernel, the following vulnerability has been resolved:mm/mempolicy: fix mpol_new leak in shared_policy_replace (CVE-2022-49080)In the Linux kernel, the following vulnerability has been resolved:qede: confirm skb is allocated before using (CVE-2022-49084)In the Linux kernel, the following vulnerability has been resolved:drbd: Fix five use after free bugs in get_initial_state (CVE-2022-49085)In the Linux kernel, the following vulnerability has been resolved:net: openvswitch: fix leak of nested actions (CVE-2022-49086)In the Linux kernel, the following vulnerability has been resolved:rxrpc: fix a race in rxrpc_exit_net() (CVE-2022-49087)In the Linux kernel, the following vulnerability has been resolved:net: ipv4: fix route with nexthop object delete warning (CVE-2022-49092)In the Linux kernel, the following vulnerability has been resolved:net/tls: fix slab-out-of-bounds bug in decrypt_internal (CVE-2022-49094)In the Linux kernel, the following vulnerability has been resolved:NFS: Avoid writeback threads getting stuck in mempool_alloc() (CVE-2022-49097)In the Linux kernel, the following vulnerability has been resolved:Drivers: hv: vmbus: Fix potential crash on module unload (CVE-2022-49098)In the Linux kernel, the following vulnerability has been resolved:virtio_console: eliminate anonymous module_init & module_exit (CVE-2022-49100)In the Linux kernel, the following vulnerability has been resolved:NFSv4.2: fix reference count leaks in _nfs42_proc_copy_notify() (CVE-2022-49103)In the Linux kernel, the following vulnerability has been resolved:ceph: fix memory leak in ceph_readdir when note_last_dentry returns error (CVE-2022-49107)In the Linux kernel, the following vulnerability has been resolved:scsi: libfc: Fix use after free in fc_exch_abts_resp() (CVE-2022-49114)In the Linux kernel, the following vulnerability has been resolved:dm ioctl: prevent potential spectre v1 gadget (CVE-2022-49122)In the Linux kernel, the following vulnerability has been resolved:io_uring: fix memory leak of uid in files registration (CVE-2022-49144)In the Linux kernel, the following vulnerability has been resolved:ACPI: CPPC: Avoid out of bounds access when parsing _CPC data (CVE-2022-49145)In the Linux kernel, the following vulnerability has been resolved:watch_queue: Free the page array when watch_queue is dismantled (CVE-2022-49148)In the Linux kernel, the following vulnerability has been resolved:rxrpc: Fix call timer start racing with call destruction (CVE-2022-49149)In the Linux kernel, the following vulnerability has been resolved:wireguard: socket: free skb in send6 when ipv6 is disabled (CVE-2022-49153)In the Linux kernel, the following vulnerability has been resolved:KVM: SVM: fix panic on out-of-bounds guest IRQ (CVE-2022-49154)In the Linux kernel, the following vulnerability has been resolved:scsi: qla2xxx: Suppress a kernel complaint in qla_creat