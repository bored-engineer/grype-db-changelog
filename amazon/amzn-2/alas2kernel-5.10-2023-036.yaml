ility has been resolved:power: supply: ab8500: Fix memory leak in ab8500_fg_sysfs_init (CVE-2022-49224)In the Linux kernel, the following vulnerability has been resolved:watch_queue: Actually free the watch (CVE-2022-49256)In the Linux kernel, the following vulnerability has been resolved:watch_queue: Fix NULL dereference in error cleanup (CVE-2022-49257)In the Linux kernel, the following vulnerability has been resolved:block: don''t delete queue kobject before its children (CVE-2022-49259)In the Linux kernel, the following vulnerability has been resolved:drm/i915/gem: add missing boundary check in vm_access (CVE-2022-49261)In the Linux kernel, the following vulnerability has been resolved:exec: Force single empty string when argv is empty (CVE-2022-49264)In the Linux kernel, the following vulnerability has been resolved:cifs: prevent bad output lengths in smb2_ioctl_query_info() (CVE-2022-49271)In the Linux kernel, the following vulnerability has been resolved:ALSA: pcm: Fix potential AB/BA lock with buffer_mutex and mmap_lock (CVE-2022-49272)In the Linux kernel, the following vulnerability has been resolved:NFSD: prevent integer overflow on 32 bit systems (CVE-2022-49279)In the Linux kernel, the following vulnerability has been resolved:NFSD: prevent underflow in nfssvc_decode_writeargs() (CVE-2022-49280)In the Linux kernel, the following vulnerability has been resolved:tpm: fix reference counting for struct tpm_chip (CVE-2022-49287)A use-after-free flaw was found in the Linux kernel''s core dump subsystem. This flaw could allow a local user to crash the system. (CVE-2023-1249)A flaw that boot CPU could be vulnerable for the speculative execution behavior kind of attacks in the Linux kernel X86 CPU Power management options functionality was found in the way user resuming CPU from suspend-to-RAM. A local user could use this flaw to potentially get unauthorized access to some memory of the CPU similar to the speculative execution behavior kind of attacks. (CVE-2023-1637)Improper restriction of operations within the bounds of a memory buffer in some Intel(R) i915 Graphics drivers for linux before kernel version 6.2.10 may allow an authenticated user to potentially enable escalation of privilege via local access. (CVE-2023-28410)'
