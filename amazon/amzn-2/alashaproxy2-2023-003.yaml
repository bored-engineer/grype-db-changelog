# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: HAProxy before 2.7.3 may allow a bypass of access control because HTTP/1 headers are inadvertently lost in some situations, aka "request smuggling." The HTTP header parsers in HAProxy may accept empty header field names, which could be used to truncate the list of HTTP headers and thus make some headers disappear after being parsed and processed for HTTP/1.0 and HTTP/1.1. For HTTP/2 and HTTP/3, the impact is limited because the headers disappear before being parsed and processed, as if they had not been sent by the client. The fixed versions are 2.7.3, 2.6.9, 2.5.12, 2.4.22, 2.2.29, and 2.0.31. (CVE-2023-25725)
    FixedIn:
        - Name: haproxy2
          NamespaceName: amzn:2
          Version: 2.2.17-1.amzn2.0.3
          VersionFormat: rpm
        - Name: haproxy2-debuginfo
          NamespaceName: amzn:2
          Version: 2.2.17-1.amzn2.0.3
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASHAPROXY2-2023-003.html
    Metadata:
        CVE:
            - Name: CVE-2023-25725
    Name: ALASHAPROXY2-2023-003
    NamespaceName: amzn:2
    Severity: High
