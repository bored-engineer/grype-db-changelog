Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: double hook unregistration in netns path (CVE-2022-49558)An issue was discovered in drivers/mtd/ubi/cdev.c in the Linux kernel 6.2. There is a divide-by-zero error in do_div(sz,mtd->erasesize), used indirectly by ctrl_cdev_ioctl, when mtd->erasesize is 0. (CVE-2023-31085)A flaw in the kernel Xen event handler can cause a deadlock with Xen console handling in unprivileged Xen guests. (CVE-2023-34324)A use-after-free vulnerability in the Linux kernel''s netfilter: nf_tables component can be exploited to achieve local privilege escalation.Due to a race condition between nf_tables netlink control plane transaction and nft_set element garbage collection, it is possible to underflow the reference counter causing a use-after-free vulnerability.We recommend upgrading past commit 3e91b0ebd994635df2346353322ac51ce84ce6d8. (CVE-2023-4244)A NULL pointer dereference flaw was found in the Linux kernel ipv4 stack. The socket buffer (skb) was assumed to be associated with a device before calling __ip_options_compile, which is not always the case if the skb is re-routed by ipvs. This issue may allow a local user with CAP_NET_ADMIN privileges to crash the system. (CVE-2023-42754)A flaw was found in the Netfilter subsystem of the Linux kernel. A race condition between IPSET_CMD_ADD and IPSET_CMD_SWAP can lead to a kernel panic due to the invocation of `__ip_set_put` on a wrong `set`. This issue may allow a local user to crash the system. (CVE-2023-42756)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_set_rbtree: skip sync GC for new elements in this transactionNew elements in this transaction might expired before such transactionends. Skip sync GC for such elements otherwise commit path might walkover an already released object. Once transaction is finished, async GCwill collect such expired element. (CVE-2023-52433)In the Linux kernel, the following vulnerability has been resolved:ring-buffer: Do not attempt to read past "commit" (CVE-2023-52501)In the Linux kernel, the following vulnerability has been resolved:net: fix possible store tearing in neigh_periodic_work() (CVE-2023-52522)In the Linux kernel, the following vulnerability has been resolved:ipv4, ipv6: Fix handling of transhdrlen in __ip{,6}_append_data() (CVE-2023-52527)In the Linux kernel, the following vulnerability has been resolved:net: usb: smsc75xx: Fix uninit-value access in __smsc75xx_read_reg (CVE-2023-52528)In the Linux kernel, the following vulnerability has been resolved:Revert "tty: n_gsm: fix UAF in gsm_cleanup_mux" (CVE-2023-52564)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix potential use after free in nilfs_gccache_submit_read_data() (CVE-2023-52566)In the Linux kernel, the following vulnerability has been resolved:serial: 8250_port: Check IRQ data before use (CVE-2023-52567)In the Linux kernel, the following vulnerability has been resolved:net: rds: Fix possible NULL-pointer dereference (CVE-2023-52573)In the Linux kernel, the following vulnerability has been resolved:team: fix null-ptr-deref when team device type is changed (CVE-2023-52574)In the Linux kernel, the following vulnerability has been resolved:dccp: fix dccp_v4_err()/dccp_v6_err() again (CVE-2023-52577)In the Linux kernel, the following vulnerability has been resolved:net: bridge: use DEV_STATS_INC() (CVE-2023-52578)In the Linux kernel, the following vulnerability has been resolved:netfilter: nftables: exthdr: fix 4-byte stack OOB writeIf priv->len is a multiple of 4, then dst[len / 4] can write pastthe destination array which leads to stack corruption.This construct is necessary to clean the remainder of the registerin case ->len is NOT a multiple of the register size, so make itconditional just like nft_payload.c does.The bug was added in 4.1 cycle and then copied/inherited whentcp/sctp and ip option support was added.Bug reported by Zero Day Initiative project (ZDI-CAN-21950,ZDI-CAN-21951, ZDI-CAN-21961). (CVE-2023-52628)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: adapt set backend to use GC transaction API (CVE-2023-52923)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: don''t skip expired elements during walk (CVE-2023-52924)A denial of service vulnerability was found in tipc_crypto_key_revoke in net/tipc/crypto.c in the Linux kernel''s TIPC subsystem. This flaw allows guests with local user privileges to trigger a deadlock and potentially crash the system. (CVE-2024-0641)'
