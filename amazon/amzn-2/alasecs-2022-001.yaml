# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: A bug was found in containerd where containers launched through containerd's CRI implementation with a specially-crafted image configuration could gain access to read-only copies of arbitrary files and directories on the host. This may bypass any policy-based enforcement on container setup (including a Kubernetes Pod Security Policy) and expose potentially sensitive information. Kubernetes and crictl can both be configured to use containerd's CRI implementation. (CVE-2022-23648)This update includes the latest ECS agent and the latest docker, containerd, and runc versions. The severity is moderate. The packages are grouped in this advisory to indicate that all packages should be applied together to apply security updates and maintain operational stability.
    FixedIn:
