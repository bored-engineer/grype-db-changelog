    Description: 'In the Linux kernel, the following vulnerability has been resolved:mm: fix zswap writeback race condition (CVE-2023-53178)In the Linux kernel, the following vulnerability has been resolved:page_pool: Fix use-after-free in page_pool_recycle_in_ring (CVE-2025-38129)In the Linux kernel, the following vulnerability has been resolved:mm/damon/sysfs: fix use-after-free in state_show() (CVE-2025-39877)In the Linux kernel, the following vulnerability has been resolved:net/sched: cls_u32: use skb_header_pointer_careful() (CVE-2026-23204)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: unconditionally bump set->nelems before insertion (CVE-2026-23272)In the Linux kernel, the following vulnerability has been resolved:net: sched: avoid qdisc_reset_all_tx_gt() vs dequeue race for lockless qdiscs (CVE-2026-23340)In the Linux kernel, the following vulnerability has been resolved:net: bonding: fix use-after-free in bond_xmit_broadcast() (CVE-2026-31419)In the Linux kernel, the following vulnerability has been resolved:xfrm: hold dev ref until after transport_finish NF_HOOK (CVE-2026-31663)In the Linux kernel, the following vulnerability has been resolved:rtnetlink: add missing netlink_ns_capable() check for peer netns (CVE-2026-31692)In the Linux kernel, the following vulnerability has been resolved:net/packet: fix TOCTOU race on mmap''d vnet_hdr in tpacket_snd() (CVE-2026-31700)In the Linux kernel, the following vulnerability has been resolved:netfilter: ctnetlink: ensure safe access to master conntrack (CVE-2026-43116)In the Linux kernel, the following vulnerability has been resolved:crypto: authencesn - reject short ahash digests during instance creation (CVE-2026-46033)In the Linux kernel, the following vulnerability has been resolved:RDMA/rxe: Validate pad and ICRC before payload_size() in rxe_rcv (CVE-2026-46043)In the Linux kernel, the following vulnerability has been resolved:net: rds: fix MR cleanup on copy error (CVE-2026-46053)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Fix shadow paging use-after-free due to unexpected GFN (CVE-2026-46113)In the Linux kernel, the following vulnerability has been resolved:RDMA/rxe: Reject unknown opcodes before ICRC processing (CVE-2026-46133)In the Linux kernel, the following vulnerability has been resolved:scsi: target: configfs: Bound snprintf() return in tg_pt_gp_members_show() (CVE-2026-46149)In the Linux kernel, the following vulnerability has been resolved:fanotify: fix false positive on permission events (CVE-2026-46150)In the Linux kernel, the following vulnerability has been resolved:drm/gem: Fix inconsistent plane dimension calculation in drm_gem_fb_init_with_funcs() (CVE-2026-46209)In the Linux kernel, the following vulnerability has been resolved:sctp: revalidate list cursor after sctp_sendmsg_to_asoc() in SCTP_SENDALL (CVE-2026-46227)In the Linux kernel, the following vulnerability has been resolved:io-wq: check that the predecessor is hashed in io_wq_remove_pending() (CVE-2026-46274)'
