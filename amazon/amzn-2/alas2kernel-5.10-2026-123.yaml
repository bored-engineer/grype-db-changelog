VE-2026-46053)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Fix shadow paging use-after-free due to unexpected GFN (CVE-2026-46113)In the Linux kernel, the following vulnerability has been resolved:RDMA/rxe: Reject unknown opcodes before ICRC processing (CVE-2026-46133)In the Linux kernel, the following vulnerability has been resolved:scsi: target: configfs: Bound snprintf() return in tg_pt_gp_members_show() (CVE-2026-46149)In the Linux kernel, the following vulnerability has been resolved:fanotify: fix false positive on permission events (CVE-2026-46150)In the Linux kernel, the following vulnerability has been resolved:drm/gem: Fix inconsistent plane dimension calculation in drm_gem_fb_init_with_funcs() (CVE-2026-46209)In the Linux kernel, the following vulnerability has been resolved:sctp: revalidate list cursor after sctp_sendmsg_to_asoc() in SCTP_SENDALL (CVE-2026-46227)In the Linux kernel, the following vulnerability has been resolved:io-wq: check that the predecessor is hashed in io_wq_remove_pending() (CVE-2026-46274)'
