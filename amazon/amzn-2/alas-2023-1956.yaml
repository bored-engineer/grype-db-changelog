# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: There's a flaw in python-lxml's HTML Cleaner component, which is responsible for sanitizing HTML and Javascript. An attacker who is able to submit a crafted payload to a web service using python-lxml's HTML Cleaner may be able to trigger script execution in clients such as web browsers. This can occur because the HTML Cleaner did not remove scripts within SVG images in data URLs such as <img src=>. XSS can result in impacts to the integrity and availability of the web page, as well as a potential impact to data confidentiality in some circumstances. (CVE-2021-43818)
    FixedIn:
        - Name: python-lxml
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.4
          VersionFormat: rpm
        - Name: python-lxml-debuginfo
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.4
          VersionFormat: rpm
        - Name: python-lxml-docs
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.4
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2023-1956.html
    Metadata:
        CVE:
            - Name: CVE-2021-43818
    Name: ALAS-2023-1956
    NamespaceName: amzn:2
    Severity: High
