Vulnerability:
    Description: A credentials-exposure flaw was found in python-requests, where if a request with authentication is redirected (302) from an HTTPS endpoint to an HTTP endpoint on the same host, the Authorization header is not stripped and the credentials can be read in plain text. A man-in-the-middle attacker could exploit this flaw to obtain a user's valid credentials.(CVE-2018-18074)
    FixedIn:
        - Available:
            Date: "2019-10-21"
            Kind: advisory
          Name: python-requests
          NamespaceName: amzn:2
          Version: 2.6.0-7.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2019-1334.html
    Metadata:
        CVE:
            - Name: CVE-2018-18074
    Name: ALAS2-2019-1334
    NamespaceName: amzn:2
    Severity: Low
