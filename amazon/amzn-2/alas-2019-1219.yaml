# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: 'Flatpak allows a sandbox bypass. Flatpak versions since 0.8.1 address CVE-2017-5226 by using a seccomp filter to prevent sandboxed apps from using the TIOCSTI ioctl, which could otherwise be used to inject commands into the controlling terminal so that they would be executed outside the sandbox after the sandboxed app exits. This fix was incomplete: on 64-bit platforms, the seccomp filter could be bypassed by an ioctl request number that has TIOCSTI in its 32 least significant bits and an arbitrary nonzero value in its 32 most significant bits, which the Linux kernel would treat as equivalent to TIOCSTI.(CVE-2019-10063)'
    FixedIn:
        - Name: flatpak
          NamespaceName: amzn:2
          Version: 1.0.2-5.amzn2.0.1
          VersionFormat: rpm
        - Name: flatpak-builder
          NamespaceName: amzn:2
          Version: 1.0.0-5.amzn2.0.1
          VersionFormat: rpm
        - Name: flatpak-debuginfo
          NamespaceName: amzn:2
          Version: 1.0.2-5.amzn2.0.1
          VersionFormat: rpm
        - Name: flatpak-devel
          NamespaceName: amzn:2
          Version: 1.0.2-5.amzn2.0.1
          VersionFormat: rpm
        - Name: flatpak-libs
          NamespaceName: amzn:2
          Version: 1.0.2-5.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2019-1219.html
