Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:net: Drop the lock in skb_may_tx_timestamp() (CVE-2026-43216)In the Linux kernel, the following vulnerability has been resolved:nvmet-tcp: fix race between ICReq handling and queue teardown (CVE-2026-46135)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_log: validate MAC header was set before dumping it (CVE-2026-52942)In the Linux kernel, the following vulnerability has been resolved:NFSv4/flexfiles: reject zero filehandle version count (CVE-2026-53392)In the Linux kernel, the following vulnerability has been resolved:nfsd: reset write verifier on deferred writeback errors (CVE-2026-53393)In the Linux kernel, the following vulnerability has been resolved:nfsd: release layout stid on setlease failure (CVE-2026-53399)In the Linux kernel, the following vulnerability has been resolved:i2c: core: fix adapter registration raceAdapters can be looked up based on their id using i2c_get_adapter()which takes a reference to the embedded struct device.Make sure that the adapter (including its struct device) has beeninitialised before adding it to the IDR to avoid accessing uninitialiseddata which could, for example, lead to NULL-pointer dereferences oruse-after-free.Note that the i2c-dev chardev, which is registered from a bus notifier,currently uses i2c_get_adapter() so the adapter needs to be added to theIDR before registration. (CVE-2026-53400)In the Linux kernel, the following vulnerability has been resolved:fbdev: fbcon: fix out-of-bounds read in err_out of fbcon_do_set_font()When fbcon_do_set_font() fails (e.g., due to a memory allocation failureinside vc_resize() under heavy memory pressure), it jumps to the `err_out`label to roll back the console state. However, the current rollback logicforgets to restore the `hi_font` state, leading to a severe state machinecorruption.Earlier in the function, `set_vc_hi_font()` might be called to change`vc->vc_hi_font_mask` and mutate the screen buffer. If `vc_resize()`subsequently fails, the `err_out` path restores `vc_font.charcount`but entirely skips rolling back the `vc_hi_font_mask` and the screenbuffer.This mismatch leaves the terminal in a desynchronized state. Because`vc_hi_font_mask` remains set, the VT subsystem will still acceptcharacter indices greater than 255 from userspace and write them to thescreen buffer. Subsequent rendering calls (e.g., `fbcon_putcs()`) willthen use these inflated indices to access the reverted, 256-characterfont array, leading to a deterministic out-of-bounds read and potentialkernel memory disclosure.Fix this by adding the missing rollback logic for the `hi_font` maskand screen buffer in the error path. (CVE-2026-53402)In the Linux kernel, the following vulnerability has been resolved:hdlc_ppp: sync per-proto timers before freeing hdlc state (CVE-2026-63803)In the Linux kernel, the following vulnerability has been resolved:KVM: Replace guest-triggerable BUG_ON() in ioeventfd datamatch with get_unaligned() (CVE-2026-63806)In the Linux kernel, the following vulnerability has been resolved:net: ip_gre: require CAP_NET_ADMIN in the device netns for changelink (CVE-2026-63829)In the Linux kernel, the following vulnerability has been resolved:net: skmsg: preserve sg.copy across SG transforms (CVE-2026-63830)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: fix race between dump and ip_set_list resize (CVE-2026-64189)In the Linux kernel, the following vulnerability has been resolved:fuse: re-lock request before returning from fuse_ref_folio() (CVE-2026-64266)In the Linux kernel, the following vulnerability has been resolved:Input: synaptics-rmi4 - bound the F30 keymap to the GPIO/LED count (CVE-2026-64276)In the Linux kernel, the following vulnerability has been resolved:exfat: bound uniname advance in exfat_find_dir_entry() (CVE-2026-64296)In the Linux kernel, the following vulnerability has been resolved:NFSv4: include MAY_WRITE in open permission mask for O_TRUNC (CVE-2026-64298)In the Linux kernel, the following vulnerability has been resolved:tracing: Prevent out-of-bounds read in glob matching (CVE-2026-64299)In the Linux kernel, the following vulnerability has been resolved:crypto: drbg - Fix returning success on failure in CTR_DRBG (CVE-2026-64306)In the Linux kernel, the following vulnerability has been resolved:crypto: pcrypt - restore callback for non-parallel fallback (CVE-2026-64312)In the Linux kernel, the following vulnerability has been resolved:crypto: ecc - Fix carry overflow in vli multiplication (CVE-2026-64313)In the Linux kernel, the following vulnerability has been resolved:isofs: bound Rock Ridge symlink components to the SL record (CVE-2026-64317)In the Linux kernel, the following vulnerability has been resolved:udf: validate sparing table length as an entry count, not a byte count (CVE-2026-64322)In the Linux kernel, the following vulnerability has been resolved:udf: validate VAT header length against the VAT inode size (CVE-2026-64323)In the Linux kernel, the following vulnerability has been resolved:udf: validate free block extents against the partition length (CVE-2026-64324)In the Linux kernel, the following vulnerability has been resolved:USB: ulpi: fix memory leak on registration failure (CVE-2026-64332)In the Linux kernel, the following vulnerability has been resolved:USB: serial: digi_acceleport: fix write buffer corruption (CVE-2026-64333)In the Linux kernel, the following vulnerability has been resolved:USB: serial: digi_acceleport: fix hard lockup on disconnect (CVE-2026-64334)In the Linux kernel, the following vulnerability has been resolved:USB: serial: digi_acceleport: fix broken rx after throttle (CVE-2026-64335)In the Linux kernel, the following vulnerability has been resolved:USB: legousbtower: fix use-after-free on disconnect race (CVE-2026-64340)In the Linux kernel, the following vulnerability has been resolved:USB: iowarrior: fix