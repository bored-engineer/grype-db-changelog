# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: An Improper Output Neutralization for Logs flaw was found in Ansible when using the uri module, where sensitive data is exposed to content and json output. This flaw allows an attacker to access the logs or outputs of performed tasks to read keys used in playbooks from other users within the uri module. The highest threat from this vulnerability is to data confidentiality. (CVE-2020-14330)A flaw was found in the Ansible Engine when using module_args. Tasks executed with check mode (--check-mode) do not properly neutralize sensitive data exposed in the event data. This flaw allows unauthorized users to read this data. The highest threat from this vulnerability is to confidentiality. (CVE-2020-14332)A flaw was found in Ansible Engine when a file is moved using atomic_move primitive as the file mode cannot be specified. This sets the destination files world-readable if the destination file does not exist and if the file exists, the file could be changed to have less restrictive permissions before the move. This could lead to the disclosure of sensitive data. All versions in 2.7.x, 2.8.x and 2.9.x branches are believed to be vulnerable. (CVE-2020-1736)
    FixedIn:
        - Name: ansible
          NamespaceName: amzn:2
          Version: 2.9.12-1.amzn2
          VersionFormat: rpm
        - Name: ansible-doc
          NamespaceName: amzn:2
          Version: 2.9.12-1.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASANSIBLE2-2023-006.html
    Metadata:
        CVE:
            - Name: CVE-2020-14330
            - Name: CVE-2020-14332
            - Name: CVE-2020-1736
    Name: ALASANSIBLE2-2023-006
    NamespaceName: amzn:2
    Severity: Medium
