# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:mm/damon/dbgfs: fix ''struct pid'' leaks in ''dbgfs_target_ids_write()'' (CVE-2021-46937)In the Linux kernel, the following vulnerability has been resolved:mm/damon/dbgfs: protect targets destructions with kdamond_lock (CVE-2021-47088)A flaw was found in the Linux kernel in linux/net/netfilter/nf_tables_api.c of the netfilter subsystem. This flaw allows a local user to cause an out-of-bounds write issue. (CVE-2022-1015)A flaw was found in the Linux kernel in net/netfilter/nf_tables_core.c:nft_do_chain, which can cause a use-after-free. This issue needs to handle return with proper preconditions, as it can lead to a kernel information leak problem caused by a local, unprivileged attacker. (CVE-2022-1016)A use-after-free vulnerability was found in the tc_new_tfilter function in net/sched/cls_api.c in the Linux kernel. The availability of local, unprivileged user namespaces allows privilege escalation. (CVE-2022-1055)An out-of-bounds (OOB) memory access flaw was found in nft_fwd_dup_netdev_offload in net/netfilter/nf_dup_netdev.c in the netfilter subcomponent in the Linux kernel due to a heap out-of-bounds write problem. This flaw allows a local attacker with a user account on the system to gain access to out-of-bounds memory, leading to a system crash or a privilege escalation threat. (CVE-2022-25636)In the Linux kernel, the following vulnerability has been resolved:drm/vrr: Set VRR capable prop only if it is attached to connector (CVE-2022-48843)In the Linux kernel, the following vulnerability has been resolved:net-sysfs: add check for netdevice being present to speed_show (CVE-2022-48850)In the Linux kernel, the following vulnerability has been resolved:sctp: fix kernel-infoleak for SCTP sockets (CVE-2022-48855)In the Linux kernel, the following vulnerability has been resolved:net/mlx5: Fix a race on command flush flow (CVE-2022-48858)In the Linux kernel, the following vulnerability has been resolved:netfilter: fix use-after-free in __nf_register_net_hook() (CVE-2022-48912)In the Linux kernel, the following vulnerability has been resolved:cifs: fix double free race when mount fails in cifs_get_root() (CVE-2022-48919)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: initialize registers in nft_do_chain() (CVE-2022-49293)'
