# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: No versions of an Amazon Linux Java Virtual Machine (JVM) are affected by CVE-2021-44228 or CVE-2021-45046. However, if customers load a log4j version that is affected by CVE-2021-44228 or CVE-2021-45046 into an Amazon Linux JVM, it will introduce the issues identified in CVE-2021-44228 and CVE-2021-45046 into the JVM. This update modifies Amazon Linux packages that provide a JVM to also install the AWS-developed hotpatch to mitigate CVE-2021-44228 or CVE-2021-45046 by default. For more information on the hotpatch package in Amazon Linux, see https://alas.aws.amazon.com/announcements/2021-001.html
    FixedIn:
        - Name: java-1.8.0-amazon-corretto
          NamespaceName: amzn:2
          Version: 1.8.0_312.b07-2.amzn2
          VersionFormat: rpm
        - Name: java-1.8.0-amazon-corretto-devel
          NamespaceName: amzn:2
          Version: 1.8.0_312.b07-2.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2CORRETTO8-2021-001.html
    Metadata:
        CVE:
            - Name: CVE-2021-44228
            - Name: CVE-2021-45046
    Name: ALAS2CORRETTO8-2021-001
    NamespaceName: amzn:2
    Severity: Critical
