Vulnerability:
    Description: 'Insufficient control flow management for the Intel(R) 82599 Ethernet Controllers and Adapters may allow an authenticated user to potentially enable denial of service via local access. (CVE-2021-33061)In the Linux kernel, the following vulnerability has been resolved:KVM: x86: Acquire kvm->srcu when handling KVM_SET_VCPU_EVENTS (CVE-2024-46830)In the Linux kernel, the following vulnerability has been resolved:sched: sch_cake: add bounds checks to host bulk flow fairness counts (CVE-2025-21647)In the Linux kernel, the following vulnerability has been resolved:pfifo_tail_enqueue: Drop new packet when sch->limit == 0 (CVE-2025-21702)In the Linux kernel, the following vulnerability has been resolved:netem: Update sch->q.qlen before qdisc_tree_reduce_backlog() (CVE-2025-21703)'
