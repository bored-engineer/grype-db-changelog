          NamespaceName: amzn:2
          Version: 20.10.7-5.amzn2
          VersionFormat: rpm
        - Name: docker-debuginfo
          NamespaceName: amzn:2
          Version: 20.10.7-5.amzn2
          VersionFormat: rpm
