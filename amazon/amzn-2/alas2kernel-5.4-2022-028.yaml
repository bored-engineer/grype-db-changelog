VE-2022-49492)In the Linux kernel, the following vulnerability has been resolved:HID: elan: Fix potential double free in elan_input_configured (CVE-2022-49508)In the Linux kernel, the following vulnerability has been resolved:arm64: compat: Do not treat syscall number as ESR_ELx for a bad syscall (CVE-2022-49520)In the Linux kernel, the following vulnerability has been resolved:md/bitmap: don''t set sb values if can''t pass sanity check (CVE-2022-49526)In the Linux kernel, the following vulnerability has been resolved:drm/virtio: fix NULL pointer dereference in virtio_gpu_conn_get_modes (CVE-2022-49532)In the Linux kernel, the following vulnerability has been resolved:zsmalloc: fix races between asynchronous zspage free and page migration (CVE-2022-49554)In the Linux kernel, the following vulnerability has been resolved:netfilter: conntrack: re-fetch conntrack after insertion (CVE-2022-49561)In the Linux kernel, the following vulnerability has been resolved:ext4: add reserved GDT blocks check (CVE-2022-49707)In the Linux kernel, the following vulnerability has been resolved:ext4: fix bug_on ext4_mb_use_inode_pa (CVE-2022-49708)In the Linux kernel, the following vulnerability has been resolved:dm mirror log: round up region bitmap size to BITS_PER_LONG (CVE-2022-49710)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v3: Fix refcount leak in gic_populate_ppi_partitions (CVE-2022-49715)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v3: Fix error handling in gic_populate_ppi_partitions (CVE-2022-49716)In the Linux kernel, the following vulnerability has been resolved:i40e: Fix call trace in setup_tx_descriptors (CVE-2022-49725)In the Linux kernel, the following vulnerability has been resolved:clocksource: hyper-v: unexport __init-annotated hv_init_clocksource() (CVE-2022-49726)In the Linux kernel, the following vulnerability has been resolved:ipv6: Fix signed integer overflow in l2tp_ip6_sendmsg (CVE-2022-49727)In the Linux kernel, the following vulnerability has been resolved:ata: libata-core: fix NULL pointer deref in ata_host_alloc_pinfo() (CVE-2022-49731)'
