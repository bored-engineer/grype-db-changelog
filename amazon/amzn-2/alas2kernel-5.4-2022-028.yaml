Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:drm/plane: Move range check for format_count earlier (CVE-2021-47659)Due to the small table perturb size, a memory leak flaw was found in the Linux kernel''s TCP source port generation algorithm in the net/ipv4/tcp.c function. This flaw allows an attacker to leak information and may cause a denial of service. (CVE-2022-1012)A use-after-free flaw was found in fs/ext4/namei.c:dx_insert_block() in the Linux kernel''s filesystem sub-component. This flaw allows a local attacker with a user privilege to cause a denial of service. (CVE-2022-1184)A use-after-free vulnerability was found in the Linux kernel''s Netfilter subsystem in net/netfilter/nf_tables_api.c. This flaw allows a local attacker with user access to cause a privilege escalation issue. (CVE-2022-1966)A flaw was found in hw. Incomplete cleanup of multi-core shared buffers for some Intel(r) Processors may allow an authenticated user to enable information disclosure via local access. (CVE-2022-21123)A flaw was found in hw. Incomplete cleanup of microarchitectural fill buffers on some Intel(r) Processors may allow an authenticated user to enable information disclosure via local access. (CVE-2022-21125)A flaw was found in hw. Incomplete cleanup in specific special register write operations for some Intel&reg; Processors may allow an authenticated user to enable information disclosure via local access. (CVE-2022-21166)KGDB and KDB allow read and write access to kernel memory, and thus should be restricted during lockdown. An attacker with access to a serial port could trigger the debugger so it is important that the debugger respect the lockdown mode when/if it is triggered. CVSS 3.1 Base Score 6.5 (Confidentiality, Integrity and Availability impacts). CVSS Vector: (CVSS:3.1/AV:L/AC:L/PR:H/UI:R/S:U/C:H/I:H/A:H). (CVE-2022-21499)net/netfilter/nf_tables_api.c in the Linux kernel through 5.18.1 allows a local user (able to create user/net namespaces) to escalate privileges to root because an incorrect NFT_STATEFUL_EXPR check leads to a use-after-free. (CVE-2022-32250)The Linux kernel before 5.17.9 allows TCP servers to identify clients by observing what source ports are used. (CVE-2022-32296)An issue was discovered in the Linux kernel through 5.18.3 on powerpc 32-bit platforms. There is a buffer overflow in ptrace PEEKUSER and POKEUSER (aka PEEKUSR and POKEUSR) when accessing floating point registers. (CVE-2022-32981)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: fix a possible null pointer dereference (CVE-2022-48710)In the Linux kernel, the following vulnerability has been resolved:net: openvswitch: fix leak of nested actions (CVE-2022-49086)In the Linux kernel, the following vulnerability has been resolved:exec: Force single empty string when argv is empty (CVE-2022-49264)In the Linux kernel, the following vulnerability has been resolved:nbd: fix io hung while disconnecting device (CVE-2022-49297)In the Linux kernel, the following vulnerability has been resolved:nbd: fix race between nbd_alloc_config() and module removal (CVE-2022-49300)In the Linux kernel, the following vulnerability has been resolved:tty: synclink_gt: Fix null-pointer-dereference in slgt_clean() (CVE-2022-49307)In the Linux kernel, the following vulnerability has been resolved:extcon: Modify extcon device to be created after driver data is set (CVE-2022-49308)In the Linux kernel, the following vulnerability has been resolved:NFSv4: Don''t hold the layoutget locks across multiple RPC calls (CVE-2022-49316)In the Linux kernel, the following vulnerability has been resolved:xprtrdma: treat all calls not a bcall when bc_serv is NULL (CVE-2022-49321)In the Linux kernel, the following vulnerability has been resolved:tracing: Fix sleeping function called from invalid context on RT kernel (CVE-2022-49322)In the Linux kernel, the following vulnerability has been resolved:tcp: fix tcp_mtup_probe_success vs wrong snd_cwnd (CVE-2022-49330)In the Linux kernel, the following vulnerability has been resolved:net: ipv6: unexport __init-annotated seg6_hmac_init() (CVE-2022-49339)In the Linux kernel, the following vulnerability has been resolved:ip_gre: test csum_start instead of transport header (CVE-2022-49340)In the Linux kernel, the following vulnerability has been resolved:bpf, arm64: Clear prog->jited_len along prog->jited (CVE-2022-49341)In the Linux kernel, the following vulnerability has been resolved:ext4: avoid cycles in directory h-tree (CVE-2022-49343)In the Linux kernel, the following vulnerability has been resolved:af_unix: Fix a data-race in unix_dgram_peer_wake_me(). (CVE-2022-49344)In the Linux kernel, the following vulnerability has been resolved:net: xfrm: unexport __init-annotated xfrm4_protocol_init() (CVE-2022-49345)In the Linux kernel, the following vulnerability has been resolved:ext4: fix bug_on in ext4_writepages (CVE-2022-49347)In the Linux kernel, the following vulnerability has been resolved:ext4: fix use-after-free in ext4_rename_dir_prepare (CVE-2022-49349)In the Linux kernel, the following vulnerability has been resolved:net: mdio: unexport __init-annotated mdio_bus_init() (CVE-2022-49350)In the Linux kernel, the following vulnerability has been resolved:ext4: fix warning in ext4_handle_inode_extension (CVE-2022-49352)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: memleak flow rule from commit path (CVE-2022-49358)In the Linux kernel, the following vulnerability has been resolved:firmware: dmi-sysfs: Fix memory leak in dmi_sysfs_register_handle (CVE-2022-49370)In the Linux kernel, the following vulnerability has been resolved:driver core: fix deadlock in __device_attach (CVE-2022-49371)In the Linux kernel, the following vulnerability has been resolved:tcp: tcp_rtx_synack() can be called from process context (CVE-2022-49372)In the Linux kernel, the following vulnerability has been resolved:tipc: chec