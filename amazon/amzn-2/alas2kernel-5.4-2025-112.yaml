Vulnerability:
    Description: 'An issue was discovered in drivers/mtd/ubi/cdev.c in the Linux kernel 6.2. There is a divide-by-zero error in do_div(sz,mtd->erasesize), used indirectly by ctrl_cdev_ioctl, when mtd->erasesize is 0. (CVE-2023-31085)A flaw in the kernel Xen event handler can cause a deadlock with Xen console handling in unprivileged Xen guests. (CVE-2023-34324)A NULL pointer dereference flaw was found in the Linux kernel ipv4 stack. The socket buffer (skb) was assumed to be associated with a device before calling __ip_options_compile, which is not always the case if the skb is re-routed by ipvs. This issue may allow a local user with CAP_NET_ADMIN privileges to crash the system. (CVE-2023-42754)A flaw was found in the Netfilter subsystem of the Linux kernel. A race condition between IPSET_CMD_ADD and IPSET_CMD_SWAP can lead to a kernel panic due to the invocation of `__ip_set_put` on a wrong `set`. This issue may allow a local user to crash the system. (CVE-2023-42756)In the Linux kernel, the following vulnerability has been resolved:net: fix possible store tearing in neigh_periodic_work() (CVE-2023-52522)In the Linux kernel, the following vulnerability has been resolved:ipv4, ipv6: Fix handling of transhdrlen in __ip{,6}_append_data() (CVE-2023-52527)In the Linux kernel, the following vulnerability has been resolved:net: usb: smsc75xx: Fix uninit-value access in __smsc75xx_read_reg (CVE-2023-52528)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix potential use after free in nilfs_gccache_submit_read_data() (CVE-2023-52566)In the Linux kernel, the following vulnerability has been resolved:serial: 8250_port: Check IRQ data before use (CVE-2023-52567)In the Linux kernel, the following vulnerability has been resolved:net: rds: Fix possible NULL-pointer dereference (CVE-2023-52573)In the Linux kernel, the following vulnerability has been resolved:team: fix null-ptr-deref when team device type is changed (CVE-2023-52574)In the Linux kernel, the following vulnerability has been resolved:dccp: fix dccp_v4_err()/dccp_v6_err() again (CVE-2023-52577)In the Linux kernel, the following vulnerability has been resolved:net: bridge: use DEV_STATS_INC() (CVE-2023-52578)In the Linux kernel, the following vulnerability has been resolved:scsi: qla2xxx: Fix deletion race condition (CVE-2023-53615)'
