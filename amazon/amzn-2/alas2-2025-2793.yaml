# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: Jinja is an extensible templating engine. Prior to 3.1.6, an oversight in how the Jinja sandboxed environment interacts with the |attr filter allows an attacker that controls the content of a template to execute arbitrary Python code. To exploit the vulnerability, an attacker needs to control the content of a template. Whether that is the case depends on the type of application using Jinja. This vulnerability impacts users of applications which execute untrusted templates. Jinja's sandbox does catch calls to str.format and ensures they don't escape the sandbox. However, it's possible to use the |attr filter to get a reference to a string's plain format method, bypassing the sandbox. After the fix, the |attr filter no longer bypasses the environment's attribute lookup. This vulnerability is fixed in 3.1.6. (CVE-2025-27516)
    FixedIn:
        - Name: python3-jinja2
          NamespaceName: amzn:2
          Version: 2.7.2-4.amzn2.0.7
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2025-2793.html
    Metadata:
        CVE:
            - Name: CVE-2025-27516
    Name: ALAS2-2025-2793
    NamespaceName: amzn:2
    Severity: High
