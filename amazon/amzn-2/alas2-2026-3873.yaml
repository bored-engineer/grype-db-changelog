Vulnerability:
    Description: 'libvirt: newline injection in network xml dns txt/srv fields allows dnsmasq config directive injection (CVE-2026-61477)libvirt: Check for empty string condition and skip inclusion of the XML document context in the error message. (CVE-2026-61478)A flaw was found in libvirt. A local attacker, specifically a process running as the confined `swtpm` user, could exploit a symlink-following vulnerability in the `virFileChownFiles()` function. By planting a symbolic link within the `swtpm` state directory, the attacker could trick the root-level libvirt daemon into changing the ownership of an arbitrary file to the `swtpm` user. This allows for privilege escalation from the `swtpm` sandbox to root-level file ownership control. (CVE-2026-63622)A flaw was found in libvirt. During storage volume clone or convert operations, newly created volume images were temporarily world-readable. This was caused by the `qemu-img` utility running with overly permissive file creation settings, allowing any local user to read the full guest disk contents. This vulnerability could lead to sensitive information disclosure from guest virtual machines. (CVE-2026-63623)'
