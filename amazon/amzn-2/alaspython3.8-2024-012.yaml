Vulnerability:
    Description: A vulnerability in the package_index module of pypa/setuptools versions up to 69.1.1 allows for remote code execution via its download functions. These functions, which are used to download packages from URLs provided by users or retrieved from package index servers, are susceptible to code injection. If these functions are exposed to user-controlled inputs, such as package URLs, they can execute arbitrary commands on the system. The issue is fixed in version 70.0. (CVE-2024-6345)
    FixedIn:
        - Name: python38-setuptools
          NamespaceName: amzn:2
          Version: 38.4.0-4.amzn2.0.3
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASPYTHON3.8-2024-012.html
