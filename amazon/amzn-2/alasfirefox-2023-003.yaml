# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: 'The Mozilla Foundation Security Advisory''s description of this flaw: The error page for sites with invalid TLS certificates was missing the activation-delay Firefox uses to protect prompts and permission dialogs from attacks that exploit human response time delays. If a malicious page elicited user clicks in precise locations immediately before navigating to a site with a certificate error and made the renderer extremely busy at the same time, it could create a gap between when the error page was loaded and when the display actually refreshed. With the right timing the elicited clicks could land in that gap and activate the button that overrides the certificate error for that site. (CVE-2023-34414)The Mozilla Foundation Security Advisory''s description of this flaw: Mozilla developers and community members Gabriele Svelto, Andrew McCreight, the Mozilla Fuzzing Team, Sean Feng, and Sebastian Hengst reported memory safety bugs present in Firefox 113 and Firefox ESR 102.11. Some of these bugs showed evidence of memory corruption and we presume that with enough effort, some of these could have been exploited to run arbitrary code. (CVE-2023-34416)'
    FixedIn:
        - Name: firefox
          NamespaceName: amzn:2
          Version: 102.12.0-1.amzn2.0.2
          VersionFormat: rpm
        - Name: firefox-debuginfo
          NamespaceName: amzn:2
          Version: 102.12.0-1.amzn2.0.2
          VersionFormat: rpm
