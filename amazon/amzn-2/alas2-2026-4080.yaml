Vulnerability:
    Description: Pod::Text versions before 6.1.1 for Perl allow CPU and memory exhaustion formatting a POD document whose =over nesting drives the margin to the output width.Each =over adds its indent to the margin, which wrap() subtracts from the output width to get the space available for text. When that space reaches zero, the line-splitting substitution matches the empty string, and the loop consumes no input while appending the margin padding on every pass.Formatting an attacker-supplied POD document never returns, and the output grows until memory is exhausted. (CVE-2026-82560)
    FixedIn:
        - Available:
            Date: "2026-11-09"
            Kind: advisory
          Name: perl-podlators
          NamespaceName: amzn:2
          Version: 2.5.1-3.amzn2.0.2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2026-4080.html
