# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'Writing large, newline-free data into a BIO chain using the line-buffering filter where the next BIO performs short writes can trigger a heap-based out-of-bounds write. (CVE-2025-68160)A type confusion vulnerability exists in the TimeStamp Response verification code where an ASN1_TYPE union member is accessed without first validating the type, causing an invalid or NULL pointer dereference when processing a malformed TimeStamp Response file. (CVE-2025-69420)Processing a malformed PKCS#12 file can trigger a NULL pointer dereference in the PKCS12_item_decrypt_d2i_ex() function. (CVE-2025-69421)ASN1_TYPE Type Confusion in the PKCS7_digest_from_attributes() functionNOTE: https://openssl-library.org/news/secadv/20260127.txt (CVE-2026-22796)'
