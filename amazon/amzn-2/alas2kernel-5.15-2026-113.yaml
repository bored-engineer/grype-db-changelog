arted trackinginvalid roots in 2008 (commit 2e53d63acba7, "KVM: MMU: ignore zapped rootpagetables"), but the true badness only came along in 2020 (Linux 5.9)with the invariant that invalid shadow pages can''t be on the list ofactive pages.Note #2, inheriting role.invalid when creating child shadow pages is alsofar from ideal; that flaw will be addressed separately. (CVE-2026-64561)In the Linux kernel, the following vulnerability has been resolved:btrfs: do not trim a device which is not writeable (CVE-2026-64593)In the Linux kernel, the following vulnerability has been resolved:KVM: VMX: Grab vmcs12 on CR8 interception update iff vCPU is in guest mode (CVE-2026-64604)In the Linux kernel, the following vulnerability has been resolved:device property: initialize the remaining fields of fwnode_handle in fwnode_init() (CVE-2026-68461)In the Linux kernel, the following vulnerability has been resolved:ipvs: fix more places with wrong ipv6 transport offsets (CVE-2026-68477)In the Linux kernel, the following vulnerability has been resolved:cgroup/cpuset: rebind mm mempolicy to effective_mems, not mems_allowed (CVE-2026-72010)In the Linux kernel, the following vulnerability has been resolved:drbd: reject data replies with an out-of-range payload size (CVE-2026-72014)In the Linux kernel, the following vulnerability has been resolved:ipvs: reset full ip_vs_seq structs in ip_vs_conn_new (CVE-2026-72020)In the Linux kernel, the following vulnerability has been resolved:ipvs: use parsed transport offset in SCTP state lookup (CVE-2026-72021)In the Linux kernel, the following vulnerability has been resolved:net/sched: sch_multiq: Replace direct dequeue call with peek and qdisc_dequeue_peeked (CVE-2026-72036)In the Linux kernel, the following vulnerability has been resolved:net: ip6_gre: require CAP_NET_ADMIN in the device netns for changelink (CVE-2026-72052)In the Linux kernel, the following vulnerability has been resolved:net: ip_vti: require CAP_NET_ADMIN in the device netns for