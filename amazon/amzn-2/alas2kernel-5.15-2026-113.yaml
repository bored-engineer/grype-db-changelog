Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:NFSv4/flexfiles: reject zero filehandle version count (CVE-2026-53392)In the Linux kernel, the following vulnerability has been resolved:nfsd: reset write verifier on deferred writeback errors (CVE-2026-53393)In the Linux kernel, the following vulnerability has been resolved:i2c: core: fix adapter registration raceAdapters can be looked up based on their id using i2c_get_adapter()which takes a reference to the embedded struct device.Make sure that the adapter (including its struct device) has beeninitialised before adding it to the IDR to avoid accessing uninitialiseddata which could, for example, lead to NULL-pointer dereferences oruse-after-free.Note that the i2c-dev chardev, which is registered from a bus notifier,currently uses i2c_get_adapter() so the adapter needs to be added to theIDR before registration. (CVE-2026-53400)In the Linux kernel, the following vulnerability has been resolved:fbdev: fbcon: fix out-of-bounds read in err_out of fbcon_do_set_font()When fbcon_do_set_font() fails (e.g., due to a memory allocation failureinside vc_resize() under heavy memory pressure), it jumps to the `err_out`label to roll back the console state. However, the current rollback logicforgets to restore the `hi_font` state, leading to a severe state machinecorruption.Earlier in the function, `set_vc_hi_font()` might be called to change`vc->vc_hi_font_mask` and mutate the screen buffer. If `vc_resize()`subsequently fails, the `err_out` path restores `vc_font.charcount`but entirely skips rolling back the `vc_hi_font_mask` and the screenbuffer.This mismatch leaves the terminal in a desynchronized state. Because`vc_hi_font_mask` remains set, the VT subsystem will still acceptcharacter indices greater than 255 from userspace and write them to thescreen buffer. Subsequent rendering calls (e.g., `fbcon_putcs()`) willthen use these inflated indices to access the reverted, 256-characterfont array, leading to a deterministic out-of-bounds read and potentialkernel memory disclosure.Fix this by adding the missing rollback logic for the `hi_font` maskand screen buffer in the error path. (CVE-2026-53402)In the Linux kernel, the following vulnerability has been resolved:KVM: Replace guest-triggerable BUG_ON() in ioeventfd datamatch with get_unaligned() (CVE-2026-63806)In the Linux kernel, the following vulnerability has been resolved:block: Avoid mounting the bdev pseudo-filesystem in userspace (CVE-2026-63810)In the Linux kernel, the following vulnerability has been resolved:net: ip_gre: require CAP_NET_ADMIN in the device netns for changelink (CVE-2026-63829)In the Linux kernel, the following vulnerability has been resolved:net: skmsg: preserve sg.copy across SG transforms (CVE-2026-63830)In the Linux kernel, the following vulnerability has been resolved:xfs: fail recovery on a committed log item with no regionsIf the first op of a transaction is a bare transaction header(len == sizeof(struct xfs_trans_header)), xlog_recover_add_to_trans()adds an item but no region, leaving it on r_itemq with ri_cnt == 0 andri_buf == NULL.The header can be split across op records, so later ops may still addregions; the item is only invalid if the transaction commits with none.The runtime commit path never emits such a transaction, so this onlyhappens on a crafted log.  It came from an AI-assisted code audit of therecovery parser.xlog_recover_reorder_trans() calls ITEM_TYPE() on the item, which reads*(unsigned short *)item->ri_buf[0].iov_base and faults on the NULLri_buf.  Reject it there, before the commit handlers that also readri_buf[0].KASAN: null-ptr-deref in range [0x0000000000000000-0x0000000000000007]RIP: 0010:xlog_recover_reorder_trans (fs/xfs/xfs_log_recover.c:1836)xlog_recover_commit_trans (fs/xfs/xfs_log_recover.c:2043)xlog_recover_process_data (fs/xfs/xfs_log_recover.c:2501)xlog_do_recovery_pass (fs/xfs/xfs_log_recover.c:3244)xlog_recover (fs/xfs/xfs_log_recover.c:3493)xfs_log_mount (fs/xfs/xfs_log.c:618)xfs_mountfs (fs/xfs/xfs_mount.c:1034)xfs_fs_fill_super (fs/xfs/xfs_super.c:1938)vfs_get_tree (fs/super.c:1695)path_mount (fs/namespace.c:4161)__x64_sys_mount (fs/namespace.c:4367) (CVE-2026-64187)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: fix race between dump and ip_set_list resize (CVE-2026-64189)In the Linux kernel, the following vulnerability has been resolved:fuse: re-lock request before returning from fuse_ref_folio() (CVE-2026-64266)In the Linux kernel, the following vulnerability has been resolved:i2c: core: fix adapter deregistration race (CVE-2026-64279)In the Linux kernel, the following vulnerability has been resolved:exfat: bound uniname advance in exfat_find_dir_entry() (CVE-2026-64296)In the Linux kernel, the following vulnerability has been resolved:NFSv4: include MAY_WRITE in open permission mask for O_TRUNC (CVE-2026-64298)In the Linux kernel, the following vulnerability has been resolved:tracing: Prevent out-of-bounds read in glob matching (CVE-2026-64299)In the Linux kernel, the following vulnerability has been resolved:crypto: drbg - Fix returning success on failure in CTR_DRBG (CVE-2026-64306)In the Linux kernel, the following vulnerability has been resolved:crypto: pcrypt - restore callback for non-parallel fallback (CVE-2026-64312)In the Linux kernel, the following vulnerability has been resolved:crypto: ecc - Fix carry overflow in vli multiplication (CVE-2026-64313)In the Linux kernel, the following vulnerability has been resolved:isofs: bound Rock Ridge symlink components to the SL record (CVE-2026-64317)In the Linux kernel, the following vulnerability has been resolved:udf: validate sparing table length as an entry count, not a byte count (CVE-2026-64322)In the Linux kernel, the following vulnerability has been resolved:udf: validate VAT header length against the VAT inode size (CVE-2026-64323)In the Linux kernel, the following vulnerability has been resolved:udf