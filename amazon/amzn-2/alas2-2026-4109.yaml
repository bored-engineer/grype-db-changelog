# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: Size calculations for very large merge results can overflow, leading to an undersized buffer and heap corruption. (CVE-2026-105437)Recursive clones can lead to remote code execution through unsafe handling of submodule-related repository metadata. (CVE-2026-111760)A server can advertise a malformed unborn HEAD, causing unintended file writes during subsequent ref updates with the files ref backend. (CVE-2026-113408)Certain fast-import features can access arbitrary paths and are now disallowed by default. (CVE-2026-114466)Removing more than two GPG signatures from commit messages can corrupt stack memory, potentially causing denial of service during merges. (CVE-2026-114467)Binary-patch size validation can be bypassed because it checks the encoded input rather than the inflated result, potentially causing an out-of-bounds read and crash. (CVE-2026-114469)
