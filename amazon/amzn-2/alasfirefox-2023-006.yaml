Vulnerability:
    Description: The Mozilla Foundation describes this issue as follows:Unexpected data returned from the Safe Browsing API could have led to memory corruption and a potentially exploitable crash. (CVE-2023-1945)The Mozilla Foundation describes this issue as follows:A website could have obscured the fullscreen notification by using a combination of window.open, fullscreen requests, window.name assignments, and setInterval calls. This could have led to user confusion and possible spoofing attacks. (CVE-2023-29533)The Mozilla Foundation describes this issue as follows:Following a Garbage Collector compaction, weak maps may have been accessed before they were correctly traced. This resulted in memory corruption and a potentially exploitable crash. (CVE-2023-29535)The Mozilla Foundation describes this issue as follows:An attacker could cause the memory manager to incorrectly free a pointer that addresses attacker-controlled memory, resulting in an assertion, memory corruption, or a potentially exploitable crash. (CVE-2023-29536)The Mozilla Foundation describes this issue as follows:When handling the filename directive in the Content-Disposition header, the filename would be truncated if the filename contained a NULL character. This could have led to reflected file download attacks potentially tricking users to install malware. (CVE-2023-29539)The Mozilla Foundation describes this issue as follows:Firefox did not properly handle downloads of files ending in .desktop, which can be interpreted to run attacker-controlled commands.This bug only affects Firefox for Linux on certain Distributions. Other operating systems are unaffected, and Mozilla is unable to enumerate all affected Linux Distributions. (CVE-2023-29541)The Mozilla Foundation describes this issue as follows:A wrong lowering instruction in the ARM64 Ion compiler resulted in a wrong optimization result. (CVE-2023-29548)The Mozilla Foundation describes this issue as follows:Mozilla developers Andrew Osmond, Sebastian Hengst, Andrew McCreight, and the Mozilla Fuzzing Team reported memory safety bugs present in Thunderbird 102.9, Firefox 111, and Firefox ESR 102.9. Some of these bugs showed evidence of memory corruption and we presume that with enough effort some of these could have been exploited to run arbitrary code. (CVE-2023-29550)
