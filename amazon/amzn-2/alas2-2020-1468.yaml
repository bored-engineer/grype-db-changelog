# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: The Mozilla Foundation Security Advisory describes this flaw as:If Thunderbird is configured to use STARTTLS for an IMAP server, and the server sends a PREAUTH response, then Thunderbird will continue with an unencrypted connection, causing email data to be sent without protection. (CVE-2020-12398)The Mozilla Foundation Security Advisory describes this flaw as:When browsing a malicious page, a race condition in our SharedWorkerService could occur and lead to a potentially exploitable crash. (CVE-2020-12405)The Mozilla Foundation Security Advisory describes this flaw as:Mozilla developer Iain Ireland discovered a missing type check during unboxed objects removal, resulting in a crash. We presume that with enough effort that it could be exploited to run arbitrary code. (CVE-2020-12406)The Mozilla Foundation Security Advisory describes this flaw as:Mozilla developers reported memory safety bugs present in Firefox 76 and Firefox ESR 68.8. Some of these bugs showed evidence of memory corruption and we presume that with enough effort some of these could have been exploited to run arbitrary code. (CVE-2020-12410)The Mozilla Foundation Security Advisory describes this flaw as:Due to confusion about ValueTags on JavaScript Objects, an object may pass through the type barrier, resulting in memory corruption and a potentially exploitable crash. (CVE-2020-12417)The Mozilla Foundation Security Advisory describes this flaw as:Manipulating individual parts of a URL object could have caused an out-of-bounds read, leaking process memory to malicious JavaScript. (CVE-2020-12418)The Mozilla Foundation Security Advisory describes this flaw as:When processing callbacks that occurred during window flushing in the parent process, the associated window may die; causing a use-after-free condition. This could have led to memory corruption and a potentially exploitable crash. (CVE-2020-12419)The Mozilla Foundation Security Advisory describes this flaw as:When trying to connect to a STUN server, a race condition could have caused a use-after-free of a pointer, leading to memory corruption and a potentially exploitable crash. (CVE-2020-12420)The Mozilla Foundation Security Advisory describes this flaw as:When performing add-on updates, certificate chains terminating in non-built-in-roots were rejected (even if they were legitimately added by an administrator.) This could have caused add-ons to become out-of-date silently without notification to the user. (CVE-2020-12421)
