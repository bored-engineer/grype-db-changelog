    Description: 'In the Linux kernel, the following vulnerability has been resolved:md: fix kmemleak of rdev->serial (CVE-2024-26900)In the Linux kernel, the following vulnerability has been resolved:dyndbg: fix old BUG_ON in >control parser (CVE-2024-35947)In the Linux kernel, the following vulnerability has been resolved:rtnetlink: Correct nested IFLA_VF_VLAN_LIST attribute validation (CVE-2024-36017)In the Linux kernel, the following vulnerability has been resolved:net: fix out-of-bounds access in ops_init (CVE-2024-36883)In the Linux kernel, the following vulnerability has been resolved:tipc: fix UAF in error path (CVE-2024-36886)In the Linux kernel, the following vulnerability has been resolved:ipv6: fib6_rules: avoid possible NULL dereference in fib6_rule_action() (CVE-2024-36902)In the Linux kernel, the following vulnerability has been resolved:tcp: Use refcount_inc_not_zero() in tcp_twsk_unique(). (CVE-2024-36904)In the Linux kernel, the following vulnerability has been resolved:tcp: defer shutdown(SEND_SHUTDOWN) for TCP_SYN_RECV sockets (CVE-2024-36905)In the Linux kernel, the following vulnerability has been resolved:blk-iocost: avoid out of bounds shift (CVE-2024-36916)In the Linux kernel, the following vulnerability has been resolved:net: core: reject skb_copy(_expand) for fraglist GSO skbs (CVE-2024-36929)In the Linux kernel, the following vulnerability has been resolved:nsh: Restore skb->{protocol,data,mac_header} for outer header in nsh_gso_segment(). (CVE-2024-36933)In the Linux kernel, the following vulnerability has been resolved:nfs: Handle error of rpc_proc_register() in nfs_net_init(). (CVE-2024-36939)In the Linux kernel, the following vulnerability has been resolved:pinctrl: core: delete incorrect free in pinctrl_enable() (CVE-2024-36940)In the Linux kernel, the following vulnerability has been resolved:KVM: arm64: vgic-v2: Check for non-NULL vCPU in vgic_v2_parse_attr() (CVE-2024-36953)In the Linux kernel, the following vulnerability has been