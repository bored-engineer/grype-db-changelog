Vulnerability:
    Description: 'A vulnerability, which was classified as problematic, was found in Linux Kernel. This affects the function tcp_getsockopt/tcp_setsockopt of the component TCP Handler. The manipulation leads to race condition. It is recommended to apply a patch to fix this issue. The identifier VDB-211089 was assigned to this vulnerability. (CVE-2022-3566)A vulnerability has been found in Linux Kernel and classified as problematic. This vulnerability affects the function inet6_stream_ops/inet6_dgram_ops of the component IPv6 Handler. The manipulation leads to race condition. It is recommended to apply a patch to fix this issue. VDB-211090 is the identifier assigned to this vulnerability. (CVE-2022-3567)In the Linux kernel, the following vulnerability has been resolved:net: sched: sch_multiq: fix possible OOB write in multiq_tune() (CVE-2024-36978)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix potential kernel bug due to lack of writeback flag waiting (CVE-2024-37078)In the Linux kernel, the following vulnerability has been resolved:usb-storage: alauda: Check whether the media is initialized (CVE-2024-38619)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix nilfs_empty_dir() misjudgment and long loop on I/O errors (CVE-2024-39469)In the Linux kernel, the following vulnerability has been resolved:netfilter: ipset: Fix race between namespace cleanup and gc in the list:set type (CVE-2024-39503)In the Linux kernel, the following vulnerability has been resolved:HID: core: remove unnecessary WARN_ON() in implement() (CVE-2024-39509)In the Linux kernel, the following vulnerability has been resolved:scsi: mpt3sas: Avoid test/set_bit() operating in non-allocated memory (CVE-2024-40901)In the Linux kernel, the following vulnerability has been resolved:netns: Make get_net_ns() handle zero refcount net (CVE-2024-40958)In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent possible NULL dereference in rt6_probe() (CVE-2024-40960)In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent possible NULL deref in fib6_nh_init() (CVE-2024-40961)In the Linux kernel, the following vulnerability has been resolved:scsi: qedi: Fix crash while reading debugfs attribute (CVE-2024-40978)In the Linux kernel, the following vulnerability has been resolved:drop_monitor: replace spin_lock by raw_spin_lock (CVE-2024-40980)In the Linux kernel, the following vulnerability has been resolved:ACPICA: Revert "ACPICA: avoid Info: mapping multiple BARs. Your kernel is fine." (CVE-2024-40984)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: fix UBSAN warning in kv_dpm.c (CVE-2024-40988)In the Linux kernel, the following vulnerability has been resolved:net/sched: act_api: fix possible infinite loop in tcf_idr_check_alloc() (CVE-2024-40995)In the Linux kernel, the following vulnerability has been resolved:ata: libata-core: Fix double free on error (CVE-2024-41087)In the Linux kernel, the following vulnerability has been resolved:usb: atm: cxacru: fix endpoint checking in cxacru_bind() (CVE-2024-41097)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: fully validate NFT_DATA_VALUE on store to data registers (CVE-2024-42070)In the Linux kernel, the following vulnerability has been resolved:ftruncate: pass a signed offset (CVE-2024-42084)In the Linux kernel, the following vulnerability has been resolved:pinctrl: fix deadlock in create_pinctrl() when handling -EPROBE_DEFER (CVE-2024-42090)In the Linux kernel, the following vulnerability has been resolved:x86: stop playing stack games in profile_pc() (CVE-2024-42096)'
