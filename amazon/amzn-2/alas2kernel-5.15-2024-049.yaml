    Description: 'In the Linux kernel, the following vulnerability has been resolved:net: dsa: fix panic when DSA master device unbinds on shutdown (CVE-2022-48808)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix RELEASE_LOCKOWNER (CVE-2024-26629)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: disallow anonymous set with timeout flag (CVE-2024-26642)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: mark set as dead when unbinding anonymous set with timeout (CVE-2024-26643)In the Linux kernel, the following vulnerability has been resolved:xen/events: close evtchn after mapping cleanup (CVE-2024-26687)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: Lock external INTx masking ops (CVE-2024-26810)In the Linux kernel, the following vulnerability has been resolved:vfio/pci: Create persistent INTx handler (CVE-2024-26812)In the Linux kernel, the following vulnerability has been resolved:af_unix: Fix garbage collector racing against connect() (CVE-2024-26923)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: release mutex after nft_gc_seq_end from abort pathThe commit mutex should not be released during the critical sectionbetween nft_gc_seq_begin() and nft_gc_seq_end(), otherwise, async GCworker could collect expired objects and get the released commit lockwithin the same GC sequence.nf_tables_module_autoload() temporarily releases the mutex to loadmodule dependencies, then it goes back to replay the transaction again.Move it at the end of the abort phase after nft_gc_seq_end() is called. (CVE-2024-26925)In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix deadlock in usb_deauthorize_interface() (CVE-2024-26934)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Fix unremoved procfs host directory regression (CVE-2024-26935)In the Linux kernel, t