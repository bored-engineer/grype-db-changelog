een resolved:dm snapshot: fix lockup in dm_exception_table_exit (CVE-2024-35805)In the Linux kernel, the following vulnerability has been resolved:PCI/PM: Drain runtime-idle callbacks before driver removal (CVE-2024-35809)In the Linux kernel, the following vulnerability has been resolved:fs/aio: Check IOCB_AIO_RW before the struct aio_kiocb conversion (CVE-2024-35815)In the Linux kernel, the following vulnerability has been resolved:vt: fix unicode buffer corruption when deleting characters (CVE-2024-35823)In the Linux kernel, the following vulnerability has been resolved:mm/secretmem: fix GUP-fast succeeding on secretmem folios (CVE-2024-35872)In the Linux kernel, the following vulnerability has been resolved:udp: do not accept non-tunnel GSO skbs landing in a tunnel (CVE-2024-35884)In the Linux kernel, the following vulnerability has been resolved:erspan: make sure erspan_base_hdr is present in skb->head (CVE-2024-35888)In the Linux kernel, the following vulnerability has been resolved:gro: fix ownership transfer (CVE-2024-35890)In the Linux kernel, the following vulnerability has been resolved:bpf, sockmap: Prevent lock inversion deadlock in map delete elem (CVE-2024-35895)In the Linux kernel, the following vulnerability has been resolved:netfilter: validate user input for expected length (CVE-2024-35896)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: discard table flag update with pending basechain deletion (CVE-2024-35897)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: flush pending destroy work before exit_net release (CVE-2024-35899)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: reject new basechain after table flag update (CVE-2024-35900)In the Linux kernel, the following vulnerability has been resolved:net/rds: fix possible cp null dereference (CVE-2024-35902)In the Linux kernel, the following vulnerability has been resolved:tcp: properly terminate timers for kernel sockets (CVE-2024-35910)In the Linux kernel, the following vulnerability has been resolved:block: prevent division by zero in blk_rq_stat_sum() (CVE-2024-35925)In the Linux kernel, the following vulnerability has been resolved:btrfs: send: handle path ref underflow in header iterate_inode_ref() (CVE-2024-35935)In the Linux kernel, the following vulnerability has been resolved:btrfs: handle chunk tree lookup error in btrfs_relocate_sys_chunks() (CVE-2024-35936)In the Linux kernel, the following vulnerability has been resolved:VMCI: Fix memcpy() run-time warning in dg_dispatch_as_host() (CVE-2024-35944)In the Linux kernel, the following vulnerability has been resolved:drm/client: Fully protect modes[] with dev->mode_config.mutex (CVE-2024-35950)In the Linux kernel, the following vulnerability has been resolved:net/mlx5: Properly link new fs rules into the tree (CVE-2024-35960)In the Linux kernel, the following vulnerability has been resolved:ipv6: fix race condition between ipv6_get_ifaddr and ipv6_del_addr (CVE-2024-35969)In the Linux kernel, the following vulnerability has been resolved:af_unix: Clear stale u->oob_skb. (CVE-2024-35970)In the Linux kernel, the following vulnerability has been resolved:geneve: fix header validation in geneve[6]_xmit_skb (CVE-2024-35973)In the Linux kernel, the following vulnerability has been resolved:xsk: validate user input for XDP_{UMEM|COMPLETION}_FILL_RING (CVE-2024-35976)In the Linux kernel, the following vulnerability has been resolved:ACPI: CPPC: Use access_width over bit_width for system memory accesses (CVE-2024-35995)'
