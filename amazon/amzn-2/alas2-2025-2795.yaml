Vulnerability:
    Description: 'net/http: sensitive headers incorrectly sent after cross-domain redirectThe HTTP client drops sensitive headers after following a cross-domain redirect.For example, a request to a.com/ containing an Authorization header which isredirected to b.com/ will not send that header to b.com.In the event that the client received a subsequent same-domain redirect, however,the sensitive headers would be restored. For example, a chain of redirects froma.com/, to b.com/1, and finally to b.com/2 would incorrectly send the Authorizationheader to b.com/2.Thanks to Kyle Seely for reporting this issue. (CVE-2024-45336)crypto/x509: usage of IPv6 zone IDs can bypass URI name constraintsA certificate with a URI which has a IPv6 address with a zone ID mayincorrectly satisfy a URI name constraint that applies to the certificatechain.Certificates containing URIs are not permitted in the web PKI, so thisonly affects users of private PKIs which make use of URIs.Thanks to Juho Forsen of Mattermost for reporting this issue. (CVE-2024-45341)NOTE: https://groups.google.com/g/golang-announce/c/4t3lzH3I0eI/m/b42ImqrBAQAJNOTE: https://github.com/golang/go/issues/71984NOTE: Fixed by: https://github.com/golang/go/commit/334de7982f8ec959c74470dd709ceedfd6dbd50a (go1.24.1)NOTE: Fixed by: https://github.com/golang/go/commit/25177ecde0922c50753c043579d17828b7ee88e7 (go1.23.7) (CVE-2025-22870)'
