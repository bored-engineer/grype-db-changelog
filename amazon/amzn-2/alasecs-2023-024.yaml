          NamespaceName: amzn:2
          Version: 1.4.6-8.amzn2
          VersionFormat: rpm
        - Name: containerd-stress
          NamespaceName: amzn:2
          Version: 1.4.6-8.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASECS-2023-024.html
