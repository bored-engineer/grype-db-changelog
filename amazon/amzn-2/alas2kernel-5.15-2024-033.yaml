Vulnerability:
    Description: 'An issue was discovered in the Linux kernel through 6.5.9. During a race with SQ thread exit, an io_uring/fdinfo.c io_uring_show_fdinfo NULL pointer dereference can occur. (CVE-2023-46862)When a router encounters an IPv6 packet too big to transmit to the next-hop, it returns an ICMP6 "Packet Too Big" (PTB) message to the sender. The sender caches this updated Maximum Transmission Unit (MTU) so it knows not to exceed this value when subsequently routing to the same host.In Linux kernels prior to 6.3, garbage collection is run on the IPv6 Destination Route Cache if the number of entries exceeds a threshold when adding the destination to the cache. This garbage collection examines every entry in the cache while holding a lock. In these affected kernel versions, a flood of the IPv6 ICMP6 PTB messages could cause high lock contention and increased CPU usage, leading to a Denial-of-Service.The fix backports the garbage collection improvements from Linux kernel 6.3 by bringing the IPv6 code closer to the IPv4 code, which does not have this issue.Patch: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit?id=af6d10345ca76670c1b7c37799f0d5576ccef277 (CVE-2023-52340)In the Linux kernel, the following vulnerability has been resolved:io_uring/af_unix: disable sending io_uring over sockets (CVE-2023-52654)In the Linux kernel, the following vulnerability has been resolved:virtio-blk: fix implicit overflow on virtio_max_dma_size (CVE-2023-52762)In the Linux kernel, the following vulnerability has been resolved:af_unix: fix use-after-free in unix_stream_read_actor() (CVE-2023-52772)In the Linux kernel, the following vulnerability has been resolved:usb: config: fix iteration issue in ''usb_get_bos_descriptor()'' (CVE-2023-52781)In the Linux kernel, the following vulnerability has been resolved:bonding: stop the device in bond_setup_by_slave() (CVE-2023-52784)In the Linux kernel, the following vulnerability has been resolved:i915/perf: Fix NULL deref bugs with drm_dbg() calls (CVE-2023-52788)In the Linux kernel, the following vulnerability has been resolved:i2c: core: Run atomic i2c xfer when !preemptible (CVE-2023-52791)In the Linux kernel, the following vulnerability has been resolved:ipvlan: add ipvlan_route_v6_outbound() helper (CVE-2023-52796)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: Fix RPC client cleaned up the freed pipefs dentries (CVE-2023-52803)In the Linux kernel, the following vulnerability has been resolved:crypto: pcrypt - Fix hungtask for PADATA_RESET (CVE-2023-52813)In the Linux kernel, the following vulnerability has been resolved:bpf: Detect IP == ksym.end as part of BPF program (CVE-2023-52828)In the Linux kernel, the following vulnerability has been resolved:perf/core: Bail out early if the request AUX area is out of bound (CVE-2023-52835)In the Linux kernel, the following vulnerability has been resolved:tracing: Have trace_event_file have ref counters (CVE-2023-52879)In the Linux kernel, the following vulnerability has been resolved:tcp: do not accept ACK of bytes we never sent (CVE-2023-52881)An out-of-bounds read vulnerability was found in the NVMe-oF/TCP subsystem in the Linux kernel. This flaw allows a remote attacker to send a crafted TCP packet, triggering a heap-based buffer overflow that results in kmalloc data to be printed (and potentially leaked) to the kernel ring buffer (dmesg). (CVE-2023-6121)A use-after-free flaw was found in the Linux Kernel due to a race problem in the unix garbage collector''s deletion of SKB races with unix_stream_read_generic() on the socket that the SKB is queued on. (CVE-2023-6531)A null pointer dereference vulnerability was found in nft_dynset_init() in net/netfilter/nft_dynset.c in nf_tables in the Linux kernel. This issue may allow a local attacker with CAP_NET_ADMIN user privilege to trigger a denial of service. (CVE-2023-6622)A use-after-free vulnerability in the Linux kernel''s netfilter: nf_tables component can be exploited to achieve local privilege escalation.The function nft_pipapo_walk did not skip inactive elements during set walk which could lead double deactivations of PIPAPO (Pile Packet Policies) elements, leading to use-after-free.We recommend upgrading past commit 317eb9685095678f2c9f5a8189de698c5354316a. (CVE-2023-6817)A heap out-of-bounds write vulnerability in the Linux kernel''s Performance Events system component can be exploited to achieve local privilege escalation.A perf_event''s read_size can overflow, leading to an heap out-of-bounds increment or write in perf_read_group().We recommend upgrading past commit 382c27f4ed28f803b1f1473ac2d8db0afc795a1b. (CVE-2023-6931)A use-after-free vulnerability in the Linux kernel''s ipv4: igmp component can be exploited to achieve local privilege escalation.A race condition can be exploited to cause a timer be mistakenly registered on a RCU read locked object which is freed by another thread.We recommend upgrading past commit e2b706c691905fe78468c361aaabc719d0a496f1. (CVE-2023-6932)A use-after-free issue was found in igmp_start_timer in net/ipv4/igmp.c in the network sub-component in the Linux Kernel. This flaw allows a local user to observe a refcnt use-after-free issue when receiving an igmp query packet, leading to a kernel information leak. (CVE-2024-0584)netfilter: nf_tables: fix pointer math issue in nft_byteorder_eval() (CVE-2024-0607)'
