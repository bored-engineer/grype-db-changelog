Vulnerability:
    Description: A flaw was found in the default configuration of dnsmasq, as shipped with Fedora and Red Hat Enterprise Linux, where it listens on any interface and accepts queries from addresses outside of its local subnet. In particular, the option `local-service` is not enabled. Running dnsmasq in this manner may inadvertently make it an open resolver accessible from any address on the internet. This flaw allows an attacker to conduct a Distributed Denial of Service (DDoS) against other systems. (CVE-2020-14312)
    FixedIn:
        - Name: dnsmasq
          NamespaceName: amzn:2
          Version: 2.76-10.amzn2.1.1
          VersionFormat: rpm
        - Name: dnsmasq-debuginfo
          NamespaceName: amzn:2
          Version: 2.76-10.amzn2.1.1
          VersionFormat: rpm
        - Name: dnsmasq-utils
          NamespaceName: amzn:2
          Version: 2.76-10.amzn2.1.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2020-1469.html
    Metadata:
        CVE:
            - Name: CVE-2020-14312
    Name: ALAS2-2020-1469
    NamespaceName: amzn:2
    Severity: Medium
