# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A flaw was found in the Linux kernel in linux/net/netfilter/nf_tables_api.c of the netfilter subsystem. This flaw allows a local user to cause an out-of-bounds write issue. (CVE-2022-1015)A flaw was found in the Linux kernel in net/netfilter/nf_tables_core.c:nft_do_chain, which can cause a use-after-free. This issue needs to handle return with proper preconditions, as it can lead to a kernel information leak problem caused by a local, unprivileged attacker. (CVE-2022-1016)Product: AndroidVersions: Android kernelAndroid ID: A-224546354References: Upstream kernel (CVE-2022-20368)In the Linux kernel, the following vulnerability has been resolved:net/packet: fix slab-out-of-bounds access in packet_recvmsg() (CVE-2022-48839)In the Linux kernel, the following vulnerability has been resolved:net-sysfs: add check for netdevice being present to speed_show (CVE-2022-48850)In the Linux kernel, the following vulnerability has been resolved:sctp: fix kernel-infoleak for SCTP sockets (CVE-2022-48855)In the Linux kernel, the following vulnerability has been resolved:netfilter: fix use-after-free in __nf_register_net_hook() (CVE-2022-48912)In the Linux kernel, the following vulnerability has been resolved:cifs: fix double free race when mount fails in cifs_get_root() (CVE-2022-48919)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: initialize registers in nft_do_chain() (CVE-2022-49293)'
