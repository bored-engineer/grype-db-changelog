# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:scsi: target: Fix WRITE_SAME No Data Buffer crashIn newer version of the SBC specs, we have a NDOB bit that indicates thereis no data buffer that gets written out. If this bit is set using commandslike "sg_write_same --ndob" we will crash in target_core_iblock/file''sexecute_write_same handlers when we go to access the se_cmd->t_data_sgbecause its NULL.This patch adds a check for the NDOB bit in the common WRITE SAME codebecause we don''t support it. And, it adds a check for zero SG elements ineach handler in case the initiator tries to send a normal WRITE SAME withno data buffer. (CVE-2022-21546)In the Linux kernel, the following vulnerability has been resolved:mm/khugepaged: fix ->anon_vma race (CVE-2023-52935)In the Linux kernel, the following vulnerability has been resolved:of: module: add buffer overflow check in of_modalias() (CVE-2024-38541)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v2m: Prevent use after free of gicv2m_get_fwnode() (CVE-2025-37819)In the Linux kernel, the following vulnerability has been resolved:net_sched: hfsc: Fix a UAF vulnerability in class with netem as child qdisc (CVE-2025-37890)In the Linux kernel, the following vulnerability has been resolved:net_sched: qfq: Fix double list add in class with netem as child qdisc (CVE-2025-37913)In the Linux kernel, the following vulnerability has been resolved:net_sched: drr: Fix double list add in class with netem as child qdisc (CVE-2025-37915)In the Linux kernel, the following vulnerability has been resolved:tracing: Fix oob write in trace_seq_to_buffer() (CVE-2025-37923)In the Linux kernel, the following vulnerability has been resolved:iommu/amd: Fix potential buffer overflow in parse_ivrs_acpihid (CVE-2025-37927)In the Linux kernel, the following vulnerability has been resolved:sch_htb: make htb_qlen_notify() idempotent (CVE-2025-37932)In the Linux kernel, the following vulnerability has been resolved:xenbus: Use kref to track req lifetime (CVE-2025-37949)In the Linux kernel, the following vulnerability has been resolved:module: ensure that kobject_put() is safe for module type kobjects (CVE-2025-37995)In the Linux kernel, the following vulnerability has been resolved:openvswitch: Fix unsafe attribute parsing in output_userspace() (CVE-2025-37998)In the Linux kernel, the following vulnerability has been resolved:sch_hfsc: Fix qlen accounting bug when using peek in hfsc_enqueue() (CVE-2025-38000)In the Linux kernel, the following vulnerability has been resolved:net_sched: hfsc: Address reentrant enqueue adding class to eltree twice (CVE-2025-38001)In the Linux kernel, the following vulnerability has been resolved:can: bcm: add locking for bcm_op runtime updates (CVE-2025-38004)'
