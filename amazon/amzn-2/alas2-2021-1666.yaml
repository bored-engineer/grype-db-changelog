Vulnerability:
    Description: A Cross-site Scripting (XSS) vulnerability was found in the python-lxml's clean module. The module's parser did not properly imitate browsers, causing different behaviors between the sanitizer and the user's page. This flaw allows a remote attacker to run arbitrary HTML/JS code. The highest threat from this vulnerability is to confidentiality and integrity. (CVE-2020-27783)
    FixedIn:
        - Available:
            Date: "2021-06-23"
            Kind: advisory
          Name: python-lxml
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.3
          VersionFormat: rpm
