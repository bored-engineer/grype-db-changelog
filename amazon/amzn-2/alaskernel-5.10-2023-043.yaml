# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: 'A race condition between two functions, lmLogClose() and txEnd(), in the Linux kernel''s JFS filesystem can lead to a use-after-free vulnerability and crash. (CVE-2023-3397)An issue was discovered in the Linux kernel before 6.5.9, exploitable by local users with userspace access to MMIO registers. Incorrect access checking in the #VC handler and instruction emulation of the SEV-ES emulation of MMIO accesses could lead to arbitrary write access to kernel memory (and thus privilege escalation). This depends on a race condition through which userspace can replace an instruction before the #VC handler reads it. (CVE-2023-46813)A heap out-of-bounds write vulnerability in the Linux kernel''s Linux Kernel Performance Events (perf) component can be exploited to achieve local privilege escalation.If perf_read_group() is called while an event''s sibling_list is smaller than its child''s sibling_list, it can increment or write to memory locations outside of the allocated buffer.We recommend upgrading past commit 32671e3799ca2e4590773fd0e63aaa4229e50c06. (CVE-2023-5717)'
