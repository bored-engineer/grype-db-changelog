Vulnerability:
    Description: 'An issue was discovered in zsh before 5.6. The beginning of a #! script file was mishandled, potentially leading to an execve call to a program named on the second line.(CVE-2018-0502)It was discovered that zsh does not properly validate the shebang of input files and it truncates it to the first 64 bytes. A local attacker may use this flaw to make zsh execute a different binary than what is expected, named with a substring of the shebang one.(CVE-2018-13259)'
    FixedIn:
        - Name: zsh
          NamespaceName: amzn:2
          Version: 5.5.1-2.amzn2.0.1
          VersionFormat: rpm
        - Name: zsh-debuginfo
          NamespaceName: amzn:2
          Version: 5.5.1-2.amzn2.0.1
          VersionFormat: rpm
        - Name: zsh-html
          NamespaceName: amzn:2
          Version: 5.5.1-2.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2018-1089.html
    Metadata:
        CVE:
            - Name: CVE-2018-0502
            - Name: CVE-2018-13259
    Name: ALAS-2018-1089
    NamespaceName: amzn:2
    Severity: Medium
