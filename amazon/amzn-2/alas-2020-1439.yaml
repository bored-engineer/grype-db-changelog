# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: In Zsh before 5.8, attackers able to execute commands can regain privileges dropped by the --no-PRIVILEGED option. Zsh fails to overwrite the saved uid, so the original privileges can be restored by executing MODULE_PATH=/dir/with/module zmodload with a module that calls setuid(). (CVE-2019-20044)
    FixedIn:
        - Name: zsh
          NamespaceName: amzn:2
          Version: 5.7.1-6.amzn2.0.1
          VersionFormat: rpm
        - Name: zsh-debuginfo
          NamespaceName: amzn:2
          Version: 5.7.1-6.amzn2.0.1
          VersionFormat: rpm
        - Name: zsh-html
          NamespaceName: amzn:2
          Version: 5.7.1-6.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2020-1439.html
    Metadata:
        CVE:
            - Name: CVE-2019-20044
    Name: ALAS-2020-1439
    NamespaceName: amzn:2
    Severity: High
