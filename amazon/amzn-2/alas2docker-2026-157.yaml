# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'Due to security concerns regarding a small set of intermediate certificates issued by a specific Certificate Authority (CA), the Go''s crypto/x509 package is updated to not trust certificates issued by the affected intermediate certificates. This would prevent possible future misuse of certificate issued by the affected intermediate certificates.Amazon Linux golang-based packages are being rebuilt with the fixed crypto/x509 package described in CVE-2026-111943 as a defense-in-depth measure against the eMudhra intermediate CA certificates with weak private keys.By default, Go programs on Amazon Linux use the system-wide certificate authority (CA) store. Therefore, the primary fix for this issue is the ca-certificates update that removes the root CA certificates that signed the affected intermediates. Customers should ensure that update is installed: https://explore.alas.aws.amazon.com/CVE-2026-113470.html (CVE-2026-111943)The `github.com/moby/sys/user` package provides Go utilities for parsing and looking up entries in Unix-style user and group database files. Versions before 0.4.1 do not sufficiently limit entries when parsing `/etc/passwd`- or `/etc/group`-style files, allowing an attacker who can supply a specially crafted file to cause excessive memory consumption and potentially terminate the affected process due to an out-of-memory condition. This issue is patched in version 0.4.1. As a workaround, avoid parsing attacker-controlled user or group database files, or validate and limit untrusted input before parsing it. (CVE-2026-61801)'
    FixedIn:
