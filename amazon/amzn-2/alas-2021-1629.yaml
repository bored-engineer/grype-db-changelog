Vulnerability:
    Description: A flaw was found in Nettle, where several Nettle signature verification functions (GOST DSA, EDDSA & ECDSA) result in the Elliptic Curve Cryptography point (ECC) multiply function being called with out-of-range scalers, possibly resulting in incorrect results. This flaw allows an attacker to force an invalid signature, causing an assertion failure or possible validation. The highest threat to this vulnerability is to confidentiality, integrity, as well as system availability. (CVE-2021-20305)
    FixedIn:
        - Name: nettle
          NamespaceName: amzn:2
          Version: 2.7.1-9.amzn2
          VersionFormat: rpm
        - Name: nettle-debuginfo
          NamespaceName: amzn:2
          Version: 2.7.1-9.amzn2
          VersionFormat: rpm
        - Name: nettle-devel
          NamespaceName: amzn:2
          Version: 2.7.1-9.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2021-1629.html
