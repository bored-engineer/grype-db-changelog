# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: python-ldap before 3.4.0 is vulnerable to a denial of service when ldap.schema is used for untrusted schema definitions, because of a regular expression denial of service (ReDoS) flaw in the LDAP schema parser. By sending crafted regex input, a remote authenticated attacker could exploit this vulnerability to cause a denial of service condition. (CVE-2021-46823)
    FixedIn:
        - Name: python-ldap
          NamespaceName: amzn:2
          Version: 2.4.15-2.amzn2.0.3
          VersionFormat: rpm
        - Name: python-ldap-debuginfo
          NamespaceName: amzn:2
          Version: 2.4.15-2.amzn2.0.3
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2024-2406.html
