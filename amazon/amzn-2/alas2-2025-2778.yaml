Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:net: relax socket state check at accept time. (CVE-2024-36484)In the Linux kernel, the following vulnerability has been resolved:bonding: Fix out-of-bounds read in bond_option_arp_ip_targets_set() (CVE-2024-39487)In the Linux kernel, the following vulnerability has been resolved:scsi: mpt3sas: Avoid test/set_bit() operating in non-allocated memory (CVE-2024-40901)In the Linux kernel, the following vulnerability has been resolved:ACPICA: Revert "ACPICA: avoid Info: mapping multiple BARs. Your kernel is fine." (CVE-2024-40984)In the Linux kernel, the following vulnerability has been resolved:drm/radeon: fix UBSAN warning in kv_dpm.c (CVE-2024-40988)In the Linux kernel, the following vulnerability has been resolved:filelock: Fix fcntl/close race recovery compat path (CVE-2024-41020)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix kernel bug on rename operation of broken directory (CVE-2024-41034)In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix duplicate endpoint bug by clearing reserved bits in the descriptor (CVE-2024-41035)In the Linux kernel, the following vulnerability has been resolved:hfsplus: fix uninit-value in copy_name (CVE-2024-41059)In the Linux kernel, the following vulnerability has been resolved:usb: atm: cxacru: fix endpoint checking in cxacru_bind() (CVE-2024-41097)In the Linux kernel, the following vulnerability has been resolved:ftruncate: pass a signed offset (CVE-2024-42084)In the Linux kernel, the following vulnerability has been resolved:nilfs2: add missing check for inode numbers on directory entries (CVE-2024-42104)In the Linux kernel, the following vulnerability has been resolved:bnx2x: Fix multiple UBSAN array-index-out-of-bounds (CVE-2024-42148)'
