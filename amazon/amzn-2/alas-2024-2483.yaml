# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: EDK2's Network Package is susceptible to an out-of-bounds readvulnerability when processing the IA_NA or IA_TA option in a DHCPv6 Advertise message. Thisvulnerability can be exploited by an attacker to gain unauthorizedaccess and potentially lead to a loss of Confidentiality. (CVE-2023-45229)EDK2's Network Package is susceptible to a buffer overflow vulnerability via a long server ID option in DHCPv6 client. Thisvulnerability can be exploited by an attacker to gain unauthorizedaccess and potentially lead to a loss of Confidentiality, Integrity and/or Availability. (CVE-2023-45230)EDK2's Network Package is susceptible to an out-of-bounds readvulnerability when processing  Neighbor Discovery Redirect message. Thisvulnerability can be exploited by an attacker to gain unauthorizedaccess and potentially lead to a loss of Confidentiality. (CVE-2023-45231)EDK2's Network Package is susceptible to an infinite loop vulnerability when parsing unknown options in the Destination Options header of IPv6. Thisvulnerability can be exploited by an attacker to gain unauthorizedaccess and potentially lead to a loss of Availability. (CVE-2023-45232)EDK2's Network Package is susceptible to an infinite lop vulnerability when parsing a PadN option in the Destination Options header of IPv6. Thisvulnerability can be exploited by an attacker to gain unauthorizedaccess and potentially lead to a loss of Availability. (CVE-2023-45233)EDK2's Network Package is susceptible to a buffer overflow vulnerability when processing DNS Servers option from a DHCPv6 Advertise message. Thisvulnerability can be exploited by an attacker to gain unauthorizedaccess and potentially lead to a loss of Confidentiality, Integrity and/or Availability. (CVE-2023-45234)EDK2's Network Package is susceptible to a buffer overflow vulnerability whenhandling Server ID optionfrom a DHCPv6 proxy Advertise message. Thisvulnerability can be exploited by an attacker to gain unauthorizedaccess and potentially lead to a loss of Confidentiality, Integrity and/or Availability. (CVE-2023-45235)Processing a maliciously formatted PKCS12 file may lead OpenSSL to crash leading to a potential Denial of Service attackThe package openssl098e is provided purely for binary compatibility with older Amazon Linux versions. It does not receive security updates. (CVE-2024-0727)
