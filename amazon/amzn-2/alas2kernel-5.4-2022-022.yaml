Vulnerability:
    Description: 'In the Linux kernel, the following vulnerability has been resolved:i40e: Fix queues reservation for XDP (CVE-2021-47619)A random memory access flaw was found in the Linux kernel''s GPU i915 kernel driver functionality in the way a user may run malicious code on the GPU. This flaw allows a local user to crash the system or escalate their privileges on the system. (CVE-2022-0330)The cgroup release_agent is called with call_usermodehelper. The function call_usermodehelper starts the release_agent with a full set of capabilities. Therefore require capabilities when setting the release_agent. (CVE-2022-0492)In the Linux kernel, the following vulnerability has been resolved:block: Fix wrong offset in bio_truncate() (CVE-2022-48747)In the Linux kernel, the following vulnerability has been resolved:phylib: fix potential use-after-free (CVE-2022-48754)In the Linux kernel, the following vulnerability has been resolved:net: fix information leakage in /proc/net/ptype (CVE-2022-48757)In the Linux kernel, the following vulnerability has been resolved:USB: core: Fix hang in usb_kill_urb by adding memory barriers (CVE-2022-48760)'
