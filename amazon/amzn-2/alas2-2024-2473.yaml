Vulnerability:
    Description: In sudo-1.8.23-10.amzn2.3.6 (Amazon Linux 2) and sudo-1.8.23-10.58.amzn1 (Amazon Linux 1), a user with an entry in the sudoers file, enabling them to run commands as another unprivileged user, can leverage it to run commands as root. No prior versions are affected. This issue has been fixed in sudo-1.8.23-10.amzn2.3.7 (AL2) and sudo-1.8.23-10.59.amzn1 (AL1). (CVE-2024-31969)
    FixedIn:
        - Name: sudo
          NamespaceName: amzn:2
          Version: 1.8.23-10.amzn2.3.7
          VersionFormat: rpm
        - Name: sudo-debuginfo
          NamespaceName: amzn:2
          Version: 1.8.23-10.amzn2.3.7
          VersionFormat: rpm
        - Name: sudo-devel
          NamespaceName: amzn:2
          Version: 1.8.23-10.amzn2.3.7
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2024-2473.html
    Metadata:
        CVE:
            - Name: CVE-2024-31969
    Name: ALAS2-2024-2473
    NamespaceName: amzn:2
    Severity: High
