Vulnerability:
    Description: A vulnerability was found in a previous version of mod_auth_mellon. An open redirect in the logout URL allows requests with backslashes to pass through by assuming that it is a relative URL, while the browsers silently convert backslash characters into forward slashes treating them as an absolute URL. This mismatch allows an attacker to bypass the redirect URL validation logic in apr_uri_parse function.(CVE-2019-3877)A vulnerability was found in mod_auth_mellon. If Apache is configured as a reverse proxy and mod_auth_mellon is configured to only let through authenticated users (with the require valid-user directive), adding special HTTP headers that are normally used to start the special SAML ECP (non-browser based) can be used to bypass authentication.(CVE-2019-3878)
    FixedIn:
        - Name: mod_auth_mellon
          NamespaceName: amzn:2
          Version: 0.14.0-2.amzn2.4
          VersionFormat: rpm
        - Name: mod_auth_mellon-debuginfo
          NamespaceName: amzn:2
          Version: 0.14.0-2.amzn2.4
          VersionFormat: rpm
        - Name: mod_auth_mellon-diagnostics
          NamespaceName: amzn:2
          Version: 0.14.0-2.amzn2.4
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2019-1200.html
    Metadata:
        CVE:
            - Name: CVE-2019-3877
            - Name: CVE-2019-3878
    Name: ALAS-2019-1200
