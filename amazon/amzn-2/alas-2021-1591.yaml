Vulnerability:
    Description: An access flaw was found in targetcli, where the `/etc/target` and underneath backup directory/files were world-readable. This flaw allows a local attacker to access potentially sensitive information such as authentication credentials from the /etc/target/saveconfig.json and backup files. The highest threat from this vulnerability is to confidentiality. (CVE-2020-13867)
    FixedIn:
        - Name: targetcli
          NamespaceName: amzn:2
          Version: 2.1.53-1.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2021-1591.html
    Metadata:
        CVE:
            - Name: CVE-2020-13867
    Name: ALAS-2021-1591
    NamespaceName: amzn:2
    Severity: Medium
