Vulnerability:
    Description: 'A race condition accessing file object in the Linux kernel OverlayFS subsystem was found in the way users do rename in specific way with OverlayFS. A local user could use this flaw to crash the system. (CVE-2021-20321)A flaw was found in the Linux kernel. A memory leak in the ccp-ops crypto driver can allow attackers to cause a denial of service. This vulnerability is similar with the older CVE-2019-18808. The highest threat from this vulnerability is to system availability. (CVE-2021-3744)A memory leak flaw was found in the Linux kernel''s ccp_run_aes_gcm_cmd() function that allows an attacker to cause a denial of service. The vulnerability is similar to the older CVE-2019-18808. The highest threat from this vulnerability is to system availability. (CVE-2021-3764)An out-of-bounds (OOB) memory write flaw was found in prealloc_elems_and_freelist in kernel/bpf/stackmap.c in the bpf in the Linux kernel. In this flaw, the multiplication to calculate the size could lead to an integer overflow which could allow a local attacker, with a special user privilege, to gain access to out-of-bounds memory leading to a system crash or a leak of internal kernel information. (CVE-2021-41864)In the Linux kernel, the following vulnerability has been resolved:binder: make sure fd closes complete (CVE-2021-47360)In the Linux kernel, the following vulnerability has been resolved:irqchip/gic-v3-its: Fix potential VPE leak on error (CVE-2021-47373)In the Linux kernel, the following vulnerability has been resolved:blktrace: Fix uaf in blk_trace access after removing by sysfs (CVE-2021-47375)In the Linux kernel, the following vulnerability has been resolved:bpf: Add oversize check before call kvcalloc() (CVE-2021-47376)In the Linux kernel, the following vulnerability has been resolved:blk-cgroup: fix UAF by grabbing blkcg lock before destroying blkg pd (CVE-2021-47379)In the Linux kernel, the following vulnerability has been resolved:tty: Fix out-of-bound vmalloc access in 