Vulnerability:
    Description: 'Perl versions through 5.45.1 have out-of-bounds heap reads and writes during regular expression matching via an undersized superlinear cache in S_regmatch.The regex engine''s superlinear cache holds one bit per subject position for each participating WHILEM node, so the bit count is the subject length plus one times the number of nodes. Nothing checks that product for positive overflow of the signed 32-bit count: a 286331153 byte subject matched against a pattern with 15 participating nodes stores the count as 14, leaving a two byte cache. The cache is then indexed from the real match position and node number, so reads go past the end of the allocation, and on failure CACHEsayNO sets a bit past it.A caller that matches an attacker controlled subject of this size against a pattern of this shape can crash the process or corrupt heap memory. (CVE-2026-15534)Perl versions from 5.9.4 before 5.41.9 produce incorrect regular expression match results when a stale failure flag ends the Aho-Corasick prescan early in S_find_byclass.The prescan walks the subject for positions where the full pattern could match, and the engine tries it from the leftmost one recorded. A failing transition sets the failed flag, and a later successful transition does not clear it, so the prescan reads the stale flag as a failure and stops before it can record a candidate that starts earlier. It takes a subject where one candidate is recorded and a later character then forces a fallback through a fail link that succeeds.Example:"ABCDE" =~ m/ABCF|BCDE|C/;    # matches C at offset 2, not BCDE"ABCDE" =~ m/ABCF|BCDE|C(G)/; # no match, BCDE missedAn alternation like this can miss input it should match, or match it on the wrong branch, so an access or filtering decision made from the result can be wrong. (CVE-2026-19487)'
