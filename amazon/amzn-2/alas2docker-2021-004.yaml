Vulnerability:
    Description: A flaw was discovered in the API endpoint behind the 'docker cp' command. The endpoint is vulnerable to a Time Of Check to Time Of Use (TOCTOU) vulnerability in the way it handles symbolic links inside a container. An attacker who has compromised an existing container can cause arbitrary files on the host filesystem to be read/written when an administrator tries to copy a file from/to the container. (CVE-2018-15664)
    FixedIn:
        - Name: docker
          NamespaceName: amzn:2
          Version: 18.06.1ce-10.amzn2
          VersionFormat: rpm
        - Name: docker-debuginfo
          NamespaceName: amzn:2
          Version: 18.06.1ce-10.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2DOCKER-2021-004.html
    Metadata:
        CVE:
            - Name: CVE-2018-15664
    Name: ALAS2DOCKER-2021-004
    NamespaceName: amzn:2
    Severity: High
