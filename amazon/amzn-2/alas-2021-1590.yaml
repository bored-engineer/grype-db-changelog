Vulnerability:
    Description: When sudo runs a command in shell mode, either via the -s or -i command line option, it escapes special characters in the command's arguments with a backslash. The sudoers policy plugin will then remove the escape characters from the arguments before evaluating the sudoers policy (which doesn't expect the escape characters) if the command is being run in shell mode. (CVE-2021-3156)
    FixedIn:
        - Name: sudo
          NamespaceName: amzn:2
          Version: 1.8.23-4.amzn2.2.1
          VersionFormat: rpm
        - Name: sudo-debuginfo
          NamespaceName: amzn:2
          Version: 1.8.23-4.amzn2.2.1
          VersionFormat: rpm
        - Name: sudo-devel
          NamespaceName: amzn:2
          Version: 1.8.23-4.amzn2.2.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2021-1590.html
