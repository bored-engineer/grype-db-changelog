# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A sandbox escape vulnerability was found in yelp, the GNOME help viewer. Bypassing the fix for CVE-2025-3155, a malicious help document can use a CSS stylesheet embedded in an SVG image to exfiltrate the contents of local files (such as files under /proc) to an external server without requiring JavaScript, evading the Content-Security-Policy protections added by the previous fix.
