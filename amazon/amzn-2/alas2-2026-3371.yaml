Vulnerability:
    Description: Due to an Improper Input Validation bug, Squid is vulnerable toa Heap-based Buffer Overflow attack against cache digests.This problem allows a trusted server to perform a Heap-basedBuffer Overflow when sending maliciously crafted replies tocache_digest request messages.This attack is limited to Squid instances that have beencompiled with the --enable-cache-digests option. (CVE-2026-50012)
