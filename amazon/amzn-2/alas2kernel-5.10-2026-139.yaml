aths and innvme_tcp_process_nvme_cqe(). The success test shifts req->status rightby one, because the driver keeps the wire value there and shifts it oncompletion, so the check must see what the completion path will see.Only REQ_OP_READ is checked, because there the length comes from thesectors the request covers; a passthrough command is built by itssubmitter, which picks both command and buffer, so the kernel hasnothing to compare against. (CVE-2026-89480)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: reject duplicate CREDS_VALUE options (CVE-2026-89539)In the Linux kernel, the following vulnerability has been resolved:SUNRPC: fix gssx_dec_option_array error path bugs (CVE-2026-89544)In the Linux kernel, the following vulnerability has been resolved:params: fix charp corruption on allocation failure (CVE-2026-89552)In the Linux kernel, the following vulnerability has been resolved:cifs: fix loff_t underflow in cifs_remap_file_range() when len == 0 (CVE-2026-89640)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix nfsd_file leak on inter-server COPY setup failure (CVE-2026-89680)In the Linux kernel, the following vulnerability has been resolved:nfsd: fix clock domain mismatch in clients_still_reclaiming() (CVE-2026-89685)In the Linux kernel, the following vulnerability has been resolved:nfsd: release path refs on follow_down() error (CVE-2026-89707)In the Linux kernel, the following vulnerability has been resolved:device property: fix infinite loop in fwnode_for_each_child_node() (CVE-2026-89744)In the Linux kernel, the following vulnerability has been resolved:KEYS: trusted: Fix TPM teardown ordering (CVE-2026-89763)In the Linux kernel, the following vulnerability has been resolved:scsi: qla2xxx: Quiesce response IRQ before freeing request queue (CVE-2026-89848)In the Linux kernel, the following vulnerability has been resolved:scsi: qla2xxx: Zero dport diagnostics buffer to avoid info leak (CVE-2026-89859)In the