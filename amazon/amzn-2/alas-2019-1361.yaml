# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: A NULL pointer dereference flaw was discovered in libvirt in the way it gets interface information through the QEMU agent. An attacker in a guest VM can use this flaw to crash libvirtd and cause a denial of service. (CVE-2019-3840)
