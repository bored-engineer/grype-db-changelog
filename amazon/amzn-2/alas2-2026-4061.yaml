Vulnerability:
    Description: A flaw was found in ImageMagick. A stack-based buffer overflow vulnerability exists in the handling of bzip2 compressed images, where stack memory can be overwritten during decoding. By submitting a specially crafted image, an attacker can exploit this issue to cause memory corruption or crash the application, resulting in a Denial of Service (DoS). (CVE-2026-116149)
