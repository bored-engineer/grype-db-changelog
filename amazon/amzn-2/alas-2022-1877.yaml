Vulnerability:
    Description: A vulnerability was found in expat. With this flaw, it is possible to create a situation in which parsing is suspended while substituting in an internal entity so that XML_ResumeParser directly uses the internalEntityProcessor as its processor. If the subsequent parse includes some unclosed tags, this will return without calling storeRawNames to ensure that the raw versions of the tag names are stored in memory other than the parse buffer itself. Issues occur if the parse buffer is changed or reallocated (for example, if processing a file line by line), problems occur. Using this vulnerability in the doContent function allows an attacker to triage a denial of service or potentially arbitrary code execution. (CVE-2022-40674)
    FixedIn:
        - Name: expat
          NamespaceName: amzn:2
          Version: 2.1.0-15.amzn2.0.1
          VersionFormat: rpm
        - Name: expat-debuginfo
          NamespaceName: amzn:2
          Version: 2.1.0-15.amzn2.0.1
          VersionFormat: rpm
        - Name: expat-devel
          NamespaceName: amzn:2
          Version: 2.1.0-15.amzn2.0.1
          VersionFormat: rpm
        - Name: expat-static
          NamespaceName: amzn:2
          Version: 2.1.0-15.amzn2.0.1
          VersionFormat: rpm
