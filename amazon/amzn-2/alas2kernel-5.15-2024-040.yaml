Vulnerability:
    Description: 'A flaw was found in the smb client in the Linux kernel. A potential out-of-bounds error was seen in the smb2_parse_contexts() function. Validate offsets and lengths before dereferencing create contexts in smb2_parse_contexts(). (CVE-2023-52434)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: disallow timeout for anonymous sets (CVE-2023-52620)In the Linux kernel, the following vulnerability has been resolved:fs/ntfs3: Add NULL ptr dereference checking at the end of attr_allocate_frame() (CVE-2023-52641)A null pointer dereference flaw was found in the hugetlbfs_fill_super function in the Linux kernel hugetlbfs (HugeTLB pages) functionality. This issue may allow a local user to crash the system or potentially escalate their privileges on the system. (CVE-2024-0841)A vulnerability was discovered in the Linux kernel''s IPv4 networking stack. Under certain conditions, MPTCP and NetLabel can be configured in a way that triggers a double free memory error in net/ipv4/af_inet.c:inet_sock_destruct(). This may lead to a system crash, denial of service, or potential arbitrary code execution. (CVE-2024-1627)In the Linux kernel, the following vulnerability has been resolved:ext4: regenerate buddy after block freeing failed if under fc replayThis mostly reverts commit 6bd97bf273bd ("ext4: remove redundantmb_regenerate_buddy()") and reintroduces mb_regenerate_buddy(). Based oncode in mb_free_blocks(), fast commit replay can end up marking as freeblocks that are already marked as such. This causes corruption of thebuddy bitmap so we need to regenerate it in that case. (CVE-2024-26601)In the Linux kernel, the following vulnerability has been resolved:x86/fpu: Stop relying on userspace for info to fault in xsave bufferBefore this change, the expected size of the user space buffer wastaken from fx_sw->xstate_size. fx_sw->xstate_size can be changedfrom user-space, so it is possible construct a sigreturn frame where:* fx_sw->xstate_size is smaller than the size required by valid bits infx_sw->xfeatures.* user-space unmaps parts of the sigrame fpu buffer so that not all ofthe buffer required by xrstor is accessible.In this case, xrstor tries to restore and accesses the unmapped areawhich results in a fault. But fault_in_readable succeeds because buf +fx_sw->xstate_size is within the still mapped area, so it goes back andtries xrstor again. It will spin in this loop forever.Instead, fault in the maximum size which can be touched by XRSTOR (takenfrom fpstate->user_size).[ dhansen: tweak subject / changelog ] (CVE-2024-26603)In the Linux kernel, the following vulnerability has been resolved:xhci: handle isoc Babble and Buffer Overrun events properly (CVE-2024-26659)In the Linux kernel, the following vulnerability has been resolved:fs,hugetlb: fix NULL pointer dereference in hugetlbs_fill_super (CVE-2024-26688)In the Linux kernel, the following vulnerability has been resolved:ipv6: sr: fix possible use-after-free and null-ptr-deref (CVE-2024-26735)In the Linux kernel, the following vulnerability has been resolved:af_unix: Drop oob_skb ref before purging queue in GC. (CVE-2024-26750)In the Linux kernel, the following vulnerability has been resolved:dm-crypt: don''t modify the data when using authenticated encryption (CVE-2024-26763)In the Linux kernel, the following vulnerability has been resolved:fs/aio: Restrict kiocb_set_cancel_fn() to I/O submitted via libaio (CVE-2024-26764)In the Linux kernel, the following vulnerability has been resolved:ext4: avoid allocating blocks from corrupted group in ext4_mb_find_by_goal() (CVE-2024-26772)In the Linux kernel, the following vulnerability has been resolved:ext4: avoid allocating blocks from corrupted group in ext4_mb_try_best_found() (CVE-2024-26773)In the Linux kernel, the following vulnerability has been resolved:ext4: avoid dividing by 0 in mb_update_avg_fragment_size() when block bitmap corrupt (CVE-2024-26774)In the Linux kernel, the following vulnerability has been resolved:mptcp: fix double-free on socket dismantle (CVE-2024-26782)In the Linux kernel, the following vulnerability has been resolved:btrfs: dev-replace: properly validate device names (CVE-2024-26791)In the Linux kernel, the following vulnerability has been resolved:gtp: fix use-after-free and null-ptr-deref in gtp_newlink() (CVE-2024-26793)In the Linux kernel, the following vulnerability has been resolved:fbcon: always restore the old font data in fbcon_do_set_font() (CVE-2024-26798)In the Linux kernel, the following vulnerability has been resolved:net: veth: clear GRO when clearing XDP even when down (CVE-2024-26803)In the Linux kernel, the following vulnerability has been resolved:net: ip_tunnel: prevent perpetual headroom growth (CVE-2024-26804)In the Linux kernel, the following vulnerability has been resolved:netlink: Fix kernel-infoleak-after-free in __skb_datagram_iter (CVE-2024-26805)In the Linux kernel, the following vulnerability has been resolved:hv_netvsc: Register VF in netvsc_probe if NET_DEVICE_REGISTER missed (CVE-2024-26820)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_tables: set dormant flag on hook register failure (CVE-2024-26835)In the Linux kernel, the following vulnerability has been resolved:cachefiles: fix memory leak in cachefiles_add_cache() (CVE-2024-26840)In the Linux kernel, the following vulnerability has been resolved:scsi: target: core: Add TMF to tmr_list handling (CVE-2024-26845)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_conntrack_h323: Add protection for bmp length out of range (CVE-2024-26851)In the Linux kernel, the following vulnerability has been resolved:geneve: make sure to pull inner header in geneve_rx() (CVE-2024-26857)In the Linux kernel, the following vulnerability has been resolved:net/rds: fix WARNING in rds_conn_connect_if_down (CVE-2024-27024)In the Linux kernel, the following vulnerability has been resolved:efi/capsule-loader: fix incorrect allocation size (CVE-2024-27413)In the Linux kernel, the following vulnerability has been resolved:netfilter: bridge: confirm multicast packets before passing them up the stack (CVE-2024-27415)In the Linux kernel, the following vulnerability has been resolved:ipv6: fix potential "struct net" leak in inet6_rtm_getaddr() (CVE-2024-27417)In the Linux kernel, the following vulnerability has been resolved:cpumap: Zero-initialise xdp_rxq_info struct before running XDP program (CVE-2024-27431)'
