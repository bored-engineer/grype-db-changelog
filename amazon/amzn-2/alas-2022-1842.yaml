# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: A flaw was found in hw. The APIC can operate in xAPIC mode (also known as a legacy mode), in which APIC configuration registers are exposed through a memory-mapped I/O (MMIO) page. This flaw allows an attacker who can execute code on a target CPU to query the APIC configuration page. When reading the APIC configuration page with an unaligned read from the MMIO page, the registers may return stale data from previous requests made by the same processor core to the same configuration page, leading to unauthorized access. (CVE-2022-21233)
    FixedIn:
        - Name: microcode_ctl
          NamespaceName: amzn:2
          Version: 2.1-47.amzn2.0.13
          VersionFormat: rpm
        - Name: microcode_ctl-debuginfo
          NamespaceName: amzn:2
          Version: 2.1-47.amzn2.0.13
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2022-1842.html
