# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: 'Vulnerability in the MySQL Connectors product of Oracle MySQL (component: Connector/J). Supported versions that are affected are 8.0.19 and prior and 5.1.48 and prior. Difficult to exploit vulnerability allows unauthenticated attacker with network access via multiple protocols to compromise MySQL Connectors. Successful attacks require human interaction from a person other than the attacker. Successful attacks of this vulnerability can result in unauthorized update, insert or delete access to some of MySQL Connectors accessible data as well as unauthorized read access to a subset of MySQL Connectors accessible data and unauthorized ability to cause a partial denial of service (partial DOS) of MySQL Connectors. (CVE-2020-2934)'
    FixedIn:
        - Name: mysql-connector-java
          NamespaceName: amzn:2
          Version: 5.1.25-3.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2023-2017.html
    Metadata:
        CVE:
            - Name: CVE-2020-2934
    Name: ALAS-2023-2017
    NamespaceName: amzn:2
    Severity: Medium
