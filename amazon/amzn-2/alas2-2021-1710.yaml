Vulnerability:
    Description: Update of ca-certificates to version 2021.2.50-72.amzn2.0.1 addresses the expiring IdentTrust DST Root CA X3, which affected some Let's Encrypt TLS certificates. The effect of the expiring certificate would be an inability of OpenSSL to validate impacted certificates issued by Let's Encrypt. Impacted customers may have experienced connection or certificate errors when attempting to connect to certain websites or APIs that use Let's Encrypt certificates.
    FixedIn:
        - Name: ca-certificates
          NamespaceName: amzn:2
          Version: 2021.2.50-72.amzn2.0.1
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS2-2021-1710.html
    Metadata:
        CVE: []
    Name: ALAS2-2021-1710
    NamespaceName: amzn:2
    Severity: High
