Vulnerability:
    Description: When doing NTLM authentication, the client sends replies tocryptographic challenges back to the server. These replieshave variable length. Winbind did not properly bounds-checkthe lan manager response length, which despite the lanmanager version no longer being used is still part of theprotocol.If the system is running Samba's ntlm_auth as authentication backendfor services like Squid (or a very unusual configuration withFreeRADIUS), the vulnarebility is remotely exploitableIf not so configured, or to exploit this vulnerability locally, theuser must have access to the privileged winbindd UNIX domainsocket (a subdirectory with name 'winbindd_privileged' under "statedirectory", as set in the smb.conf).This access is normally only given so special system services likeSquid or FreeRADIUS, that use this feature. (CVE-2022-2127)SMB client can truncate files to 0 bytes by opening files with OVERWRITE disposition when using the acl_xattr Samba VFS module with the smb.conf setting "acl_xattr:ignore system acls = yes" (CVE-2023-4091)
