    Description: 'In the Linux kernel, the following vulnerability has been resolved:netfilter: flowtable: fix stuck flows on cleanup due to pending work (CVE-2022-50000)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_socket: fix sk refcount leaks (CVE-2024-46855)In the Linux kernel, the following vulnerability has been resolved:mm: hugetlb: independent PMD page table shared count (CVE-2024-57883)In the Linux kernel, the following vulnerability has been resolved:net_sched: sch_sfq: don''t allow 1 packet limit (CVE-2024-57996)In the Linux kernel, the following vulnerability has been resolved:mm/huge_memory: fix dereferencing invalid pmd migration entry (CVE-2025-37958)In the Linux kernel, the following vulnerability has been resolved:arm64: bpf: Only mitigate cBPF programs loaded by unprivileged users (CVE-2025-37963)In the Linux kernel, the following vulnerability has been resolved:net_sched: prio: fix a race in prio_tune() (CVE-2025-38083)In the Linux kernel, the following vulnerability has been resolved:mm/hugetlb: unshare page tables during VMA split, not before (CVE-2025-38084)In the Linux kernel, the following vulnerability has been resolved:net: ch9200: fix uninitialised access during mii_nway_restart (CVE-2025-38086)In the Linux kernel, the following vulnerability has been resolved:x86/iopl: Cure TIF_IO_BITMAP inconsistencies (CVE-2025-38100)In the Linux kernel, the following vulnerability has been resolved:net_sched: ets: fix a race in ets_qdisc_change() (CVE-2025-38107)In the Linux kernel, the following vulnerability has been resolved:net_sched: red: fix a race in __red_change() (CVE-2025-38108)In the Linux kernel, the following vulnerability has been resolved:net/mdiobus: Fix potential out-of-bounds read/write access (CVE-2025-38111)In the Linux kernel, the following vulnerability has been resolved:net: Fix TOCTOU issue in sk_is_readable() (CVE-2025-38112)In the Linux kernel, the following vulnerability has been resolved:net_sched: sch_sfq: fix a potential crash on gso_skb handling (CVE-2025-38115)In the Linux kernel, the following vulnerability has been resolved:net: openvswitch: Fix the dead loop of MPLS parse (CVE-2025-38146)In the Linux kernel, the following vulnerability has been resolved:calipso: Don''t call calipso functions for AF_INET sk. (CVE-2025-38147)In the Linux kernel, the following vulnerability has been resolved:RDMA/mlx5: Fix error flow upon firmware failure for RQ destruction (CVE-2025-38161)In the Linux kernel, the following vulnerability has been resolved:exfat: fix double free in delayed_free (CVE-2025-38206)In the Linux kernel, the following vulnerability has been resolved:nfsd: Initialize ssc before laundromat_work to prevent NULL dereference (CVE-2025-38231)In the Linux kernel, the following vulnerability has been resolved:bpf: Fix WARN() in get_bpf_raw_tp_regs (CVE-2025-38285)In the Linux kernel, the following vulnerability has been resolved:fbdev: core: fbcvt: avoid division by 0 in fb_cvt_hperiod() (CVE-2025-38312)In the Linux kernel, the following vulnerability has been resolved:arm64/ptrace: Fix stack-out-of-bounds read in regs_get_kernel_stack_nth() (CVE-2025-38320)In the Linux kernel, the following vulnerability has been resolved:mpls: Use rcu_dereference_rtnl() in mpls_route_input_rcu(). (CVE-2025-38324)'
