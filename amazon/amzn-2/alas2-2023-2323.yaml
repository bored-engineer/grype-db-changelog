Vulnerability:
    Description: Potential PIN bypass.When the token/card was plugged into the computer and authenticated from one process, it could be used to provide cryptographic operations from different process when the empty, zero-length PIN and the token can track the login status using some of its internals. This is dangerous for OS logon/screen unlock and small tokens that are plugged permanently to the computer. (CVE-2023-40660)multiple memory issues with pkcs15-init (enrollment tool) (CVE-2023-40661)
