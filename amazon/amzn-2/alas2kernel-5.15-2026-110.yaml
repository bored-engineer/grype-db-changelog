    Description: 'In the Linux kernel, the following vulnerability has been resolved:nfsd: fix heap overflow in NFSv4.0 LOCK replay cache (CVE-2026-31402)In the Linux kernel, the following vulnerability has been resolved:ext4: validate p_idx bounds in ext4_ext_correct_indexes (CVE-2026-31449)In the Linux kernel, the following vulnerability has been resolved:net/packet: fix TOCTOU race on mmap''d vnet_hdr in tpacket_snd() (CVE-2026-31700)In the Linux kernel, the following vulnerability has been resolved:smb: client: fix OOB read in smb2_ioctl_query_info QUERY_INFO path (CVE-2026-31708)In the Linux kernel, the following vulnerability has been resolved:smb: client: validate the whole DACL before rewriting it in cifsacl (CVE-2026-31709)In the Linux kernel, the following vulnerability has been resolved:net/ipv6: ioam6: prevent schema length wraparound in trace fill (CVE-2026-43341)In the Linux kernel, the following vulnerability has been resolved:smb: client: require a full NFS mode SID before reading mode bits (CVE-2026-43350)In the Linux kernel, the following vulnerability has been resolved:net/tcp-md5: Fix MAC comparison to be constant-time (CVE-2026-43383)In the Linux kernel, the following vulnerability has been resolved:lib/crypto: mpi: Fix integer underflow in mpi_read_raw_from_sgl() (CVE-2026-43492)In the Linux kernel, the following vulnerability has been resolved:ipvs: skip ipv6 extension headers for csum checks (CVE-2026-45850)In the Linux kernel, the following vulnerability has been resolved:udf: fix partition descriptor append bookkeeping (CVE-2026-45991)In the Linux kernel, the following vulnerability has been resolved:thermal: core: Fix thermal zone governor cleanup issues (CVE-2026-46021)In the Linux kernel, the following vulnerability has been resolved:ceph: only d_add() negative dentries when they are unhashed (CVE-2026-46052)In the Linux kernel, the following vulnerability has been resolved:fbdev: defio: Disconnect deferred I/O from the lifetime of struc