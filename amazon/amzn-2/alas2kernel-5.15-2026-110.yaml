on to the valid ID range (CVE-2026-52923)In the Linux kernel, the following vulnerability has been resolved:sctp: purge outqueue on stale COOKIE-ECHO handling (CVE-2026-52924)In the Linux kernel, the following vulnerability has been resolved:netfilter: ebtables: fix OOB read in compat_mtw_from_user (CVE-2026-52927)In the Linux kernel, the following vulnerability has been resolved:sctp: stream: fully roll back denied add-stream state (CVE-2026-52929)In the Linux kernel, the following vulnerability has been resolved:ipc/shm: serialize orphan cleanup with shm_nattch updates (CVE-2026-52930)In the Linux kernel, the following vulnerability has been resolved:io_uring/poll: fix signed comparison in io_poll_get_ownership() (CVE-2026-52933)In the Linux kernel, the following vulnerability has been resolved:netfilter: nf_log: validate MAC header was set before dumping it (CVE-2026-52942)In the Linux kernel, the following vulnerability has been resolved:net: skbuff: fix missing zerocopy reference in pskb_carve helpers (CVE-2026-52943)In the Linux kernel, the following vulnerability has been resolved:fs/fcntl: fix SOFTIRQ-unsafe lock order in fasync signaling (CVE-2026-52946)In the Linux kernel, the following vulnerability has been resolved:netfilter: require Ethernet MAC header before using eth_hdr() (CVE-2026-53131)In the Linux kernel, the following vulnerability has been resolved:RDMA/umem: Fix truncation for block sizes >= 4G (CVE-2026-53133)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_fib: fix stale stack leak via the OIFNAME register (CVE-2026-53134)In the Linux kernel, the following vulnerability has been resolved:fuse: reject fuse_notify() pagecache ops on directories (CVE-2026-53168)In the Linux kernel, the following vulnerability has been resolved:mm/huge_memory: update file PMD counter before folio_put() (CVE-2026-53189)In the Linux kernel, the following vulnerability has been resolved:hv_netvsc: use kmap_local_page in netvsc_copy_to_send_buf (CVE-2026-53199)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_tunnel: fix use-after-free on object destroy (CVE-2026-53212)In the Linux kernel, the following vulnerability has been resolved:netfilter: nft_exthdr: fix register tracking for F_PRESENT flag (CVE-2026-53218)In the Linux kernel, the following vulnerability has been resolved:netfilter: x_tables: avoid leaking percpu counter pointers (CVE-2026-53219)In the Linux kernel, the following vulnerability has been resolved:ip6_vti: fix incorrect tunnel matching in vti6_tnl_lookup() (CVE-2026-53221)In the Linux kernel, the following vulnerability has been resolved:net: guard timestamp cmsgs to real error queue skbs (CVE-2026-53223)In the Linux kernel, the following vulnerability has been resolved:sctp: fix uninit-value in __sctp_rcv_asconf_lookup() (CVE-2026-53225)In the Linux kernel, the following vulnerability has been resolved:net: openvswitch: fix possible kfree_skb of ERR_PTR (CVE-2026-53227)In the Linux kernel, the following vulnerability has been resolved:ipv6: sit: reload inner IPv6 header after GSO offloads (CVE-2026-53228)In the Linux kernel, the following vulnerability has been resolved:netlabel: validate unlabeled address and mask attribute lengths (CVE-2026-53238)In the Linux kernel, the following vulnerability has been resolved:xfrm: policy: fix use-after-free on inexact bin in xfrm_policy_bysel_ctx() (CVE-2026-53239)In the Linux kernel, the following vulnerability has been resolved:net/802/mrp: fix vector attribute parsing in mrp_pdu_parse_vecattr (CVE-2026-53245)In the Linux kernel, the following vulnerability has been resolved:ipv4: restrict IPOPT_SSRR and IPOPT_LSRR options (CVE-2026-53249)In the Linux kernel, the following vulnerability has been resolved:net/sched: act_api: use RCU with deferred freeing for action lifecycle (CVE-2026-53264)In the Linux kernel, the following vulnerability has been resolved:netfilter: bridge: make ebt_snat ARP rewrite writable (CVE-2026-53266)In the Linux kernel, the following vulnerability has been resolved:netfilter: conntrack_irc: fix possible out-of-bounds read (CVE-2026-53268)In the Linux kernel, the following vulnerability has been resolved:netfilter: synproxy: add mutex to guard hook reference counting (CVE-2026-53269)In the Linux kernel, the following vulnerability has been resolved:ipvs: clear the svc scheduler ptr early on edit (CVE-2026-53270)In the Linux kernel, the following vulnerability has been resolved:ipv6: mcast: Fix use-after-free when processing MLD queries (CVE-2026-53275)In the Linux kernel, the following vulnerability has been resolved:net: bonding: fix NULL pointer dereference in bond_do_ioctl()In bond_do_ioctl(), slave_dev is obtained via __dev_get_by_name() whichcan return NULL if the requested interface name does not exist. However,the subsequent slave_dbg() call is placed before the NULL check:slave_dev = __dev_get_by_name(net, ifr->ifr_slave);slave_dbg(bond_dev, slave_dev, "slave_dev=%p:\n", slave_dev); //hereif (!slave_dev)return -ENODEV;The slave_dbg() macro expands to netdev_dbg(bond_dev, "(slave %s): " fmt,(slave_dev)->name, ...) which unconditionally dereferences slave_dev->namebefore the NULL check is performed. This results in a NULL pointerdereference kernel oops when a user calls bonding ioctl (e.g.SIOCBONDENSLAVE, SIOCBONDRELEASE, etc.) with a non-existent slaveinterface name.This is reachable from userspace via the bonding ioctl interface withCAP_NET_ADMIN capability, making it a potential local denial-of-servicevector.Fix by moving the slave_dbg() call after the NULL check. (CVE-2026-53337)In the Linux kernel, the following vulnerability has been resolved:signal: clear JOBCTL_PENDING_MASK for caller in zap_other_threads()When a multi-threaded process receives a stop signal (e.g., SIGSTOP),do_signal_stop() sets JOBCTL_STOP_PENDING and JOBCTL_STOP_CONSUME on allthreads and sets signal->group_stop_count to the number of threads. Ifone of the threads concurrently calls execve(), de_thread() invokeszap_other_threads() to kill all other threads. zap_other_threads()aborts the pending group stop by resetting signal->group_stop_count to 0and clears the JOBCTL_PENDING_MASK for all other threads. However, itfails to clear the job control flags for the calling thread.When execve() completes, the calling thread returns to user mode andchecks for pending signals. Seeing the stale JOBCTL_STOP_PENDING flag,it calls do_signal_stop(), which invokes task_participate_group_stop().Since JOBCTL_STOP_CONSUME is still set, it attempts to decrement thealready-zero signal->group_stop_count, triggering a warning:sig->group_stop_count == 0WARNING: CPU: 1 PID: 6475 at kernel/signal.c:373task_participate_group_stop+0x215/0x2d0Call Trace:<TASK>do_signal_stop+0x3be/0x5c0 kernel/signal.c:2619get_signal+0xa8c/0x1330 kernel/signal.c:2884arch_do_signal_or_restart+0xbc/0x840 arch/x86/kernel/signal.c:337exit_to_user_mode_loop+0x8c/0x4d0 kernel/entry/common.c:98do_syscall_64+0x33e/0xf80 arch/x86/entry/syscall_64.c:100entry_SYSCALL_64_after_hwframe+0x77/0x7f</TASK>Fix this race condition by clearing the JOBCTL_PENDING_MASK for thecalling thread in zap_other_threads(), ensuring it does not retain anystale job control state after the thread group is destroyed. This alignswith other functions that tear down a thread group and abort groupstops, such as zap_process() and complete_signal(), which correctlyclear these flags for all threads including the current one. (CVE-2026-53352)In the Linux kernel, the following vulnerability has been resolved:arm64: errata: Mitigate TLBI errata on various Arm CPUsA number of CPUs developed by Arm suffer from errata whereby a broadcastTLBI;DSB sequence may complete before the global observation of writeswhich are translated by an affected TLB entry.These errata ONLY affect the completion of memory accesses which havebeen translated by an invalidated TLB entry, and these errata DO NOTaffect the actual invalidation of TLB entries. TLB entries are removedcorrectly.This issue has been assigned CVE ID CVE-2025-10263.To mitigate this issue, Arm recommends that software follows anyaffected TLBI;DSB sequence with an additional TLBI;DSB, which willensure that all memory write effects affected by the first TLBI havebeen globally observed. The additional TLBI can use any operation thatis broadcast to affected CPUs, and the additional DSB can use any optionthat is sufficient to complete the additional TLBI.The ARM64_WORKAROUND_REPEAT_TLBI workaround is sufficient to mitigatethe issue. Enable this workaround for affected CPUs, and update thesilicon errata documentation accordingly.Note that due to the manner in which Arm develops IP and tracks errata,some CPUs share a common erratum number. (CVE-2026-53354)In the Linux kernel, the following vulnerability has been resolved:drm/i915/gem: Fix phys BO pread/pwrite with offset (CVE-2026-53356)'
