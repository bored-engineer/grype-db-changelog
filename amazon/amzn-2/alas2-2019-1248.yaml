# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: 'A heap buffer overflow issue was found in the load_device_tree() function of QEMU, which is invoked to load a device tree blob at boot time. It occurs due to device tree size manipulation before buffer allocation, which could overflow a signed int type. A user/process could use this flaw to potentially execute arbitrary code on a host system with privileges of the QEMU process. (CVE-2018-20815)hw/sparc64/sun4u.c in QEMU 3.1.50 is vulnerable to a NULL pointer dereference, which allows the attacker to cause a denial of service via a device driver. (CVE-2019-5008)Slirp: information leakage in tcp_emu() due to uninitialized stack variables (CVE-2019-9824)qxl: null pointer dereference while releasing spice resources (CVE-2019-12155)'
