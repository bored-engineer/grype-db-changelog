# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: This update adds the checkHost option to stunnel, which verifies the host of the peer certificate subject. Certificates are accepted if no checkHost option was specified, or the host name of the peer certificate matches any of the hosts specified with checkHost.This update adds the OCSPaia option to stunnel, which enables stunnel to validate certificates with the list of OCSP responder URLs retrieved from their AIA (Authority Information Access) extension.This update adds the verify option to stunnel, which verifies the peer certificate.  The different verification levels are as follows:level 0 - request and ignore the peer certificatelevel 1 - verify the peer certificate if presentlevel 2 - verify the peer certificatelevel 3 - verify the peer against a locally installed certificatelevel 4 - ignore the chain and only verify the peer certificatedefault - no verifyCertificates for verification needs to be stored either in the file specified with CAfile, or in the directory specified with CApath.This update enables amazon-efs-utils to use new features added to stunnel to encrypt data in transit to EFS
    FixedIn:
