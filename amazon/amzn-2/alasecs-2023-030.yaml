# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: A flaw was found in containerd. Access controls for the shim API socket verified that a connecting process had an effective UID of 0, but otherwise did not restrict access to the abstract Unix domain socket. This could allow malicious containers running in the same network namespace as the shim, with an effective UID of 0 but otherwise reduced privileges, to cause new processes to be run with elevated privileges. The highest threat from this vulnerability is to data confidentiality and integrity as well as system availability. (CVE-2020-15257)
    FixedIn:
        - Name: containerd
          NamespaceName: amzn:2
          Version: 1.4.1-2.amzn2
          VersionFormat: rpm
        - Name: containerd-debuginfo
          NamespaceName: amzn:2
          Version: 1.4.1-2.amzn2
          VersionFormat: rpm
        - Name: containerd-stress
          NamespaceName: amzn:2
          Version: 1.4.1-2.amzn2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASECS-2023-030.html
    Metadata:
        CVE:
            - Name: CVE-2020-15257
    Name: ALASECS-2023-030
    NamespaceName: amzn:2
    Severity: Medium
