# schema: vulnerability/os/schema-1.0.2.json
Vulnerability:
    Description: In CISOfy Lynis 2.x through 2.7.5, the license key can be obtained by looking at the process list when a data upload is being performed. This license can be used to upload data to a central Lynis server. Although no data can be extracted by knowing the license key, it may be possible to upload the data of additional scans. (CVE-2019-13033)CISOfy Lynis before 3.0.0 has Incorrect Access Control because of a TOCTOU race condition. The routine to check the log and report file permissions was not working as intended and could be bypassed locally. Because of the race, an unprivileged attacker can set up a log and report file, and control that up to the point where the specific routine is doing its check. After that, the file can be removed, recreated, and used for additional attacks. (CVE-2020-13882)
    FixedIn:
        - Name: lynis
          NamespaceName: amzn:2
          Version: 3.0.0-1.amzn2.0.2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALASLYNIS-2023-001.html
    Metadata:
        CVE:
            - Name: CVE-2019-13033
            - Name: CVE-2020-13882
    Name: ALASLYNIS-2023-001
    NamespaceName: amzn:2
    Severity: Medium
