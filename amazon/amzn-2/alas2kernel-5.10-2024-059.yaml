Vulnerability:
    Description: 'An issue was discovered in arch/x86/kvm/vmx/nested.c in the Linux kernel before 6.2.8. nVMX on x86_64 lacks consistency checks for CR0 and CR4. (CVE-2023-30456)In the Linux kernel, the following vulnerability has been resolved:ftrace: Fix invalid address access in lookup_rec() when index is 0 (CVE-2023-53075)In the Linux kernel, the following vulnerability has been resolved:ext4: fix task hung in ext4_xattr_delete_inode (CVE-2023-53089)In the Linux kernel, the following vulnerability has been resolved:ext4: fix WARNING in ext4_update_inline_data (CVE-2023-53100)In the Linux kernel, the following vulnerability has been resolved:ext4: zero i_disksize when initializing the bootloader inode (CVE-2023-53101)In the Linux kernel, the following vulnerability has been resolved:net: tunnels: annotate lockless accesses to dev->needed_headroom (CVE-2023-53109)In the Linux kernel, the following vulnerability has been resolved:scsi: core: Remove the /proc/scsi/${proc_name} directory earlier (CVE-2023-53140)'
