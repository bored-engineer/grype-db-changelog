# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A use-after-free vulnerability was found in __nfs42_ssc_open() in fs/nfs/nfs4file.c in the Linux kernel. This flaw allows an attacker to conduct a remote denial of service. (CVE-2022-4379)In the Linux kernel, the following vulnerability has been resolved:gfs2: Always check inode size of inline inodes (CVE-2022-49739)A use-after-free flaw was found in btrfs_search_slot in fs/btrfs/ctree.c in btrfs in the Linux Kernel.This flaw allows an attacker to crash the system and possibly cause a kernel information lea (CVE-2023-1611)An out-of-bounds write vulnerability was found in the Linux kernel''s SLIMpro I2C device driver. The userspace "data->block[0]" variable was not capped to a number between 0-255 and was used as the size of a memcpy, possibly writing beyond the end of dma_buffer. This flaw could allow a local privileged user to crash the system or potentially achieve code execution. (CVE-2023-2194)do_tls_getsockopt in net/tls/tls_main.c in the Linux kernel through 6.2.6 lacks a lock_sock call, leading to a race condition (with a resultant use-after-free or NULL pointer dereference). (CVE-2023-28466)The Linux kernel before 6.2.9 has a race condition and resultant use-after-free in drivers/net/ethernet/qualcomm/emac/emac.c if a physically proximate attacker unplugs an emac based device. (CVE-2023-33203)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix kernel-infoleak in nilfs_ioctl_wrap_copy() (CVE-2023-53035)In the Linux kernel, the following vulnerability has been resolved:dm crypt: add cond_resched() to dmcrypt_write() (CVE-2023-53051)In the Linux kernel, the following vulnerability has been resolved:erspan: do not use skb_mac_header() in ndo_start_xmit() (CVE-2023-53053)In the Linux kernel, the following vulnerability has been resolved:net/mlx5: E-Switch, Fix an Oops in error handling code (CVE-2023-53058)In the Linux kernel, the following vulnerability has been resolved:qed/qed_sriov: guard against NULL derefs from qed_iov_get_vf_info (CVE-2023-53066)In the Linux kernel, the following vulnerability has been resolved:net/mlx5: Fix steering rules cleanup (CVE-2023-53079)In the Linux kernel, the following vulnerability has been resolved:xsk: Add missing overflow check in xdp_umem_reg (CVE-2023-53080)'
