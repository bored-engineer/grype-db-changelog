Vulnerability:
    Description: 'Product: AndroidVersions: Android kernelAndroid ID: A-224546354References: Upstream kernel (CVE-2022-20368)A buffer overflow flaw was found in the Linux kernel''s NFC protocol functionality. This flaw allows a local user to crash or escalate their privileges on the system. (CVE-2022-26490)A heap buffer overflow flaw was found in IPsec ESP transformation code in net/ipv4/esp4.c and net/ipv6/esp6.c. This flaw allows a local attacker with a normal user privilege to overwrite kernel heap objects and may cause a local privilege escalation threat. (CVE-2022-27666)In the Linux kernel before 5.17.1, a refcount leak bug was found in net/llc/af_llc.c. (CVE-2022-28356)In the Linux kernel, the following vulnerability has been resolved:usb: usbtmc: Fix bug in pipe direction for control transfers (CVE-2022-48834)In the Linux kernel, the following vulnerability has been resolved:net/packet: fix slab-out-of-bounds access in packet_recvmsg() (CVE-2022-48839)In the Linux kernel, the following vulnerability has been resolved:tpm: use try_get_ops() in tpm-space.c (CVE-2022-49286)'
