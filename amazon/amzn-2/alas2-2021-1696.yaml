# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'A flaw was found in the Linux kernel, where a BPF program can obtain sensitive information from kernel memory via a Speculative Store Bypass side-channel attack. This issue occurs when the protection mechanism neglects the possibility of uninitialized memory locations on the BPF stack. The highest threat from this vulnerability is to confidentiality. (CVE-2021-34556)A flaw in the Linux kernel allows a privileged BPF program to obtain sensitive information from kernel memory via a Speculative Store Bypass side-channel in the eBPF subsystem (CVE-2021-35477)A vulnerability was found in the Linux kernel. Missing size validations on inbound SCTP packets may allow the kernel to read uninitialized memory. (CVE-2021-3655)In the Linux kernel, the following vulnerability has been resolved:igb: Fix use-after-free error during reset (CVE-2021-47301)In the Linux kernel, the following vulnerability has been resolved:dma-buf/sync_file: Don''t leak fences on merge failure (CVE-2021-47305)In the Linux kernel, the following vulnerability has been resolved:scsi: libfc: Fix array index out of bound exception (CVE-2021-47308)In the Linux kernel, the following vulnerability has been resolved:net: validate lwtstate->data before returning from skb_tunnel_info() (CVE-2021-47309)In the Linux kernel, the following vulnerability has been resolved:net: qcom/emac: fix UAF in emac_remove (CVE-2021-47311)In the Linux kernel, the following vulnerability has been resolved:virtio-blk: Fix memory leak among suspend/resume procedure (CVE-2021-47319)In the Linux kernel, the following vulnerability has been resolved:nfs: fix acl memory leak of posix_acl_create() (CVE-2021-47320)In the Linux kernel, the following vulnerability has been resolved:jfs: fix GPF in diFree (CVE-2021-47340)In the Linux kernel, the following vulnerability has been resolved:dm btree remove: assign new_root only when removal succeeds (CVE-2021-47343)In the Linux kernel, the following vulnerability has been resolved:RDMA/cma: Fix rdma_resolve_route() memory leak (CVE-2021-47345)In the Linux kernel, the following vulnerability has been resolved:udf: Fix NULL pointer dereference in udf_symlink function (CVE-2021-47353)An issue was discovered in the Linux kernel before 5.13.3. lib/seq_buf.c has a seq_buf_putmem_hex buffer overflow. (CVE-2023-28772)'
