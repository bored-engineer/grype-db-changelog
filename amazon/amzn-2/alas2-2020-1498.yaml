# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: A flaw was found in nmcli, where the command-line interface to the NetworkManager did not accept the 802-1x.ca-path and 802-1x.phase2-ca-path settings when creating a new profile. When a user connects to a network using this profile, the authentication does not happen and an insecure connection occurs. (CVE-2020-10754)
