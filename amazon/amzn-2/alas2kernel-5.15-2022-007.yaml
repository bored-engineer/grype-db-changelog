Vulnerability:
    Description: 'An out-of-bounds read flaw was found in the Linux kernel''s TeleTYpe subsystem. The issue occurs in how a user triggers a race condition using ioctls TIOCSPTLCK and TIOCGPTPEER and TIOCSTI and TCXONC with leakage of memory in the flush_to_ldisc function. This flaw allows a local user to crash the system or read unauthorized random data from memory. (CVE-2022-1462)A bug in the IMA subsystem was discovered which would incorrectly allow kexec to be used when kernel lockdown was enabled (CVE-2022-21505)An issue was discovered in the Linux kernel through 5.18.14. xfrm_expand_policies in net/xfrm/xfrm_policy.c can cause a refcount to be dropped twice. (CVE-2022-36879)A memory corruption flaw was found in the Linux kernel''s Netfilter subsystem in the way a local user uses the libnetfilter_queue when analyzing a corrupted network packet. This flaw allows a local user to crash the system or a remote user to crash the system when the libnetfilter_queue is used by a local user. (CVE-2022-36946)In the Linux kernel, the following vulnerability has been resolved:mm/mempolicy: fix uninit-value in mpol_rebind_policy() (CVE-2022-49567)In the Linux kernel, the following vulnerability has been resolved:KVM: Don''t null dereference ops->destroy (CVE-2022-49568)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_max_reordering. (CVE-2022-49571)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_slow_start_after_idle. (CVE-2022-49572)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_early_retrans. (CVE-2022-49573)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_recovery. (CVE-2022-49574)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_thin_linear_timeouts. (CVE-2022-49575)In the Linux kernel, the following vulnerability has been resolved:ipv4: Fix data-races around sysctl_fib_multipath_hash_fields. (CVE-2022-49576)In the Linux kernel, the following vulnerability has been resolved:udp: Fix a data-race around sysctl_udp_l3mdev_accept. (CVE-2022-49577)In the Linux kernel, the following vulnerability has been resolved:ip: Fix data-races around sysctl_ip_prot_sock. (CVE-2022-49578)In the Linux kernel, the following vulnerability has been resolved:ipv4: Fix data-races around sysctl_fib_multipath_hash_policy. (CVE-2022-49579)In the Linux kernel, the following vulnerability has been resolved:ipv4: Fix a data-race around sysctl_fib_multipath_use_neigh. (CVE-2022-49580)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_fastopen_blackhole_timeout. (CVE-2022-49585)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_fastopen. (CVE-2022-49586)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_notsent_lowat. (CVE-2022-49587)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_migrate_req. (CVE-2022-49588)In the Linux kernel, the following vulnerability has been resolved:igmp: Fix data-races around sysctl_igmp_qrv. (CVE-2022-49589)In the Linux kernel, the following vulnerability has been resolved:igmp: Fix data-races around sysctl_igmp_llm_reports. (CVE-2022-49590)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_probe_interval. (CVE-2022-49593)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_mtu_probe_floor. (CVE-2022-49594)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_probe_threshold. (CVE-2022-49595)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_min_snd_mss. (CVE-2022-49596)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_base_mss. (CVE-2022-49597)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_mtu_probing. (CVE-2022-49598)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_l3mdev_accept. (CVE-2022-49599)In the Linux kernel, the following vulnerability has been resolved:ip: Fix a data-race around sysctl_ip_autobind_reuse. (CVE-2022-49600)In the Linux kernel, the following vulnerability has been resolved:tcp/dccp: Fix a data-race around sysctl_tcp_fwmark_accept. (CVE-2022-49601)In the Linux kernel, the following vulnerability has been resolved:ip: Fix a data-race around sysctl_fwmark_reflect. (CVE-2022-49602)In the Linux kernel, the following vulnerability has been resolved:ip: Fix data-races around sysctl_ip_fwd_update_priority. (CVE-2022-49603)In the Linux kernel, the following vulnerability has been resolved:ip: Fix data-races around sysctl_ip_fwd_use_pmtu. (CVE-2022-49604)In the Linux kernel, the following vulnerability has been resolved:perf/core: Fix data race between perf_event_set_output() and perf_mmap_close() (CVE-2022-49607)In the Linux kernel, the following vulnerability has been resolved:pinctrl: ralink: Check for null return of devm_kcalloc (CVE-2022-49608)A NULL pointer dereference issue was found in the SCTP network protocol in net/sctp/stream_sched.c in the Linux kernel. If stream_in allocation fails, stream_out is freed, which would be accessed further. This flaw allows a local user to crash the system or potentially cause a denial of service. (CVE-2023-2177)'
