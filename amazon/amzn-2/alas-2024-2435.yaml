Vulnerability:
    Description: A vulnerability was found in Linux PAM. An unprivileged user that is not yet in a corresponding mount namespace with ~/tmp mounted as a polyinstantiated dir can place a FIFO there, and a subsequent attempt to login as this user with `pam_namespace` configured will cause the `openat()` in `protect_dir()` to block the attempt, causing a local denial of service. (CVE-2024-22365)
    FixedIn:
        - Name: pam
          NamespaceName: amzn:2
          Version: 1.1.8-23.amzn2.0.2
          VersionFormat: rpm
        - Name: pam-debuginfo
          NamespaceName: amzn:2
          Version: 1.1.8-23.amzn2.0.2
          VersionFormat: rpm
        - Name: pam-devel
          NamespaceName: amzn:2
          Version: 1.1.8-23.amzn2.0.2
          VersionFormat: rpm
    Link: https://alas.aws.amazon.com/AL2/ALAS-2024-2435.html
