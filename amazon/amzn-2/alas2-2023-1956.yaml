          Version: 3.2.1-4.amzn2.0.4
          VersionFormat: rpm
        - Available:
            Date: "2023-02-21"
            Kind: advisory
          Name: python-lxml-docs
          NamespaceName: amzn:2
          Version: 3.2.1-4.amzn2.0.4
          VersionFormat: rpm
