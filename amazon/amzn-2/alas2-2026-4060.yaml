# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: An attacker able to supply a crafted XML document to an application using QXmlStreamReader can cause disproportionate CPU consumption during parsing, making the application unresponsive (denial of service). Exploitation requires only that the application parse attacker-influenced XML; no authentication, privileges, or user interaction beyond ingesting the input are needed. There is no loss of confidentiality or integrity -- no data disclosure, data modification, or code execution -- and the impact is contained to the affected process. (CVE-2026-16762)
