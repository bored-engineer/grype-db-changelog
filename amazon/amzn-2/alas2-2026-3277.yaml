Vulnerability:
    Description: In Eclipse Jetty, the class JASPIAuthenticator initiates the authentication checks, which set two ThreadLocal variable.Upon returning from the initial checks, there are conditions that cause an early return from the JASPIAuthenticator code without clearing those ThreadLocals.A subsequent request using the same thread inherits the ThreadLocal values, leading to a broken access control and privilege escalation. (CVE-2026-5795)
