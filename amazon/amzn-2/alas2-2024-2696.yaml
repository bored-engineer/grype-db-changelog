    Description: 'In the Linux kernel, the following vulnerability has been resolved:ipv6: prevent UAF in ip6_send_skb() (CVE-2024-44987)In the Linux kernel, the following vulnerability has been resolved:VMCI: Fix use-after-free when removing resource in vmci_resource_remove() (CVE-2024-46738)In the Linux kernel, the following vulnerability has been resolved:of/irq: Prevent device address out-of-bounds read in interrupt map walk (CVE-2024-46743)In the Linux kernel, the following vulnerability has been resolved:Squashfs: sanity check symbolic link size (CVE-2024-46744)In the Linux kernel, the following vulnerability has been resolved:Input: uinput - reject requests with unreasonable number of slots (CVE-2024-46745)In the Linux kernel, the following vulnerability has been resolved:PCI: Add missing bridge lock to pci_bus_lock() (CVE-2024-46750)In the Linux kernel, the following vulnerability has been resolved:hwmon: (adc128d818) Fix underflows seen when writing limit attributes (CVE-2024-46759)In the Linux kernel, the following vulnerability has been resolved:nilfs2: protect references to superblock parameters exposed in sysfs (CVE-2024-46780)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix missing cleanup on rollforward recovery error (CVE-2024-46781)In the Linux kernel, the following vulnerability has been resolved:sch/netem: fix use after free in netem_dequeue (CVE-2024-46800)In the Linux kernel, the following vulnerability has been resolved:rtmutex: Drop rt_mutex::wait_lock before scheduling (CVE-2024-46829)In the Linux kernel, the following vulnerability has been resolved:btrfs: clean up our handling of refs == 0 in snapshot delete (CVE-2024-46840)In the Linux kernel, the following vulnerability has been resolved:nilfs2: fix state management in error path of log writing function (CVE-2024-47669)'
