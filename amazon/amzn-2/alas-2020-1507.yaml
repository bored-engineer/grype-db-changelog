# schema: vulnerability/os/schema-1.0.0.json
Vulnerability:
    Description: A flaw was found in the Dnsmasq application where a remote attacker can trigger a memory leak by sending specially crafted DHCP responses to the server. A successful attack is dependent on a specific configuration regarding the domain name set into the dnsmasq.conf file. Over time, the memory leak may cause the process to run out of memory and terminate, causing a denial of service. (CVE-2019-14834)
    FixedIn:
        - Name: dnsmasq
          NamespaceName: amzn:2
          Version: 2.76-16.amzn2.0.1
          VersionFormat: rpm
