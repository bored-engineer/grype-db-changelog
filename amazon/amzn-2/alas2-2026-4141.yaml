# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: OAuthLib is an implementation of the OAuth request-signing logic for Python 3.6+. Prior to 4.0.0, the client_credentials and Resource Owner Password Credentials token grant handlers can authenticate request.client as one confidential client while retaining an attacker-supplied request.client_id for validate_grant_type and validate_scopes. A lower-privilege authenticated client can therefore cause grant and scope authorization to use another client's identity when an application validator relies on the documented client_id argument, potentially issuing tokens with unauthorized grants or scopes. Validators that authorize exclusively from request.client may not be affected. This issue is fixed in version 4.0.0. (CVE-2026-118669)
    FixedIn:
        - Available:
            Date: "2026-11-19"
            Kind: advisory
          Name: python-oauthlib
          NamespaceName: amzn:2
          Version: 2.0.1-8.amzn2.0.2
          VersionFormat: rpm
