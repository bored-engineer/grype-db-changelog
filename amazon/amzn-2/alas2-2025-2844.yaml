# schema: vulnerability/os/schema-1.1.0.json
Vulnerability:
    Description: 'When reading the language .mo file in grub_mofile_open(), grub2 fails to verify an integer overflow when allocating its internal buffer. A crafted .mo file may lead the buffer size calculation to overflow, leading to out-of-bound reads and writes. This flaw allows an attacker to leak sensitive data or overwrite critical data, possibly circumventing secure boot protections. (CVE-2024-45776)A flaw was found in grub2. The calculation of the translation buffer when reading a language .mo file in grub_gettext_getstr_from_position() may overflow, leading to a Out-of-bound write. This issue can be leveraged by an attacker to overwrite grub2''s sensitive heap data, eventually leading to the circumvention of secure boot protections. (CVE-2024-45777)grub2: fs/bfs: Integer overflow in the BFS parser. (CVE-2024-45778)grub2: fs/bfs: Integer overflow leads to Heap OOB Read in the BFS parser (CVE-2024-45779)'
