Vulnerability:
    Description: 'An out-of-bounds write flaw was found in the Linux kernel&rsquo;s framebuffer-based console driver functionality in the way a user triggers ioctl FBIOPUT_VSCREENINFO with malicious data. This flaw allows a local user to crash or potentially escalate their privileges on the system. (CVE-2021-33655)A bug in the IMA subsystem was discovered which would incorrectly allow kexec to be used when kernel lockdown was enabled (CVE-2022-21505)A heap buffer overflow flaw was found in the Linux kernel''s Netfilter subsystem in the way a user provides incorrect input of the NFT_DATA_VERDICT type. This flaw allows a local user to crash or potentially escalate their privileges on the system. (CVE-2022-34918)An issue was discovered in the Linux kernel through 5.18.14. xfrm_expand_policies in net/xfrm/xfrm_policy.c can cause a refcount to be dropped twice. (CVE-2022-36879)A memory corruption flaw was found in the Linux kernel''s Netfilter subsystem in the way a local user uses the libnetfilter_queue when analyzing a corrupted network packet. This flaw allows a local user to crash the system or a remote user to crash the system when the libnetfilter_queue is used by a local user. (CVE-2022-36946)In the Linux kernel, the following vulnerability has been resolved:ext4: fix race condition between ext4_write and ext4_convert_inline_data (CVE-2022-49414)In the Linux kernel, the following vulnerability has been resolved:mm/mempolicy: fix uninit-value in mpol_rebind_policy() (CVE-2022-49567)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_max_reordering. (CVE-2022-49571)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_slow_start_after_idle. (CVE-2022-49572)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_early_retrans. (CVE-2022-49573)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_recovery. (CVE-2022-49574)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_thin_linear_timeouts. (CVE-2022-49575)In the Linux kernel, the following vulnerability has been resolved:udp: Fix a data-race around sysctl_udp_l3mdev_accept. (CVE-2022-49577)In the Linux kernel, the following vulnerability has been resolved:ipv4: Fix a data-race around sysctl_fib_multipath_use_neigh. (CVE-2022-49580)In the Linux kernel, the following vulnerability has been resolved:iavf: Fix handling of dummy receive descriptors (CVE-2022-49583)In the Linux kernel, the following vulnerability has been resolved:ixgbe: Add locking to prevent panic when setting sriov_numvfs to zero (CVE-2022-49584)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_fastopen. (CVE-2022-49586)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_notsent_lowat. (CVE-2022-49587)In the Linux kernel, the following vulnerability has been resolved:igmp: Fix data-races around sysctl_igmp_qrv. (CVE-2022-49589)In the Linux kernel, the following vulnerability has been resolved:igmp: Fix data-races around sysctl_igmp_llm_reports. (CVE-2022-49590)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_probe_interval. (CVE-2022-49593)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_mtu_probe_floor. (CVE-2022-49594)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix a data-race around sysctl_tcp_probe_threshold. (CVE-2022-49595)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_min_snd_mss. (CVE-2022-49596)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_base_mss. (CVE-2022-49597)In the Linux kernel, the following vulnerability has been resolved:tcp: Fix data-races around sysctl_tcp_mtu_probing. (CVE-2022-49598)In the Linux kernel, the following vulnerability has been resolved:tcp/dccp: Fix a data-race around sysctl_tcp_fwmark_accept. (CVE-2022-49601)In the Linux kernel, the following vulnerability has been resolved:ip: Fix a data-race around sysctl_fwmark_reflect. (CVE-2022-49602)In the Linux kernel, the following vulnerability has been resolved:ip: Fix data-races around sysctl_ip_fwd_use_pmtu. (CVE-2022-49604)In the Linux kernel, the following vulnerability has been resolved:perf/core: Fix data race between perf_event_set_output() and perf_mmap_close() (CVE-2022-49607)In the Linux kernel, the following vulnerability has been resolved:pinctrl: ralink: Check for null return of devm_kcalloc (CVE-2022-49608)In the Linux kernel, the following vulnerability has been resolved:net: tipc: fix possible refcount leak in tipc_sk_create() (CVE-2022-49620)In the Linux kernel, the following vulnerability has been resolved:raw: Fix a data-race around sysctl_raw_l3mdev_accept. (CVE-2022-49631)In the Linux kernel, the following vulnerability has been resolved:ipv4: Fix a data-race around sysctl_fib_sync_mem. (CVE-2022-49637)In the Linux kernel, the following vulnerability has been resolved:icmp: Fix data-races around sysctl. (CVE-2022-49638)In the Linux kernel, the following vulnerability has been resolved:cipso: Fix data-races around sysctl. (CVE-2022-49639)In the Linux kernel, the following vulnerability has been resolved:ima: Fix a potential integer overflow in ima_appraise_measurement (CVE-2022-49643)In the Linux kernel, the following vulnerability has been resolved:cgroup: Use separate src/dst nodes when preloading css_sets for migration (CVE-2022-49647)In the Linux kernel, the following vulnerability has been resolved:xen/netback: avoid entering xenvif_rx_next_skb() with an empty rx queue (CVE-2022-49649)In the Linux kernel, the following vulnerability has been resolved:usbnet: fix memory leak in error case (CVE-2022-49657)In the Linux kernel, the following vulnerability has been resolved:mm/slub: add missing TID updates on slab deactivation (CVE-2022-49700)A NULL pointer dereference issue was found in the SCTP network protocol in net/sctp/stream_sched.c in the Linux kernel. If stream_in allocation fails, stream_out is freed, which would be accessed further. This flaw allows a local user to crash the system or potentially cause a denial of service. (CVE-2023-2177)'
