        [3.3.10-7]
        - Fix DoS via crafted IMAP responses in net-imap. (CVE-2026-42245)
          Resolves: RHEL-181682
        - Fix information disclosure via MITM attack bypassing TLS in net-imap.
          (CVE-2026-42246)
          Resolves: RHEL-181759
        - Fix command injection via Symbol arguments in net-imap. (CVE-2026-42258)
          Resolves: RHEL-181791

        [3.3.10-6]
        - Fix arbitrary code execution via deserialization bypass in ERB. (CVE-2026-41316)
          Resolves: RHEL-171247

        [3.3.10-5]
        - Upgrade to Ruby 3.3.10.
          Resolves: RHEL-106820
        - Fix possible denial of service in resolv gem (CVE-2025-24294)
        - Fix URI Credential Leakage Bypass previous fixes. (CVE-2025-61594)
        - Fix REXML denial of service. (CVE-2025-58767)
          Resolves: RHEL-122012

        [3.3.8-4]
        - Upgrade to Ruby 3.3.8.
          Resolves: RHEL-68632
        - Fix Net::IMAP vulnerable to possible DoS by memory exhaustion. (CVE-2025-25186)
        - Fix Denial of Service in CGI::Cookie.parse. (CVE-2025-27219)
        - Fix userinfo leakage in URI#join, URI#merge and URI#+. (CVE-2025-27221)

        [3.3.5-3]
        - Upgrade to Ruby 3.3.5
          Resolves: RHEL-55409
        - Fix DoS vulnerability in rexml.
          (CVE-2024-39908)
          (CVE-2024-41946)
          (CVE-2024-43398)
          Resolves: RHEL-57049
          Resolves: RHEL-57054
          Resolves: RHEL-57069
        - Fix REXML DoS when parsing an XML having many specific characters such as
          whitespace character, >] and ]>.
          (CVE-2024-41123)
          Resolves: RHEL-52783

        [3.3.1-2]
        - Upgrade to Ruby 3.3.1.
          Resolves: RHEL-37446
        - Fix buffer overread vulnerability in StringIO.
          (CVE-2024-27280)
          Resolves: RHEL-37448
        - Fix RCE vulnerability with .rdoc_options in RDoc.
          (CVE-2024-27281)
          Resolves: RHEL-37449
        - Fix Arbitrary memory address read vulnerability with Regex search.
          (CVE-2024-27282)
          Resolves: RHEL-37447

