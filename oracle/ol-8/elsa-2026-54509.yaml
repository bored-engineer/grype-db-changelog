        [32:9.16.23-0.22.8]
        - Fix RPZ name-too-long wildcard expansion (CVE-2026-11331)
        - Add upstream rpz system test
        - Resolves: RHEL-213478

        [32:9.16.23-0.22.7]
        - Fix CVE-2026-13204: ensure NSEC/NSEC3 has matching RRSIG
        - Resolves: RHEL-213478
