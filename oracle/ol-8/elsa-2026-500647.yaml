        [9.0.0-17]
        - daemon: install logrotate configurations for all daemons (Partha Sarathi Satapathy) [Orabug: 40055979]
        - util: virFileChownFiles: do not follow symlinks (HE WEI) [Orabug: 40184758] {CVE-2026-63622}
        - remote: Fix integer overflow in RPC handler for virNodeGetFreePages (CVE-2026-18917) (Peter Krempa) [Orabug: 40184784] {CVE-2026-18917}
        - API/qemu: add async unplug flag to virDomainSetVcpu (Akash Kulhalli) [Orabug: 39870832]
        - API/qemu: add async unplug flag to virDomainSetVcpusFlags (Akash Kulhalli) [Orabug: 39870832]
        - qemu: thread async vcpu unplug through internal helpers (Akash Kulhalli) [Orabug: 39870832]
        - qemu: emit vcpu-removed event on unplug completion (Akash Kulhalli) [Orabug: 39870832]
        - conf,remote: add vcpu-removed domain event (Akash Kulhalli) [Orabug: 39870832]

        libvirt-dbus
        libvirt-python
        [9.0.0-17.el8]
        - Update to libvirt 9.0.0-17 (Karl Heubaum)

        nbdkit
        netcf
        perl-Sys-Virt
        qemu-kvm
        [7.2.0-44]
        - scsi-disk: fix out-of-bound read in WRITE SAME (Paolo Bonzini) [Orabug: 40250898] {CVE-2026-81628}
        - hw/usb/hcd-xhci: More reentrancy guard fixes for the XHCI code (Thomas Huth) [Orabug: 40194860] {CVE-2026-111819}
        - hw/display/vga: fix OOB writes after external surface resize (Marc-Andre Lureau) [Orabug: 40188736] {CVE-2026-97889}
        - io: prevent unbounded read of websocket data from client (Daniel P. Berrange) [Orabug: 40188735] {CVE-2026-101291}
        - hw/usb/hcd-xhci: Set reentrancy guard in timer functions (CVE-2026-17588) (Thomas Huth) [Orabug: 40104739] {CVE-2026-17588}
        - hw/9pfs: mutate FID path from main thread only (CVE-2026-93834) (Christian Schoenebeck) [Orabug: 40104726] {CVE-2026-93834}
        - qga: Change effective user/group ID in guest-ssh-* commands (Kostiantyn Kostiuk) [Orabug: 40060417] {CVE-2026-12080}
        - virtio-balloon: fix free-page BH teardown on unrealize (Michael S. Tsirkin) [Orabug: 40060414] {CVE-2026-66899}
        - hw/net/virtio-net: strip trailing padding when caching RSC segment (Laurent Vivier) [Orabug: 40060413] {CVE-2026-66900}
        - io/channel-websock: do not lose QIO_CHANNEL_ERR_BLOCK while reading (Denis V. Lunev) [Orabug: 40060405] {CVE-2026-84788}
        - io/channel-websock: handle a blocked write during the handshake (Denis V. Lunev) [Orabug: 40060405] {CVE-2026-84788}
        - io/channel-websock: send an HTTP 400 when the greeting has no space (Denis V. Lunev) [Orabug: 40060405] {CVE-2026-84788}
        - io/channel-socket: do not treat a zero length write as an error (Denis V. Lunev) [Orabug: 40060405] {CVE-2026-84788}
        - hw/display/vga: fix text-mode OOB write after a graphics surface switch (Warisjeet Singh) [Orabug: 40039326] {CVE-2026-77913}
        - hw/virtio-rng: Fix host use-after-free (CVE-2026-50624) (Laurent Vivier) [Orabug: 39703366] {CVE-2026-50624}
        - virtio-pmem: wait for flush requests on unrealize (Michael S. Tsirkin) [Orabug: 39947075] {CVE-2026-63323}
        - virtio-mmio: fix QUEUE_NUM_MAX (Michael S. Tsirkin) [Orabug: 39825829] {CVE-2026-50626}
        - virtio-scsi: fix SCSIRequest leak on a bad request (Michael S. Tsirkin) [Orabug: 39903681] {CVE-2026-61476}
        - qemu-kvm.spec: Require matching QEMU common package for USB modules (Mark Kanda) [Orabug: 40120472]

