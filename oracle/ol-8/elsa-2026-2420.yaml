    Description: |-
        nodejs
        [1:24.13.0-1]
        - Update to 24.13.0
          Resolves: RHEL-135257

        [1:24.4.1-1]
        - Initial import of nodejs:24

        nodejs-nodemon
        [3.0.3-1]
