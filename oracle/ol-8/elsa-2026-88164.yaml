          font conversion
        - Resolves: RHEL-276430 CVE-2026-63277 Arbitrary code execution via remote Java
          database driver

        [1:7.1.8.1-1]
        - OpenJDK 8 won't be supported anymore on RHEL 8 starting from November 2026,
          move to OpenJDK 21. LibreOffice 6.x doesn't really support anything newer than
          OpenJDK 8, so a rebase to 7.x was needed and RHEL 9 was used as a base.
          OpenJDK 21 doesn't have i686 builds available so these are not built anymore
          (previously they were built, but stayed in the BUILDROOT repository).
        - Resolves: RHEL-260518

