Vulnerability:
    CVSS: []
    Description: |-
        python36
        [3.6.8-39]
        - Provide /usr/bin/python3 explicitly
        - Resolves: RHEL-2113

        python-distro
        [1.4.0-2]
        - Port from Fedora to RHEL8, part of the python36 module
        - Resolves: rhbz#1678920

        python-docs
        [3.6.7-2]
        - Bumping due to problems with modular RPM upgrade path
        - Resolves: rhbz#1695587

        python-docutils
        [0.14-12]
        - Bumping due to problems with modular RPM upgrade path
        - Resolves: rhbz#1695587

        python-nose
        [1.3.7-31]
        - Adjusted the postun scriptlets to enable upgrading to RHEL 9
        - Resolves: rhbz#1933055

        python-pygments
        [2.2.0-22]
        - Fix CVE-2021-27291: ReDos via crafted malicious input
        Resolves: rhbz#1943459 rhbz#1943460

        python-pymongo
        [3.7.0-3]
        - Backport CVE-2026-88029

        python-PyMySQL
        [0.10.1-2]
        - Revert upstream change of default charset (from utf8mb4 to latin1)
        - Resolves BZ#1885641

        python-sqlalchemy
        [1.3.2-3]
        - Fix GROUP BY for joined relationships
        Resolves: RHEL-17464

        python-virtualenv
        [15.1.0-23]
        - Security fix for CVE-2024-53899
        Resolves: RHEL-68876

        python-wheel
        [1:0.31.1-3]
        - Adjusted the postun scriptlets to enable upgrading to RHEL 9
        - Resolves: rhbz#1933055

        scipy
        [1.0.0-21]
        - Do not create -PYTEST.pyc files
        - Resolves: rhbz#1934199
