    Description: |-
        [2.02-78.0.3.el8_1.1]
        - honor /etc/sysconfig/kernel DEFAULTKERNEL setting for BLS [Orabug: 30643497]
        - set EFIDIR as redhat for additional grub2 tools [Orabug: 29875597]
        - Update upstream references [Orabug: 26388226]
