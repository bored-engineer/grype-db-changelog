        - util: Enable default kernel for updates
        - Resolves: #RHEL-4343

        [2.02-152]
        - kern/ieee1275/init: ppc64: Restrict high memory in presence
          of fadump
        - Resolves: #RHEL-14283

        [2.02-151]
        - util: Regenerate kernelopts if missing on ppc
        - Resolves: #2051889
