        - Update to jdk-21.0.5+11 (GA)
        - Update release notes to 21.0.5+11
        - Remove local JDK-8327501 & JDK-8328366 backport as this is now upstream.
        - Sync the copy of the portable specfile with the latest update
        - Related: RHEL-61346
