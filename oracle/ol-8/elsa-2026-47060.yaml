Vulnerability:
    CVSS: []
    Description: |-
        nodejs
        [1:24.18.0-2]
        - Backport patches for various CVEs
          Fixes: CVE-2026-59873 CVE-2026-59874 CVE-2026-13149
          Resolves: RHEL-194176 RHEL-194179 RHEL-208658

        [1:24.18.0-1]
        - Update to version 24.18.0
          Resolves: RHEL-168744

        [1:24.14.1-2]
        - Update bundled nghttp2 to 1.68.1
          Related: RHEL-151374

        [1:24.14.1-1]
        - Update to 24.14.0
          Resolves: RHEL-151374

        [1:24.13.0-1]
        - Update to 24.13.0
          Resolves: RHEL-135257

        [1:24.4.1-1]
        - Initial import of nodejs:24

        nodejs-nodemon
        [3.1.14-1]
        - Rebase to 3.1.14
        - Switch from using remys fork as a source to npm.
        - Resolves: RHEL-208657

        nodejs-packaging
        [2021.06-6]
        - Properly handle @group/package deps in nodejs-symlink-deps
          Resolves: RHEL-121576

        [2021.06-5]
        - nodejs.req to properly detect bundled deps

        [2021.06-4]
        - NPM bundler: also find namespaced bundled dependencies

        [2021.06-3]
        - Rebuilt for https://fedoraproject.org/wiki/Fedora_35_Mass_Rebuild

        [2021.06-2]
        - Fix hard-coded output directory in the bundler

        [2021.06-1]
        - Update to 2021.06-1
        - bundler: Handle archaic license metadata
        - bundler: Warn about bundled dependencies with no license metadata

        [2021.01-3]
        - Rebuilt for https://fedoraproject.org/wiki/Fedora_34_Mass_Rebuild

        [2021.01-2]
        - nodejs-packaging-bundler improvements to handle uncommon characters

        [2021.01]
        - Add nodejs-packaging-bundler and update README.md

        [2020.09-1]
        - Move to dist-git as the upstream
