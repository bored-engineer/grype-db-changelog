        [1.16.1-5]
        - Fix unexpected code execution in Gemfiles (CVE-2021-43809)
          Resolves: RHEL-87017

        rubygem-mongo
        [2.5.1-2]
        - Disable tests to fix FTBFS by dropped MongoDB module.
          Resolves: rhbz#1710863

        rubygem-mysql2
        [0.4.10-4]
        - Rebuilt for https://fedoraproject.org/wiki/Fedora_28_Mass_Rebuild

        rubygem-pg
        [1.0.0-3]
        - Fix FTBFS with PostgreSQL 10.6 and above.
