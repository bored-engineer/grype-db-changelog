    Description: |-
        python2
        [2.7.18-4.0.1]
        - Add Oracle Linux distribution in platform.py [Orabug: 20812544]

        [2.7.18-4]
        - Security fix for CVE-2021-3177
        Resolves: rhbz#1919163

        [2.7.18-3]
        - Fixes for bundling prefix=/app build in gimp/inkscape containers
        Resolves: rhbz#1907592

        [2.7.18-2]
        - Security fix for CVE-2020-26116: Reject control chars in HTTP method in httplib.putrequest
        Resolves: rhbz#1883258

        [2.7.18-1]
        - Update to 2.7.18
        Resolves: rhbz#1886754

        python2-setuptools
        [39.0.1-13]
        - When building for Flatpak inclusion, build in bootstrap mode
        Resolves: rhbz#1907597

        python-backports
        [1.0-16]
        - Update python macros to python2 versioned macros
        - Issue found when rebuilding the python27 module to include CVE fixes
        - Related: rhbz#1883890 rhbz#1883258

        python-backports-ssl_match_hostname
        [3.5.0.1-12]
        - Remove unversioned Provides
        - Resolves: rhbz#1908300
