    Description: |-
        [3.10.0-1160.59.1.OL7]
        - Update Oracle Linux certificates (Ilya Okomin)
        - Oracle Linux RHCK Module Signing Key was compiled into kernel (olkmod_signing_key.x509)(alexey.petrenko@oracle.com)
