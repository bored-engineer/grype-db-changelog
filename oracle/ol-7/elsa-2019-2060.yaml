        [12:4.2.5-71]
        - Resolves: #1623792 - Load leases file in tracing mode only

        [12:4.2.5-70]
        - Resolves: #1574292 - Fix options conflict for ddns update

        [12:4.2.5-69]
        - Resolves: #1570895 - Fix command execution vulnerability (CVE-2018-1111)
