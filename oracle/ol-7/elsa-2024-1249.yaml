        - net: bonding: fix possible NULL deref in rlb code (Hangbin Liu) [RHEL-17227]
        - net: bonding: fix use-after-free after 802.3ad slave unbind (Hangbin Liu) [RHEL-17227]

        [3.10.0-1160.111.1]
