    Description: |-
        [1:1.7.0.85-2.6.1.2.0.1.el7_1]
        - Update DISTRO_NAME in specfile

        [1:1.7.0.85-2.6.1.2]
        - Bump upstream tarball to u25b01 to fix issue with 8075374 backport.
