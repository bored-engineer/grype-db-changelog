    Description: |-
        libvirt
        [9.0.0.-17.el9]
        - daemon: install logrotate configurations for all daemons (Partha Sarathi Satapathy) [Orabug: 40055979]
        - util: virFileChownFiles: do not follow symlinks (HE WEI) [Orabug: 40184758] {CVE-2026-63622}
        - remote: Fix integer overflow in RPC handler for virNodeGetFreePages (CVE-2026-18917) (Peter Krempa) [Orabug: 40184784] {CVE-2026-18917}
        - API/qemu: add async unplug flag to virDomainSetVcpu (Akash Kulhalli) [Orabug: 39870832]
