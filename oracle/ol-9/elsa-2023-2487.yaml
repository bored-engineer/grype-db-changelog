        [1.8.10-2]
        - Rebuild because distrobaker did entirely the wrong thing.
        - Resolves: rhbz#2128384, needed for rhbz#2119436 and rhbz#2128384

        [1.8.10-1]
        - Rebase to latest upstream release to fix multiple ESP detection problems
