Vulnerability:
    CVSS: []
    Description: |-
        ruby
        [4.0.6-35]
        - Fix resolv: do not register on-demand classes for unknown DNS
          types and SvcParamKeys to prevent memory exhaustion
          (CVE-2026-80212)
          Resolves: RHEL-252035

        [4.0.6-34]
        - Upgrade to Ruby 4.0.6.
          Resolves: RHEL-211301
          Resolves: RHEL-193663

        [4.0.3-33]
        - Fix Net::IMAP ResponseReader quadratic complexity vulnerability. (CVE-2026-42245)
          Resolves: RHEL-181690
        - Fix Net::IMAP STARTTLS stripping vulnerability. (CVE-2026-42246)
          Resolves: RHEL-181771
        - Fix Net::IMAP command injection vulnerability via unvalidated Symbol arguments. (CVE-2026-42258)
          Resolves: RHEL-181803

        [4.0.3-32]
        - Upgrade to Ruby 4.0.3.
          Resolves: RHEL-171933
        - Fix ERB: Arbitrary code execution via deserialization bypass
         (CVE-2026-41316)
          Resolves: RHEL-171258
        - Fix JSON: Denial of Service or Information Disclosure via format string injection
         (CVE-2026-33210)
         Resolves: RHEL-173458

        [4.0.1-31]
        - Upgrade to Ruby 4.0.1.
          Resolves: RHEL-142278

        [3.3.10-5]
        - Upgrade to Ruby 3.3.10.
          Resolves: RHEL-106821
        - Fix possible denial of service in resolv gem (CVE-2025-24294)
        - Fix URI Credential Leakage Bypass previous fixes. (CVE-2025-61594)
        - Fix REXML denial of service. (CVE-2025-58767)
          Resolves: RHEL-126728

        [3.3.8-4]
        - Upgrade to Ruby 3.3.8.
          Resolves: RHEL-68631
        - Fix Net::IMAP vulnerable to possible DoS by memory exhaustion. (CVE-2025-25186)
        - Fix Denial of Service in CGI::Cookie.parse. (CVE-2025-27219)
          Resolves: RHEL-86109
        - Fix userinfo leakage in URI#join, URI#merge and URI#+. (CVE-2025-27221)

        rubygem-mysql2
        [0.5.7-1]
        - Upgrade to mysql2 0.5.7.
          Related: RHEL-142278

        [0.5.5-3]
        - Disable tests on the 32bit platforms ix86.
          Related: RHEL-80222

        [0.5.5-2]
        - Adapt tests to openssl 3.2
          Resolves: RHEL-80222

        rubygem-pg
        [1.6.3-1]
        - Upgrade to pg 1.6.3
          Related: RHEL-142278
