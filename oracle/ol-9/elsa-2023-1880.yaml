    Description: |-
        [11.0.19.0.7-1.0.1]
        - Replace upstream references [Orabug: 34340155]

        [1:11.0.19.0.7-1]
        - Update to jdk-11.0.19.0+7
        - Update release notes to 11.0.19.0+7
