    Description: |-
        pgaudit
        [1.7.0-1]
        - Initial import for postgresql 15 module
        - Update to 1.7.0
        - Support postgresql 15
        - Related: #2128410

        pg_repack
        [1.4.8-2]
        - Add new build dependencies to fix build with lz4 enabled
        - Related: RHEL-47350

        [1.4.8-1]
        - Update to version 1.4.8
        - Postgresql 15 is supported
        - Related: #2128410

        postgres-decoderbufs
