        - Iitial import for postgresql 15 stream
        - Related: #2128410

        postgresql
        [15.12-1]
        - Update to 15.12

        [15.10-1]
        - Update to 15.10
        - Fixes: CVE-2024-10976 CVE-2024-10978 CVE-2024-10979

        [15.8-2]
        - Fix build on 15.8

        [15.8-1]
        - Update to 15.8

        [15.6-3]
        - Remove /var/run/postgresql
        - Related: RHEL-51271

        [15.6-2]
        - Enable lz4 and zstd support

        [15.6-1]
        - Update to 15.6 and 13.14
        - Fix CVE-2024-0985

        [15.5-1]
        - update to 15.5
        - Fixes CVE-2023-5868, CVE-2023-5869, CVE-2023-5870, CVE-2023-39417, and CVE-2023-39418

        [15.3-1]
        - update to 15.3
        - Fixes CVE-2023-2454 and CVE-2023-2455
          Resolves: #2214875
