    CVSS: []
    Description: |-
        [9.9p1-16.0.1.el9_9]
        - Restore pam_ssh_agent_rel values that were used for initial release
        - Fix PerSourcePenalties grace-exceeded using the crash penalty value [Orabug: 39825354]
        - Replace unsupported ML-KEM hybrid algorithm skip logic with v9.9p1-23.el10_2 ML-KEM/NIST backport [Orabug: 39423076]
        - Upstream references found with /usr/bin/ssh [Orabug: 37814929]

        [9.9p1-16]
        - CVE-2026-59998: Document caveat regarding GSSAPIStrictAcceptorCheck
          Resolves: RHEL-276923
        - CVE-2026-59997: Fix internal-sftp server argument parsing limit
          Resolves: RHEL-276930
        - CVE-2026-60000: Fix DoS via excessive GSSAPI authentication attempts
          Resolves: RHEL-276924

        [9.9p1-15]
        - bump release

        [9.9p1-14]
        - CVE-2026-60001: Fix cases in GSSAPI and keyboard-interactive
          authentication where the minimum per-attempt delay was not being enforced
          Resolves: RHEL-258464
