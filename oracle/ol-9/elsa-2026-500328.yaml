    CVSS: []
    Description: "[6.12.0-206.104.4.4]\n- net: tun: bound receive headroom (Asim Viladi Oglu Manizada)  [Orabug: 40035126]  {CVE-2026-81000}\n- xfrm: ah6: validate routing header segments_left (Asim Viladi Oglu Manizada)  [Orabug: 40035125]  {CVE-2026-80844}\n- RDMA/nldev: Fix locking when accessing mr->pd (Jason Gunthorpe)  [Orabug: 40028950]  {CVE-2026-74334}\n- RDMA/restrack: Fix typos in the comments (Kalesh AP)  [Orabug: 40028950] \n- tcp: clear sock_ops cb flags before force-closing a child socket (Sechang Lim)  [Orabug: 40028948]  {CVE-2026-74268}\n- xsk: cache csum_start/csum_offset to fix TOCTOU in xsk_skb_metadata() (Jason Xing)  [Orabug: 40028941]  {CVE-2026-53250}\n- tcp: fix potential race in tcp_v6_syn_recv_sock() (Eric Dumazet)  [Orabug: 40028939]  {CVE-2026-43198}\n\n[6.12.0-206.104.4.3]\n- net: Account VLAN RPS drops (Sherry Yang)  [Orabug: 40023758]\n- net: ntb_netdev: Count packets dropped on RX refill failure (Koichiro Den)\n- net: ntb_netdev: Avoid double-accounting netif_rx() drops (Koichiro Den)\n- net: stmmac: selftests: Pass the IP proto mask in the TC selftest (Maxime Chevallier)\n- Bluetooth: L2CAP: fix race l2cap_sock_cleanup_listen() vs. put_chan (Pauli Virtanen)\n- ALSA: seq: midi: Optimize event_input locking with RCU (Takashi Iwai)\n- ALSA: seq: Don't leak the extension cell pointer in the bounce payload (HyeongJun An)\n- f2fs: fix i_size when pinned fallocate partially fails (Zhan Xusheng)\n- media: cec: core: Fix kmemleak due to missed rc_free_device() call (Jonas Karlman)\n- LoongArch: Fix acpi_package_ids[] array overflow (Bibo Mao)\n- fs: fix user path of nested backing files (Baokun Li)\n- Revert 'PM: sleep: Use complete() in device_pm_sleep_init()' (Sasha Levin)\n- perf: Reject exited events as group leaders (Kyle Zeng)\n- erofs: Fix EROFS_FS_ZIP_LZMA_DEFAULT_MAX_STREAMS default logic (Geert Uytterhoeven)\n- drm/amd/display: fix BT.2020 YCbCr limited output CSC matrix (Nathan Lucas)\n- ipv4: start using dst_dev_rcu() (Eric Dumazet)  [Orabug: 40022810]  {CVE-2025-40074}\n- NTB: ntb_netdev: Preserve RX queue depth on allocation failure (Koichiro Den)  [Orabug: 40022771]  {CVE-2026-74626}\n- inet: frags: publish queues before arming timer (Zhiling Zou)  [Orabug: 40022764]  {CVE-2026-74662}\n- inet: frags: save a pair of atomic operations in reassembly (Eric Dumazet)  [Orabug: 40022764]\n- inet: frags: change inet_frag_kill() to defer refcount updates (Eric Dumazet)  [Orabug: 40022764]\n- ipv4: frags: remove ipq_put() (Eric Dumazet)  [Orabug: 40022764]\n- inet: frags: add inet_frag_putn() helper (Eric Dumazet)  [Orabug: 40022764]"
