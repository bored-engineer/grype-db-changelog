# schema: vulnerability/os/schema-1.1.1.json
Vulnerability:
    CVSS: []
    Description: |-
        ruby
        [3.3.14-11]
        - Rebase to Ruby 3.3.14.
          Resolves: RHEL-312526
        - Fix Heap buffer overflow in case conversion of strings (CVE-2026-132825).
          Resolves: RHEL-312279

        [3.3.13-10]
        - Rebase to Ruby 3.3.13.
          Resolves: RHEL-313262
        - Fix: integer overflow issue in regular expression compiler (CVE-2026-110264)
          Resolves: RHEL-292084
        - Fix: integer overflow issue in CI/CD regular expression compiler (CVE-2026-97229)
          Resolves: RHEL-292113
        - Fix: integer overflow issue in regular expression compiler (CVE-2026-93577)
          Resolves: RHEL-292143
        - Fix: double free issue in regular expression parser (CVE-2026-89078)
          Resolves: RHEL-292217

        rubygem-mysql2
        [0.5.5-3]
        - Disable tests on the 32bit platforms ix86.
          Related: RHEL-80222

        [0.5.5-2]
        - Adapt tests to openssl 3.2
          Resolves: RHEL-80222

        [0.5.5-1]
        - Upgrade to mysql2 0.5.5.
          Related: RHEL-17089

        rubygem-pg
        [-1.5.4-2]
        - Fix encoding issue in spec suite.
          Resolves: RHEL-159199
