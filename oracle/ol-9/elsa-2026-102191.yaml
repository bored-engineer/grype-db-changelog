# schema: vulnerability/os/schema-1.1.1.json
Vulnerability:
    CVSS: []
    Description: |-
        [9.9p1-17.0.1]
        - Restore pam_ssh_agent_rel values that were used for initial release
        - Fix PerSourcePenalties grace-exceeded using the crash penalty value [Orabug: 39825354]
        - Replace unsupported ML-KEM hybrid algorithm skip logic with v9.9p1-23.el10_2 ML-KEM/NIST backport [Orabug: 39423076]
        - Upstream references found with /usr/bin/ssh [Orabug: 37814929]

        [9.9p1-17]
        - CVE-2026-106552: Fix arbitrary file write via directory traversal
          during sftp recursive copy
          Resolves: RHEL-286928
        - CVE-2026-106585: Fix DoS via oversized decompressed packets
          Resolves: RHEL-286938
        - CVE-2026-106583: Fix command injection via unvalidated command-line username
          Resolves: RHEL-286961
        - CVE-2026-106582: Fix compression side-channel by disabling L77 dictionary coder
          Resolves: RHEL-286931
        - CVE-2026-106553: Fix credentials persisting after GSSAPI authentication attempt failure
          Resolves: RHEL-286887
        - Fix resource leaks in krb5 and GSSAPI authentication
          Related: RHEL-286887
        - Fix and enable the PKCS#11 URI tests
          Related: RHEL-288511
        - Restores functionality of IdentitiesOnly=yes with PKCS#11 URI in IdentityFile
          Resolves: RHEL-288511
