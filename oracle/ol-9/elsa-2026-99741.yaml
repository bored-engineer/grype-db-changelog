        - Rebuilt for IMA sigs, glibc 2.34, aarch64 flags
          Related: rhbz#1991688

        mysql
        [8.4.13-1]
        - Rebase to 8.4.13

        perl-DBD-MySQL
        [4.053-3]
        - Resolves: RHEL-132443
        - Skip the ssl tests if MySQL does not provide have_ssl

        rapidjson
        [1.1.0-20]
        - Backport patch for CVE-2026-116620
