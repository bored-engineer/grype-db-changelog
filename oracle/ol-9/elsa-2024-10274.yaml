        - Add Oracle Linux IMA certificates

        [5.14.0-503.15.1_5]
        - USB: serial: mos7840: fix crash on resume (Desnes Nunes) [RHEL-65484 RHEL-59050] {CVE-2024-42244}
        - attr: block mode changes of symlinks (CKI Backport Bot) [RHEL-61231 RHEL-60822]
