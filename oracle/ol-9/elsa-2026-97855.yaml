# schema: vulnerability/os/schema-1.1.1.json
Vulnerability:
    CVSS: []
    Description: |-
        nodejs
        [1:26.8.2-1]
        - Update to version 26.8.2

        [1:26.1.0-2]
        - Enable building with rust

        [1:26.1.0-1]
        - Rebase to nodejs 26.1.0
        - list new dependency: merve
        - Switch compiler from gcc-toolset-12 to clang/llvm
        - Add libatomic build dependency and linker symlink workaround
        - Replace -fno-ipa-icf with -fno-optimize-sibling-calls (clang compat)
        - Disable LTO (not yet supported with clang toolchain)
        - Export CC/CXX/AR/RANLIB for clang/llvm
        - Add LDFLAGS for libatomic search path
        - Add patch: Python <3.10 compat (match/case to if/elif)
        - Add patch: v8 include climits for CHAR_BIT (clang strict headers)
        - Dropped downstream nghttp2 update patch
        - Removed corepack stuff

        [1:24.14.1-2]
        - Update bundled nghttp2 to 1.68.1

        [1:24.14.1-1]
        - Update to version 24.14.1

        [1:24.13.0-1]
        - Update to version 24.13.0

        [1:24.11.1-2]
        - Disable test-tls-session-cache.js as its not currently compatiable with
          RHEL environment

        [1:24.11.1-1]
        - Update to version 24.11.1

        [1:24.4.1-7]
        - Add patch to prevent fips usage segfault

        [1:24.4.1-6]
        - Rename nodejs-npm back to npm

        nodejs-nodemon
        [2.0.3-9]
        - Let nodemon work with any Node.js version
          Resolves: #2230317

        [2.0.3-8]
        - Rebuilt for https://fedoraproject.org/wiki/Fedora_39_Mass_Rebuild

        [2.0.3-7]
        - Rebuilt for https://fedoraproject.org/wiki/Fedora_38_Mass_Rebuild

        [2.0.3-6]
        - Rebuilt for https://fedoraproject.org/wiki/Fedora_37_Mass_Rebuild

        [2.0.3-5]
        - Rebuilt for https://fedoraproject.org/wiki/Fedora_36_Mass_Rebuild

        nodejs-packaging
        [2021.06-6]
        - Properly handle @group/package deps in nodejs-symlink-deps
          Resolves: RHEL-121569

        [2021.06-5]
        - nodejs.req to properly detect bundled deps
