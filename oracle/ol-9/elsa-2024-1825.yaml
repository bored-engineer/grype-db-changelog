    Description: |-
        [17.0.11.0.9-2.0.1]
        - Add Oracle vendor bug URL

        [1:17.0.11.0.9-2]
        - Update to jdk-17.0.11+9 (GA)
        - Add openjdk-17.0.11+9.tar.xz to .gitignore
        - Sync java-17-openjdk-portable.specfile from openjdk-portable-rhel-8
