Vulnerability:
    CVSS: []
    Description: |-
        [7.2.0-43.el9]
        - dmg: reject inconsistent UDRW chunk sector count and length (CVE-2026-65928) (Stefan Hajnoczi) [Orabug: 39849788] {CVE-2026-65928}
        - dmg: fix out-of-bounds load in search_chunk() (CVE-2026-65929) (Stefan Hajnoczi) [Orabug: 39849747] {CVE-2026-65929}
        - virtio: avoid packed vring virtio_queue_empty() infinite loops (CVE-2026-16457) (Stefan Hajnoczi) [Orabug: 39844863] {CVE-2026-16457}
        - hw/net/virtio-net: Protect from DMA re-entrancy bugs (Laurent Vivier) [Orabug: 39843811] {CVE-2026-66022}
        - libvduse: validate vq size (Michael S. Tsirkin) [Orabug: 39825932] {CVE-2026-61402}
        - libvhost-user: fix heap overflow in vu_check_queue_inflights (Michael S. Tsirkin) [Orabug: 39843801] {CVE-2026-63110}
        - libvhost-user: validate last_batch_head in vu_check_queue_inflights (Michael S. Tsirkin) [Orabug: 39843801] {CVE-2026-63110}
        - virtio-net: fix short frame OOB read in receive_filter() (Michael S. Tsirkin) [Orabug: 39843795] {CVE-2026-63320}
        - hw/9pfs: fix O_TRUNC bypass on read-only export (Christian Schoenebeck) [Orabug: 39804678] {CVE-2026-63318}
        - hw/usb/hcd-xhci-sysbus: Fix OOB heap access in xhci_sysbus_intr_raise() (Thomas Huth) [Orabug: 39793551] {CVE-2026-16043}
        - usbredir: fix use-after-free on buffered bulk packet overflow (Marc-Andre Lureau) [Orabug: 39793554] {CVE-2026-15705}
        - ui/vnc: validate SetPixelFormat field ranges (Marc-Andre Lureau) [Orabug: 39804658] {CVE-2026-15578}
        - target/i386: add compatibility property for arch_capabilities (Paolo Bonzini) [Orabug: 39935277]
        - hw/i386: Add pc-q35-7.2-exadata-v2 machine (Mark Kanda) [Orabug: 39917084]
