# schema: vulnerability/os/schema-1.1.1.json
Vulnerability:
    CVSS: []
    Description: |-
        nodejs
        [1:24.21.0-1.0.1]
        - Fix out-of-bounds write in bundled Brotli decoder [CVE-2026-111497]
        - Expose the decoder block-switch error and add regression coverage
        - Require the patched system Brotli for shared builds

        [1:24.21.0-1]
        - Update to version 24.21.0

        [1:24.19.0-1]
        - Update to version 24.19.0

        [1:24.18.0-6]
        - Update brace-expansion from 5.0.6 to 5.0.9 to address CVE-2026-13149
          (memory exhaustion via deeply chained brace groups). as well as
          CVE-2026-14257 (fixed in 5.0.8).

        [1:24.18.0-5]
        - Fix for CVE-2026-69192 & CVE-2026-54272 : ip-address

        [1:24.18.0-4]
        - deps: update sqlite to 3.53.4

        [1:24.18.0-3]
        - Fix CVE-2026-59873, CVE-2026-59874 (node-tar) in npm's bundled tar

        [1:24.18.0-2]
        - Fix CVE-2026-13149 (brace-expansion) in npm's bundled brace-expansion

        [1:24.18.0-1]
        - Update to version 24.18.0

        [1:24.14.1-2]
        - Update bundled nghttp2 to 1.68.1

        nodejs-nodemon
        [3.1.14-6]
        - CVE-2026-102278 nodejs-nodemon: brace-expansion: Denial of Service via
          uncontrolled recursion in nested brace patterns

        [3.1.14-5]
        - CVE-2026-118764 nodejs-nodemon: minimatch: Denial of Service via crafted
          glob pattern expansion

        [3.1.14-4]
        - CVE-2026-102276 nodejs-nodemon: brace-expansion: Denial of Service via
          stack exhaustion from crafted brace patterns

        [3.1.14-3]
        - Fix CVE-2026-69152 - brace-expansion

        [3.1.14-2]
        - Correction to sources for 3.1.14.

        [3.1.14-1]
        - Update to version 3.1.14

        [3.0.3-3]
        - Keep BR on just npm

        [3.0.3-2]
        - Fix BR for nodejs-npm

        nodejs-packaging
        [2021.06-6]
        - Properly handle @group/package deps in nodejs-symlink-deps
          Resolves: RHEL-121569

        [2021.06-5]
        - nodejs.req to properly detect bundled deps
