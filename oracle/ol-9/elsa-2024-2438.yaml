        - pam_faillock: create tallydir before creating tallyfile. Resolves: RHEL-20943

        [1.5.1-16]
        - libpam: use close_range() to close file descriptors. Resolves: RHEL-5099
        - fix formatting of audit messages. Resolves: RHEL-5100
