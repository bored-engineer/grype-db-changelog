        - Add entropy generation to nics (John Sobecki) [10622900]
        - [SCSI] compat_ioct: fix bsg SG_IO [orabug 12732464]
        - ipc/sem.c: error path in try_atomic_semop() left spinlock locked

        [2.6.32-200.10.5.el6uek]
        - update kabi

