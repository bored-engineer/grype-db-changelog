Vulnerability:
    CVSS: []
    Description: |-
        [2.40.2-18.0.1.el10_2.20]
        - fix -d -t output regression [OLDIS-51984]

        [2.40.2-20]
        - libblkid: validate EBR data [CVE-2026-53615]

        [2.40.2-19]
        - libmount and blkid security fixes
        - libblkid: fix use-after-free in nested partition probing [CVE-2026-13595]
        - nsenter: close cgroup.procs fd after join to prevent authority leak
          [CVE-2026-78408]
        - libmount: fix SUID bypass via LIBMOUNT_FORCE_MOUNT2 and legacy mount
          [CVE-2026-53614]
        - libmount: TOCTOU in the mount program via ancestor directory swap on
          target path  [CVE-2026-53613]
        - libmount: TOCTOU in the mount program when applying post-mount
          ownership/mode changes [CVE-2026-53612]
        - libmount: restrict the mount source for non-root users [CVE-2026-78410]
        - libmount: skip post-mount hooks after a failed mount helper
          [CVE-2026-76642]
        - loopdev: do not follow symlinks for the backing file [CVE-2026-27456]
