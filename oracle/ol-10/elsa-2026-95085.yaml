Vulnerability:
    CVSS: []
    Description: |-
        [5.3.4-11]
        - Fix incomplete CVE-2026-88051: reset 'size_used_' on validation failure
          in 'GenericVector::read()'; check 'fontinfo_table_' and 'fontset_table_'
          read return values in 'ReadIntTemplates'

        [5.3.4-10]
        - Replace ASSERT_HOST around LSTM model Load with graceful error
          handling; fixes denial-of-service crash (exit 134) when CVE
          validation correctly rejects a malformed LSTM traineddata file

        [5.3.4-9]
        - CVE-2026-88053: add void-to-bool failure propagation for
          'InitAdaptiveClassifier', 'program_editup', and
          'init_tesseract_internal'; without this, validation fires but the
          process SIGSEGV (exit 139) because the failure never reaches Init

        [5.3.4-8]
        - Backport fixes for CVE-2026-88047, CVE-2026-88048, CVE-2026-88049,
          CVE-2026-88051, CVE-2026-88052, CVE-2026-88053
