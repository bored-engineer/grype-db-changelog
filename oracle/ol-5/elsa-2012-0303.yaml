        [1.1.1-48.90]
        - cve-2011-4028.patch: File existence disclosure vulnerability.

        [1.1.1-48.88]
        - cve-2011-4818.patch: Multiple input sanitization flaws in Render and GLX
        - xorg-x11-server-1.1.0-mesa-copy-sub-buffer.patch: Likewise.

