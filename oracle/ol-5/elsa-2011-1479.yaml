        - [base] Fix potential deadlock in driver core (Don Zickus) [750848 637930]
        - [security] keys: Fix NULL deref in user-defined key type (David Howells) [751300 751301]
        - [xen] passthrough: block VT-d MSI trap injection (Paolo Bonzini) [716301 716302] {CVE-2011-1898}

