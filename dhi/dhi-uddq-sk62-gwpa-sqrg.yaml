details: |
    ## Executive summary

    Microsoft is releasing this security advisory to provide information about a vulnerability in ASP.NET Core. This advisory provides guidance on updating affected applications and components.

    Malformed chunked HttpSys requests containing conflicting content-length headers can retain request and connection resources.

    ## Announcement

    Announcement for this issue can be found at https://github.com/dotnet/announcements/issues/513

    ## CVSS Details

    - **Version:** 3.1
    - **Severity:** High
    - **Score:** 7.5 (base score)
    - **Vector:** `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H/E:U/RL:O/RC:C`
    - **Weakness:** CWE-401

    ## Affected Platforms

    - **Platforms:** Windows
    - **Architectures:** All

    ## <a name="affected-packages"></a>Affected Packages

    The tables list affected version ranges and fixed package versions. Runtime and standalone deliveries are listed separately.

    ### ASP.NET Core 2.3 - standalone packages

    Package | Affected version | Patched version
    --- | --- | ---
    [Microsoft.AspNetCore.Server.HttpSys](https://www.nuget.org/packages/Microsoft.AspNetCore.Server.HttpSys) | = 2.3.10 | 2.3.14
    [Microsoft.AspNetCore.Server.HttpSys](https://www.nuget.org/packages/Microsoft.AspNetCore.Server.HttpSys) | = 2.3.11 | 2.3.14
    [Microsoft.AspNetCore.Server.HttpSys](https://www.nuget.org/packages/Microsoft.AspNetCore.Server.HttpSys) | = 2.3.12 | 2.3.14
    [Microsoft.AspNetCore.Server.HttpSys](https://www.nuget.org/packages/Microsoft.AspNetCore.Server.HttpSys) | = 2.3.13 | 2.3.14

    ### .NET 8.0 - affected runtime packages

    Package | Affected version | Patched version
    --- | --- | ---
    [Microsoft.AspNetCore.App.Runtime.win-arm64](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-arm64) | >= 8.0.0, <= 8.0.33 | 8.0.34
    [Microsoft.AspNetCore.App.Runtime.win-x64](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-x64) | >= 8.0.0, <= 8.0.33 | 8.0.34
    [Microsoft.AspNetCore.App.Runtime.win-x86](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-x86) | >= 8.0.0, <= 8.0.33 | 8.0.34

    ### .NET 9.0 - affected runtime packages

    Package | Affected version | Patched version
    --- | --- | ---
    [Microsoft.AspNetCore.App.Runtime.win-arm64](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-arm64) | >= 9.0.0, <= 9.0.22 | 9.0.23
    [Microsoft.AspNetCore.App.Runtime.win-x64](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-x64) | >= 9.0.0, <= 9.0.22 | 9.0.23
    [Microsoft.AspNetCore.App.Runtime.win-x86](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-x86) | >= 9.0.0, <= 9.0.22 | 9.0.23

    ### .NET 10.0 - affected runtime packages

    Package | Affected version | Patched version
    --- | --- | ---
    [Microsoft.AspNetCore.App.Runtime.win-arm64](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-arm64) | >= 10.0.0, <= 10.0.14 | 10.0.15
    [Microsoft.AspNetCore.App.Runtime.win-x64](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-x64) | >= 10.0.0, <= 10.0.14 | 10.0.15
    [Microsoft.AspNetCore.App.Runtime.win-x86](https://www.nuget.org/packages/Microsoft.AspNetCore.App.Runtime.win-x86) | >= 10.0.0, <= 10.0.14 | 10.0.15

    ## Advisory FAQ

    ### <a name="how-affected"></a>How do I know if I am affected?

    Check the deployed runtime and application package versions against the affected ranges above. Self-contained applications include their own runtime; updating a machine-wide runtime does not replace it.

    ### <a name="how-fix"></a>How do I fix the issue?

    Update standalone Microsoft.AspNetCore.Server.HttpSys references to 2.3.14, then rebuild and redeploy affected applications, including framework-dependent applications. Install the applicable patched runtime version listed above. Restart applications. Rebuild and redeploy self-contained applications; updating a machine-wide runtime does not replace their embedded runtime. An SDK update alone does not update an application's standalone package references.

    ## Other Information

    ### Reporting Security Issues

    If you have found a potential security issue in a supported version of .NET, please report it to the Microsoft Security Response Center (MSRC) via the [MSRC Researcher Portal](https://msrc.microsoft.com/report/vulnerability/new). Further information can be found in the MSRC [Report an Issue FAQ](https://www.microsoft.com/msrc/faqs-report-an-issue).

    Security reports made through MSRC may qualify for the Microsoft .NET Bounty. Details of the Microsoft .NET Bounty Program including terms and conditions are at https://aka.ms/corebounty.

    ### Support

    You can ask questions about this issue on GitHub in the .NET GitHub organization. The main repos are located at https://github.com/dotnet/runtime. The Announcements repo (https://github.com/dotnet/Announcements) will contain this bulletin as an issue and will include a link to a discussion issue. You can ask questions in the linked discussion issue.

    ### Disclaimer

    The information provided in this advisory is provided "as is" without warranty of any kind. Microsoft disclaims all warranties, either express or implied, including the warranties of merchantability and fitness for a particular purpose. In no event shall Microsoft Corporation or its suppliers be liable for any damages whatsoever including direct, indirect, incidental, consequential, loss of business profits or special damages, even if Microsoft Corporation or its suppliers have been advised of the possibility of such damages. Some states do not allow the exclusion or limitation of liability for consequential or incidental damages so the foregoing limitation may not apply.

